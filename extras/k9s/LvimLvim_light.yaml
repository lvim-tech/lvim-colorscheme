# Lvim Colorscheme LvimLight
k9s:
  body:
    fgColor: "#5e8888"
    bgColor: "#dadada"
    logoColor: "#4d86b6"
  prompt:
    fgColor: "#55a6ab"
    bgColor: "#E4E4E4"
    suggestColor: "#789698"
  info:
    fgColor: "#789698"
    sectionColor: "#5e8888"
  dialog:
    fgColor: "#5e8888"
    bgColor: "#E4E4E4"
    buttonFgColor: "#55a6ab"
    buttonBgColor: "#e9e9e9"
    buttonFocusFgColor: "#dadada"
    buttonFocusBgColor: "#457da3"
    labelFgColor: "#aa703f"
    fieldFgColor: "#5e8888"
  frame:
    border:
      fgColor: "#eeeeee"
      focusColor: "#457da3"
    menu:
      fgColor: "#5e8888"
      keyColor: "#af5543"
      numKeyColor: "#aa703f"
    crumbs:
      fgColor: "#dadada"
      bgColor: "#e9e9e9"
      activeColor: "#457da3"
    status:
      newColor: "#458677"
      modifyColor: "#457da3"
      addColor: "#55673c"
      errorColor: "#ae4b41"
      highlightColor: "#aa703f"
      killColor: "#789698"
      completedColor: "#789698"
    title:
      fgColor: "#5e8888"
      bgColor: "#E4E4E4"
      highlightColor: "#aa703f"
      counterColor: "#4d86b6"
      filterColor: "#af5543"
  views:
    charts:
      bgColor: "#dadada"
      defaultDialColors:
        - "#55673c"
        - "#ae4b41"
      defaultChartColors:
        - "#55673c"
        - "#ae4b41"
    table:
      fgColor: "#5e8888"
      bgColor: "#dadada"
      cursorFgColor: "#dadada"
      cursorBgColor: "#e9e9e9"
      header:
        fgColor: "#55a6ab"
        bgColor: "#dadada"
        sorterColor: "#3e7a89"
    yaml:
      keyColor: "#457da3"
      colonColor: "#789698"
      valueColor: "#5e8888"
    logs:
      fgColor: "#5e8888"
      bgColor: "#dadada"
      indicator:
        fgColor: "#4d86b6"
        bgColor: "#dadada"
