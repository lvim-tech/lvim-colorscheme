# Lvim Colorscheme LvimLight
k9s:
  body:
    fgColor: "#5e8888"
    bgColor: "#dadada"
    logoColor: "#1981bd"
  prompt:
    fgColor: "#55a6ab"
    bgColor: "#E4E4E4"
    suggestColor: "#789698"
  info:
    fgColor: "#789698"
    sectionColor: "#5e8888"
  dialog:
    fgColor: "#5e8888"
    bgColor: "#E4E4E4"
    buttonFgColor: "#55a6ab"
    buttonBgColor: "#e9e9e9"
    buttonFocusFgColor: "#dadada"
    buttonFocusBgColor: "#0879a9"
    labelFgColor: "#a96400"
    fieldFgColor: "#5e8888"
  frame:
    border:
      fgColor: "#eeeeee"
      focusColor: "#0879a9"
    menu:
      fgColor: "#5e8888"
      keyColor: "#bc533c"
      numKeyColor: "#a96400"
    crumbs:
      fgColor: "#dadada"
      bgColor: "#e9e9e9"
      activeColor: "#0879a9"
    status:
      newColor: "#228773"
      modifyColor: "#0879a9"
      addColor: "#748c50"
      errorColor: "#ac4135"
      highlightColor: "#a96400"
      killColor: "#789698"
      completedColor: "#789698"
    title:
      fgColor: "#5e8888"
      bgColor: "#E4E4E4"
      highlightColor: "#a96400"
      counterColor: "#1981bd"
      filterColor: "#bc533c"
  views:
    charts:
      bgColor: "#dadada"
      defaultDialColors:
        - "#748c50"
        - "#ac4135"
      defaultChartColors:
        - "#748c50"
        - "#ac4135"
    table:
      fgColor: "#5e8888"
      bgColor: "#dadada"
      cursorFgColor: "#dadada"
      cursorBgColor: "#e9e9e9"
      header:
        fgColor: "#55a6ab"
        bgColor: "#dadada"
        sorterColor: "#01778a"
    yaml:
      keyColor: "#0879a9"
      colonColor: "#789698"
      valueColor: "#5e8888"
    logs:
      fgColor: "#5e8888"
      bgColor: "#dadada"
      indicator:
        fgColor: "#1981bd"
        bgColor: "#dadada"
