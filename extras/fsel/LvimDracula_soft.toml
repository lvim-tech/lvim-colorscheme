# Lvim Colorscheme DraculaSoft
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimDracula_soft.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#dc61a8"
# Panel titles.
header_title_color = "#65c8dd"
# Pin icon on pinned entries.
pin_color = "#de9f5c"

# Panel borders.
main_border_color = "#43465b"
apps_border_color = "#43465b"
input_border_color = "#43465b"

# Panel text.
main_text_color = "#c7c7b3"
apps_text_color = "#c7c7b3"
input_text_color = "#c7c7b3"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#dc61a8"
header_title_color = "#65c8dd"
main_border_color = "#43465b"
items_border_color = "#43465b"
input_border_color = "#43465b"
main_text_color = "#c7c7b3"
items_text_color = "#c7c7b3"
input_text_color = "#c7c7b3"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#dc61a8"
header_title_color = "#65c8dd"
main_border_color = "#43465b"
items_border_color = "#43465b"
input_border_color = "#43465b"
main_text_color = "#c7c7b3"
items_text_color = "#c7c7b3"
input_text_color = "#c7c7b3"
