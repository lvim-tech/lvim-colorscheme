# Lvim Colorscheme GruvboxSoft
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimGruvbox_soft.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#bb755e"
# Panel titles.
header_title_color = "#4a748c"
# Pin icon on pinned entries.
pin_color = "#c47d54"

# Panel borders.
main_border_color = "#484543"
apps_border_color = "#484543"
input_border_color = "#484543"

# Panel text.
main_text_color = "#b49f88"
apps_text_color = "#b49f88"
input_text_color = "#b49f88"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#bb755e"
header_title_color = "#4a748c"
main_border_color = "#484543"
items_border_color = "#484543"
input_border_color = "#484543"
main_text_color = "#b49f88"
items_text_color = "#b49f88"
input_text_color = "#b49f88"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#bb755e"
header_title_color = "#4a748c"
main_border_color = "#484543"
items_border_color = "#484543"
input_border_color = "#484543"
main_text_color = "#b49f88"
items_text_color = "#b49f88"
input_text_color = "#b49f88"
