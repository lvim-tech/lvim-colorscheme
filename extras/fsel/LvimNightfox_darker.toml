# Lvim Colorscheme NightfoxDarker
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimNightfox_darker.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#9a80ae"
# Panel titles.
header_title_color = "#6885ad"
# Pin icon on pinned entries.
pin_color = "#c88e62"

# Panel borders.
main_border_color = "#144063"
apps_border_color = "#144063"
input_border_color = "#144063"

# Panel text.
main_text_color = "#bcbdbd"
apps_text_color = "#bcbdbd"
input_text_color = "#bcbdbd"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#9a80ae"
header_title_color = "#6885ad"
main_border_color = "#144063"
items_border_color = "#144063"
input_border_color = "#144063"
main_text_color = "#bcbdbd"
items_text_color = "#bcbdbd"
input_text_color = "#bcbdbd"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#9a80ae"
header_title_color = "#6885ad"
main_border_color = "#144063"
items_border_color = "#144063"
input_border_color = "#144063"
main_text_color = "#bcbdbd"
items_text_color = "#bcbdbd"
input_text_color = "#bcbdbd"
