# Lvim Colorscheme MaterialDark
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimMaterial_dark.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#da596e"
# Panel titles.
header_title_color = "#618adf"
# Pin icon on pinned entries.
pin_color = "#d77c61"

# Panel borders.
main_border_color = "#364a53"
apps_border_color = "#364a53"
input_border_color = "#364a53"

# Panel text.
main_text_color = "#b2c7c7"
apps_text_color = "#b2c7c7"
input_text_color = "#b2c7c7"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#da596e"
header_title_color = "#618adf"
main_border_color = "#364a53"
items_border_color = "#364a53"
input_border_color = "#364a53"
main_text_color = "#b2c7c7"
items_text_color = "#b2c7c7"
input_text_color = "#b2c7c7"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#da596e"
header_title_color = "#618adf"
main_border_color = "#364a53"
items_border_color = "#364a53"
input_border_color = "#364a53"
main_text_color = "#b2c7c7"
items_text_color = "#b2c7c7"
input_text_color = "#b2c7c7"
