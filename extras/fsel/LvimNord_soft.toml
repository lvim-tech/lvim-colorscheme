# Lvim Colorscheme NordSoft
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimNord_soft.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#a58aa0"
# Panel titles.
header_title_color = "#8097af"
# Pin icon on pinned entries.
pin_color = "#ba8574"

# Panel borders.
main_border_color = "#40495e"
apps_border_color = "#40495e"
input_border_color = "#40495e"

# Panel text.
main_text_color = "#b3bac6"
apps_text_color = "#b3bac6"
input_text_color = "#b3bac6"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#a58aa0"
header_title_color = "#8097af"
main_border_color = "#40495e"
items_border_color = "#40495e"
input_border_color = "#40495e"
main_text_color = "#b3bac6"
items_text_color = "#b3bac6"
input_text_color = "#b3bac6"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#a58aa0"
header_title_color = "#8097af"
main_border_color = "#40495e"
items_border_color = "#40495e"
input_border_color = "#40495e"
main_text_color = "#b3bac6"
items_text_color = "#b3bac6"
input_text_color = "#b3bac6"
