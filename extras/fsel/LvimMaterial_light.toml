# Lvim Colorscheme MaterialLight
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimMaterial_light.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#b04556"
# Panel titles.
header_title_color = "#4d6cae"
# Pin icon on pinned entries.
pin_color = "#b36b57"

# Panel borders.
main_border_color = "#b1b1b1"
apps_border_color = "#b1b1b1"
input_border_color = "#b1b1b1"

# Panel text.
main_text_color = "#425353"
apps_text_color = "#425353"
input_text_color = "#425353"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#b04556"
header_title_color = "#4d6cae"
main_border_color = "#b1b1b1"
items_border_color = "#b1b1b1"
input_border_color = "#b1b1b1"
main_text_color = "#425353"
items_text_color = "#425353"
input_text_color = "#425353"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#b04556"
header_title_color = "#4d6cae"
main_border_color = "#b1b1b1"
items_border_color = "#b1b1b1"
input_border_color = "#b1b1b1"
main_text_color = "#425353"
items_text_color = "#425353"
input_text_color = "#425353"
