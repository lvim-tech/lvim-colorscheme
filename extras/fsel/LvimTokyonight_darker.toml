# Lvim Colorscheme TokyonightDarker
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimTokyonight_darker.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#9470d5"
# Panel titles.
header_title_color = "#6589d7"
# Pin icon on pinned entries.
pin_color = "#dd8b5a"

# Panel borders.
main_border_color = "#2e375b"
apps_border_color = "#2e375b"
input_border_color = "#2e375b"

# Panel text.
main_text_color = "#b2b6c7"
apps_text_color = "#b2b6c7"
input_text_color = "#b2b6c7"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#9470d5"
header_title_color = "#6589d7"
main_border_color = "#2e375b"
items_border_color = "#2e375b"
input_border_color = "#2e375b"
main_text_color = "#b2b6c7"
items_text_color = "#b2b6c7"
input_text_color = "#b2b6c7"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#9470d5"
header_title_color = "#6589d7"
main_border_color = "#2e375b"
items_border_color = "#2e375b"
input_border_color = "#2e375b"
main_text_color = "#b2b6c7"
items_text_color = "#b2b6c7"
input_text_color = "#b2b6c7"
