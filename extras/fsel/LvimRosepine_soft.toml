# Lvim Colorscheme RosepineSoft
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimRosepine_soft.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#9084a2"
# Panel titles.
header_title_color = "#5d6d74"
# Pin icon on pinned entries.
pin_color = "#a98a89"

# Panel borders.
main_border_color = "#46404e"
apps_border_color = "#46404e"
input_border_color = "#46404e"

# Panel text.
main_text_color = "#b3afb2"
apps_text_color = "#b3afb2"
input_text_color = "#b3afb2"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#9084a2"
header_title_color = "#5d6d74"
main_border_color = "#46404e"
items_border_color = "#46404e"
input_border_color = "#46404e"
main_text_color = "#b3afb2"
items_text_color = "#b3afb2"
input_text_color = "#b3afb2"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#9084a2"
header_title_color = "#5d6d74"
main_border_color = "#46404e"
items_border_color = "#46404e"
input_border_color = "#46404e"
main_text_color = "#b3afb2"
items_text_color = "#b3afb2"
input_text_color = "#b3afb2"
