# Lvim Colorscheme SolarizedDarker
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimSolarized_darker.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#c0578a"
# Panel titles.
header_title_color = "#4f7ea3"
# Pin icon on pinned entries.
pin_color = "#b46548"

# Panel borders.
main_border_color = "#004452"
apps_border_color = "#004452"
input_border_color = "#004452"

# Panel text.
main_text_color = "#9da4a4"
apps_text_color = "#9da4a4"
input_text_color = "#9da4a4"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#c0578a"
header_title_color = "#4f7ea3"
main_border_color = "#004452"
items_border_color = "#004452"
input_border_color = "#004452"
main_text_color = "#9da4a4"
items_text_color = "#9da4a4"
input_text_color = "#9da4a4"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#c0578a"
header_title_color = "#4f7ea3"
main_border_color = "#004452"
items_border_color = "#004452"
input_border_color = "#004452"
main_text_color = "#9da4a4"
items_text_color = "#9da4a4"
input_text_color = "#9da4a4"
