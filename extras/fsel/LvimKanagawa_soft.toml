# Lvim Colorscheme KanagawaSoft
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimKanagawa_soft.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#c4726c"
# Panel titles.
header_title_color = "#506fa5"
# Pin icon on pinned entries.
pin_color = "#bf8f62"

# Panel borders.
main_border_color = "#434554"
apps_border_color = "#434554"
input_border_color = "#434554"

# Panel text.
main_text_color = "#a0a0bc"
apps_text_color = "#a0a0bc"
input_text_color = "#a0a0bc"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#c4726c"
header_title_color = "#506fa5"
main_border_color = "#434554"
items_border_color = "#434554"
input_border_color = "#434554"
main_text_color = "#a0a0bc"
items_text_color = "#a0a0bc"
input_text_color = "#a0a0bc"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#c4726c"
header_title_color = "#506fa5"
main_border_color = "#434554"
items_border_color = "#434554"
input_border_color = "#434554"
main_text_color = "#a0a0bc"
items_text_color = "#a0a0bc"
input_text_color = "#a0a0bc"
