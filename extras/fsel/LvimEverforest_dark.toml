# Lvim Colorscheme EverforestDark
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimEverforest_dark.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#bb755e"
# Panel titles.
header_title_color = "#42758f"
# Pin icon on pinned entries.
pin_color = "#cc7942"

# Panel borders.
main_border_color = "#394650"
apps_border_color = "#394650"
input_border_color = "#394650"

# Panel text.
main_text_color = "#94a68e"
apps_text_color = "#94a68e"
input_text_color = "#94a68e"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#bb755e"
header_title_color = "#42758f"
main_border_color = "#394650"
items_border_color = "#394650"
input_border_color = "#394650"
main_text_color = "#94a68e"
items_text_color = "#94a68e"
input_text_color = "#94a68e"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#bb755e"
header_title_color = "#42758f"
main_border_color = "#394650"
items_border_color = "#394650"
input_border_color = "#394650"
main_text_color = "#94a68e"
items_text_color = "#94a68e"
input_text_color = "#94a68e"
