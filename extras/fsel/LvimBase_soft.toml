# Lvim Colorscheme BaseSoft
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimBase_soft.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#c6614d"
# Panel titles.
header_title_color = "#447ca2"
# Pin icon on pinned entries.
pin_color = "#e19556"

# Panel borders.
main_border_color = "#3c4d56"
apps_border_color = "#3c4d56"
input_border_color = "#3c4d56"

# Panel text.
main_text_color = "#6bb4b4"
apps_text_color = "#6bb4b4"
input_text_color = "#6bb4b4"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#c6614d"
header_title_color = "#447ca2"
main_border_color = "#3c4d56"
items_border_color = "#3c4d56"
input_border_color = "#3c4d56"
main_text_color = "#6bb4b4"
items_text_color = "#6bb4b4"
input_text_color = "#6bb4b4"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#c6614d"
header_title_color = "#447ca2"
main_border_color = "#3c4d56"
items_border_color = "#3c4d56"
input_border_color = "#3c4d56"
main_text_color = "#6bb4b4"
items_text_color = "#6bb4b4"
input_text_color = "#6bb4b4"
