# Lvim Colorscheme RosepineDarker
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimRosepine_darker.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#9f80c4"
# Panel titles.
header_title_color = "#416d7f"
# Pin icon on pinned entries.
pin_color = "#c68784"

# Panel borders.
main_border_color = "#3f3a55"
apps_border_color = "#3f3a55"
input_border_color = "#3f3a55"

# Panel text.
main_text_color = "#b4b2c7"
apps_text_color = "#b4b2c7"
input_text_color = "#b4b2c7"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#9f80c4"
header_title_color = "#416d7f"
main_border_color = "#3f3a55"
items_border_color = "#3f3a55"
input_border_color = "#3f3a55"
main_text_color = "#b4b2c7"
items_text_color = "#b4b2c7"
input_text_color = "#b4b2c7"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#9f80c4"
header_title_color = "#416d7f"
main_border_color = "#3f3a55"
items_border_color = "#3f3a55"
input_border_color = "#3f3a55"
main_text_color = "#b4b2c7"
items_text_color = "#b4b2c7"
input_text_color = "#b4b2c7"
