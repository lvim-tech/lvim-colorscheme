# Lvim Colorscheme GruvboxDarker
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimGruvbox_darker.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#bb755e"
# Panel titles.
header_title_color = "#497188"
# Pin icon on pinned entries.
pin_color = "#c47d54"

# Panel borders.
main_border_color = "#423f3b"
apps_border_color = "#423f3b"
input_border_color = "#423f3b"

# Panel text.
main_text_color = "#aa9782"
apps_text_color = "#aa9782"
input_text_color = "#aa9782"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#bb755e"
header_title_color = "#497188"
main_border_color = "#423f3b"
items_border_color = "#423f3b"
input_border_color = "#423f3b"
main_text_color = "#aa9782"
items_text_color = "#aa9782"
input_text_color = "#aa9782"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#bb755e"
header_title_color = "#497188"
main_border_color = "#423f3b"
items_border_color = "#423f3b"
input_border_color = "#423f3b"
main_text_color = "#aa9782"
items_text_color = "#aa9782"
input_text_color = "#aa9782"
