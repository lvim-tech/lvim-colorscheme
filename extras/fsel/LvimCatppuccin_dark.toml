# Lvim Colorscheme CatppuccinDark
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimCatppuccin_dark.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#d07fba"
# Panel titles.
header_title_color = "#6793da"
# Pin icon on pinned entries.
pin_color = "#da9366"

# Panel borders.
main_border_color = "#3a3c4e"
apps_border_color = "#3a3c4e"
input_border_color = "#3a3c4e"

# Panel text.
main_text_color = "#b2b7c7"
apps_text_color = "#b2b7c7"
input_text_color = "#b2b7c7"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#d07fba"
header_title_color = "#6793da"
main_border_color = "#3a3c4e"
items_border_color = "#3a3c4e"
input_border_color = "#3a3c4e"
main_text_color = "#b2b7c7"
items_text_color = "#b2b7c7"
input_text_color = "#b2b7c7"

# --- cclip mode ------------------------------------------------------------

[cclip]
