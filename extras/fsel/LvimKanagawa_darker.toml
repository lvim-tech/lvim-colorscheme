# Lvim Colorscheme KanagawaDarker
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimKanagawa_darker.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#c4726c"
# Panel titles.
header_title_color = "#4e6a9c"
# Pin icon on pinned entries.
pin_color = "#bf8f62"

# Panel borders.
main_border_color = "#3b3f53"
apps_border_color = "#3b3f53"
input_border_color = "#3b3f53"

# Panel text.
main_text_color = "#9898b5"
apps_text_color = "#9898b5"
input_text_color = "#9898b5"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#c4726c"
header_title_color = "#4e6a9c"
main_border_color = "#3b3f53"
items_border_color = "#3b3f53"
input_border_color = "#3b3f53"
main_text_color = "#9898b5"
items_text_color = "#9898b5"
input_text_color = "#9898b5"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#c4726c"
header_title_color = "#4e6a9c"
main_border_color = "#3b3f53"
items_border_color = "#3b3f53"
input_border_color = "#3b3f53"
main_text_color = "#9898b5"
items_text_color = "#9898b5"
input_text_color = "#9898b5"
