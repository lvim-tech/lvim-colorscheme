# Lvim Colorscheme EverforestSoft
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimEverforest_soft.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#bb755e"
# Panel titles.
header_title_color = "#427a96"
# Pin icon on pinned entries.
pin_color = "#cc7942"

# Panel borders.
main_border_color = "#404c56"
apps_border_color = "#404c56"
input_border_color = "#404c56"

# Panel text.
main_text_color = "#9baf95"
apps_text_color = "#9baf95"
input_text_color = "#9baf95"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#bb755e"
header_title_color = "#427a96"
main_border_color = "#404c56"
items_border_color = "#404c56"
input_border_color = "#404c56"
main_text_color = "#9baf95"
items_text_color = "#9baf95"
input_text_color = "#9baf95"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#bb755e"
header_title_color = "#427a96"
main_border_color = "#404c56"
items_border_color = "#404c56"
input_border_color = "#404c56"
main_text_color = "#9baf95"
items_text_color = "#9baf95"
input_text_color = "#9baf95"
