# Lvim Colorscheme LvimSoft
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimLvim_soft.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#c75940"
# Panel titles.
header_title_color = "#0A85B9"
# Pin icon on pinned entries.
pin_color = "#FF9C2A"

# Panel borders.
main_border_color = "#3e4952"
apps_border_color = "#3e4952"
input_border_color = "#3e4952"

# Panel text.
main_text_color = "#6ab1b1"
apps_text_color = "#6ab1b1"
input_text_color = "#6ab1b1"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#c75940"
header_title_color = "#0A85B9"
main_border_color = "#3e4952"
items_border_color = "#3e4952"
input_border_color = "#3e4952"
main_text_color = "#6ab1b1"
items_text_color = "#6ab1b1"
input_text_color = "#6ab1b1"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#c75940"
header_title_color = "#0A85B9"
main_border_color = "#3e4952"
items_border_color = "#3e4952"
input_border_color = "#3e4952"
main_text_color = "#6ab1b1"
items_text_color = "#6ab1b1"
input_text_color = "#6ab1b1"
