# Lvim Colorscheme KanagawaDark
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimKanagawa_dark.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#c4726c"
# Panel titles.
header_title_color = "#4e6a9c"
# Pin icon on pinned entries.
pin_color = "#bf8f62"

# Panel borders.
main_border_color = "#3e4152"
apps_border_color = "#3e4152"
input_border_color = "#3e4152"

# Panel text.
main_text_color = "#9a9ab8"
apps_text_color = "#9a9ab8"
input_text_color = "#9a9ab8"

# --- dmenu mode ------------------------------------------------------------

[dmenu]
highlight_color = "#c4726c"
header_title_color = "#4e6a9c"
main_border_color = "#3e4152"
items_border_color = "#3e4152"
input_border_color = "#3e4152"
main_text_color = "#9a9ab8"
items_text_color = "#9a9ab8"
input_text_color = "#9a9ab8"

# --- cclip mode ------------------------------------------------------------

[cclip]
highlight_color = "#c4726c"
header_title_color = "#4e6a9c"
main_border_color = "#3e4152"
items_border_color = "#3e4152"
input_border_color = "#3e4152"
main_text_color = "#9a9ab8"
items_text_color = "#9a9ab8"
input_text_color = "#9a9ab8"
