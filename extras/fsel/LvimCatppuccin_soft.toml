# Lvim Colorscheme CatppuccinSoft
# Generated by lvim-colorscheme for fsel — https://github.com/Mjoyufull/fsel
#
# Install:
#   mkdir -p ~/.config/fsel
#   ln -sf extras/fsel/LvimCatppuccin_soft.toml ~/.config/fsel/config.toml
#
# Colour keys only. Everything else — keybinds, matching, layout, launch behaviour — keeps
# fsel's defaults, so this file can be replaced wholesale when the palette changes.

# --- app launcher (root level) ---------------------------------------------

# Selected item and cursor.
highlight_color = "#b976a7"
# Panel titles.
header_title_color = "#6076a0"
# Pin icon on pinned entries.
pin_color = "#b88970"

# Panel borders.
main_border_color = "#3f425e"
apps_border_color = "#3f425e"
input_border_color = "#3f425e"

# Panel text.
main_text_color = "#b2b7c7"
apps_text_color = "#b2b7c7"
input_text_color = "#b2b7c7"

