# lvim-colorscheme — colours only, as a drop-in.
#
# dunst reads ~/.config/dunst/dunstrc first and this file after it, so what is set here wins.
# Geometry, timeouts, font and rules stay in dunstrc and are not this file's business.
#
# Quoted because '#' starts a comment in dunst's config unless the value is a string.

[global]
    separator_color = frame

[urgency_low]
    background = "#E4E4E4"
    foreground = "#5e8888"
    frame_color = "#E4E4E4"
    highlight = "#584b31"

[urgency_normal]
    background = "#E4E4E4"
    foreground = "#5e8888"
    frame_color = "#E4E4E4"
    highlight = "#7e5e3f"

[urgency_critical]
    background = "#E4E4E4"
    foreground = "#5e8888"
    frame_color = "#E4E4E4"
    highlight = "#9d4f4f"

# The title, coloured by urgency. These are rules rather than urgency sections because `format` is
# a rule attribute; the filter is what an urgency section would have had implied.

[lvim_title_low]
    msg_urgency = low
    format = "<span foreground='#584b31'><b>%s</b></span>\n%b"

[lvim_title_normal]
    msg_urgency = normal
    format = "<span foreground='#7e5e3f'><b>%s</b></span>\n%b"

[lvim_title_critical]
    msg_urgency = critical
    format = "<span foreground='#9d4f4f'><b>%s</b></span>\n%b"
