# LvimEverforest_soft colors for Neomutt

# Basic Colors
color normal          #869682             default         # normal text
color indicator       default           #2a3034      # selected item
color tree            #57a060      default         # thread arrows
color status          #0b9dc9      default         # status line
color error           #f75c5c       default         # error messages
color message         #909600     default         # info messages
color markers         #d77a34    default         # + at line wrapping
color attachment      #dc754e   default         # attachment info
color search          #a6935a    default         # search matches
color tilde           #535d4e        default         # ~ empty lines

# Message Headers
color hdrdefault      #809873        default         # default header
color header          #379ac3           default         '^From:'
color header          #958ba8    default         '^Subject:'
color header          #5ea067           default         '^User-Agent:.*Mutt'
color header          #57a060      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #92962d          default         # quoted text
color quoted1         #0b9dc9      default         # nested quote
color quoted2         #938ca4         default         # nested quote 2
color quoted3         #57a060      default         # nested quote 3
color quoted4         #a6935a    default         # nested quote 4
color quoted5         #cc7d62        default         # nested quote 5
color signature       #809873        default         # signature
color bold            #d07b41         default         # bold text
color underline       #d77a34    default         # underlined text

# Message Index
color index           #5ea067           default         ~Q  # replied messages
color index           #f75c5c       default         ~D  # deleted messages
color index           #809873        default         ~O  # old messages
color index           #0b9dc9      default         ~P  # from me
color index           #a6935a    default         ~T  # tagged messages
color index           #d07b41         default         ~F  # flagged messages
color index           #958ba8    default         ~v  # collapsed thread
color index           #cc7d62        default         ~k  # GPG
color index           #909600     default         ~N  # new messages
color index_author    #57a060      default         .*  # all authors

# Special Email Elements
color body            #0b9dc9      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #57a060      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #af9e6b         default         "\\[[0-9]+\\]"
color body            #a6935a    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #e36a6a            default         ~D   # deleted
color index_flags     #57a060      default         ~g   # signed
color index_flags     #0b9dc9      default         ~G   # encrypted
color index_author    #909600     default         ~P   # from me
color index_author    #d77a34    default         ~F   # flagged
color index_author    #d77a34    default         ~l   # mailing lists
color index_flags     #92962d          default         ~N   # new
color index_flags     #f75c5c       default         ~l   # lists
color index_date      #e36a6a            default              # date
color index_size      #0b9dc9      default              # size
color index_number    #a6935a    default              # number

color indicator             default         #2a3034
color sidebar_indicator     #e07e2f  #2a3034
color sidebar_highlight     default         #2a3034
color sidebar_background    #869682           default
color sidebar_divider       #0b9dc9    default
color sidebar_flagged       #0b9dc9    default
color sidebar_new           #e36a6a          default
color sidebar_ordinary      #909600   default
color sidebar_spool_file    #af9e6b       default
color sidebar_unread        #e36a6a          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold