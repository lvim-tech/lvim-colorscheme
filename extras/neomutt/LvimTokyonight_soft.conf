# LvimTokyonight_soft colors for Neomutt

# Basic Colors
color normal          #b2b6c7             default         # normal text
color indicator       default           #22252e      # selected item
color tree            #59748b      default         # thread arrows
color status          #546593      default         # status line
color error           #ac5764       default         # error messages
color message         #697b58     default         # info messages
color markers         #ad7862    default         # + at line wrapping
color attachment      #826cb1   default         # attachment info
color search          #ad9170    default         # search matches
color tilde           #616784        default         # ~ empty lines

# Message Headers
color hdrdefault      #616784        default         # default header
color header          #6073a4           default         '^From:'
color header          #655680    default         '^Subject:'
color header          #648299           default         '^User-Agent:.*Mutt'
color header          #59748b      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #788a67          default         # quoted text
color quoted1         #546593      default         # nested quote
color quoted2         #73638e         default         # nested quote 2
color quoted3         #59748b      default         # nested quote 3
color quoted4         #ad9170    default         # nested quote 4
color quoted5         #907bba        default         # nested quote 5
color signature       #616784        default         # signature
color bold            #bb866d         default         # bold text
color underline       #ad7862    default         # underlined text

# Message Index
color index           #648299           default         ~Q  # replied messages
color index           #ac5764       default         ~D  # deleted messages
color index           #616784        default         ~O  # old messages
color index           #546593      default         ~P  # from me
color index           #ad9170    default         ~T  # tagged messages
color index           #bb866d         default         ~F  # flagged messages
color index           #655680    default         ~v  # collapsed thread
color index           #907bba        default         ~k  # GPG
color index           #697b58     default         ~N  # new messages
color index_author    #59748b      default         .*  # all authors

# Special Email Elements
color body            #546593      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #59748b      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #b79d7b         default         "\\[[0-9]+\\]"
color body            #ad9170    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #bb6171            default         ~D   # deleted
color index_flags     #59748b      default         ~g   # signed
color index_flags     #546593      default         ~G   # encrypted
color index_author    #697b58     default         ~P   # from me
color index_author    #ad7862    default         ~F   # flagged
color index_author    #ad7862    default         ~l   # mailing lists
color index_flags     #788a67          default         ~N   # new
color index_flags     #ac5764       default         ~l   # lists
color index_date      #bb6171            default              # date
color index_size      #546593      default              # size
color index_number    #ad9170    default              # number

color indicator             default         #22252e
color sidebar_indicator     #ad7862  #22252e
color sidebar_highlight     default         #22252e
color sidebar_background    #b2b6c7           default
color sidebar_divider       #546593    default
color sidebar_flagged       #546593    default
color sidebar_new           #bb6171          default
color sidebar_ordinary      #697b58   default
color sidebar_spool_file    #b79d7b       default
color sidebar_unread        #bb6171          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold