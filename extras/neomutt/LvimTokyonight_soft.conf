# LvimTokyonight_soft colors for Neomutt

# Basic Colors
color normal          #b2b6c7             default         # normal text
color indicator       default           #22252e      # selected item
color tree            #668fb0      default         # thread arrows
color status          #6c88cd      default         # status line
color error           #d06c7b       default         # error messages
color message         #799162     default         # info messages
color markers         #b57c64    default         # + at line wrapping
color attachment      #947ec4   default         # attachment info
color search          #ad9170    default         # search matches
color tilde           #616784        default         # ~ empty lines

# Message Headers
color hdrdefault      #8088ac        default         # default header
color header          #728ac6           default         '^From:'
color header          #9481b8    default         '^Subject:'
color header          #6b90ab           default         '^User-Agent:.*Mutt'
color header          #668fb0      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #7c906a          default         # quoted text
color quoted1         #6c88cd      default         # nested quote
color quoted2         #9484b1         default         # nested quote 2
color quoted3         #668fb0      default         # nested quote 3
color quoted4         #ad9170    default         # nested quote 4
color quoted5         #9580bf        default         # nested quote 5
color signature       #8088ac        default         # signature
color bold            #bb866d         default         # bold text
color underline       #b57c64    default         # underlined text

# Message Index
color index           #6b90ab           default         ~Q  # replied messages
color index           #d06c7b       default         ~D  # deleted messages
color index           #8088ac        default         ~O  # old messages
color index           #6c88cd      default         ~P  # from me
color index           #ad9170    default         ~T  # tagged messages
color index           #bb866d         default         ~F  # flagged messages
color index           #9481b8    default         ~v  # collapsed thread
color index           #9580bf        default         ~k  # GPG
color index           #799162     default         ~N  # new messages
color index_author    #668fb0      default         .*  # all authors

# Special Email Elements
color body            #6c88cd      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #668fb0      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #b79d7b         default         "\\[[0-9]+\\]"
color body            #ad9170    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #ca6e7e            default         ~D   # deleted
color index_flags     #668fb0      default         ~g   # signed
color index_flags     #6c88cd      default         ~G   # encrypted
color index_author    #799162     default         ~P   # from me
color index_author    #b57c64    default         ~F   # flagged
color index_author    #b57c64    default         ~l   # mailing lists
color index_flags     #7c906a          default         ~N   # new
color index_flags     #d06c7b       default         ~l   # lists
color index_date      #ca6e7e            default              # date
color index_size      #6c88cd      default              # size
color index_number    #ad9170    default              # number

color indicator             default         #22252e
color sidebar_indicator     #b97e66  #22252e
color sidebar_highlight     default         #22252e
color sidebar_background    #b2b6c7           default
color sidebar_divider       #6c88cd    default
color sidebar_flagged       #6c88cd    default
color sidebar_new           #ca6e7e          default
color sidebar_ordinary      #799162   default
color sidebar_spool_file    #b79d7b       default
color sidebar_unread        #ca6e7e          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold