# LvimNightfox_light colors for Neomutt

# Basic Colors
color normal          #5e8888             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #3e686a      default         # thread arrows
color status          #597ba8      default         # status line
color error           #c55f78       default         # error messages
color message         #557063     default         # info messages
color markers         #835739    default         # + at line wrapping
color attachment      #84679c   default         # attachment info
color search          #938151    default         # search matches
color tilde           #646f7d        default         # ~ empty lines

# Message Headers
color hdrdefault      #646f7d        default         # default header
color header          #546d8e           default         '^From:'
color header          #8c79af    default         '^Subject:'
color header          #5b8e8f           default         '^User-Agent:.*Mutt'
color header          #3e686a      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #749182          default         # quoted text
color quoted1         #597ba8      default         # nested quote
color quoted2         #8069a2         default         # nested quote 2
color quoted3         #3e686a      default         # nested quote 3
color quoted4         #938151    default         # nested quote 4
color quoted5         #755a88        default         # nested quote 5
color signature       #646f7d        default         # signature
color bold            #ac7a53         default         # bold text
color underline       #835739    default         # underlined text

# Message Index
color index           #5b8e8f           default         ~Q  # replied messages
color index           #c55f78       default         ~D  # deleted messages
color index           #646f7d        default         ~O  # old messages
color index           #597ba8      default         ~P  # from me
color index           #938151    default         ~T  # tagged messages
color index           #ac7a53         default         ~F  # flagged messages
color index           #8c79af    default         ~v  # collapsed thread
color index           #755a88        default         ~k  # GPG
color index           #557063     default         ~N  # new messages
color index_author    #3e686a      default         .*  # all authors

# Special Email Elements
color body            #597ba8      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #3e686a      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #897a50         default         "\\[[0-9]+\\]"
color body            #938151    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #a75d70            default         ~D   # deleted
color index_flags     #3e686a      default         ~g   # signed
color index_flags     #597ba8      default         ~G   # encrypted
color index_author    #557063     default         ~P   # from me
color index_author    #835739    default         ~F   # flagged
color index_author    #835739    default         ~l   # mailing lists
color index_flags     #749182          default         ~N   # new
color index_flags     #c55f78       default         ~l   # lists
color index_date      #a75d70            default              # date
color index_size      #597ba8      default              # size
color index_number    #938151    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #835739  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #5e8888           default
color sidebar_divider       #597ba8    default
color sidebar_flagged       #597ba8    default
color sidebar_new           #a75d70          default
color sidebar_ordinary      #557063   default
color sidebar_spool_file    #897a50       default
color sidebar_unread        #a75d70          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold