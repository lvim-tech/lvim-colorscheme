# LvimNightfox_light colors for Neomutt

# Basic Colors
color normal          #4e6767             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #3e686a      default         # thread arrows
color status          #4e6483      default         # status line
color error           #8e4f5d       default         # error messages
color message         #50685d     default         # info messages
color markers         #835739    default         # + at line wrapping
color attachment      #6e5980   default         # attachment info
color search          #6c6146    default         # search matches
color tilde           #646f7d        default         # ~ empty lines

# Message Headers
color hdrdefault      #5a626e        default         # default header
color header          #4e637f           default         '^From:'
color header          #6a5a87    default         '^Subject:'
color header          #4c6768           default         '^User-Agent:.*Mutt'
color header          #3e686a      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #57665e          default         # quoted text
color quoted1         #4e6483      default         # nested quote
color quoted2         #6d5a89         default         # nested quote 2
color quoted3         #3e686a      default         # nested quote 3
color quoted4         #6c6146    default         # nested quote 4
color quoted5         #725884        default         # nested quote 5
color signature       #5a626e        default         # signature
color bold            #795c47         default         # bold text
color underline       #835739    default         # underlined text

# Message Index
color index           #4c6768           default         ~Q  # replied messages
color index           #8e4f5d       default         ~D  # deleted messages
color index           #5a626e        default         ~O  # old messages
color index           #4e6483      default         ~P  # from me
color index           #6c6146    default         ~T  # tagged messages
color index           #795c47         default         ~F  # flagged messages
color index           #6a5a87    default         ~v  # collapsed thread
color index           #725884        default         ~k  # GPG
color index           #50685d     default         ~N  # new messages
color index_author    #3e686a      default         .*  # all authors

# Special Email Elements
color body            #4e6483      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #3e686a      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #6c6147         default         "\\[[0-9]+\\]"
color body            #6c6146    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #895260            default         ~D   # deleted
color index_flags     #3e686a      default         ~g   # signed
color index_flags     #4e6483      default         ~G   # encrypted
color index_author    #50685d     default         ~P   # from me
color index_author    #835739    default         ~F   # flagged
color index_author    #835739    default         ~l   # mailing lists
color index_flags     #57665e          default         ~N   # new
color index_flags     #8e4f5d       default         ~l   # lists
color index_date      #895260            default              # date
color index_size      #4e6483      default              # size
color index_number    #6c6146    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #835739  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #4e6767           default
color sidebar_divider       #4e6483    default
color sidebar_flagged       #4e6483    default
color sidebar_new           #895260          default
color sidebar_ordinary      #50685d   default
color sidebar_spool_file    #6c6147       default
color sidebar_unread        #895260          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold