# LvimKanagawa_dark colors for Neomutt

# Basic Colors
color normal          #8585a4             default         # normal text
color indicator       default           #202127      # selected item
color tree            #5f9087      default         # thread arrows
color status          #5188dc      default         # status line
color error           #df5f5f       default         # error messages
color message         #768e56     default         # info messages
color markers         #b7875b    default         # + at line wrapping
color attachment      #c56d67   default         # attachment info
color search          #cbae75    default         # search matches
color tilde           #4e4e73        default         # ~ empty lines

# Message Headers
color hdrdefault      #8383b4        default         # default header
color header          #5588d7           default         '^From:'
color header          #8d81a9    default         '^Subject:'
color header          #629189           default         '^User-Agent:.*Mutt'
color header          #5f9087      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #789059          default         # quoted text
color quoted1         #5188dc      default         # nested quote
color quoted2         #8c81a9         default         # nested quote 2
color quoted3         #5f9087      default         # nested quote 3
color quoted4         #cbae75    default         # nested quote 4
color quoted5         #c4726c        default         # nested quote 5
color signature       #8383b4        default         # signature
color bold            #bf8f62         default         # bold text
color underline       #b7875b    default         # underlined text

# Message Index
color index           #629189           default         ~Q  # replied messages
color index           #df5f5f       default         ~D  # deleted messages
color index           #8383b4        default         ~O  # old messages
color index           #5188dc      default         ~P  # from me
color index           #cbae75    default         ~T  # tagged messages
color index           #bf8f62         default         ~F  # flagged messages
color index           #8d81a9    default         ~v  # collapsed thread
color index           #c4726c        default         ~k  # GPG
color index           #768e56     default         ~N  # new messages
color index_author    #5f9087      default         .*  # all authors

# Special Email Elements
color body            #5188dc      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5f9087      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #d1b57c         default         "\\[[0-9]+\\]"
color body            #cbae75    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #d66666            default         ~D   # deleted
color index_flags     #5f9087      default         ~g   # signed
color index_flags     #5188dc      default         ~G   # encrypted
color index_author    #768e56     default         ~P   # from me
color index_author    #b7875b    default         ~F   # flagged
color index_author    #b7875b    default         ~l   # mailing lists
color index_flags     #789059          default         ~N   # new
color index_flags     #df5f5f       default         ~l   # lists
color index_date      #d66666            default              # date
color index_size      #5188dc      default              # size
color index_number    #cbae75    default              # number

color indicator             default         #202127
color sidebar_indicator     #b7875b  #202127
color sidebar_highlight     default         #202127
color sidebar_background    #8585a4           default
color sidebar_divider       #5188dc    default
color sidebar_flagged       #5188dc    default
color sidebar_new           #d66666          default
color sidebar_ordinary      #768e56   default
color sidebar_spool_file    #d1b57c       default
color sidebar_unread        #d66666          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold