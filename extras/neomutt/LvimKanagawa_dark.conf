# LvimKanagawa_dark colors for Neomutt

# Basic Colors
color normal          #54546d             default         # normal text
color indicator       default           #202127      # selected item
color tree            #52716b      default         # thread arrows
color status          #496291      default         # status line
color error           #b34b4b       default         # error messages
color message         #64754e     default         # info messages
color markers         #b7875b    default         # + at line wrapping
color attachment      #bc6a64   default         # attachment info
color search          #cbae75    default         # search matches
color tilde           #4e4e73        default         # ~ empty lines

# Message Headers
color hdrdefault      #4e4e73        default         # default header
color header          #4e6a9c           default         '^From:'
color header          #695e82    default         '^Subject:'
color header          #587a74           default         '^User-Agent:.*Mutt'
color header          #52716b      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #6c7f54          default         # quoted text
color quoted1         #496291      default         # nested quote
color quoted2         #70658b         default         # nested quote 2
color quoted3         #52716b      default         # nested quote 3
color quoted4         #cbae75    default         # nested quote 4
color quoted5         #c4726c        default         # nested quote 5
color signature       #4e4e73        default         # signature
color bold            #bf8f62         default         # bold text
color underline       #b7875b    default         # underlined text

# Message Index
color index           #587a74           default         ~Q  # replied messages
color index           #b34b4b       default         ~D  # deleted messages
color index           #4e4e73        default         ~O  # old messages
color index           #496291      default         ~P  # from me
color index           #cbae75    default         ~T  # tagged messages
color index           #bf8f62         default         ~F  # flagged messages
color index           #695e82    default         ~v  # collapsed thread
color index           #c4726c        default         ~k  # GPG
color index           #64754e     default         ~N  # new messages
color index_author    #52716b      default         .*  # all authors

# Special Email Elements
color body            #496291      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #52716b      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #d1b57c         default         "\\[[0-9]+\\]"
color body            #cbae75    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #ba5454            default         ~D   # deleted
color index_flags     #52716b      default         ~g   # signed
color index_flags     #496291      default         ~G   # encrypted
color index_author    #64754e     default         ~P   # from me
color index_author    #b7875b    default         ~F   # flagged
color index_author    #b7875b    default         ~l   # mailing lists
color index_flags     #6c7f54          default         ~N   # new
color index_flags     #b34b4b       default         ~l   # lists
color index_date      #ba5454            default              # date
color index_size      #496291      default              # size
color index_number    #cbae75    default              # number

color indicator             default         #202127
color sidebar_indicator     #b7875b  #202127
color sidebar_highlight     default         #202127
color sidebar_background    #54546d           default
color sidebar_divider       #496291    default
color sidebar_flagged       #496291    default
color sidebar_new           #ba5454          default
color sidebar_ordinary      #64754e   default
color sidebar_spool_file    #d1b57c       default
color sidebar_unread        #ba5454          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold