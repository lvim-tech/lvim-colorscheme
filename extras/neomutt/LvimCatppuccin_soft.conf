# LvimCatppuccin_soft colors for Neomutt

# Basic Colors
color normal          #b2b7c7             default         # normal text
color indicator       default           #22232d      # selected item
color tree            #638f9a      default         # thread arrows
color status          #6489cc      default         # status line
color error           #cb6b83       default         # error messages
color message         #669563     default         # info messages
color markers         #b07c64    default         # + at line wrapping
color attachment      #b972a4   default         # attachment info
color search          #af9973    default         # search matches
color tilde           #6c7393        default         # ~ empty lines

# Message Headers
color hdrdefault      #8087a9        default         # default header
color header          #6c8bc3           default         '^From:'
color header          #9b7bc4    default         '^Subject:'
color header          #698f97           default         '^User-Agent:.*Mutt'
color header          #638f9a      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #6e936c          default         # quoted text
color quoted1         #6489cc      default         # nested quote
color quoted2         #9c7ebe         default         # nested quote 2
color quoted3         #638f9a      default         # nested quote 3
color quoted4         #af9973    default         # nested quote 4
color quoted5         #b976a7        default         # nested quote 5
color signature       #8087a9        default         # signature
color bold            #b88970         default         # bold text
color underline       #b07c64    default         # underlined text

# Message Index
color index           #698f97           default         ~Q  # replied messages
color index           #cb6b83       default         ~D  # deleted messages
color index           #8087a9        default         ~O  # old messages
color index           #6489cc      default         ~P  # from me
color index           #af9973    default         ~T  # tagged messages
color index           #b88970         default         ~F  # flagged messages
color index           #9b7bc4    default         ~v  # collapsed thread
color index           #b976a7        default         ~k  # GPG
color index           #669563     default         ~N  # new messages
color index_author    #638f9a      default         .*  # all authors

# Special Email Elements
color body            #6489cc      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #638f9a      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #b8a47e         default         "\\[[0-9]+\\]"
color body            #af9973    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #c46f84            default         ~D   # deleted
color index_flags     #638f9a      default         ~g   # signed
color index_flags     #6489cc      default         ~G   # encrypted
color index_author    #669563     default         ~P   # from me
color index_author    #b07c64    default         ~F   # flagged
color index_author    #b07c64    default         ~l   # mailing lists
color index_flags     #6e936c          default         ~N   # new
color index_flags     #cb6b83       default         ~l   # lists
color index_date      #c46f84            default              # date
color index_size      #6489cc      default              # size
color index_number    #af9973    default              # number

color indicator             default         #22232d
color sidebar_indicator     #b47e65  #22232d
color sidebar_highlight     default         #22232d
color sidebar_background    #b2b7c7           default
color sidebar_divider       #6489cc    default
color sidebar_flagged       #6489cc    default
color sidebar_new           #c46f84          default
color sidebar_ordinary      #669563   default
color sidebar_spool_file    #b8a47e       default
color sidebar_unread        #c46f84          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold