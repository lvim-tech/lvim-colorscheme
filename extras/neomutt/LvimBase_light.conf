# LvimBase_light colors for Neomutt

# Basic Colors
color normal          #4e6767             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #436670      default         # thread arrows
color status          #46647b      default         # status line
color error           #9d4640       default         # error messages
color message         #596843     default         # info messages
color markers         #84593f    default         # + at line wrapping
color attachment      #934f43   default         # attachment info
color search          #745f3f    default         # search matches
color tilde           #789698        default         # ~ empty lines

# Message Headers
color hdrdefault      #576667        default         # default header
color header          #42657f           default         '^From:'
color header          #4a657f    default         '^Subject:'
color header          #3e6975           default         '^User-Agent:.*Mutt'
color header          #436670      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #55673c          default         # quoted text
color quoted1         #46647b      default         # nested quote
color quoted2         #476684         default         # nested quote 2
color quoted3         #436670      default         # nested quote 3
color quoted4         #745f3f    default         # nested quote 4
color quoted5         #984e40        default         # nested quote 5
color signature       #576667        default         # signature
color bold            #80593d         default         # bold text
color underline       #84593f    default         # underlined text

# Message Index
color index           #3e6975           default         ~Q  # replied messages
color index           #9d4640       default         ~D  # deleted messages
color index           #576667        default         ~O  # old messages
color index           #46647b      default         ~P  # from me
color index           #745f3f    default         ~T  # tagged messages
color index           #80593d         default         ~F  # flagged messages
color index           #4a657f    default         ~v  # collapsed thread
color index           #984e40        default         ~k  # GPG
color index           #596843     default         ~N  # new messages
color index_author    #436670      default         .*  # all authors

# Special Email Elements
color body            #46647b      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #436670      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #72603f         default         "\\[[0-9]+\\]"
color body            #745f3f    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #9f483f            default         ~D   # deleted
color index_flags     #436670      default         ~g   # signed
color index_flags     #46647b      default         ~G   # encrypted
color index_author    #596843     default         ~P   # from me
color index_author    #84593f    default         ~F   # flagged
color index_author    #84593f    default         ~l   # mailing lists
color index_flags     #55673c          default         ~N   # new
color index_flags     #9d4640       default         ~l   # lists
color index_date      #9f483f            default              # date
color index_size      #46647b      default              # size
color index_number    #745f3f    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #885b40  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #4e6767           default
color sidebar_divider       #46647b    default
color sidebar_flagged       #46647b    default
color sidebar_new           #9f483f          default
color sidebar_ordinary      #596843   default
color sidebar_spool_file    #72603f       default
color sidebar_unread        #9f483f          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold