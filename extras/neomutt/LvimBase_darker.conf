# LvimBase_darker colors for Neomutt

# Basic Colors
color normal          #608e8e             default         # normal text
color indicator       default           #1c2225      # selected item
color tree            #2c92a7      default         # thread arrows
color status          #2a8fc1      default         # status line
color error           #e75547       default         # error messages
color message         #778e52     default         # info messages
color markers         #da8950    default         # + at line wrapping
color attachment      #de6146   default         # attachment info
color search          #d1aa64    default         # search matches
color tilde           #4d6263        default         # ~ empty lines

# Message Headers
color hdrdefault      #638e8f        default         # default header
color header          #418dbc           default         '^From:'
color header          #068fd0    default         '^Subject:'
color header          #4291a3           default         '^User-Agent:.*Mutt'
color header          #2c92a7      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #7e965a          default         # quoted text
color quoted1         #2a8fc1      default         # nested quote
color quoted2         #378cc8         default         # nested quote 2
color quoted3         #2c92a7      default         # nested quote 3
color quoted4         #d1aa64    default         # nested quote 4
color quoted5         #d5654e        default         # nested quote 5
color signature       #638e8f        default         # signature
color bold            #e19556         default         # bold text
color underline       #da8950    default         # underlined text

# Message Index
color index           #4291a3           default         ~Q  # replied messages
color index           #e75547       default         ~D  # deleted messages
color index           #638e8f        default         ~O  # old messages
color index           #2a8fc1      default         ~P  # from me
color index           #d1aa64    default         ~T  # tagged messages
color index           #e19556         default         ~F  # flagged messages
color index           #068fd0    default         ~v  # collapsed thread
color index           #d5654e        default         ~k  # GPG
color index           #778e52     default         ~N  # new messages
color index_author    #2c92a7      default         .*  # all authors

# Special Email Elements
color body            #2a8fc1      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #2c92a7      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #d8b36f         default         "\\[[0-9]+\\]"
color body            #d1aa64    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #dc5f52            default         ~D   # deleted
color index_flags     #2c92a7      default         ~g   # signed
color index_flags     #2a8fc1      default         ~G   # encrypted
color index_author    #778e52     default         ~P   # from me
color index_author    #da8950    default         ~F   # flagged
color index_author    #da8950    default         ~l   # mailing lists
color index_flags     #7e965a          default         ~N   # new
color index_flags     #e75547       default         ~l   # lists
color index_date      #dc5f52            default              # date
color index_size      #2a8fc1      default              # size
color index_number    #d1aa64    default              # number

color indicator             default         #1c2225
color sidebar_indicator     #da8950  #1c2225
color sidebar_highlight     default         #1c2225
color sidebar_background    #608e8e           default
color sidebar_divider       #2a8fc1    default
color sidebar_flagged       #2a8fc1    default
color sidebar_new           #dc5f52          default
color sidebar_ordinary      #778e52   default
color sidebar_spool_file    #d8b36f       default
color sidebar_unread        #dc5f52          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold