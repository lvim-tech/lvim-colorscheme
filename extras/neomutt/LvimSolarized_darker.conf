# LvimSolarized_darker colors for Neomutt

# Basic Colors
color normal          #9da4a4             default         # normal text
color indicator       default           #001f27      # selected item
color tree            #438e89      default         # thread arrows
color status          #488ab9      default         # status line
color error           #e54f4b       default         # error messages
color message         #7d8a2f     default         # info messages
color markers         #c76841    default         # + at line wrapping
color attachment      #d55193   default         # attachment info
color search          #978043    default         # search matches
color tilde           #5d6a6f        default         # ~ empty lines

# Message Headers
color hdrdefault      #72878e        default         # default header
color header          #5089b4           default         '^From:'
color header          #7d80a5    default         '^Subject:'
color header          #4c8e88           default         '^User-Agent:.*Mutt'
color header          #438e89      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #7e8a3c          default         # quoted text
color quoted1         #488ab9      default         # nested quote
color quoted2         #7f81a2         default         # nested quote 2
color quoted3         #438e89      default         # nested quote 3
color quoted4         #978043    default         # nested quote 4
color quoted5         #cf5a93        default         # nested quote 5
color signature       #72878e        default         # signature
color bold            #c16a49         default         # bold text
color underline       #c76841    default         # underlined text

# Message Index
color index           #4c8e88           default         ~Q  # replied messages
color index           #e54f4b       default         ~D  # deleted messages
color index           #72878e        default         ~O  # old messages
color index           #488ab9      default         ~P  # from me
color index           #978043    default         ~T  # tagged messages
color index           #c16a49         default         ~F  # flagged messages
color index           #7d80a5    default         ~v  # collapsed thread
color index           #cf5a93        default         ~k  # GPG
color index           #7d8a2f     default         ~N  # new messages
color index_author    #438e89      default         .*  # all authors

# Special Email Elements
color body            #488ab9      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #438e89      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #9f8549         default         "\\[[0-9]+\\]"
color body            #978043    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #dd5755            default         ~D   # deleted
color index_flags     #438e89      default         ~g   # signed
color index_flags     #488ab9      default         ~G   # encrypted
color index_author    #7d8a2f     default         ~P   # from me
color index_author    #c76841    default         ~F   # flagged
color index_author    #c76841    default         ~l   # mailing lists
color index_flags     #7e8a3c          default         ~N   # new
color index_flags     #e54f4b       default         ~l   # lists
color index_date      #dd5755            default              # date
color index_size      #488ab9      default              # size
color index_number    #978043    default              # number

color indicator             default         #001f27
color sidebar_indicator     #cc6a41  #001f27
color sidebar_highlight     default         #001f27
color sidebar_background    #9da4a4           default
color sidebar_divider       #488ab9    default
color sidebar_flagged       #488ab9    default
color sidebar_new           #dd5755          default
color sidebar_ordinary      #7d8a2f   default
color sidebar_spool_file    #9f8549       default
color sidebar_unread        #dd5755          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold