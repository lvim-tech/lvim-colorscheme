# LvimSolarized_darker colors for Neomutt

# Basic Colors
color normal          #9da4a4             default         # normal text
color indicator       default           #001f27      # selected item
color tree            #437773      default         # thread arrows
color status          #477193      default         # status line
color error           #b34644       default         # error messages
color message         #666f37     default         # info messages
color markers         #a35b41    default         # + at line wrapping
color attachment      #b14d7d   default         # attachment info
color search          #917b43    default         # search matches
color tilde           #5d6a6f        default         # ~ empty lines

# Message Headers
color hdrdefault      #5d6a6f        default         # default header
color header          #4f7ea3           default         '^From:'
color header          #67698c    default         '^Subject:'
color header          #4b8580           default         '^User-Agent:.*Mutt'
color header          #437773      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #727c3e          default         # quoted text
color quoted1         #477193      default         # nested quote
color quoted2         #757797         default         # nested quote 2
color quoted3         #437773      default         # nested quote 3
color quoted4         #917b43    default         # nested quote 4
color quoted5         #c0578a        default         # nested quote 5
color signature       #5d6a6f        default         # signature
color bold            #b46548         default         # bold text
color underline       #a35b41    default         # underlined text

# Message Index
color index           #4b8580           default         ~Q  # replied messages
color index           #b34644       default         ~D  # deleted messages
color index           #5d6a6f        default         ~O  # old messages
color index           #477193      default         ~P  # from me
color index           #917b43    default         ~T  # tagged messages
color index           #b46548         default         ~F  # flagged messages
color index           #67698c    default         ~v  # collapsed thread
color index           #c0578a        default         ~k  # GPG
color index           #666f37     default         ~N  # new messages
color index_author    #437773      default         .*  # all authors

# Special Email Elements
color body            #477193      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #437773      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #9f8549         default         "\\[[0-9]+\\]"
color body            #917b43    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #c24f4d            default         ~D   # deleted
color index_flags     #437773      default         ~g   # signed
color index_flags     #477193      default         ~G   # encrypted
color index_author    #666f37     default         ~P   # from me
color index_author    #a35b41    default         ~F   # flagged
color index_author    #a35b41    default         ~l   # mailing lists
color index_flags     #727c3e          default         ~N   # new
color index_flags     #b34644       default         ~l   # lists
color index_date      #c24f4d            default              # date
color index_size      #477193      default              # size
color index_number    #917b43    default              # number

color indicator             default         #001f27
color sidebar_indicator     #a35b41  #001f27
color sidebar_highlight     default         #001f27
color sidebar_background    #9da4a4           default
color sidebar_divider       #477193    default
color sidebar_flagged       #477193    default
color sidebar_new           #c24f4d          default
color sidebar_ordinary      #666f37   default
color sidebar_spool_file    #9f8549       default
color sidebar_unread        #c24f4d          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold