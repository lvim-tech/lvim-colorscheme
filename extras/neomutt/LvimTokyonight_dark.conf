# LvimTokyonight_dark colors for Neomutt

# Basic Colors
color normal          #b2b6c7             default         # normal text
color indicator       default           #1d2028      # selected item
color tree            #6389a8      default         # thread arrows
color status          #6985cb      default         # status line
color error           #cd6575       default         # error messages
color message         #758c5f     default         # info messages
color markers         #b17a63    default         # + at line wrapping
color attachment      #917bc1   default         # attachment info
color search          #ad9170    default         # search matches
color tilde           #616784        default         # ~ empty lines

# Message Headers
color hdrdefault      #7d85a9        default         # default header
color header          #6c85c1           default         '^From:'
color header          #8f7cb3    default         '^Subject:'
color header          #688aa4           default         '^User-Agent:.*Mutt'
color header          #6389a8      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #7a8d68          default         # quoted text
color quoted1         #6985cb      default         # nested quote
color quoted2         #8f7eac         default         # nested quote 2
color quoted3         #6389a8      default         # nested quote 3
color quoted4         #ad9170    default         # nested quote 4
color quoted5         #907bba        default         # nested quote 5
color signature       #7d85a9        default         # signature
color bold            #bb866d         default         # bold text
color underline       #b17a63    default         # underlined text

# Message Index
color index           #688aa4           default         ~Q  # replied messages
color index           #cd6575       default         ~D  # deleted messages
color index           #7d85a9        default         ~O  # old messages
color index           #6985cb      default         ~P  # from me
color index           #ad9170    default         ~T  # tagged messages
color index           #bb866d         default         ~F  # flagged messages
color index           #8f7cb3    default         ~v  # collapsed thread
color index           #907bba        default         ~k  # GPG
color index           #758c5f     default         ~N  # new messages
color index_author    #6389a8      default         .*  # all authors

# Special Email Elements
color body            #6985cb      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #6389a8      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #b79d7b         default         "\\[[0-9]+\\]"
color body            #ad9170    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #c86b7b            default         ~D   # deleted
color index_flags     #6389a8      default         ~g   # signed
color index_flags     #6985cb      default         ~G   # encrypted
color index_author    #758c5f     default         ~P   # from me
color index_author    #b17a63    default         ~F   # flagged
color index_author    #b17a63    default         ~l   # mailing lists
color index_flags     #7a8d68          default         ~N   # new
color index_flags     #cd6575       default         ~l   # lists
color index_date      #c86b7b            default              # date
color index_size      #6985cb      default              # size
color index_number    #ad9170    default              # number

color indicator             default         #1d2028
color sidebar_indicator     #b17a63  #1d2028
color sidebar_highlight     default         #1d2028
color sidebar_background    #b2b6c7           default
color sidebar_divider       #6985cb    default
color sidebar_flagged       #6985cb    default
color sidebar_new           #c86b7b          default
color sidebar_ordinary      #758c5f   default
color sidebar_spool_file    #b79d7b       default
color sidebar_unread        #c86b7b          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold