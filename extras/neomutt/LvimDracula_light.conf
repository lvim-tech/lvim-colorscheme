# LvimDracula_light colors for Neomutt

# Basic Colors
color normal          #5e8888             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #51766e      default         # thread arrows
color status          #5a7d87      default         # status line
color error           #c75e5e       default         # error messages
color message         #507a57     default         # info messages
color markers         #7e5f47    default         # + at line wrapping
color attachment      #a65981   default         # attachment info
color search          #7c8158    default         # search matches
color tilde           #6b728f        default         # ~ empty lines

# Message Headers
color hdrdefault      #6b728f        default         # default header
color header          #517079           default         '^From:'
color header          #9888b1    default         '^Subject:'
color header          #496b64           default         '^User-Agent:.*Mutt'
color header          #51766e      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #466d4e          default         # quoted text
color quoted1         #5a7d87      default         # nested quote
color quoted2         #8b79a6         default         # nested quote 2
color quoted3         #51766e      default         # nested quote 3
color quoted4         #7c8158    default         # nested quote 4
color quoted5         #905274        default         # nested quote 5
color signature       #6b728f        default         # signature
color bold            #a38165         default         # bold text
color underline       #7e5f47    default         # underlined text

# Message Index
color index           #496b64           default         ~Q  # replied messages
color index           #c75e5e       default         ~D  # deleted messages
color index           #6b728f        default         ~O  # old messages
color index           #5a7d87      default         ~P  # from me
color index           #7c8158    default         ~T  # tagged messages
color index           #a38165         default         ~F  # flagged messages
color index           #9888b1    default         ~v  # collapsed thread
color index           #905274        default         ~k  # GPG
color index           #507a57     default         ~N  # new messages
color index_author    #51766e      default         .*  # all authors

# Special Email Elements
color body            #5a7d87      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #51766e      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #777b56         default         "\\[[0-9]+\\]"
color body            #7c8158    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #af5959            default         ~D   # deleted
color index_flags     #51766e      default         ~g   # signed
color index_flags     #5a7d87      default         ~G   # encrypted
color index_author    #507a57     default         ~P   # from me
color index_author    #7e5f47    default         ~F   # flagged
color index_author    #7e5f47    default         ~l   # mailing lists
color index_flags     #466d4e          default         ~N   # new
color index_flags     #c75e5e       default         ~l   # lists
color index_date      #af5959            default              # date
color index_size      #5a7d87      default              # size
color index_number    #7c8158    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #7e5f47  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #5e8888           default
color sidebar_divider       #5a7d87    default
color sidebar_flagged       #5a7d87    default
color sidebar_new           #af5959          default
color sidebar_ordinary      #507a57   default
color sidebar_spool_file    #777b56       default
color sidebar_unread        #af5959          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold