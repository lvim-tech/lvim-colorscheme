# LvimDracula_light colors for Neomutt

# Basic Colors
color normal          #4e6767             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #4b6862      default         # thread arrows
color status          #4e656c      default         # status line
color error           #944f4f       default         # error messages
color message         #49694e     default         # info messages
color markers         #7b5d46    default         # + at line wrapping
color attachment      #8c506f   default         # attachment info
color search          #61644b    default         # search matches
color tilde           #6b728f        default         # ~ empty lines

# Message Headers
color hdrdefault      #5c6177        default         # default header
color header          #4c656d           default         '^From:'
color header          #695c7d    default         '^Subject:'
color header          #486862           default         '^User-Agent:.*Mutt'
color header          #4b6862      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #456a4d          default         # quoted text
color quoted1         #4e656c      default         # nested quote
color quoted2         #6b5c81         default         # nested quote 2
color quoted3         #4b6862      default         # nested quote 3
color quoted4         #61644b    default         # nested quote 4
color quoted5         #884f6e        default         # nested quote 5
color signature       #5c6177        default         # signature
color bold            #725e50         default         # bold text
color underline       #7b5d46    default         # underlined text

# Message Index
color index           #486862           default         ~Q  # replied messages
color index           #944f4f       default         ~D  # deleted messages
color index           #5c6177        default         ~O  # old messages
color index           #4e656c      default         ~P  # from me
color index           #61644b    default         ~T  # tagged messages
color index           #725e50         default         ~F  # flagged messages
color index           #695c7d    default         ~v  # collapsed thread
color index           #884f6e        default         ~k  # GPG
color index           #49694e     default         ~N  # new messages
color index_author    #4b6862      default         .*  # all authors

# Special Email Elements
color body            #4e656c      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #4b6862      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #61644b         default         "\\[[0-9]+\\]"
color body            #61644b    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #904f4f            default         ~D   # deleted
color index_flags     #4b6862      default         ~g   # signed
color index_flags     #4e656c      default         ~G   # encrypted
color index_author    #49694e     default         ~P   # from me
color index_author    #7b5d46    default         ~F   # flagged
color index_author    #7b5d46    default         ~l   # mailing lists
color index_flags     #456a4d          default         ~N   # new
color index_flags     #944f4f       default         ~l   # lists
color index_date      #904f4f            default              # date
color index_size      #4e656c      default              # size
color index_number    #61644b    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #7e5f47  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #4e6767           default
color sidebar_divider       #4e656c    default
color sidebar_flagged       #4e656c    default
color sidebar_new           #904f4f          default
color sidebar_ordinary      #49694e   default
color sidebar_spool_file    #61644b       default
color sidebar_unread        #904f4f          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold