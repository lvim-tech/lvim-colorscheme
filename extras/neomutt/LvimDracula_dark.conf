# LvimDracula_dark colors for Neomutt

# Basic Colors
color normal          #c7c7b3             default         # normal text
color indicator       default           #242630      # selected item
color tree            #62958b      default         # thread arrows
color status          #6292a0      default         # status line
color error           #d66c6c       default         # error messages
color message         #5f9a69     default         # info messages
color markers         #ae8363    default         # + at line wrapping
color attachment      #cb6c9e   default         # attachment info
color search          #a3a975    default         # search matches
color tilde           #727a98        default         # ~ empty lines

# Message Headers
color hdrdefault      #848caa        default         # default header
color header          #6894a0           default         '^From:'
color header          #9a82be    default         '^Subject:'
color header          #67968d           default         '^User-Agent:.*Mutt'
color header          #62958b      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #63996f          default         # quoted text
color quoted1         #6292a0      default         # nested quote
color quoted2         #9882b6         default         # nested quote 2
color quoted3         #62958b      default         # nested quote 3
color quoted4         #a3a975    default         # nested quote 4
color quoted5         #c1729c        default         # nested quote 5
color signature       #848caa        default         # signature
color bold            #b58f70         default         # bold text
color underline       #ae8363    default         # underlined text

# Message Index
color index           #67968d           default         ~Q  # replied messages
color index           #d66c6c       default         ~D  # deleted messages
color index           #848caa        default         ~O  # old messages
color index           #6292a0      default         ~P  # from me
color index           #a3a975    default         ~T  # tagged messages
color index           #b58f70         default         ~F  # flagged messages
color index           #9a82be    default         ~v  # collapsed thread
color index           #c1729c        default         ~k  # GPG
color index           #5f9a69     default         ~N  # new messages
color index_author    #62958b      default         .*  # all authors

# Special Email Elements
color body            #6292a0      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #62958b      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #adb27e         default         "\\[[0-9]+\\]"
color body            #a3a975    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #cc7575            default         ~D   # deleted
color index_flags     #62958b      default         ~g   # signed
color index_flags     #6292a0      default         ~G   # encrypted
color index_author    #5f9a69     default         ~P   # from me
color index_author    #ae8363    default         ~F   # flagged
color index_author    #ae8363    default         ~l   # mailing lists
color index_flags     #63996f          default         ~N   # new
color index_flags     #d66c6c       default         ~l   # lists
color index_date      #cc7575            default              # date
color index_size      #6292a0      default              # size
color index_number    #a3a975    default              # number

color indicator             default         #242630
color sidebar_indicator     #b18664  #242630
color sidebar_highlight     default         #242630
color sidebar_background    #c7c7b3           default
color sidebar_divider       #6292a0    default
color sidebar_flagged       #6292a0    default
color sidebar_new           #cc7575          default
color sidebar_ordinary      #5f9a69   default
color sidebar_spool_file    #adb27e       default
color sidebar_unread        #cc7575          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold