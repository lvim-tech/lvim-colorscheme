# LvimDracula_darker colors for Neomutt

# Basic Colors
color normal          #c7c7b3             default         # normal text
color indicator       default           #1d1f27      # selected item
color tree            #5d877e      default         # thread arrows
color status          #597c86      default         # status line
color error           #b15353       default         # error messages
color message         #598861     default         # info messages
color markers         #aa8162    default         # + at line wrapping
color attachment      #b4618c   default         # attachment info
color search          #a3a975    default         # search matches
color tilde           #727a98        default         # ~ empty lines

# Message Headers
color hdrdefault      #727a98        default         # default header
color header          #638993           default         '^From:'
color header          #6a5786    default         '^Subject:'
color header          #66938a           default         '^User-Agent:.*Mutt'
color header          #5d877e      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #62966d          default         # quoted text
color quoted1         #597c86      default         # nested quote
color quoted2         #796496         default         # nested quote 2
color quoted3         #5d877e      default         # nested quote 3
color quoted4         #a3a975    default         # nested quote 4
color quoted5         #bf6f9a        default         # nested quote 5
color signature       #727a98        default         # signature
color bold            #b58f70         default         # bold text
color underline       #aa8162    default         # underlined text

# Message Index
color index           #66938a           default         ~Q  # replied messages
color index           #b15353       default         ~D  # deleted messages
color index           #727a98        default         ~O  # old messages
color index           #597c86      default         ~P  # from me
color index           #a3a975    default         ~T  # tagged messages
color index           #b58f70         default         ~F  # flagged messages
color index           #6a5786    default         ~v  # collapsed thread
color index           #bf6f9a        default         ~k  # GPG
color index           #598861     default         ~N  # new messages
color index_author    #5d877e      default         .*  # all authors

# Special Email Elements
color body            #597c86      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5d877e      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #adb27e         default         "\\[[0-9]+\\]"
color body            #a3a975    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #bc6060            default         ~D   # deleted
color index_flags     #5d877e      default         ~g   # signed
color index_flags     #597c86      default         ~G   # encrypted
color index_author    #598861     default         ~P   # from me
color index_author    #aa8162    default         ~F   # flagged
color index_author    #aa8162    default         ~l   # mailing lists
color index_flags     #62966d          default         ~N   # new
color index_flags     #b15353       default         ~l   # lists
color index_date      #bc6060            default              # date
color index_size      #597c86      default              # size
color index_number    #a3a975    default              # number

color indicator             default         #1d1f27
color sidebar_indicator     #aa8162  #1d1f27
color sidebar_highlight     default         #1d1f27
color sidebar_background    #c7c7b3           default
color sidebar_divider       #597c86    default
color sidebar_flagged       #597c86    default
color sidebar_new           #bc6060          default
color sidebar_ordinary      #598861   default
color sidebar_spool_file    #adb27e       default
color sidebar_unread        #bc6060          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold