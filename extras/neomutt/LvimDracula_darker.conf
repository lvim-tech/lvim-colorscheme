# LvimDracula_darker colors for Neomutt

# Basic Colors
color normal          #c7c7b3             default         # normal text
color indicator       default           #1d1f27      # selected item
color tree            #5f8d83      default         # thread arrows
color status          #608d99      default         # status line
color error           #d26161       default         # error messages
color message         #5c9165     default         # info messages
color markers         #aa8162    default         # + at line wrapping
color attachment      #c66699   default         # attachment info
color search          #a3a975    default         # search matches
color tilde           #727a98        default         # ~ empty lines

# Message Headers
color hdrdefault      #7c84a3        default         # default header
color header          #648c96           default         '^From:'
color header          #927ab7    default         '^Subject:'
color header          #66938a           default         '^User-Agent:.*Mutt'
color header          #5f8d83      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #62966d          default         # quoted text
color quoted1         #608d99      default         # nested quote
color quoted2         #937db1         default         # nested quote 2
color quoted3         #5f8d83      default         # nested quote 3
color quoted4         #a3a975    default         # nested quote 4
color quoted5         #bf6f9a        default         # nested quote 5
color signature       #7c84a3        default         # signature
color bold            #b58f70         default         # bold text
color underline       #aa8162    default         # underlined text

# Message Index
color index           #66938a           default         ~Q  # replied messages
color index           #d26161       default         ~D  # deleted messages
color index           #7c84a3        default         ~O  # old messages
color index           #608d99      default         ~P  # from me
color index           #a3a975    default         ~T  # tagged messages
color index           #b58f70         default         ~F  # flagged messages
color index           #927ab7    default         ~v  # collapsed thread
color index           #bf6f9a        default         ~k  # GPG
color index           #5c9165     default         ~N  # new messages
color index_author    #5f8d83      default         .*  # all authors

# Special Email Elements
color body            #608d99      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5f8d83      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #adb27e         default         "\\[[0-9]+\\]"
color body            #a3a975    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #c76b6b            default         ~D   # deleted
color index_flags     #5f8d83      default         ~g   # signed
color index_flags     #608d99      default         ~G   # encrypted
color index_author    #5c9165     default         ~P   # from me
color index_author    #aa8162    default         ~F   # flagged
color index_author    #aa8162    default         ~l   # mailing lists
color index_flags     #62966d          default         ~N   # new
color index_flags     #d26161       default         ~l   # lists
color index_date      #c76b6b            default              # date
color index_size      #608d99      default              # size
color index_number    #a3a975    default              # number

color indicator             default         #1d1f27
color sidebar_indicator     #aa8162  #1d1f27
color sidebar_highlight     default         #1d1f27
color sidebar_background    #c7c7b3           default
color sidebar_divider       #608d99    default
color sidebar_flagged       #608d99    default
color sidebar_new           #c76b6b          default
color sidebar_ordinary      #5c9165   default
color sidebar_spool_file    #adb27e       default
color sidebar_unread        #c76b6b          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold