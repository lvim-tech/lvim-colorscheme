# LvimTokyonight_darker colors for Neomutt

# Basic Colors
color normal          #b2b6c7             default         # normal text
color indicator       default           #181b22      # selected item
color tree            #6287a4      default         # thread arrows
color status          #6480c6      default         # status line
color error           #cb6172       default         # error messages
color message         #73895e     default         # info messages
color markers         #ad7862    default         # + at line wrapping
color attachment      #8c76bc   default         # attachment info
color search          #ad9170    default         # search matches
color tilde           #616784        default         # ~ empty lines

# Message Headers
color hdrdefault      #7880a4        default         # default header
color header          #6982bf           default         '^From:'
color header          #8d79b0    default         '^Subject:'
color header          #65859d           default         '^User-Agent:.*Mutt'
color header          #6287a4      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #788a67          default         # quoted text
color quoted1         #6480c6      default         # nested quote
color quoted2         #8a79a7         default         # nested quote 2
color quoted3         #6287a4      default         # nested quote 3
color quoted4         #ad9170    default         # nested quote 4
color quoted5         #907bba        default         # nested quote 5
color signature       #7880a4        default         # signature
color bold            #bb866d         default         # bold text
color underline       #ad7862    default         # underlined text

# Message Index
color index           #65859d           default         ~Q  # replied messages
color index           #cb6172       default         ~D  # deleted messages
color index           #7880a4        default         ~O  # old messages
color index           #6480c6      default         ~P  # from me
color index           #ad9170    default         ~T  # tagged messages
color index           #bb866d         default         ~F  # flagged messages
color index           #8d79b0    default         ~v  # collapsed thread
color index           #907bba        default         ~k  # GPG
color index           #73895e     default         ~N  # new messages
color index_author    #6287a4      default         .*  # all authors

# Special Email Elements
color body            #6480c6      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #6287a4      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #b79d7b         default         "\\[[0-9]+\\]"
color body            #ad9170    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #c46475            default         ~D   # deleted
color index_flags     #6287a4      default         ~g   # signed
color index_flags     #6480c6      default         ~G   # encrypted
color index_author    #73895e     default         ~P   # from me
color index_author    #ad7862    default         ~F   # flagged
color index_author    #ad7862    default         ~l   # mailing lists
color index_flags     #788a67          default         ~N   # new
color index_flags     #cb6172       default         ~l   # lists
color index_date      #c46475            default              # date
color index_size      #6480c6      default              # size
color index_number    #ad9170    default              # number

color indicator             default         #181b22
color sidebar_indicator     #ad7862  #181b22
color sidebar_highlight     default         #181b22
color sidebar_background    #b2b6c7           default
color sidebar_divider       #6480c6    default
color sidebar_flagged       #6480c6    default
color sidebar_new           #c46475          default
color sidebar_ordinary      #73895e   default
color sidebar_spool_file    #b79d7b       default
color sidebar_unread        #c46475          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold