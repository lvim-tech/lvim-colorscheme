# LvimDracula_soft colors for Neomutt

# Basic Colors
color normal          #c7c7b3             default         # normal text
color indicator       default           #292b36      # selected item
color tree            #649b90      default         # thread arrows
color status          #6398a6      default         # status line
color error           #d97373       default         # error messages
color message         #61a06c     default         # info messages
color markers         #b58865    default         # + at line wrapping
color attachment      #cf73a2   default         # attachment info
color search          #a3a975    default         # search matches
color tilde           #727a98        default         # ~ empty lines

# Message Headers
color hdrdefault      #878fad        default         # default header
color header          #6997a3           default         '^From:'
color header          #9d85c1    default         '^Subject:'
color header          #68998f           default         '^User-Agent:.*Mutt'
color header          #649b90      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #659f72          default         # quoted text
color quoted1         #6398a6      default         # nested quote
color quoted2         #9d88bb         default         # nested quote 2
color quoted3         #649b90      default         # nested quote 3
color quoted4         #a3a975    default         # nested quote 4
color quoted5         #c578a1        default         # nested quote 5
color signature       #878fad        default         # signature
color bold            #b58f70         default         # bold text
color underline       #b58865    default         # underlined text

# Message Index
color index           #68998f           default         ~Q  # replied messages
color index           #d97373       default         ~D  # deleted messages
color index           #878fad        default         ~O  # old messages
color index           #6398a6      default         ~P  # from me
color index           #a3a975    default         ~T  # tagged messages
color index           #b58f70         default         ~F  # flagged messages
color index           #9d85c1    default         ~v  # collapsed thread
color index           #c578a1        default         ~k  # GPG
color index           #61a06c     default         ~N  # new messages
color index_author    #649b90      default         .*  # all authors

# Special Email Elements
color body            #6398a6      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #649b90      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #adb27e         default         "\\[[0-9]+\\]"
color body            #a3a975    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #cd7878            default         ~D   # deleted
color index_flags     #649b90      default         ~g   # signed
color index_flags     #6398a6      default         ~G   # encrypted
color index_author    #61a06c     default         ~P   # from me
color index_author    #b58865    default         ~F   # flagged
color index_author    #b58865    default         ~l   # mailing lists
color index_flags     #659f72          default         ~N   # new
color index_flags     #d97373       default         ~l   # lists
color index_date      #cd7878            default              # date
color index_size      #6398a6      default              # size
color index_number    #a3a975    default              # number

color indicator             default         #292b36
color sidebar_indicator     #b98a66  #292b36
color sidebar_highlight     default         #292b36
color sidebar_background    #c7c7b3           default
color sidebar_divider       #6398a6    default
color sidebar_flagged       #6398a6    default
color sidebar_new           #cd7878          default
color sidebar_ordinary      #61a06c   default
color sidebar_spool_file    #adb27e       default
color sidebar_unread        #cd7878          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold