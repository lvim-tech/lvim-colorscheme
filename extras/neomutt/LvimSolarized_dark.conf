# LvimSolarized_dark colors for Neomutt

# Basic Colors
color normal          #9da4a4             default         # normal text
color indicator       default           #002b36      # selected item
color tree            #409a94      default         # thread arrows
color status          #4692c7      default         # status line
color error           #eb605e       default         # error messages
color message         #849328     default         # info messages
color markers         #da6e3e    default         # + at line wrapping
color attachment      #e25b9e   default         # attachment info
color search          #a58a41    default         # search matches
color tilde           #5d6a6f        default         # ~ empty lines

# Message Headers
color hdrdefault      #788f97        default         # default header
color header          #5091c1           default         '^From:'
color header          #888aaf    default         '^Subject:'
color header          #4b9a93           default         '^User-Agent:.*Mutt'
color header          #409a94      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #859239          default         # quoted text
color quoted1         #4692c7      default         # nested quote
color quoted2         #8789a9         default         # nested quote 2
color quoted3         #409a94      default         # nested quote 3
color quoted4         #a58a41    default         # nested quote 4
color quoted5         #db649e        default         # nested quote 5
color signature       #788f97        default         # signature
color bold            #d47148         default         # bold text
color underline       #da6e3e    default         # underlined text

# Message Index
color index           #4b9a93           default         ~Q  # replied messages
color index           #eb605e       default         ~D  # deleted messages
color index           #788f97        default         ~O  # old messages
color index           #4692c7      default         ~P  # from me
color index           #a58a41    default         ~T  # tagged messages
color index           #d47148         default         ~F  # flagged messages
color index           #888aaf    default         ~v  # collapsed thread
color index           #db649e        default         ~k  # GPG
color index           #849328     default         ~N  # new messages
color index_author    #409a94      default         .*  # all authors

# Special Email Elements
color body            #4692c7      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #409a94      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #a68a49         default         "\\[[0-9]+\\]"
color body            #a58a41    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #e26361            default         ~D   # deleted
color index_flags     #409a94      default         ~g   # signed
color index_flags     #4692c7      default         ~G   # encrypted
color index_author    #849328     default         ~P   # from me
color index_author    #da6e3e    default         ~F   # flagged
color index_author    #da6e3e    default         ~l   # mailing lists
color index_flags     #859239          default         ~N   # new
color index_flags     #eb605e       default         ~l   # lists
color index_date      #e26361            default              # date
color index_size      #4692c7      default              # size
color index_number    #a58a41    default              # number

color indicator             default         #002b36
color sidebar_indicator     #df703e  #002b36
color sidebar_highlight     default         #002b36
color sidebar_background    #9da4a4           default
color sidebar_divider       #4692c7    default
color sidebar_flagged       #4692c7    default
color sidebar_new           #e26361          default
color sidebar_ordinary      #849328   default
color sidebar_spool_file    #a68a49       default
color sidebar_unread        #e26361          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold