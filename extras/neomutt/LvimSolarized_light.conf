# LvimSolarized_light colors for Neomutt

# Basic Colors
color normal          #5e8888             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #4f8a85      default         # thread arrows
color status          #5586ae      default         # status line
color error           #d85c5a       default         # error messages
color message         #7f8a46     default         # info messages
color markers         #bc6a4c    default         # + at line wrapping
color attachment      #c7578d   default         # attachment info
color search          #836f3c    default         # search matches
color tilde           #798890        default         # ~ empty lines

# Message Headers
color hdrdefault      #798890        default         # default header
color header          #4c799d           default         '^From:'
color header          #7f809f    default         '^Subject:'
color header          #467c77           default         '^User-Agent:.*Mutt'
color header          #4f8a85      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #727c3e          default         # quoted text
color quoted1         #5586ae      default         # nested quote
color quoted2         #707293         default         # nested quote 2
color quoted3         #4f8a85      default         # nested quote 3
color quoted4         #836f3c    default         # nested quote 4
color quoted5         #b35181        default         # nested quote 5
color signature       #798890        default         # signature
color bold            #ab6044         default         # bold text
color underline       #bc6a4c    default         # underlined text

# Message Index
color index           #467c77           default         ~Q  # replied messages
color index           #d85c5a       default         ~D  # deleted messages
color index           #798890        default         ~O  # old messages
color index           #5586ae      default         ~P  # from me
color index           #836f3c    default         ~T  # tagged messages
color index           #ab6044         default         ~F  # flagged messages
color index           #7f809f    default         ~v  # collapsed thread
color index           #b35181        default         ~k  # GPG
color index           #7f8a46     default         ~N  # new messages
color index_author    #4f8a85      default         .*  # all authors

# Special Email Elements
color body            #5586ae      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #4f8a85      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #786435         default         "\\[[0-9]+\\]"
color body            #836f3c    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #ca5350            default         ~D   # deleted
color index_flags     #4f8a85      default         ~g   # signed
color index_flags     #5586ae      default         ~G   # encrypted
color index_author    #7f8a46     default         ~P   # from me
color index_author    #bc6a4c    default         ~F   # flagged
color index_author    #bc6a4c    default         ~l   # mailing lists
color index_flags     #727c3e          default         ~N   # new
color index_flags     #d85c5a       default         ~l   # lists
color index_date      #ca5350            default              # date
color index_size      #5586ae      default              # size
color index_number    #836f3c    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #bc6a4c  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #5e8888           default
color sidebar_divider       #5586ae    default
color sidebar_flagged       #5586ae    default
color sidebar_new           #ca5350          default
color sidebar_ordinary      #7f8a46   default
color sidebar_spool_file    #786435       default
color sidebar_unread        #ca5350          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold