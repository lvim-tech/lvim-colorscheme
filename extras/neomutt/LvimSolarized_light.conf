# LvimSolarized_light colors for Neomutt

# Basic Colors
color normal          #4e6767             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #466865      default         # thread arrows
color status          #4a647b      default         # status line
color error           #974948       default         # error messages
color message         #5e6541     default         # info messages
color markers         #895544    default         # + at line wrapping
color attachment      #934b6c   default         # attachment info
color search          #70613b    default         # search matches
color tilde           #798890        default         # ~ empty lines

# Message Headers
color hdrdefault      #5b6469        default         # default header
color header          #476682           default         '^From:'
color header          #5f607b    default         '^Subject:'
color header          #426865           default         '^User-Agent:.*Mutt'
color header          #466865      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #5f673d          default         # quoted text
color quoted1         #4a647b      default         # nested quote
color quoted2         #5d5e7c         default         # nested quote 2
color quoted3         #466865      default         # nested quote 3
color quoted4         #70613b    default         # nested quote 4
color quoted5         #924a6c        default         # nested quote 5
color signature       #5b6469        default         # signature
color bold            #8d5440         default         # bold text
color underline       #895544    default         # underlined text

# Message Index
color index           #426865           default         ~Q  # replied messages
color index           #974948       default         ~D  # deleted messages
color index           #5b6469        default         ~O  # old messages
color index           #4a647b      default         ~P  # from me
color index           #70613b    default         ~T  # tagged messages
color index           #8d5440         default         ~F  # flagged messages
color index           #5f607b    default         ~v  # collapsed thread
color index           #924a6c        default         ~k  # GPG
color index           #5e6541     default         ~N  # new messages
color index_author    #466865      default         .*  # all authors

# Special Email Elements
color body            #4a647b      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #466865      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #725f35         default         "\\[[0-9]+\\]"
color body            #70613b    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #994847            default         ~D   # deleted
color index_flags     #466865      default         ~g   # signed
color index_flags     #4a647b      default         ~G   # encrypted
color index_author    #5e6541     default         ~P   # from me
color index_author    #895544    default         ~F   # flagged
color index_author    #895544    default         ~l   # mailing lists
color index_flags     #5f673d          default         ~N   # new
color index_flags     #974948       default         ~l   # lists
color index_date      #994847            default              # date
color index_size      #4a647b      default              # size
color index_number    #70613b    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #915846  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #4e6767           default
color sidebar_divider       #4a647b    default
color sidebar_flagged       #4a647b    default
color sidebar_new           #994847          default
color sidebar_ordinary      #5e6541   default
color sidebar_spool_file    #725f35       default
color sidebar_unread        #994847          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold