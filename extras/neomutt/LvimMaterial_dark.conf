# LvimMaterial_dark colors for Neomutt

# Basic Colors
color normal          #b2c7c7             default         # normal text
color indicator       default           #222d32      # selected item
color tree            #5998b6      default         # thread arrows
color status          #678de9      default         # status line
color error           #e46c71       default         # error messages
color message         #83a15c     default         # info messages
color markers         #de7354    default         # + at line wrapping
color attachment      #e76677   default         # attachment info
color search          #c79e5e    default         # search matches
color tilde           #5e6a70        default         # ~ empty lines

# Message Headers
color hdrdefault      #7e949f        default         # default header
color header          #6b8edd           default         '^From:'
color header          #a485bb    default         '^Subject:'
color header          #65a1bd           default         '^User-Agent:.*Mutt'
color header          #5998b6      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #90ad68          default         # quoted text
color quoted1         #678de9      default         # nested quote
color quoted2         #a186b5         default         # nested quote 2
color quoted3         #5998b6      default         # nested quote 3
color quoted4         #c79e5e    default         # nested quote 4
color quoted5         #df707f        default         # nested quote 5
color signature       #7e949f        default         # signature
color bold            #d37a60         default         # bold text
color underline       #de7354    default         # underlined text

# Message Index
color index           #65a1bd           default         ~Q  # replied messages
color index           #e46c71       default         ~D  # deleted messages
color index           #7e949f        default         ~O  # old messages
color index           #678de9      default         ~P  # from me
color index           #c79e5e    default         ~T  # tagged messages
color index           #d37a60         default         ~F  # flagged messages
color index           #a485bb    default         ~v  # collapsed thread
color index           #df707f        default         ~k  # GPG
color index           #83a15c     default         ~N  # new messages
color index_author    #5998b6      default         .*  # all authors

# Special Email Elements
color body            #678de9      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5998b6      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #cfa96a         default         "\\[[0-9]+\\]"
color body            #c79e5e    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #d97478            default         ~D   # deleted
color index_flags     #5998b6      default         ~g   # signed
color index_flags     #678de9      default         ~G   # encrypted
color index_author    #83a15c     default         ~P   # from me
color index_author    #de7354    default         ~F   # flagged
color index_author    #de7354    default         ~l   # mailing lists
color index_flags     #90ad68          default         ~N   # new
color index_flags     #e46c71       default         ~l   # lists
color index_date      #d97478            default              # date
color index_size      #678de9      default              # size
color index_number    #c79e5e    default              # number

color indicator             default         #222d32
color sidebar_indicator     #e37554  #222d32
color sidebar_highlight     default         #222d32
color sidebar_background    #b2c7c7           default
color sidebar_divider       #678de9    default
color sidebar_flagged       #678de9    default
color sidebar_new           #d97478          default
color sidebar_ordinary      #83a15c   default
color sidebar_spool_file    #cfa96a       default
color sidebar_unread        #d97478          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold