# LvimRosepine_dark colors for Neomutt

# Basic Colors
color normal          #b3afb2             default         # normal text
color indicator       default           #1d1b1f      # selected item
color tree            #748787      default         # thread arrows
color status          #6a8690      default         # status line
color error           #b07280       default         # error messages
color message         #718875     default         # info messages
color markers         #9d7978    default         # + at line wrapping
color attachment      #8b7d9f   default         # attachment info
color search          #ac9682    default         # search matches
color tilde           #896882        default         # ~ empty lines

# Message Headers
color hdrdefault      #a17699        default         # default header
color header          #6f8792           default         '^From:'
color header          #83808f    default         '^Subject:'
color header          #788787           default         '^User-Agent:.*Mutt'
color header          #748787      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #788b7c          default         # quoted text
color quoted1         #6a8690      default         # nested quote
color quoted2         #84818e         default         # nested quote 2
color quoted3         #748787      default         # nested quote 3
color quoted4         #ac9682    default         # nested quote 4
color quoted5         #9084a2        default         # nested quote 5
color signature       #a17699        default         # signature
color bold            #a98a89         default         # bold text
color underline       #9d7978    default         # underlined text

# Message Index
color index           #788787           default         ~Q  # replied messages
color index           #b07280       default         ~D  # deleted messages
color index           #a17699        default         ~O  # old messages
color index           #6a8690      default         ~P  # from me
color index           #ac9682    default         ~T  # tagged messages
color index           #a98a89         default         ~F  # flagged messages
color index           #83808f    default         ~v  # collapsed thread
color index           #9084a2        default         ~k  # GPG
color index           #718875     default         ~N  # new messages
color index_author    #748787      default         .*  # all authors

# Special Email Elements
color body            #6a8690      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #748787      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #b6a18b         default         "\\[[0-9]+\\]"
color body            #ac9682    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #a77681            default         ~D   # deleted
color index_flags     #748787      default         ~g   # signed
color index_flags     #6a8690      default         ~G   # encrypted
color index_author    #718875     default         ~P   # from me
color index_author    #9d7978    default         ~F   # flagged
color index_author    #9d7978    default         ~l   # mailing lists
color index_flags     #788b7c          default         ~N   # new
color index_flags     #b07280       default         ~l   # lists
color index_date      #a77681            default              # date
color index_size      #6a8690      default              # size
color index_number    #ac9682    default              # number

color indicator             default         #1d1b1f
color sidebar_indicator     #a07b7a  #1d1b1f
color sidebar_highlight     default         #1d1b1f
color sidebar_background    #b3afb2           default
color sidebar_divider       #6a8690    default
color sidebar_flagged       #6a8690    default
color sidebar_new           #a77681          default
color sidebar_ordinary      #718875   default
color sidebar_spool_file    #b6a18b       default
color sidebar_unread        #a77681          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold