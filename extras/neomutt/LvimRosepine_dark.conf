# LvimRosepine_dark colors for Neomutt

# Basic Colors
color normal          #b3afb2             default         # normal text
color indicator       default           #1d1b1f      # selected item
color tree            #6a7a7a      default         # thread arrows
color status          #526167      default         # status line
color error           #95646f       default         # error messages
color message         #697d6d     default         # info messages
color markers         #9d7978    default         # + at line wrapping
color attachment      #837597   default         # attachment info
color search          #ac9682    default         # search matches
color tilde           #896882        default         # ~ empty lines

# Message Headers
color hdrdefault      #896882        default         # default header
color header          #5d6d74           default         '^From:'
color header          #656270    default         '^Subject:'
color header          #788787           default         '^User-Agent:.*Mutt'
color header          #6a7a7a      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #788b7c          default         # quoted text
color quoted1         #526167      default         # nested quote
color quoted2         #726f7c         default         # nested quote 2
color quoted3         #6a7a7a      default         # nested quote 3
color quoted4         #ac9682    default         # nested quote 4
color quoted5         #9084a2        default         # nested quote 5
color signature       #896882        default         # signature
color bold            #a98a89         default         # bold text
color underline       #9d7978    default         # underlined text

# Message Index
color index           #788787           default         ~Q  # replied messages
color index           #95646f       default         ~D  # deleted messages
color index           #896882        default         ~O  # old messages
color index           #526167      default         ~P  # from me
color index           #ac9682    default         ~T  # tagged messages
color index           #a98a89         default         ~F  # flagged messages
color index           #656270    default         ~v  # collapsed thread
color index           #9084a2        default         ~k  # GPG
color index           #697d6d     default         ~N  # new messages
color index_author    #6a7a7a      default         .*  # all authors

# Special Email Elements
color body            #526167      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #6a7a7a      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #b6a18b         default         "\\[[0-9]+\\]"
color body            #ac9682    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #a0727c            default         ~D   # deleted
color index_flags     #6a7a7a      default         ~g   # signed
color index_flags     #526167      default         ~G   # encrypted
color index_author    #697d6d     default         ~P   # from me
color index_author    #9d7978    default         ~F   # flagged
color index_author    #9d7978    default         ~l   # mailing lists
color index_flags     #788b7c          default         ~N   # new
color index_flags     #95646f       default         ~l   # lists
color index_date      #a0727c            default              # date
color index_size      #526167      default              # size
color index_number    #ac9682    default              # number

color indicator             default         #1d1b1f
color sidebar_indicator     #9d7978  #1d1b1f
color sidebar_highlight     default         #1d1b1f
color sidebar_background    #b3afb2           default
color sidebar_divider       #526167    default
color sidebar_flagged       #526167    default
color sidebar_new           #a0727c          default
color sidebar_ordinary      #697d6d   default
color sidebar_spool_file    #b6a18b       default
color sidebar_unread        #a0727c          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold