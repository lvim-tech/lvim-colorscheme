# LvimNord_soft colors for Neomutt

# Basic Colors
color normal          #b3bac6             default         # normal text
color indicator       default           #282d38      # selected item
color tree            #639cac      default         # thread arrows
color status          #7296b8      default         # status line
color error           #c97e86       default         # error messages
color message         #829a6e     default         # info messages
color markers         #c88068    default         # + at line wrapping
color attachment      #ab89a4   default         # attachment info
color search          #b99c64    default         # search matches
color tilde           #677185        default         # ~ empty lines

# Message Headers
color hdrdefault      #8292b2        default         # default header
color header          #7c95af           default         '^From:'
color header          #9a90a5    default         '^Subject:'
color header          #719aa6           default         '^User-Agent:.*Mutt'
color header          #639cac      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #879978          default         # quoted text
color quoted1         #7296b8      default         # nested quote
color quoted2         #978fa2         default         # nested quote 2
color quoted3         #639cac      default         # nested quote 3
color quoted4         #b99c64    default         # nested quote 4
color quoted5         #a78ba2        default         # nested quote 5
color signature       #8292b2        default         # signature
color bold            #bc8675         default         # bold text
color underline       #c88068    default         # underlined text

# Message Index
color index           #719aa6           default         ~Q  # replied messages
color index           #c97e86       default         ~D  # deleted messages
color index           #8292b2        default         ~O  # old messages
color index           #7296b8      default         ~P  # from me
color index           #b99c64    default         ~T  # tagged messages
color index           #bc8675         default         ~F  # flagged messages
color index           #9a90a5    default         ~v  # collapsed thread
color index           #a78ba2        default         ~k  # GPG
color index           #829a6e     default         ~N  # new messages
color index_author    #639cac      default         .*  # all authors

# Special Email Elements
color body            #7296b8      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #639cac      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #c3a870         default         "\\[[0-9]+\\]"
color body            #b99c64    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #bc858a            default         ~D   # deleted
color index_flags     #639cac      default         ~g   # signed
color index_flags     #7296b8      default         ~G   # encrypted
color index_author    #829a6e     default         ~P   # from me
color index_author    #c88068    default         ~F   # flagged
color index_author    #c88068    default         ~l   # mailing lists
color index_flags     #879978          default         ~N   # new
color index_flags     #c97e86       default         ~l   # lists
color index_date      #bc858a            default              # date
color index_size      #7296b8      default              # size
color index_number    #b99c64    default              # number

color indicator             default         #282d38
color sidebar_indicator     #cc8269  #282d38
color sidebar_highlight     default         #282d38
color sidebar_background    #b3bac6           default
color sidebar_divider       #7296b8    default
color sidebar_flagged       #7296b8    default
color sidebar_new           #bc858a          default
color sidebar_ordinary      #829a6e   default
color sidebar_spool_file    #c3a870       default
color sidebar_unread        #bc858a          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold