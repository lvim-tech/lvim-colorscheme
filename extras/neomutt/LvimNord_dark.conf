# LvimNord_dark colors for Neomutt

# Basic Colors
color normal          #b3bac6             default         # normal text
color indicator       default           #232831      # selected item
color tree            #6194a2      default         # thread arrows
color status          #6f90b0      default         # status line
color error           #c67880       default         # error messages
color message         #7e946b     default         # info messages
color markers         #bf7c66    default         # + at line wrapping
color attachment      #a6839f   default         # attachment info
color search          #b99c64    default         # search matches
color tilde           #677185        default         # ~ empty lines

# Message Headers
color hdrdefault      #7e8dab        default         # default header
color header          #7990a8           default         '^From:'
color header          #92889d    default         '^Subject:'
color header          #7097a3           default         '^User-Agent:.*Mutt'
color header          #6194a2      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #879978          default         # quoted text
color quoted1         #6f90b0      default         # nested quote
color quoted2         #92899d         default         # nested quote 2
color quoted3         #6194a2      default         # nested quote 3
color quoted4         #b99c64    default         # nested quote 4
color quoted5         #a2869d        default         # nested quote 5
color signature       #7e8dab        default         # signature
color bold            #b88473         default         # bold text
color underline       #bf7c66    default         # underlined text

# Message Index
color index           #7097a3           default         ~Q  # replied messages
color index           #c67880       default         ~D  # deleted messages
color index           #7e8dab        default         ~O  # old messages
color index           #6f90b0      default         ~P  # from me
color index           #b99c64    default         ~T  # tagged messages
color index           #b88473         default         ~F  # flagged messages
color index           #92889d    default         ~v  # collapsed thread
color index           #a2869d        default         ~k  # GPG
color index           #7e946b     default         ~N  # new messages
color index_author    #6194a2      default         .*  # all authors

# Special Email Elements
color body            #6f90b0      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #6194a2      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #c3a870         default         "\\[[0-9]+\\]"
color body            #b99c64    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #b97f85            default         ~D   # deleted
color index_flags     #6194a2      default         ~g   # signed
color index_flags     #6f90b0      default         ~G   # encrypted
color index_author    #7e946b     default         ~P   # from me
color index_author    #bf7c66    default         ~F   # flagged
color index_author    #bf7c66    default         ~l   # mailing lists
color index_flags     #879978          default         ~N   # new
color index_flags     #c67880       default         ~l   # lists
color index_date      #b97f85            default              # date
color index_size      #6f90b0      default              # size
color index_number    #b99c64    default              # number

color indicator             default         #232831
color sidebar_indicator     #c37e67  #232831
color sidebar_highlight     default         #232831
color sidebar_background    #b3bac6           default
color sidebar_divider       #6f90b0    default
color sidebar_flagged       #6f90b0    default
color sidebar_new           #b97f85          default
color sidebar_ordinary      #7e946b   default
color sidebar_spool_file    #c3a870       default
color sidebar_unread        #b97f85          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold