# LvimNord_dark colors for Neomutt

# Basic Colors
color normal          #b3bac6             default         # normal text
color indicator       default           #232831      # selected item
color tree            #5e8b98      default         # thread arrows
color status          #637b93      default         # status line
color error           #a35e65       default         # error messages
color message         #788c67     default         # info messages
color markers         #af7461    default         # + at line wrapping
color attachment      #95788f   default         # attachment info
color search          #b99c64    default         # search matches
color tilde           #677185        default         # ~ empty lines

# Message Headers
color hdrdefault      #677185        default         # default header
color header          #73889e           default         '^From:'
color header          #7b7186    default         '^Subject:'
color header          #7097a3           default         '^User-Agent:.*Mutt'
color header          #5e8b98      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #879978          default         # quoted text
color quoted1         #637b93      default         # nested quote
color quoted2         #887f93         default         # nested quote 2
color quoted3         #5e8b98      default         # nested quote 3
color quoted4         #b99c64    default         # nested quote 4
color quoted5         #a2869d        default         # nested quote 5
color signature       #677185        default         # signature
color bold            #b88473         default         # bold text
color underline       #af7461    default         # underlined text

# Message Index
color index           #7097a3           default         ~Q  # replied messages
color index           #a35e65       default         ~D  # deleted messages
color index           #677185        default         ~O  # old messages
color index           #637b93      default         ~P  # from me
color index           #b99c64    default         ~T  # tagged messages
color index           #b88473         default         ~F  # flagged messages
color index           #7b7186    default         ~v  # collapsed thread
color index           #a2869d        default         ~k  # GPG
color index           #788c67     default         ~N  # new messages
color index_author    #5e8b98      default         .*  # all authors

# Special Email Elements
color body            #637b93      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5e8b98      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #c3a870         default         "\\[[0-9]+\\]"
color body            #b99c64    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #ac6e74            default         ~D   # deleted
color index_flags     #5e8b98      default         ~g   # signed
color index_flags     #637b93      default         ~G   # encrypted
color index_author    #788c67     default         ~P   # from me
color index_author    #af7461    default         ~F   # flagged
color index_author    #af7461    default         ~l   # mailing lists
color index_flags     #879978          default         ~N   # new
color index_flags     #a35e65       default         ~l   # lists
color index_date      #ac6e74            default              # date
color index_size      #637b93      default              # size
color index_number    #b99c64    default              # number

color indicator             default         #232831
color sidebar_indicator     #af7461  #232831
color sidebar_highlight     default         #232831
color sidebar_background    #b3bac6           default
color sidebar_divider       #637b93    default
color sidebar_flagged       #637b93    default
color sidebar_new           #ac6e74          default
color sidebar_ordinary      #788c67   default
color sidebar_spool_file    #c3a870       default
color sidebar_unread        #ac6e74          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold