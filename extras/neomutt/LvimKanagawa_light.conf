# LvimKanagawa_light colors for Neomutt

# Basic Colors
color normal          #4e6767             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #526763      default         # thread arrows
color status          #526284      default         # status line
color error           #964b4b       default         # error messages
color message         #5b674c     default         # info messages
color markers         #785e49    default         # + at line wrapping
color attachment      #8f524e   default         # attachment info
color search          #6f6045    default         # search matches
color tilde           #9d9db5        default         # ~ empty lines

# Message Headers
color hdrdefault      #606077        default         # default header
color header          #506285           default         '^From:'
color header          #665f79    default         '^Subject:'
color header          #506762           default         '^User-Agent:.*Mutt'
color header          #526763      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #596648          default         # quoted text
color quoted1         #526284      default         # nested quote
color quoted2         #645d79         default         # nested quote 2
color quoted3         #526763      default         # nested quote 3
color quoted4         #6f6045    default         # nested quote 4
color quoted5         #8c514c        default         # nested quote 5
color signature       #606077        default         # signature
color bold            #775e49         default         # bold text
color underline       #785e49    default         # underlined text

# Message Index
color index           #506762           default         ~Q  # replied messages
color index           #964b4b       default         ~D  # deleted messages
color index           #606077        default         ~O  # old messages
color index           #526284      default         ~P  # from me
color index           #6f6045    default         ~T  # tagged messages
color index           #775e49         default         ~F  # flagged messages
color index           #665f79    default         ~v  # collapsed thread
color index           #8c514c        default         ~k  # GPG
color index           #5b674c     default         ~N  # new messages
color index_author    #526763      default         .*  # all authors

# Special Email Elements
color body            #526284      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #526763      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #6f6145         default         "\\[[0-9]+\\]"
color body            #6f6045    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #944c4c            default         ~D   # deleted
color index_flags     #526763      default         ~g   # signed
color index_flags     #526284      default         ~G   # encrypted
color index_author    #5b674c     default         ~P   # from me
color index_author    #785e49    default         ~F   # flagged
color index_author    #785e49    default         ~l   # mailing lists
color index_flags     #596648          default         ~N   # new
color index_flags     #964b4b       default         ~l   # lists
color index_date      #944c4c            default              # date
color index_size      #526284      default              # size
color index_number    #6f6045    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #7b604a  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #4e6767           default
color sidebar_divider       #526284    default
color sidebar_flagged       #526284    default
color sidebar_new           #944c4c          default
color sidebar_ordinary      #5b674c   default
color sidebar_spool_file    #6f6145       default
color sidebar_unread        #944c4c          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold