# LvimKanagawa_light colors for Neomutt

# Basic Colors
color normal          #5e8888             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #658b83      default         # thread arrows
color status          #6c8dcc      default         # status line
color error           #d15d5d       default         # error messages
color message         #728559     default         # info messages
color markers         #b08257    default         # + at line wrapping
color attachment      #a05954   default         # attachment info
color search          #87734c    default         # search matches
color tilde           #9d9db5        default         # ~ empty lines

# Message Headers
color hdrdefault      #9d9db5        default         # default header
color header          #6385c2           default         '^From:'
color header          #8f87a4    default         '^Subject:'
color header          #5e827b           default         '^User-Agent:.*Mutt'
color header          #658b83      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #697b51          default         # quoted text
color quoted1         #6c8dcc      default         # nested quote
color quoted2         #887fa0         default         # nested quote 2
color quoted3         #658b83      default         # nested quote 3
color quoted4         #87734c    default         # nested quote 4
color quoted5         #94544f        default         # nested quote 5
color signature       #9d9db5        default         # signature
color bold            #a87e56         default         # bold text
color underline       #b08257    default         # underlined text

# Message Index
color index           #5e827b           default         ~Q  # replied messages
color index           #d15d5d       default         ~D  # deleted messages
color index           #9d9db5        default         ~O  # old messages
color index           #6c8dcc      default         ~P  # from me
color index           #87734c    default         ~T  # tagged messages
color index           #a87e56         default         ~F  # flagged messages
color index           #8f87a4    default         ~v  # collapsed thread
color index           #94544f        default         ~k  # GPG
color index           #728559     default         ~N  # new messages
color index_author    #658b83      default         .*  # all authors

# Special Email Elements
color body            #6c8dcc      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #658b83      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #816f4a         default         "\\[[0-9]+\\]"
color body            #87734c    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #c35959            default         ~D   # deleted
color index_flags     #658b83      default         ~g   # signed
color index_flags     #6c8dcc      default         ~G   # encrypted
color index_author    #728559     default         ~P   # from me
color index_author    #b08257    default         ~F   # flagged
color index_author    #b08257    default         ~l   # mailing lists
color index_flags     #697b51          default         ~N   # new
color index_flags     #d15d5d       default         ~l   # lists
color index_date      #c35959            default              # date
color index_size      #6c8dcc      default              # size
color index_number    #87734c    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #b08257  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #5e8888           default
color sidebar_divider       #6c8dcc    default
color sidebar_flagged       #6c8dcc    default
color sidebar_new           #c35959          default
color sidebar_ordinary      #728559   default
color sidebar_spool_file    #816f4a       default
color sidebar_unread        #c35959          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold