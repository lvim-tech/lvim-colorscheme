# LvimEverforest_light colors for Neomutt

# Basic Colors
color normal          #4e6767             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #4f6752      default         # thread arrows
color status          #4b6676      default         # status line
color error           #a74242       default         # error messages
color message         #626441     default         # info messages
color markers         #8b5535    default         # + at line wrapping
color attachment      #8b5442   default         # attachment info
color search          #6a6046    default         # search matches
color tilde           #8b9a83        default         # ~ empty lines

# Message Headers
color hdrdefault      #5e655a        default         # default header
color header          #476677           default         '^From:'
color header          #64606d    default         '^Subject:'
color header          #4d6950           default         '^User-Agent:.*Mutt'
color header          #4f6752      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #62643c          default         # quoted text
color quoted1         #4b6676      default         # nested quote
color quoted2         #635f6d         default         # nested quote 2
color quoted3         #4f6752      default         # nested quote 3
color quoted4         #6a6046    default         # nested quote 4
color quoted5         #895645        default         # nested quote 5
color signature       #5e655a        default         # signature
color bold            #8d522b         default         # bold text
color underline       #8b5535    default         # underlined text

# Message Index
color index           #4d6950           default         ~Q  # replied messages
color index           #a74242       default         ~D  # deleted messages
color index           #5e655a        default         ~O  # old messages
color index           #4b6676      default         ~P  # from me
color index           #6a6046    default         ~T  # tagged messages
color index           #8d522b         default         ~F  # flagged messages
color index           #64606d    default         ~v  # collapsed thread
color index           #895645        default         ~k  # GPG
color index           #626441     default         ~N  # new messages
color index_author    #4f6752      default         .*  # all authors

# Special Email Elements
color body            #4b6676      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #4f6752      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #696149         default         "\\[[0-9]+\\]"
color body            #6a6046    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #9f4646            default         ~D   # deleted
color index_flags     #4f6752      default         ~g   # signed
color index_flags     #4b6676      default         ~G   # encrypted
color index_author    #626441     default         ~P   # from me
color index_author    #8b5535    default         ~F   # flagged
color index_author    #8b5535    default         ~l   # mailing lists
color index_flags     #62643c          default         ~N   # new
color index_flags     #a74242       default         ~l   # lists
color index_date      #9f4646            default              # date
color index_size      #4b6676      default              # size
color index_number    #6a6046    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #8f5735  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #4e6767           default
color sidebar_divider       #4b6676    default
color sidebar_flagged       #4b6676    default
color sidebar_new           #9f4646          default
color sidebar_ordinary      #626441   default
color sidebar_spool_file    #696149       default
color sidebar_unread        #9f4646          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold