# LvimRosepine_soft colors for Neomutt

# Basic Colors
color normal          #b3afb2             default         # normal text
color indicator       default           #232126      # selected item
color tree            #788d8d      default         # thread arrows
color status          #6d8b97      default         # status line
color error           #b47785       default         # error messages
color message         #748d7a     default         # info messages
color markers         #a27e7d    default         # + at line wrapping
color attachment      #9082a4   default         # attachment info
color search          #ac9682    default         # search matches
color tilde           #896882        default         # ~ empty lines

# Message Headers
color hdrdefault      #a97b9f        default         # default header
color header          #738d98           default         '^From:'
color header          #888594    default         '^Subject:'
color header          #7a8a8a           default         '^User-Agent:.*Mutt'
color header          #788d8d      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #7a8e7e          default         # quoted text
color quoted1         #6d8b97      default         # nested quote
color quoted2         #898693         default         # nested quote 2
color quoted3         #788d8d      default         # nested quote 3
color quoted4         #ac9682    default         # nested quote 4
color quoted5         #9084a2        default         # nested quote 5
color signature       #a97b9f        default         # signature
color bold            #a98a89         default         # bold text
color underline       #a27e7d    default         # underlined text

# Message Index
color index           #7a8a8a           default         ~Q  # replied messages
color index           #b47785       default         ~D  # deleted messages
color index           #a97b9f        default         ~O  # old messages
color index           #6d8b97      default         ~P  # from me
color index           #ac9682    default         ~T  # tagged messages
color index           #a98a89         default         ~F  # flagged messages
color index           #888594    default         ~v  # collapsed thread
color index           #9084a2        default         ~k  # GPG
color index           #748d7a     default         ~N  # new messages
color index_author    #788d8d      default         .*  # all authors

# Special Email Elements
color body            #6d8b97      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #788d8d      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #b6a18b         default         "\\[[0-9]+\\]"
color body            #ac9682    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #ab7c86            default         ~D   # deleted
color index_flags     #788d8d      default         ~g   # signed
color index_flags     #6d8b97      default         ~G   # encrypted
color index_author    #748d7a     default         ~P   # from me
color index_author    #a27e7d    default         ~F   # flagged
color index_author    #a27e7d    default         ~l   # mailing lists
color index_flags     #7a8e7e          default         ~N   # new
color index_flags     #b47785       default         ~l   # lists
color index_date      #ab7c86            default              # date
color index_size      #6d8b97      default              # size
color index_number    #ac9682    default              # number

color indicator             default         #232126
color sidebar_indicator     #a48180  #232126
color sidebar_highlight     default         #232126
color sidebar_background    #b3afb2           default
color sidebar_divider       #6d8b97    default
color sidebar_flagged       #6d8b97    default
color sidebar_new           #ab7c86          default
color sidebar_ordinary      #748d7a   default
color sidebar_spool_file    #b6a18b       default
color sidebar_unread        #ab7c86          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold