# LvimEverforest_dark colors for Neomutt

# Basic Colors
color normal          #82907e             default         # normal text
color indicator       default           #232a2a      # selected item
color tree            #569a5e      default         # thread arrows
color status          #1e97c1      default         # status line
color error           #f55252       default         # error messages
color message         #8e9300     default         # info messages
color markers         #ce7637    default         # + at line wrapping
color attachment      #d3724e   default         # attachment info
color search          #a6935a    default         # search matches
color tilde           #535d4e        default         # ~ empty lines

# Message Headers
color hdrdefault      #7c9370        default         # default header
color header          #3a97bf           default         '^From:'
color header          #9289a5    default         '^Subject:'
color header          #5d9a65           default         '^User-Agent:.*Mutt'
color header          #569a5e      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #8f9330          default         # quoted text
color quoted1         #1e97c1      default         # nested quote
color quoted2         #918aa2         default         # nested quote 2
color quoted3         #569a5e      default         # nested quote 3
color quoted4         #a6935a    default         # nested quote 4
color quoted5         #c37960        default         # nested quote 5
color signature       #7c9370        default         # signature
color bold            #cc7942         default         # bold text
color underline       #ce7637    default         # underlined text

# Message Index
color index           #5d9a65           default         ~Q  # replied messages
color index           #f55252       default         ~D  # deleted messages
color index           #7c9370        default         ~O  # old messages
color index           #1e97c1      default         ~P  # from me
color index           #a6935a    default         ~T  # tagged messages
color index           #cc7942         default         ~F  # flagged messages
color index           #9289a5    default         ~v  # collapsed thread
color index           #c37960        default         ~k  # GPG
color index           #8e9300     default         ~N  # new messages
color index_author    #569a5e      default         .*  # all authors

# Special Email Elements
color body            #1e97c1      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #569a5e      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #af9e6b         default         "\\[[0-9]+\\]"
color body            #a6935a    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #e16666            default         ~D   # deleted
color index_flags     #569a5e      default         ~g   # signed
color index_flags     #1e97c1      default         ~G   # encrypted
color index_author    #8e9300     default         ~P   # from me
color index_author    #ce7637    default         ~F   # flagged
color index_author    #ce7637    default         ~l   # mailing lists
color index_flags     #8f9330          default         ~N   # new
color index_flags     #f55252       default         ~l   # lists
color index_date      #e16666            default              # date
color index_size      #1e97c1      default              # size
color index_number    #a6935a    default              # number

color indicator             default         #232a2a
color sidebar_indicator     #d37836  #232a2a
color sidebar_highlight     default         #232a2a
color sidebar_background    #82907e           default
color sidebar_divider       #1e97c1    default
color sidebar_flagged       #1e97c1    default
color sidebar_new           #e16666          default
color sidebar_ordinary      #8e9300   default
color sidebar_spool_file    #af9e6b       default
color sidebar_unread        #e16666          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold