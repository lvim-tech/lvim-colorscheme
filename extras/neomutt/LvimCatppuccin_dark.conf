# LvimCatppuccin_dark colors for Neomutt

# Basic Colors
color normal          #b2b7c7             default         # normal text
color indicator       default           #1d1e27      # selected item
color tree            #597981      default         # thread arrows
color status          #546891      default         # status line
color error           #a85a6d       default         # error messages
color message         #5b7e59     default         # info messages
color markers         #ac7a63    default         # + at line wrapping
color attachment      #a96b96   default         # attachment info
color search          #af9973    default         # search matches
color tilde           #6c7393        default         # ~ empty lines

# Message Headers
color hdrdefault      #6c7393        default         # default header
color header          #6076a0           default         '^From:'
color header          #6c548a    default         '^Subject:'
color header          #65878e           default         '^User-Agent:.*Mutt'
color header          #597981      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #6b8d69          default         # quoted text
color quoted1         #546891      default         # nested quote
color quoted2         #7c609b         default         # nested quote 2
color quoted3         #597981      default         # nested quote 3
color quoted4         #af9973    default         # nested quote 4
color quoted5         #b976a7        default         # nested quote 5
color signature       #6c7393        default         # signature
color bold            #b88970         default         # bold text
color underline       #ac7a63    default         # underlined text

# Message Index
color index           #65878e           default         ~Q  # replied messages
color index           #a85a6d       default         ~D  # deleted messages
color index           #6c7393        default         ~O  # old messages
color index           #546891      default         ~P  # from me
color index           #af9973    default         ~T  # tagged messages
color index           #b88970         default         ~F  # flagged messages
color index           #6c548a    default         ~v  # collapsed thread
color index           #b976a7        default         ~k  # GPG
color index           #5b7e59     default         ~N  # new messages
color index_author    #597981      default         .*  # all authors

# Special Email Elements
color body            #546891      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #597981      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #b8a47e         default         "\\[[0-9]+\\]"
color body            #af9973    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #b7657a            default         ~D   # deleted
color index_flags     #597981      default         ~g   # signed
color index_flags     #546891      default         ~G   # encrypted
color index_author    #5b7e59     default         ~P   # from me
color index_author    #ac7a63    default         ~F   # flagged
color index_author    #ac7a63    default         ~l   # mailing lists
color index_flags     #6b8d69          default         ~N   # new
color index_flags     #a85a6d       default         ~l   # lists
color index_date      #b7657a            default              # date
color index_size      #546891      default              # size
color index_number    #af9973    default              # number

color indicator             default         #1d1e27
color sidebar_indicator     #ac7a63  #1d1e27
color sidebar_highlight     default         #1d1e27
color sidebar_background    #b2b7c7           default
color sidebar_divider       #546891    default
color sidebar_flagged       #546891    default
color sidebar_new           #b7657a          default
color sidebar_ordinary      #5b7e59   default
color sidebar_spool_file    #b8a47e       default
color sidebar_unread        #b7657a          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold