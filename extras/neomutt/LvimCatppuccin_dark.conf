# LvimCatppuccin_dark colors for Neomutt

# Basic Colors
color normal          #b2b7c7             default         # normal text
color indicator       default           #1d1e27      # selected item
color tree            #628c97      default         # thread arrows
color status          #6284c2      default         # status line
color error           #c96880       default         # error messages
color message         #638f61     default         # info messages
color markers         #ac7a63    default         # + at line wrapping
color attachment      #b16e9d   default         # attachment info
color search          #af9973    default         # search matches
color tilde           #6c7393        default         # ~ empty lines

# Message Headers
color hdrdefault      #7e85a6        default         # default header
color header          #6985ba           default         '^From:'
color header          #9676bf    default         '^Subject:'
color header          #668a91           default         '^User-Agent:.*Mutt'
color header          #628c97      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #6b8d69          default         # quoted text
color quoted1         #6284c2      default         # nested quote
color quoted2         #9679b9         default         # nested quote 2
color quoted3         #628c97      default         # nested quote 3
color quoted4         #af9973    default         # nested quote 4
color quoted5         #b976a7        default         # nested quote 5
color signature       #7e85a6        default         # signature
color bold            #b88970         default         # bold text
color underline       #ac7a63    default         # underlined text

# Message Index
color index           #668a91           default         ~Q  # replied messages
color index           #c96880       default         ~D  # deleted messages
color index           #7e85a6        default         ~O  # old messages
color index           #6284c2      default         ~P  # from me
color index           #af9973    default         ~T  # tagged messages
color index           #b88970         default         ~F  # flagged messages
color index           #9676bf    default         ~v  # collapsed thread
color index           #b976a7        default         ~k  # GPG
color index           #638f61     default         ~N  # new messages
color index_author    #628c97      default         .*  # all authors

# Special Email Elements
color body            #6284c2      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #628c97      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #b8a47e         default         "\\[[0-9]+\\]"
color body            #af9973    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #c26b81            default         ~D   # deleted
color index_flags     #628c97      default         ~g   # signed
color index_flags     #6284c2      default         ~G   # encrypted
color index_author    #638f61     default         ~P   # from me
color index_author    #ac7a63    default         ~F   # flagged
color index_author    #ac7a63    default         ~l   # mailing lists
color index_flags     #6b8d69          default         ~N   # new
color index_flags     #c96880       default         ~l   # lists
color index_date      #c26b81            default              # date
color index_size      #6284c2      default              # size
color index_number    #af9973    default              # number

color indicator             default         #1d1e27
color sidebar_indicator     #ac7a63  #1d1e27
color sidebar_highlight     default         #1d1e27
color sidebar_background    #b2b7c7           default
color sidebar_divider       #6284c2    default
color sidebar_flagged       #6284c2    default
color sidebar_new           #c26b81          default
color sidebar_ordinary      #638f61   default
color sidebar_spool_file    #b8a47e       default
color sidebar_unread        #c26b81          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold