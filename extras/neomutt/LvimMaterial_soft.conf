# LvimMaterial_soft colors for Neomutt

# Basic Colors
color normal          #b2c7c7             default         # normal text
color indicator       default           #273339      # selected item
color tree            #5aa1c1      default         # thread arrows
color status          #7295ef      default         # status line
color error           #e67378       default         # error messages
color message         #83a15c     default         # info messages
color markers         #e77756    default         # + at line wrapping
color attachment      #ec7281   default         # attachment info
color search          #c79e5e    default         # search matches
color tilde           #5e6a70        default         # ~ empty lines

# Message Headers
color hdrdefault      #819aa5        default         # default header
color header          #7596e3           default         '^From:'
color header          #a98bc0    default         '^Subject:'
color header          #65a1bd           default         '^User-Agent:.*Mutt'
color header          #5aa1c1      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #90ad68          default         # quoted text
color quoted1         #7295ef      default         # nested quote
color quoted2         #a68cba         default         # nested quote 2
color quoted3         #5aa1c1      default         # nested quote 3
color quoted4         #c79e5e    default         # nested quote 4
color quoted5         #e27786        default         # nested quote 5
color signature       #819aa5        default         # signature
color bold            #dc7e61         default         # bold text
color underline       #e77756    default         # underlined text

# Message Index
color index           #65a1bd           default         ~Q  # replied messages
color index           #e67378       default         ~D  # deleted messages
color index           #819aa5        default         ~O  # old messages
color index           #7295ef      default         ~P  # from me
color index           #c79e5e    default         ~T  # tagged messages
color index           #dc7e61         default         ~F  # flagged messages
color index           #a98bc0    default         ~v  # collapsed thread
color index           #e27786        default         ~k  # GPG
color index           #83a15c     default         ~N  # new messages
color index_author    #5aa1c1      default         .*  # all authors

# Special Email Elements
color body            #7295ef      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5aa1c1      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #cfa96a         default         "\\[[0-9]+\\]"
color body            #c79e5e    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #dc7b7f            default         ~D   # deleted
color index_flags     #5aa1c1      default         ~g   # signed
color index_flags     #7295ef      default         ~G   # encrypted
color index_author    #83a15c     default         ~P   # from me
color index_author    #e77756    default         ~F   # flagged
color index_author    #e77756    default         ~l   # mailing lists
color index_flags     #90ad68          default         ~N   # new
color index_flags     #e67378       default         ~l   # lists
color index_date      #dc7b7f            default              # date
color index_size      #7295ef      default              # size
color index_number    #c79e5e    default              # number

color indicator             default         #273339
color sidebar_indicator     #e87a5b  #273339
color sidebar_highlight     default         #273339
color sidebar_background    #b2c7c7           default
color sidebar_divider       #7295ef    default
color sidebar_flagged       #7295ef    default
color sidebar_new           #dc7b7f          default
color sidebar_ordinary      #83a15c   default
color sidebar_spool_file    #cfa96a       default
color sidebar_unread        #dc7b7f          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold