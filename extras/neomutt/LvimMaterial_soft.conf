# LvimMaterial_soft colors for Neomutt

# Basic Colors
color normal          #b2c7c7             default         # normal text
color indicator       default           #273339      # selected item
color tree            #5995b2      default         # thread arrows
color status          #4f6fbb      default         # status line
color error           #c34e54       default         # error messages
color message         #83a15c     default         # info messages
color markers         #c76b52    default         # + at line wrapping
color attachment      #ce4c5f   default         # attachment info
color search          #c79e5e    default         # search matches
color tilde           #5e6a70        default         # ~ empty lines

# Message Headers
color hdrdefault      #5e6a70        default         # default header
color header          #5b7fcb           default         '^From:'
color header          #816596    default         '^Subject:'
color header          #65a1bd           default         '^User-Agent:.*Mutt'
color header          #5995b2      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #90ad68          default         # quoted text
color quoted1         #4f6fbb      default         # nested quote
color quoted2         #8f74a3         default         # nested quote 2
color quoted3         #5995b2      default         # nested quote 3
color quoted4         #c79e5e    default         # nested quote 4
color quoted5         #d75d70        default         # nested quote 5
color signature       #5e6a70        default         # signature
color bold            #d37a60         default         # bold text
color underline       #c76b52    default         # underlined text

# Message Index
color index           #65a1bd           default         ~Q  # replied messages
color index           #c34e54       default         ~D  # deleted messages
color index           #5e6a70        default         ~O  # old messages
color index           #4f6fbb      default         ~P  # from me
color index           #c79e5e    default         ~T  # tagged messages
color index           #d37a60         default         ~F  # flagged messages
color index           #816596    default         ~v  # collapsed thread
color index           #d75d70        default         ~k  # GPG
color index           #83a15c     default         ~N  # new messages
color index_author    #5995b2      default         .*  # all authors

# Special Email Elements
color body            #4f6fbb      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5995b2      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #cfa96a         default         "\\[[0-9]+\\]"
color body            #c79e5e    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #d05e64            default         ~D   # deleted
color index_flags     #5995b2      default         ~g   # signed
color index_flags     #4f6fbb      default         ~G   # encrypted
color index_author    #83a15c     default         ~P   # from me
color index_author    #c76b52    default         ~F   # flagged
color index_author    #c76b52    default         ~l   # mailing lists
color index_flags     #90ad68          default         ~N   # new
color index_flags     #c34e54       default         ~l   # lists
color index_date      #d05e64            default              # date
color index_size      #4f6fbb      default              # size
color index_number    #c79e5e    default              # number

color indicator             default         #273339
color sidebar_indicator     #c76b52  #273339
color sidebar_highlight     default         #273339
color sidebar_background    #b2c7c7           default
color sidebar_divider       #4f6fbb    default
color sidebar_flagged       #4f6fbb    default
color sidebar_new           #d05e64          default
color sidebar_ordinary      #83a15c   default
color sidebar_spool_file    #cfa96a       default
color sidebar_unread        #d05e64          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold