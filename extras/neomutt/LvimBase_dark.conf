# LvimBase_dark colors for Neomutt

# Basic Colors
color normal          #629393             default         # normal text
color indicator       default           #20272b      # selected item
color tree            #2498ae      default         # thread arrows
color status          #2194ca      default         # status line
color error           #e95d52       default         # error messages
color message         #7b9452     default         # info messages
color markers         #da8950    default         # + at line wrapping
color attachment      #e36245   default         # attachment info
color search          #d1aa64    default         # search matches
color tilde           #4d6263        default         # ~ empty lines

# Message Headers
color hdrdefault      #659395        default         # default header
color header          #3e92c5           default         '^From:'
color header          #0095d8    default         '^Subject:'
color header          #4097aa           default         '^User-Agent:.*Mutt'
color header          #2498ae      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #7e965a          default         # quoted text
color quoted1         #2194ca      default         # nested quote
color quoted2         #3392d2         default         # nested quote 2
color quoted3         #2498ae      default         # nested quote 3
color quoted4         #d1aa64    default         # nested quote 4
color quoted5         #de684e        default         # nested quote 5
color signature       #659395        default         # signature
color bold            #e19556         default         # bold text
color underline       #da8950    default         # underlined text

# Message Index
color index           #4097aa           default         ~Q  # replied messages
color index           #e95d52       default         ~D  # deleted messages
color index           #659395        default         ~O  # old messages
color index           #2194ca      default         ~P  # from me
color index           #d1aa64    default         ~T  # tagged messages
color index           #e19556         default         ~F  # flagged messages
color index           #0095d8    default         ~v  # collapsed thread
color index           #de684e        default         ~k  # GPG
color index           #7b9452     default         ~N  # new messages
color index_author    #2498ae      default         .*  # all authors

# Special Email Elements
color body            #2194ca      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #2498ae      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #d8b36f         default         "\\[[0-9]+\\]"
color body            #d1aa64    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #e1655a            default         ~D   # deleted
color index_flags     #2498ae      default         ~g   # signed
color index_flags     #2194ca      default         ~G   # encrypted
color index_author    #7b9452     default         ~P   # from me
color index_author    #da8950    default         ~F   # flagged
color index_author    #da8950    default         ~l   # mailing lists
color index_flags     #7e965a          default         ~N   # new
color index_flags     #e95d52       default         ~l   # lists
color index_date      #e1655a            default              # date
color index_size      #2194ca      default              # size
color index_number    #d1aa64    default              # number

color indicator             default         #20272b
color sidebar_indicator     #da8950  #20272b
color sidebar_highlight     default         #20272b
color sidebar_background    #629393           default
color sidebar_divider       #2194ca    default
color sidebar_flagged       #2194ca    default
color sidebar_new           #e1655a          default
color sidebar_ordinary      #7b9452   default
color sidebar_spool_file    #d8b36f       default
color sidebar_unread        #e1655a          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold