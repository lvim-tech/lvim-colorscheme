# LvimBase_dark colors for Neomutt

# Basic Colors
color normal          #5e8888             default         # normal text
color indicator       default           #20272b      # selected item
color tree            #3a7280      default         # thread arrows
color status          #3b6d8d      default         # status line
color error           #cc5147       default         # error messages
color message         #718650     default         # info messages
color markers         #da8950    default         # + at line wrapping
color attachment      #b65745   default         # attachment info
color search          #d1aa64    default         # search matches
color tilde           #4d6263        default         # ~ empty lines

# Message Headers
color hdrdefault      #4d6263        default         # default header
color header          #447ca2           default         '^From:'
color header          #376386    default         '^Subject:'
color header          #448595           default         '^User-Agent:.*Mutt'
color header          #3a7280      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #7e965a          default         # quoted text
color quoted1         #3b6d8d      default         # nested quote
color quoted2         #40719a         default         # nested quote 2
color quoted3         #3a7280      default         # nested quote 3
color quoted4         #d1aa64    default         # nested quote 4
color quoted5         #c6614d        default         # nested quote 5
color signature       #4d6263        default         # signature
color bold            #e19556         default         # bold text
color underline       #da8950    default         # underlined text

# Message Index
color index           #448595           default         ~Q  # replied messages
color index           #cc5147       default         ~D  # deleted messages
color index           #4d6263        default         ~O  # old messages
color index           #3b6d8d      default         ~P  # from me
color index           #d1aa64    default         ~T  # tagged messages
color index           #e19556         default         ~F  # flagged messages
color index           #376386    default         ~v  # collapsed thread
color index           #c6614d        default         ~k  # GPG
color index           #718650     default         ~N  # new messages
color index_author    #3a7280      default         .*  # all authors

# Special Email Elements
color body            #3b6d8d      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #3a7280      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #d8b36f         default         "\\[[0-9]+\\]"
color body            #d1aa64    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #d75e52            default         ~D   # deleted
color index_flags     #3a7280      default         ~g   # signed
color index_flags     #3b6d8d      default         ~G   # encrypted
color index_author    #718650     default         ~P   # from me
color index_author    #da8950    default         ~F   # flagged
color index_author    #da8950    default         ~l   # mailing lists
color index_flags     #7e965a          default         ~N   # new
color index_flags     #cc5147       default         ~l   # lists
color index_date      #d75e52            default              # date
color index_size      #3b6d8d      default              # size
color index_number    #d1aa64    default              # number

color indicator             default         #20272b
color sidebar_indicator     #da8950  #20272b
color sidebar_highlight     default         #20272b
color sidebar_background    #5e8888           default
color sidebar_divider       #3b6d8d    default
color sidebar_flagged       #3b6d8d    default
color sidebar_new           #d75e52          default
color sidebar_ordinary      #718650   default
color sidebar_spool_file    #d8b36f       default
color sidebar_unread        #d75e52          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold