# LvimBase_soft colors for Neomutt

# Basic Colors
color normal          #659c9c             default         # normal text
color indicator       default           #262d31      # selected item
color tree            #199eb6      default         # thread arrows
color status          #119ad4      default         # status line
color error           #ec665b       default         # error messages
color message         #7f9a53     default         # info messages
color markers         #da8950    default         # + at line wrapping
color attachment      #ee684b   default         # attachment info
color search          #d1aa64    default         # search matches
color tilde           #4d6263        default         # ~ empty lines

# Message Headers
color hdrdefault      #68999b        default         # default header
color header          #399bd3           default         '^From:'
color header          #009ae0    default         '^Subject:'
color header          #3e9db1           default         '^User-Agent:.*Mutt'
color header          #199eb6      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #80995b          default         # quoted text
color quoted1         #119ad4      default         # nested quote
color quoted2         #2c98dc         default         # nested quote 2
color quoted3         #199eb6      default         # nested quote 3
color quoted4         #d1aa64    default         # nested quote 4
color quoted5         #e86b50        default         # nested quote 5
color signature       #68999b        default         # signature
color bold            #e19556         default         # bold text
color underline       #da8950    default         # underlined text

# Message Index
color index           #3e9db1           default         ~Q  # replied messages
color index           #ec665b       default         ~D  # deleted messages
color index           #68999b        default         ~O  # old messages
color index           #119ad4      default         ~P  # from me
color index           #d1aa64    default         ~T  # tagged messages
color index           #e19556         default         ~F  # flagged messages
color index           #009ae0    default         ~v  # collapsed thread
color index           #e86b50        default         ~k  # GPG
color index           #7f9a53     default         ~N  # new messages
color index_author    #199eb6      default         .*  # all authors

# Special Email Elements
color body            #119ad4      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #199eb6      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #d8b36f         default         "\\[[0-9]+\\]"
color body            #d1aa64    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #e46d62            default         ~D   # deleted
color index_flags     #199eb6      default         ~g   # signed
color index_flags     #119ad4      default         ~G   # encrypted
color index_author    #7f9a53     default         ~P   # from me
color index_author    #da8950    default         ~F   # flagged
color index_author    #da8950    default         ~l   # mailing lists
color index_flags     #80995b          default         ~N   # new
color index_flags     #ec665b       default         ~l   # lists
color index_date      #e46d62            default              # date
color index_size      #119ad4      default              # size
color index_number    #d1aa64    default              # number

color indicator             default         #262d31
color sidebar_indicator     #da8950  #262d31
color sidebar_highlight     default         #262d31
color sidebar_background    #659c9c           default
color sidebar_divider       #119ad4    default
color sidebar_flagged       #119ad4    default
color sidebar_new           #e46d62          default
color sidebar_ordinary      #7f9a53   default
color sidebar_spool_file    #d8b36f       default
color sidebar_unread        #e46d62          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold