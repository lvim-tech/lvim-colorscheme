# LvimRosepine_light colors for Neomutt

# Basic Colors
color normal          #4e6767             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #5a6565      default         # thread arrows
color status          #5a6569      default         # status line
color error           #7a5860       default         # error messages
color message         #58665a     default         # info messages
color markers         #775c5c    default         # + at line wrapping
color attachment      #685d79   default         # attachment info
color search          #6b6056    default         # search matches
color tilde           #95718d        default         # ~ empty lines

# Message Headers
color hdrdefault      #745c6e        default         # default header
color header          #586367           default         '^From:'
color header          #64616c    default         '^Subject:'
color header          #5a6565           default         '^User-Agent:.*Mutt'
color header          #5a6565      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #57645a          default         # quoted text
color quoted1         #5a6569      default         # nested quote
color quoted2         #63616c         default         # nested quote 2
color quoted3         #5a6565      default         # nested quote 3
color quoted4         #6b6056    default         # nested quote 4
color quoted5         #6a5d7d        default         # nested quote 5
color signature       #745c6e        default         # signature
color bold            #735e5d         default         # bold text
color underline       #775c5c    default         # underlined text

# Message Index
color index           #5a6565           default         ~Q  # replied messages
color index           #7a5860       default         ~D  # deleted messages
color index           #745c6e        default         ~O  # old messages
color index           #5a6569      default         ~P  # from me
color index           #6b6056    default         ~T  # tagged messages
color index           #735e5d         default         ~F  # flagged messages
color index           #64616c    default         ~v  # collapsed thread
color index           #6a5d7d        default         ~k  # GPG
color index           #58665a     default         ~N  # new messages
color index_author    #5a6565      default         .*  # all authors

# Special Email Elements
color body            #5a6569      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5a6565      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #6c6156         default         "\\[[0-9]+\\]"
color body            #6b6056    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #795960            default         ~D   # deleted
color index_flags     #5a6565      default         ~g   # signed
color index_flags     #5a6569      default         ~G   # encrypted
color index_author    #58665a     default         ~P   # from me
color index_author    #775c5c    default         ~F   # flagged
color index_author    #775c5c    default         ~l   # mailing lists
color index_flags     #57645a          default         ~N   # new
color index_flags     #7a5860       default         ~l   # lists
color index_date      #795960            default              # date
color index_size      #5a6569      default              # size
color index_number    #6b6056    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #7a5f5e  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #4e6767           default
color sidebar_divider       #5a6569    default
color sidebar_flagged       #5a6569    default
color sidebar_new           #795960          default
color sidebar_ordinary      #58665a   default
color sidebar_spool_file    #6c6156       default
color sidebar_unread        #795960          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold