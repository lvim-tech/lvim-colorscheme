# LvimRosepine_light colors for Neomutt

# Basic Colors
color normal          #5e8888             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #6a7a7a      default         # thread arrows
color status          #7e949d      default         # status line
color error           #a36e7a       default         # error messages
color message         #677b6b     default         # info messages
color markers         #846564    default         # + at line wrapping
color attachment      #7b6d90   default         # attachment info
color search          #958270    default         # search matches
color tilde           #95718d        default         # ~ empty lines

# Message Headers
color hdrdefault      #95718d        default         # default header
color header          #73878f           default         '^From:'
color header          #8c8995    default         '^Subject:'
color header          #606d6d           default         '^User-Agent:.*Mutt'
color header          #6a7a7a      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #5d6c60          default         # quoted text
color quoted1         #7e949d      default         # nested quote
color quoted2         #7f7c88         default         # nested quote 2
color quoted3         #6a7a7a      default         # nested quote 3
color quoted4         #958270    default         # nested quote 4
color quoted5         #6d5f81        default         # nested quote 5
color signature       #95718d        default         # signature
color bold            #a58382         default         # bold text
color underline       #846564    default         # underlined text

# Message Index
color index           #606d6d           default         ~Q  # replied messages
color index           #a36e7a       default         ~D  # deleted messages
color index           #95718d        default         ~O  # old messages
color index           #7e949d      default         ~P  # from me
color index           #958270    default         ~T  # tagged messages
color index           #a58382         default         ~F  # flagged messages
color index           #8c8995    default         ~v  # collapsed thread
color index           #6d5f81        default         ~k  # GPG
color index           #677b6b     default         ~N  # new messages
color index_author    #6a7a7a      default         .*  # all authors

# Special Email Elements
color body            #7e949d      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #6a7a7a      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #8c7b6a         default         "\\[[0-9]+\\]"
color body            #958270    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #8e656e            default         ~D   # deleted
color index_flags     #6a7a7a      default         ~g   # signed
color index_flags     #7e949d      default         ~G   # encrypted
color index_author    #677b6b     default         ~P   # from me
color index_author    #846564    default         ~F   # flagged
color index_author    #846564    default         ~l   # mailing lists
color index_flags     #5d6c60          default         ~N   # new
color index_flags     #a36e7a       default         ~l   # lists
color index_date      #8e656e            default              # date
color index_size      #7e949d      default              # size
color index_number    #958270    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #846564  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #5e8888           default
color sidebar_divider       #7e949d    default
color sidebar_flagged       #7e949d    default
color sidebar_new           #8e656e          default
color sidebar_ordinary      #677b6b   default
color sidebar_spool_file    #8c7b6a       default
color sidebar_unread        #8e656e          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold