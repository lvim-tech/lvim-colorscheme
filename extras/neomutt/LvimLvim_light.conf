# LvimLvim_light colors for Neomutt

# Basic Colors
color normal          #5e8888             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #498d9e      default         # thread arrows
color status          #4e8db5      default         # status line
color error           #c54e44       default         # error messages
color message         #637646     default         # info messages
color markers         #b87342    default         # + at line wrapping
color attachment      #c15d4a   default         # attachment info
color search          #8e7242    default         # search matches
color tilde           #789698        default         # ~ empty lines

# Message Headers
color hdrdefault      #789698        default         # default header
color header          #457da3           default         '^From:'
color header          #5695c8    default         '^Subject:'
color header          #3e7a89           default         '^User-Agent:.*Mutt'
color header          #498d9e      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #55673c          default         # quoted text
color quoted1         #4e8db5      default         # nested quote
color quoted2         #4d86b6         default         # nested quote 2
color quoted3         #498d9e      default         # nested quote 3
color quoted4         #8e7242    default         # nested quote 4
color quoted5         #af5543        default         # nested quote 5
color signature       #789698        default         # signature
color bold            #aa703f         default         # bold text
color underline       #b87342    default         # underlined text

# Message Index
color index           #3e7a89           default         ~Q  # replied messages
color index           #c54e44       default         ~D  # deleted messages
color index           #789698        default         ~O  # old messages
color index           #4e8db5      default         ~P  # from me
color index           #8e7242    default         ~T  # tagged messages
color index           #aa703f         default         ~F  # flagged messages
color index           #5695c8    default         ~v  # collapsed thread
color index           #af5543        default         ~k  # GPG
color index           #637646     default         ~N  # new messages
color index_author    #498d9e      default         .*  # all authors

# Special Email Elements
color body            #4e8db5      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #498d9e      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #856e42         default         "\\[[0-9]+\\]"
color body            #8e7242    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #ae4b41            default         ~D   # deleted
color index_flags     #498d9e      default         ~g   # signed
color index_flags     #4e8db5      default         ~G   # encrypted
color index_author    #637646     default         ~P   # from me
color index_author    #b87342    default         ~F   # flagged
color index_author    #b87342    default         ~l   # mailing lists
color index_flags     #55673c          default         ~N   # new
color index_flags     #c54e44       default         ~l   # lists
color index_date      #ae4b41            default              # date
color index_size      #4e8db5      default              # size
color index_number    #8e7242    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #b87342  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #5e8888           default
color sidebar_divider       #4e8db5    default
color sidebar_flagged       #4e8db5    default
color sidebar_new           #ae4b41          default
color sidebar_ordinary      #637646   default
color sidebar_spool_file    #856e42       default
color sidebar_unread        #ae4b41          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold