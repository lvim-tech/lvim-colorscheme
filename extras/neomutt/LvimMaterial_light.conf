# LvimMaterial_light colors for Neomutt

# Basic Colors
color normal          #5e8888             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #3c667b      default         # thread arrows
color status          #577acd      default         # status line
color error           #ca5157       default         # error messages
color message         #748f51     default         # info messages
color markers         #a05540    default         # + at line wrapping
color attachment      #c7495c   default         # attachment info
color search          #997947    default         # search matches
color tilde           #798991        default         # ~ empty lines

# Message Headers
color hdrdefault      #798991        default         # default header
color header          #4d6cae           default         '^From:'
color header          #8f73a4    default         '^Subject:'
color header          #578ca5           default         '^User-Agent:.*Mutt'
color header          #3c667b      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #6f864f          default         # quoted text
color quoted1         #577acd      default         # nested quote
color quoted2         #806594         default         # nested quote 2
color quoted3         #3c667b      default         # nested quote 3
color quoted4         #997947    default         # nested quote 4
color quoted5         #b04556        default         # nested quote 5
color signature       #798991        default         # signature
color bold            #c9745b         default         # bold text
color underline       #a05540    default         # underlined text

# Message Index
color index           #578ca5           default         ~Q  # replied messages
color index           #ca5157       default         ~D  # deleted messages
color index           #798991        default         ~O  # old messages
color index           #577acd      default         ~P  # from me
color index           #997947    default         ~T  # tagged messages
color index           #c9745b         default         ~F  # flagged messages
color index           #8f73a4    default         ~v  # collapsed thread
color index           #b04556        default         ~k  # GPG
color index           #748f51     default         ~N  # new messages
color index_author    #3c667b      default         .*  # all authors

# Special Email Elements
color body            #577acd      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #3c667b      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #8e7347         default         "\\[[0-9]+\\]"
color body            #997947    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #b14b51            default         ~D   # deleted
color index_flags     #3c667b      default         ~g   # signed
color index_flags     #577acd      default         ~G   # encrypted
color index_author    #748f51     default         ~P   # from me
color index_author    #a05540    default         ~F   # flagged
color index_author    #a05540    default         ~l   # mailing lists
color index_flags     #6f864f          default         ~N   # new
color index_flags     #ca5157       default         ~l   # lists
color index_date      #b14b51            default              # date
color index_size      #577acd      default              # size
color index_number    #997947    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #a05540  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #5e8888           default
color sidebar_divider       #577acd    default
color sidebar_flagged       #577acd    default
color sidebar_new           #b14b51          default
color sidebar_ordinary      #748f51   default
color sidebar_spool_file    #8e7347       default
color sidebar_unread        #b14b51          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold