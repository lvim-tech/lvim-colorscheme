# LvimMaterial_light colors for Neomutt

# Basic Colors
color normal          #4e6767             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #3c667b      default         # thread arrows
color status          #4c6095      default         # status line
color error           #9d484c       default         # error messages
color message         #596846     default         # info messages
color markers         #93503f    default         # + at line wrapping
color attachment      #9e4350   default         # attachment info
color search          #755f42    default         # search matches
color tilde           #798991        default         # ~ empty lines

# Message Headers
color hdrdefault      #5a6267        default         # default header
color header          #496095           default         '^From:'
color header          #6e5b7d    default         '^Subject:'
color header          #4a6674           default         '^User-Agent:.*Mutt'
color header          #3c667b      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #596846          default         # quoted text
color quoted1         #4c6095      default         # nested quote
color quoted2         #6d597d         default         # nested quote 2
color quoted3         #3c667b      default         # nested quote 3
color quoted4         #755f42    default         # nested quote 4
color quoted5         #a14351        default         # nested quote 5
color signature       #5a6267        default         # signature
color bold            #86564a         default         # bold text
color underline       #93503f    default         # underlined text

# Message Index
color index           #4a6674           default         ~Q  # replied messages
color index           #9d484c       default         ~D  # deleted messages
color index           #5a6267        default         ~O  # old messages
color index           #4c6095      default         ~P  # from me
color index           #755f42    default         ~T  # tagged messages
color index           #86564a         default         ~F  # flagged messages
color index           #6e5b7d    default         ~v  # collapsed thread
color index           #a14351        default         ~k  # GPG
color index           #596846     default         ~N  # new messages
color index_author    #3c667b      default         .*  # all authors

# Special Email Elements
color body            #4c6095      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #3c667b      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #746042         default         "\\[[0-9]+\\]"
color body            #755f42    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #9d474c            default         ~D   # deleted
color index_flags     #3c667b      default         ~g   # signed
color index_flags     #4c6095      default         ~G   # encrypted
color index_author    #596846     default         ~P   # from me
color index_author    #93503f    default         ~F   # flagged
color index_author    #93503f    default         ~l   # mailing lists
color index_flags     #596846          default         ~N   # new
color index_flags     #9d484c       default         ~l   # lists
color index_date      #9d474c            default              # date
color index_size      #4c6095      default              # size
color index_number    #755f42    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #97523f  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #4e6767           default
color sidebar_divider       #4c6095    default
color sidebar_flagged       #4c6095    default
color sidebar_new           #9d474c          default
color sidebar_ordinary      #596846   default
color sidebar_spool_file    #746042       default
color sidebar_unread        #9d474c          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold