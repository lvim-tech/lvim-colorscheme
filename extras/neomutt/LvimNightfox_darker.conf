# LvimNightfox_darker colors for Neomutt

# Basic Colors
color normal          #bcbdbd             default         # normal text
color indicator       default           #141c26      # selected item
color tree            #5c9799      default         # thread arrows
color status          #5b84b9      default         # status line
color error           #d25a7a       default         # error messages
color message         #6a8b7b     default         # info messages
color markers         #bd8055    default         # + at line wrapping
color attachment      #9578ac   default         # attachment info
color search          #b19c63    default         # search matches
color tilde           #758292        default         # ~ empty lines

# Message Headers
color hdrdefault      #778595        default         # default header
color header          #6885ad           default         '^From:'
color header          #8f77b8    default         '^Subject:'
color header          #69a3a4           default         '^User-Agent:.*Mutt'
color header          #5c9799      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #7b998a          default         # quoted text
color quoted1         #5b84b9      default         # nested quote
color quoted2         #8e78af         default         # nested quote 2
color quoted3         #5c9799      default         # nested quote 3
color quoted4         #b19c63    default         # nested quote 4
color quoted5         #9a80ae        default         # nested quote 5
color signature       #778595        default         # signature
color bold            #c88e62         default         # bold text
color underline       #bd8055    default         # underlined text

# Message Index
color index           #69a3a4           default         ~Q  # replied messages
color index           #d25a7a       default         ~D  # deleted messages
color index           #778595        default         ~O  # old messages
color index           #5b84b9      default         ~P  # from me
color index           #b19c63    default         ~T  # tagged messages
color index           #c88e62         default         ~F  # flagged messages
color index           #8f77b8    default         ~v  # collapsed thread
color index           #9a80ae        default         ~k  # GPG
color index           #6a8b7b     default         ~N  # new messages
color index_author    #5c9799      default         .*  # all authors

# Special Email Elements
color body            #5b84b9      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5c9799      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #bba76f         default         "\\[[0-9]+\\]"
color body            #b19c63    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #bf687e            default         ~D   # deleted
color index_flags     #5c9799      default         ~g   # signed
color index_flags     #5b84b9      default         ~G   # encrypted
color index_author    #6a8b7b     default         ~P   # from me
color index_author    #bd8055    default         ~F   # flagged
color index_author    #bd8055    default         ~l   # mailing lists
color index_flags     #7b998a          default         ~N   # new
color index_flags     #d25a7a       default         ~l   # lists
color index_date      #bf687e            default              # date
color index_size      #5b84b9      default              # size
color index_number    #b19c63    default              # number

color indicator             default         #141c26
color sidebar_indicator     #bd8055  #141c26
color sidebar_highlight     default         #141c26
color sidebar_background    #bcbdbd           default
color sidebar_divider       #5b84b9    default
color sidebar_flagged       #5b84b9    default
color sidebar_new           #bf687e          default
color sidebar_ordinary      #6a8b7b   default
color sidebar_spool_file    #bba76f       default
color sidebar_unread        #bf687e          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold