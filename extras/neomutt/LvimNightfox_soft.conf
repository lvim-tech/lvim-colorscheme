# LvimNightfox_soft colors for Neomutt

# Basic Colors
color normal          #bcbdbd             default         # normal text
color indicator       default           #1d2837      # selected item
color tree            #5c9799      default         # thread arrows
color status          #5d8fcb      default         # status line
color error           #d96985       default         # error messages
color message         #6f9482     default         # info messages
color markers         #bd8055    default         # + at line wrapping
color attachment      #9f82b6   default         # attachment info
color search          #b19c63    default         # search matches
color tilde           #758292        default         # ~ empty lines

# Message Headers
color hdrdefault      #808fa2        default         # default header
color header          #6e90bd           default         '^From:'
color header          #9982c2    default         '^Subject:'
color header          #69a3a4           default         '^User-Agent:.*Mutt'
color header          #5c9799      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #7b998a          default         # quoted text
color quoted1         #5d8fcb      default         # nested quote
color quoted2         #9882b9         default         # nested quote 2
color quoted3         #5c9799      default         # nested quote 3
color quoted4         #b19c63    default         # nested quote 4
color quoted5         #9d83b0        default         # nested quote 5
color signature       #808fa2        default         # signature
color bold            #c88e62         default         # bold text
color underline       #bd8055    default         # underlined text

# Message Index
color index           #69a3a4           default         ~Q  # replied messages
color index           #d96985       default         ~D  # deleted messages
color index           #808fa2        default         ~O  # old messages
color index           #5d8fcb      default         ~P  # from me
color index           #b19c63    default         ~T  # tagged messages
color index           #c88e62         default         ~F  # flagged messages
color index           #9982c2    default         ~v  # collapsed thread
color index           #9d83b0        default         ~k  # GPG
color index           #6f9482     default         ~N  # new messages
color index_author    #5c9799      default         .*  # all authors

# Special Email Elements
color body            #5d8fcb      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5c9799      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #bba76f         default         "\\[[0-9]+\\]"
color body            #b19c63    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #c77489            default         ~D   # deleted
color index_flags     #5c9799      default         ~g   # signed
color index_flags     #5d8fcb      default         ~G   # encrypted
color index_author    #6f9482     default         ~P   # from me
color index_author    #bd8055    default         ~F   # flagged
color index_author    #bd8055    default         ~l   # mailing lists
color index_flags     #7b998a          default         ~N   # new
color index_flags     #d96985       default         ~l   # lists
color index_date      #c77489            default              # date
color index_size      #5d8fcb      default              # size
color index_number    #b19c63    default              # number

color indicator             default         #1d2837
color sidebar_indicator     #bd8055  #1d2837
color sidebar_highlight     default         #1d2837
color sidebar_background    #bcbdbd           default
color sidebar_divider       #5d8fcb    default
color sidebar_flagged       #5d8fcb    default
color sidebar_new           #c77489          default
color sidebar_ordinary      #6f9482   default
color sidebar_spool_file    #bba76f       default
color sidebar_unread        #c77489          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold