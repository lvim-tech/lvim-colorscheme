# LvimNightfox_dark colors for Neomutt

# Basic Colors
color normal          #bcbdbd             default         # normal text
color indicator       default           #192330      # selected item
color tree            #5c9799      default         # thread arrows
color status          #5d8cc7      default         # status line
color error           #d6627f       default         # error messages
color message         #6d9180     default         # info messages
color markers         #bd8055    default         # + at line wrapping
color attachment      #9a7db1   default         # attachment info
color search          #b19c63    default         # search matches
color tilde           #758292        default         # ~ empty lines

# Message Headers
color hdrdefault      #7b8a9c        default         # default header
color header          #6b8ab5           default         '^From:'
color header          #947dbd    default         '^Subject:'
color header          #69a3a4           default         '^User-Agent:.*Mutt'
color header          #5c9799      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #7b998a          default         # quoted text
color quoted1         #5d8cc7      default         # nested quote
color quoted2         #937db4         default         # nested quote 2
color quoted3         #5c9799      default         # nested quote 3
color quoted4         #b19c63    default         # nested quote 4
color quoted5         #9a80ae        default         # nested quote 5
color signature       #7b8a9c        default         # signature
color bold            #c88e62         default         # bold text
color underline       #bd8055    default         # underlined text

# Message Index
color index           #69a3a4           default         ~Q  # replied messages
color index           #d6627f       default         ~D  # deleted messages
color index           #7b8a9c        default         ~O  # old messages
color index           #5d8cc7      default         ~P  # from me
color index           #b19c63    default         ~T  # tagged messages
color index           #c88e62         default         ~F  # flagged messages
color index           #947dbd    default         ~v  # collapsed thread
color index           #9a80ae        default         ~k  # GPG
color index           #6d9180     default         ~N  # new messages
color index_author    #5c9799      default         .*  # all authors

# Special Email Elements
color body            #5d8cc7      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5c9799      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #bba76f         default         "\\[[0-9]+\\]"
color body            #b19c63    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #c46e83            default         ~D   # deleted
color index_flags     #5c9799      default         ~g   # signed
color index_flags     #5d8cc7      default         ~G   # encrypted
color index_author    #6d9180     default         ~P   # from me
color index_author    #bd8055    default         ~F   # flagged
color index_author    #bd8055    default         ~l   # mailing lists
color index_flags     #7b998a          default         ~N   # new
color index_flags     #d6627f       default         ~l   # lists
color index_date      #c46e83            default              # date
color index_size      #5d8cc7      default              # size
color index_number    #b19c63    default              # number

color indicator             default         #192330
color sidebar_indicator     #bd8055  #192330
color sidebar_highlight     default         #192330
color sidebar_background    #bcbdbd           default
color sidebar_divider       #5d8cc7    default
color sidebar_flagged       #5d8cc7    default
color sidebar_new           #c46e83          default
color sidebar_ordinary      #6d9180   default
color sidebar_spool_file    #bba76f       default
color sidebar_unread        #c46e83          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold