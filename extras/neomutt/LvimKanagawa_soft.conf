# LvimKanagawa_soft colors for Neomutt

# Basic Colors
color normal          #8a8aa9             default         # normal text
color indicator       default           #26272d      # selected item
color tree            #61968c      default         # thread arrows
color status          #548de4      default         # status line
color error           #e26767       default         # error messages
color message         #7a9457     default         # info messages
color markers         #b7875b    default         # + at line wrapping
color attachment      #cb7670   default         # attachment info
color search          #cbae75    default         # search matches
color tilde           #4e4e73        default         # ~ empty lines

# Message Headers
color hdrdefault      #8989b9        default         # default header
color header          #578ee0           default         '^From:'
color header          #9286ae    default         '^Subject:'
color header          #64968e           default         '^User-Agent:.*Mutt'
color header          #61968c      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #7c955b          default         # quoted text
color quoted1         #548de4      default         # nested quote
color quoted2         #9186ae         default         # nested quote 2
color quoted3         #61968c      default         # nested quote 3
color quoted4         #cbae75    default         # nested quote 4
color quoted5         #c77973        default         # nested quote 5
color signature       #8989b9        default         # signature
color bold            #bf8f62         default         # bold text
color underline       #b7875b    default         # underlined text

# Message Index
color index           #64968e           default         ~Q  # replied messages
color index           #e26767       default         ~D  # deleted messages
color index           #8989b9        default         ~O  # old messages
color index           #548de4      default         ~P  # from me
color index           #cbae75    default         ~T  # tagged messages
color index           #bf8f62         default         ~F  # flagged messages
color index           #9286ae    default         ~v  # collapsed thread
color index           #c77973        default         ~k  # GPG
color index           #7a9457     default         ~N  # new messages
color index_author    #61968c      default         .*  # all authors

# Special Email Elements
color body            #548de4      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #61968c      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #d1b57c         default         "\\[[0-9]+\\]"
color body            #cbae75    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #d96d6d            default         ~D   # deleted
color index_flags     #61968c      default         ~g   # signed
color index_flags     #548de4      default         ~G   # encrypted
color index_author    #7a9457     default         ~P   # from me
color index_author    #b7875b    default         ~F   # flagged
color index_author    #b7875b    default         ~l   # mailing lists
color index_flags     #7c955b          default         ~N   # new
color index_flags     #e26767       default         ~l   # lists
color index_date      #d96d6d            default              # date
color index_size      #548de4      default              # size
color index_number    #cbae75    default              # number

color indicator             default         #26272d
color sidebar_indicator     #b7875b  #26272d
color sidebar_highlight     default         #26272d
color sidebar_background    #8a8aa9           default
color sidebar_divider       #548de4    default
color sidebar_flagged       #548de4    default
color sidebar_new           #d96d6d          default
color sidebar_ordinary      #7a9457   default
color sidebar_spool_file    #d1b57c       default
color sidebar_unread        #d96d6d          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold