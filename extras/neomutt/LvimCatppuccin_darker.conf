# LvimCatppuccin_darker colors for Neomutt

# Basic Colors
color normal          #b2b7c7             default         # normal text
color indicator       default           #181920      # selected item
color tree            #5f8790      default         # thread arrows
color status          #6181be      default         # status line
color error           #c4627b       default         # error messages
color message         #628c5f     default         # info messages
color markers         #ac7a63    default         # + at line wrapping
color attachment      #ad6d99   default         # attachment info
color search          #af9973    default         # search matches
color tilde           #6c7393        default         # ~ empty lines

# Message Headers
color hdrdefault      #7880a1        default         # default header
color header          #6783b5           default         '^From:'
color header          #9473bc    default         '^Subject:'
color header          #65878e           default         '^User-Agent:.*Mutt'
color header          #5f8790      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #6b8d69          default         # quoted text
color quoted1         #6181be      default         # nested quote
color quoted2         #9173b3         default         # nested quote 2
color quoted3         #5f8790      default         # nested quote 3
color quoted4         #af9973    default         # nested quote 4
color quoted5         #b976a7        default         # nested quote 5
color signature       #7880a1        default         # signature
color bold            #b88970         default         # bold text
color underline       #ac7a63    default         # underlined text

# Message Index
color index           #65878e           default         ~Q  # replied messages
color index           #c4627b       default         ~D  # deleted messages
color index           #7880a1        default         ~O  # old messages
color index           #6181be      default         ~P  # from me
color index           #af9973    default         ~T  # tagged messages
color index           #b88970         default         ~F  # flagged messages
color index           #9473bc    default         ~v  # collapsed thread
color index           #b976a7        default         ~k  # GPG
color index           #628c5f     default         ~N  # new messages
color index_author    #5f8790      default         .*  # all authors

# Special Email Elements
color body            #6181be      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5f8790      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #b8a47e         default         "\\[[0-9]+\\]"
color body            #af9973    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #bb677c            default         ~D   # deleted
color index_flags     #5f8790      default         ~g   # signed
color index_flags     #6181be      default         ~G   # encrypted
color index_author    #628c5f     default         ~P   # from me
color index_author    #ac7a63    default         ~F   # flagged
color index_author    #ac7a63    default         ~l   # mailing lists
color index_flags     #6b8d69          default         ~N   # new
color index_flags     #c4627b       default         ~l   # lists
color index_date      #bb677c            default              # date
color index_size      #6181be      default              # size
color index_number    #af9973    default              # number

color indicator             default         #181920
color sidebar_indicator     #ac7a63  #181920
color sidebar_highlight     default         #181920
color sidebar_background    #b2b7c7           default
color sidebar_divider       #6181be    default
color sidebar_flagged       #6181be    default
color sidebar_new           #bb677c          default
color sidebar_ordinary      #628c5f   default
color sidebar_spool_file    #b8a47e       default
color sidebar_unread        #bb677c          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold