# LvimGruvbox_darker colors for Neomutt

# Basic Colors
color normal          #928373             default         # normal text
color indicator       default           #1e1d1c      # selected item
color tree            #54915c      default         # thread arrows
color status          #3d8caf      default         # status line
color error           #e74d4d       default         # error messages
color message         #838838     default         # info messages
color markers         #b9744b    default         # + at line wrapping
color attachment      #c36e51   default         # attachment info
color search          #a5935f    default         # search matches
color tilde           #64584e        default         # ~ empty lines

# Message Headers
color hdrdefault      #98806b        default         # default header
color header          #4c8aaa           default         '^From:'
color header          #887e9b    default         '^Subject:'
color header          #5a9162           default         '^User-Agent:.*Mutt'
color header          #54915c      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #848846          default         # quoted text
color quoted1         #3d8caf      default         # nested quote
color quoted2         #877f98         default         # nested quote 2
color quoted3         #54915c      default         # nested quote 3
color quoted4         #a5935f    default         # nested quote 4
color quoted5         #bb755e        default         # nested quote 5
color signature       #98806b        default         # signature
color bold            #c47d54         default         # bold text
color underline       #b9744b    default         # underlined text

# Message Index
color index           #5a9162           default         ~Q  # replied messages
color index           #e74d4d       default         ~D  # deleted messages
color index           #98806b        default         ~O  # old messages
color index           #3d8caf      default         ~P  # from me
color index           #a5935f    default         ~T  # tagged messages
color index           #c47d54         default         ~F  # flagged messages
color index           #887e9b    default         ~v  # collapsed thread
color index           #bb755e        default         ~k  # GPG
color index           #838838     default         ~N  # new messages
color index_author    #54915c      default         .*  # all authors

# Special Email Elements
color body            #3d8caf      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #54915c      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #af9e6b         default         "\\[[0-9]+\\]"
color body            #a5935f    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #dc5a5a            default         ~D   # deleted
color index_flags     #54915c      default         ~g   # signed
color index_flags     #3d8caf      default         ~G   # encrypted
color index_author    #838838     default         ~P   # from me
color index_author    #b9744b    default         ~F   # flagged
color index_author    #b9744b    default         ~l   # mailing lists
color index_flags     #848846          default         ~N   # new
color index_flags     #e74d4d       default         ~l   # lists
color index_date      #dc5a5a            default              # date
color index_size      #3d8caf      default              # size
color index_number    #a5935f    default              # number

color indicator             default         #1e1d1c
color sidebar_indicator     #b9744b  #1e1d1c
color sidebar_highlight     default         #1e1d1c
color sidebar_background    #928373           default
color sidebar_divider       #3d8caf    default
color sidebar_flagged       #3d8caf    default
color sidebar_new           #dc5a5a          default
color sidebar_ordinary      #838838   default
color sidebar_spool_file    #af9e6b       default
color sidebar_unread        #dc5a5a          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold