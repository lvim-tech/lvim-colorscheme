# LvimGruvbox_darker colors for Neomutt

# Basic Colors
color normal          #645c54             default         # normal text
color indicator       default           #1e1d1c      # selected item
color tree            #486b4c      default         # thread arrows
color status          #3f6376      default         # status line
color error           #bd4343       default         # error messages
color message         #65683b     default         # info messages
color markers         #b1704b    default         # + at line wrapping
color attachment      #b1674f   default         # attachment info
color search          #a5935f    default         # search matches
color tilde           #64584e        default         # ~ empty lines

# Message Headers
color hdrdefault      #64584e        default         # default header
color header          #497188           default         '^From:'
color header          #575163    default         '^Subject:'
color header          #527a57           default         '^User-Agent:.*Mutt'
color header          #486b4c      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #757845          default         # quoted text
color quoted1         #3f6376      default         # nested quote
color quoted2         #635d71         default         # nested quote 2
color quoted3         #486b4c      default         # nested quote 3
color quoted4         #a5935f    default         # nested quote 4
color quoted5         #bb755e        default         # nested quote 5
color signature       #64584e        default         # signature
color bold            #c47d54         default         # bold text
color underline       #b1704b    default         # underlined text

# Message Index
color index           #527a57           default         ~Q  # replied messages
color index           #bd4343       default         ~D  # deleted messages
color index           #64584e        default         ~O  # old messages
color index           #3f6376      default         ~P  # from me
color index           #a5935f    default         ~T  # tagged messages
color index           #c47d54         default         ~F  # flagged messages
color index           #575163    default         ~v  # collapsed thread
color index           #bb755e        default         ~k  # GPG
color index           #65683b     default         ~N  # new messages
color index_author    #486b4c      default         .*  # all authors

# Special Email Elements
color body            #3f6376      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #486b4c      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #af9e6b         default         "\\[[0-9]+\\]"
color body            #a5935f    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #ca4f4f            default         ~D   # deleted
color index_flags     #486b4c      default         ~g   # signed
color index_flags     #3f6376      default         ~G   # encrypted
color index_author    #65683b     default         ~P   # from me
color index_author    #b1704b    default         ~F   # flagged
color index_author    #b1704b    default         ~l   # mailing lists
color index_flags     #757845          default         ~N   # new
color index_flags     #bd4343       default         ~l   # lists
color index_date      #ca4f4f            default              # date
color index_size      #3f6376      default              # size
color index_number    #a5935f    default              # number

color indicator             default         #1e1d1c
color sidebar_indicator     #b1704b  #1e1d1c
color sidebar_highlight     default         #1e1d1c
color sidebar_background    #645c54           default
color sidebar_divider       #3f6376    default
color sidebar_flagged       #3f6376    default
color sidebar_new           #ca4f4f          default
color sidebar_ordinary      #65683b   default
color sidebar_spool_file    #af9e6b       default
color sidebar_unread        #ca4f4f          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold