# LvimCatppuccin_light colors for Neomutt

# Basic Colors
color normal          #4e6767             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #50656b      default         # thread arrows
color status          #566381      default         # status line
color error           #8c5260       default         # error messages
color message         #50694f     default         # info messages
color markers         #7d5a49    default         # + at line wrapping
color attachment      #825574   default         # attachment info
color search          #6d614f    default         # search matches
color tilde           #727897        default         # ~ empty lines

# Message Headers
color hdrdefault      #5e6279        default         # default header
color header          #546380           default         '^From:'
color header          #6c5b82    default         '^Subject:'
color header          #4f676c           default         '^User-Agent:.*Mutt'
color header          #50656b      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #50694f          default         # quoted text
color quoted1         #566381      default         # nested quote
color quoted2         #6c5a83         default         # nested quote 2
color quoted3         #50656b      default         # nested quote 3
color quoted4         #6d614f    default         # nested quote 4
color quoted5         #845377        default         # nested quote 5
color signature       #5e6279        default         # signature
color bold            #755c50         default         # bold text
color underline       #7d5a49    default         # underlined text

# Message Index
color index           #4f676c           default         ~Q  # replied messages
color index           #8c5260       default         ~D  # deleted messages
color index           #5e6279        default         ~O  # old messages
color index           #566381      default         ~P  # from me
color index           #6d614f    default         ~T  # tagged messages
color index           #755c50         default         ~F  # flagged messages
color index           #6c5b82    default         ~v  # collapsed thread
color index           #845377        default         ~k  # GPG
color index           #50694f     default         ~N  # new messages
color index_author    #50656b      default         .*  # all authors

# Special Email Elements
color body            #566381      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #50656b      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #6a604e         default         "\\[[0-9]+\\]"
color body            #6d614f    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #8a515f            default         ~D   # deleted
color index_flags     #50656b      default         ~g   # signed
color index_flags     #566381      default         ~G   # encrypted
color index_author    #50694f     default         ~P   # from me
color index_author    #7d5a49    default         ~F   # flagged
color index_author    #7d5a49    default         ~l   # mailing lists
color index_flags     #50694f          default         ~N   # new
color index_flags     #8c5260       default         ~l   # lists
color index_date      #8a515f            default              # date
color index_size      #566381      default              # size
color index_number    #6d614f    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #845e4c  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #4e6767           default
color sidebar_divider       #566381    default
color sidebar_flagged       #566381    default
color sidebar_new           #8a515f          default
color sidebar_ordinary      #50694f   default
color sidebar_spool_file    #6a604e       default
color sidebar_unread        #8a515f          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold