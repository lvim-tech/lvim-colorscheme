# LvimCatppuccin_light colors for Neomutt

# Basic Colors
color normal          #5e8888             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #5e8088      default         # thread arrows
color status          #6d86ba      default         # status line
color error           #b76277       default         # error messages
color message         #5e825c     default         # info messages
color markers         #88604d    default         # + at line wrapping
color attachment      #955e84   default         # attachment info
color search          #948161    default         # search matches
color tilde           #727897        default         # ~ empty lines

# Message Headers
color hdrdefault      #727897        default         # default header
color header          #6279a4           default         '^From:'
color header          #9c87b8    default         '^Subject:'
color header          #557278           default         '^User-Agent:.*Mutt'
color header          #5e8088      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #557153          default         # quoted text
color quoted1         #6d86ba      default         # nested quote
color quoted2         #9078ad         default         # nested quote 2
color quoted3         #5e8088      default         # nested quote 3
color quoted4         #948161    default         # nested quote 4
color quoted5         #845377        default         # nested quote 5
color signature       #727897        default         # signature
color bold            #ac8068         default         # bold text
color underline       #88604d    default         # underlined text

# Message Index
color index           #557278           default         ~Q  # replied messages
color index           #b76277       default         ~D  # deleted messages
color index           #727897        default         ~O  # old messages
color index           #6d86ba      default         ~P  # from me
color index           #948161    default         ~T  # tagged messages
color index           #ac8068         default         ~F  # flagged messages
color index           #9c87b8    default         ~v  # collapsed thread
color index           #845377        default         ~k  # GPG
color index           #5e825c     default         ~N  # new messages
color index_author    #5e8088      default         .*  # all authors

# Special Email Elements
color body            #6d86ba      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5e8088      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #8a7b5e         default         "\\[[0-9]+\\]"
color body            #948161    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #a45a6d            default         ~D   # deleted
color index_flags     #5e8088      default         ~g   # signed
color index_flags     #6d86ba      default         ~G   # encrypted
color index_author    #5e825c     default         ~P   # from me
color index_author    #88604d    default         ~F   # flagged
color index_author    #88604d    default         ~l   # mailing lists
color index_flags     #557153          default         ~N   # new
color index_flags     #b76277       default         ~l   # lists
color index_date      #a45a6d            default              # date
color index_size      #6d86ba      default              # size
color index_number    #948161    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #88604d  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #5e8888           default
color sidebar_divider       #6d86ba    default
color sidebar_flagged       #6d86ba    default
color sidebar_new           #a45a6d          default
color sidebar_ordinary      #5e825c   default
color sidebar_spool_file    #8a7b5e       default
color sidebar_unread        #a45a6d          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold