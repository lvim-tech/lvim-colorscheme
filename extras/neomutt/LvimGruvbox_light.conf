# LvimGruvbox_light colors for Neomutt

# Basic Colors
color normal          #4e6767             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #4f6752      default         # thread arrows
color status          #4f6674      default         # status line
color error           #a04747       default         # error messages
color message         #626446     default         # info messages
color markers         #86573e    default         # + at line wrapping
color attachment      #8a5544   default         # attachment info
color search          #696048    default         # search matches
color tilde           #a59283        default         # ~ empty lines

# Message Headers
color hdrdefault      #6a615a        default         # default header
color header          #4b6575           default         '^From:'
color header          #64606d    default         '^Subject:'
color header          #4d6950           default         '^User-Agent:.*Mutt'
color header          #4f6752      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #616342          default         # quoted text
color quoted1         #4f6674      default         # nested quote
color quoted2         #635f6d         default         # nested quote 2
color quoted3         #4f6752      default         # nested quote 3
color quoted4         #696048    default         # nested quote 4
color quoted5         #895645        default         # nested quote 5
color signature       #6a615a        default         # signature
color bold            #875537         default         # bold text
color underline       #86573e    default         # underlined text

# Message Index
color index           #4d6950           default         ~Q  # replied messages
color index           #a04747       default         ~D  # deleted messages
color index           #6a615a        default         ~O  # old messages
color index           #4f6674      default         ~P  # from me
color index           #696048    default         ~T  # tagged messages
color index           #875537         default         ~F  # flagged messages
color index           #64606d    default         ~v  # collapsed thread
color index           #895645        default         ~k  # GPG
color index           #626446     default         ~N  # new messages
color index_author    #4f6752      default         .*  # all authors

# Special Email Elements
color body            #4f6674      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #4f6752      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #696149         default         "\\[[0-9]+\\]"
color body            #696048    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #9f4747            default         ~D   # deleted
color index_flags     #4f6752      default         ~g   # signed
color index_flags     #4f6674      default         ~G   # encrypted
color index_author    #626446     default         ~P   # from me
color index_author    #86573e    default         ~F   # flagged
color index_author    #86573e    default         ~l   # mailing lists
color index_flags     #616342          default         ~N   # new
color index_flags     #a04747       default         ~l   # lists
color index_date      #9f4747            default              # date
color index_size      #4f6674      default              # size
color index_number    #696048    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #8a593f  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #4e6767           default
color sidebar_divider       #4f6674    default
color sidebar_flagged       #4f6674    default
color sidebar_new           #9f4747          default
color sidebar_ordinary      #626446   default
color sidebar_spool_file    #696149       default
color sidebar_unread        #9f4747          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold