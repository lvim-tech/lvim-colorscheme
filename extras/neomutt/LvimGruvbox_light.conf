# LvimGruvbox_light colors for Neomutt

# Basic Colors
color normal          #5e8888             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #67976d      default         # thread arrows
color status          #6397b3      default         # status line
color error           #db5353       default         # error messages
color message         #8a8e52     default         # info messages
color markers         #9a6140    default         # + at line wrapping
color attachment      #a7614a   default         # attachment info
color search          #988857    default         # search matches
color tilde           #a59283        default         # ~ empty lines

# Message Headers
color hdrdefault      #a59283        default         # default header
color header          #5988a3           default         '^From:'
color header          #9f9aa9    default         '^Subject:'
color header          #5c8861           default         '^User-Agent:.*Mutt'
color header          #67976d      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #7a7d48          default         # quoted text
color quoted1         #6397b3      default         # nested quote
color quoted2         #918c9d         default         # nested quote 2
color quoted3         #67976d      default         # nested quote 3
color quoted4         #988857    default         # nested quote 4
color quoted5         #915a47        default         # nested quote 5
color signature       #a59283        default         # signature
color bold            #875537         default         # bold text
color underline       #9a6140    default         # underlined text

# Message Index
color index           #5c8861           default         ~Q  # replied messages
color index           #db5353       default         ~D  # deleted messages
color index           #a59283        default         ~O  # old messages
color index           #6397b3      default         ~P  # from me
color index           #988857    default         ~T  # tagged messages
color index           #875537         default         ~F  # flagged messages
color index           #9f9aa9    default         ~v  # collapsed thread
color index           #915a47        default         ~k  # GPG
color index           #8a8e52     default         ~N  # new messages
color index_author    #67976d      default         .*  # all authors

# Special Email Elements
color body            #6397b3      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #67976d      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #8f8156         default         "\\[[0-9]+\\]"
color body            #988857    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #c74e4e            default         ~D   # deleted
color index_flags     #67976d      default         ~g   # signed
color index_flags     #6397b3      default         ~G   # encrypted
color index_author    #8a8e52     default         ~P   # from me
color index_author    #9a6140    default         ~F   # flagged
color index_author    #9a6140    default         ~l   # mailing lists
color index_flags     #7a7d48          default         ~N   # new
color index_flags     #db5353       default         ~l   # lists
color index_date      #c74e4e            default              # date
color index_size      #6397b3      default              # size
color index_number    #988857    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #9a6140  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #5e8888           default
color sidebar_divider       #6397b3    default
color sidebar_flagged       #6397b3    default
color sidebar_new           #c74e4e          default
color sidebar_ordinary      #8a8e52   default
color sidebar_spool_file    #8f8156       default
color sidebar_unread        #c74e4e          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold