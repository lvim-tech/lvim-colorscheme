# LvimNord_light colors for Neomutt

# Basic Colors
color normal          #4e6767             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #486871      default         # thread arrows
color status          #536374      default         # status line
color error           #855458       default         # error messages
color message         #57654c     default         # info messages
color markers         #82584b    default         # + at line wrapping
color attachment      #6f5b6b   default         # attachment info
color search          #706146    default         # search matches
color tilde           #737d95        default         # ~ empty lines

# Message Headers
color hdrdefault      #5b6271        default         # default header
color header          #546272           default         '^From:'
color header          #67606f    default         '^Subject:'
color header          #53666d           default         '^User-Agent:.*Mutt'
color header          #486871      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #5b6454          default         # quoted text
color quoted1         #536374      default         # nested quote
color quoted2         #665f70         default         # nested quote 2
color quoted3         #486871      default         # nested quote 3
color quoted4         #706146    default         # nested quote 4
color quoted5         #6e5a6b        default         # nested quote 5
color signature       #5b6271        default         # signature
color bold            #7a564b         default         # bold text
color underline       #82584b    default         # underlined text

# Message Index
color index           #53666d           default         ~Q  # replied messages
color index           #855458       default         ~D  # deleted messages
color index           #5b6271        default         ~O  # old messages
color index           #536374      default         ~P  # from me
color index           #706146    default         ~T  # tagged messages
color index           #7a564b         default         ~F  # flagged messages
color index           #67606f    default         ~v  # collapsed thread
color index           #6e5a6b        default         ~k  # GPG
color index           #57654c     default         ~N  # new messages
color index_author    #486871      default         .*  # all authors

# Special Email Elements
color body            #536374      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #486871      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #6f6146         default         "\\[[0-9]+\\]"
color body            #706146    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #84575b            default         ~D   # deleted
color index_flags     #486871      default         ~g   # signed
color index_flags     #536374      default         ~G   # encrypted
color index_author    #57654c     default         ~P   # from me
color index_author    #82584b    default         ~F   # flagged
color index_author    #82584b    default         ~l   # mailing lists
color index_flags     #5b6454          default         ~N   # new
color index_flags     #855458       default         ~l   # lists
color index_date      #84575b            default              # date
color index_size      #536374      default              # size
color index_number    #706146    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #895c4e  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #4e6767           default
color sidebar_divider       #536374    default
color sidebar_flagged       #536374    default
color sidebar_new           #84575b          default
color sidebar_ordinary      #57654c   default
color sidebar_spool_file    #6f6146       default
color sidebar_unread        #84575b          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold