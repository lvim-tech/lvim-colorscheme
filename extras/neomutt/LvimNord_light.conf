# LvimNord_light colors for Neomutt

# Basic Colors
color normal          #5e8888             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #4b707a      default         # thread arrows
color status          #60788f      default         # status line
color error           #b2676e       default         # error messages
color message         #5d6d50     default         # info messages
color markers         #916050    default         # + at line wrapping
color attachment      #7f667a   default         # attachment info
color search          #967e50    default         # search matches
color tilde           #737d95        default         # ~ empty lines

# Message Headers
color hdrdefault      #737d95        default         # default header
color header          #596a7c           default         '^From:'
color header          #7f758a    default         '^Subject:'
color header          #6c919d           default         '^User-Agent:.*Mutt'
color header          #4b707a      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #7e8f70          default         # quoted text
color quoted1         #60788f      default         # nested quote
color quoted2         #71687d         default         # nested quote 2
color quoted3         #4b707a      default         # nested quote 3
color quoted4         #967e50    default         # nested quote 4
color quoted5         #6e5a6b        default         # nested quote 5
color signature       #737d95        default         # signature
color bold            #7a564b         default         # bold text
color underline       #916050    default         # underlined text

# Message Index
color index           #6c919d           default         ~Q  # replied messages
color index           #b2676e       default         ~D  # deleted messages
color index           #737d95        default         ~O  # old messages
color index           #60788f      default         ~P  # from me
color index           #967e50    default         ~T  # tagged messages
color index           #7a564b         default         ~F  # flagged messages
color index           #7f758a    default         ~v  # collapsed thread
color index           #6e5a6b        default         ~k  # GPG
color index           #5d6d50     default         ~N  # new messages
color index_author    #4b707a      default         .*  # all authors

# Special Email Elements
color body            #60788f      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #4b707a      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #8b774e         default         "\\[[0-9]+\\]"
color body            #967e50    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #976065            default         ~D   # deleted
color index_flags     #4b707a      default         ~g   # signed
color index_flags     #60788f      default         ~G   # encrypted
color index_author    #5d6d50     default         ~P   # from me
color index_author    #916050    default         ~F   # flagged
color index_author    #916050    default         ~l   # mailing lists
color index_flags     #7e8f70          default         ~N   # new
color index_flags     #b2676e       default         ~l   # lists
color index_date      #976065            default              # date
color index_size      #60788f      default              # size
color index_number    #967e50    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #916050  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #5e8888           default
color sidebar_divider       #60788f    default
color sidebar_flagged       #60788f    default
color sidebar_new           #976065          default
color sidebar_ordinary      #5d6d50   default
color sidebar_spool_file    #8b774e       default
color sidebar_unread        #976065          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold