# LvimKanagawa_darker colors for Neomutt

# Basic Colors
color normal          #80809f             default         # normal text
color indicator       default           #1c1d23      # selected item
color tree            #5e8d84      default         # thread arrows
color status          #5183d1      default         # status line
color error           #dc5757       default         # error messages
color message         #748b55     default         # info messages
color markers         #b7875b    default         # + at line wrapping
color attachment      #c06c65   default         # attachment info
color search          #cbae75    default         # search matches
color tilde           #4e4e73        default         # ~ empty lines

# Message Headers
color hdrdefault      #8181b2        default         # default header
color header          #5583cd           default         '^From:'
color header          #8a7ea6    default         '^Subject:'
color header          #5f8b83           default         '^User-Agent:.*Mutt'
color header          #5e8d84      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #748a58          default         # quoted text
color quoted1         #5183d1      default         # nested quote
color quoted2         #897ea6         default         # nested quote 2
color quoted3         #5e8d84      default         # nested quote 3
color quoted4         #cbae75    default         # nested quote 4
color quoted5         #c4726c        default         # nested quote 5
color signature       #8181b2        default         # signature
color bold            #bf8f62         default         # bold text
color underline       #b7875b    default         # underlined text

# Message Index
color index           #5f8b83           default         ~Q  # replied messages
color index           #dc5757       default         ~D  # deleted messages
color index           #8181b2        default         ~O  # old messages
color index           #5183d1      default         ~P  # from me
color index           #cbae75    default         ~T  # tagged messages
color index           #bf8f62         default         ~F  # flagged messages
color index           #8a7ea6    default         ~v  # collapsed thread
color index           #c4726c        default         ~k  # GPG
color index           #748b55     default         ~N  # new messages
color index_author    #5e8d84      default         .*  # all authors

# Special Email Elements
color body            #5183d1      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5e8d84      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #d1b57c         default         "\\[[0-9]+\\]"
color body            #cbae75    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #d35f5f            default         ~D   # deleted
color index_flags     #5e8d84      default         ~g   # signed
color index_flags     #5183d1      default         ~G   # encrypted
color index_author    #748b55     default         ~P   # from me
color index_author    #b7875b    default         ~F   # flagged
color index_author    #b7875b    default         ~l   # mailing lists
color index_flags     #748a58          default         ~N   # new
color index_flags     #dc5757       default         ~l   # lists
color index_date      #d35f5f            default              # date
color index_size      #5183d1      default              # size
color index_number    #cbae75    default              # number

color indicator             default         #1c1d23
color sidebar_indicator     #b7875b  #1c1d23
color sidebar_highlight     default         #1c1d23
color sidebar_background    #80809f           default
color sidebar_divider       #5183d1    default
color sidebar_flagged       #5183d1    default
color sidebar_new           #d35f5f          default
color sidebar_ordinary      #748b55   default
color sidebar_spool_file    #d1b57c       default
color sidebar_unread        #d35f5f          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold