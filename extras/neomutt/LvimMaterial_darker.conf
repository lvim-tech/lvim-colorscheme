# LvimMaterial_darker colors for Neomutt

# Basic Colors
color normal          #b2c7c7             default         # normal text
color indicator       default           #1c2529      # selected item
color tree            #5995b2      default         # thread arrows
color status          #5d85e2      default         # status line
color error           #df6066       default         # error messages
color message         #83a15c     default         # info messages
color markers         #d06e53    default         # + at line wrapping
color attachment      #e35a6d   default         # attachment info
color search          #c79e5e    default         # search matches
color tilde           #5e6a70        default         # ~ empty lines

# Message Headers
color hdrdefault      #788c96        default         # default header
color header          #6187d6           default         '^From:'
color header          #9c7db4    default         '^Subject:'
color header          #65a1bd           default         '^User-Agent:.*Mutt'
color header          #5995b2      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #90ad68          default         # quoted text
color quoted1         #5d85e2      default         # nested quote
color quoted2         #997ead         default         # nested quote 2
color quoted3         #5995b2      default         # nested quote 3
color quoted4         #c79e5e    default         # nested quote 4
color quoted5         #da6576        default         # nested quote 5
color signature       #788c96        default         # signature
color bold            #d37a60         default         # bold text
color underline       #d06e53    default         # underlined text

# Message Index
color index           #65a1bd           default         ~Q  # replied messages
color index           #df6066       default         ~D  # deleted messages
color index           #788c96        default         ~O  # old messages
color index           #5d85e2      default         ~P  # from me
color index           #c79e5e    default         ~T  # tagged messages
color index           #d37a60         default         ~F  # flagged messages
color index           #9c7db4    default         ~v  # collapsed thread
color index           #da6576        default         ~k  # GPG
color index           #83a15c     default         ~N  # new messages
color index_author    #5995b2      default         .*  # all authors

# Special Email Elements
color body            #5d85e2      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5995b2      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #cfa96a         default         "\\[[0-9]+\\]"
color body            #c79e5e    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #d5696e            default         ~D   # deleted
color index_flags     #5995b2      default         ~g   # signed
color index_flags     #5d85e2      default         ~G   # encrypted
color index_author    #83a15c     default         ~P   # from me
color index_author    #d06e53    default         ~F   # flagged
color index_author    #d06e53    default         ~l   # mailing lists
color index_flags     #90ad68          default         ~N   # new
color index_flags     #df6066       default         ~l   # lists
color index_date      #d5696e            default              # date
color index_size      #5d85e2      default              # size
color index_number    #c79e5e    default              # number

color indicator             default         #1c2529
color sidebar_indicator     #d57053  #1c2529
color sidebar_highlight     default         #1c2529
color sidebar_background    #b2c7c7           default
color sidebar_divider       #5d85e2    default
color sidebar_flagged       #5d85e2    default
color sidebar_new           #d5696e          default
color sidebar_ordinary      #83a15c   default
color sidebar_spool_file    #cfa96a       default
color sidebar_unread        #d5696e          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold