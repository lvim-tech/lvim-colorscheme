# LvimNord_darker colors for Neomutt

# Basic Colors
color normal          #b3bac6             default         # normal text
color indicator       default           #1d2128      # selected item
color tree            #5f8e9b      default         # thread arrows
color status          #6c8ba9      default         # status line
color error           #c16e77       default         # error messages
color message         #788c67     default         # info messages
color markers         #b77863    default         # + at line wrapping
color attachment      #9c7c95   default         # attachment info
color search          #b99c64    default         # search matches
color tilde           #677185        default         # ~ empty lines

# Message Headers
color hdrdefault      #7a88a4        default         # default header
color header          #73889e           default         '^From:'
color header          #8d8398    default         '^Subject:'
color header          #7097a3           default         '^User-Agent:.*Mutt'
color header          #5f8e9b      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #879978          default         # quoted text
color quoted1         #6c8ba9      default         # nested quote
color quoted2         #8b8296         default         # nested quote 2
color quoted3         #5f8e9b      default         # nested quote 3
color quoted4         #b99c64    default         # nested quote 4
color quoted5         #a2869d        default         # nested quote 5
color signature       #7a88a4        default         # signature
color bold            #b88473         default         # bold text
color underline       #b77863    default         # underlined text

# Message Index
color index           #7097a3           default         ~Q  # replied messages
color index           #c16e77       default         ~D  # deleted messages
color index           #7a88a4        default         ~O  # old messages
color index           #6c8ba9      default         ~P  # from me
color index           #b99c64    default         ~T  # tagged messages
color index           #b88473         default         ~F  # flagged messages
color index           #8d8398    default         ~v  # collapsed thread
color index           #a2869d        default         ~k  # GPG
color index           #788c67     default         ~N  # new messages
color index_author    #5f8e9b      default         .*  # all authors

# Special Email Elements
color body            #6c8ba9      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #5f8e9b      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #c3a870         default         "\\[[0-9]+\\]"
color body            #b99c64    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #b3767c            default         ~D   # deleted
color index_flags     #5f8e9b      default         ~g   # signed
color index_flags     #6c8ba9      default         ~G   # encrypted
color index_author    #788c67     default         ~P   # from me
color index_author    #b77863    default         ~F   # flagged
color index_author    #b77863    default         ~l   # mailing lists
color index_flags     #879978          default         ~N   # new
color index_flags     #c16e77       default         ~l   # lists
color index_date      #b3767c            default              # date
color index_size      #6c8ba9      default              # size
color index_number    #b99c64    default              # number

color indicator             default         #1d2128
color sidebar_indicator     #b77863  #1d2128
color sidebar_highlight     default         #1d2128
color sidebar_background    #b3bac6           default
color sidebar_divider       #6c8ba9    default
color sidebar_flagged       #6c8ba9    default
color sidebar_new           #b3767c          default
color sidebar_ordinary      #788c67   default
color sidebar_spool_file    #c3a870       default
color sidebar_unread        #b3767c          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold