# LvimGruvbox_dark colors for Neomutt

# Basic Colors
color normal          #958575             default         # normal text
color indicator       default           #222120      # selected item
color tree            #54945d      default         # thread arrows
color status          #3c8fb3      default         # status line
color error           #e95252       default         # error messages
color message         #868b37     default         # info messages
color markers         #be764c    default         # + at line wrapping
color attachment      #c77052   default         # attachment info
color search          #a5935f    default         # search matches
color tilde           #64584e        default         # ~ empty lines

# Message Headers
color hdrdefault      #9b836d        default         # default header
color header          #4c90b2           default         '^From:'
color header          #8d83a0    default         '^Subject:'
color header          #5b9463           default         '^User-Agent:.*Mutt'
color header          #54945d      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #878b46          default         # quoted text
color quoted1         #3c8fb3      default         # nested quote
color quoted2         #8c849d         default         # nested quote 2
color quoted3         #54945d      default         # nested quote 3
color quoted4         #a5935f    default         # nested quote 4
color quoted5         #bb755e        default         # nested quote 5
color signature       #9b836d        default         # signature
color bold            #c47d54         default         # bold text
color underline       #be764c    default         # underlined text

# Message Index
color index           #5b9463           default         ~Q  # replied messages
color index           #e95252       default         ~D  # deleted messages
color index           #9b836d        default         ~O  # old messages
color index           #3c8fb3      default         ~P  # from me
color index           #a5935f    default         ~T  # tagged messages
color index           #c47d54         default         ~F  # flagged messages
color index           #8d83a0    default         ~v  # collapsed thread
color index           #bb755e        default         ~k  # GPG
color index           #868b37     default         ~N  # new messages
color index_author    #54945d      default         .*  # all authors

# Special Email Elements
color body            #3c8fb3      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #54945d      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #af9e6b         default         "\\[[0-9]+\\]"
color body            #a5935f    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #de5e5e            default         ~D   # deleted
color index_flags     #54945d      default         ~g   # signed
color index_flags     #3c8fb3      default         ~G   # encrypted
color index_author    #868b37     default         ~P   # from me
color index_author    #be764c    default         ~F   # flagged
color index_author    #be764c    default         ~l   # mailing lists
color index_flags     #878b46          default         ~N   # new
color index_flags     #e95252       default         ~l   # lists
color index_date      #de5e5e            default              # date
color index_size      #3c8fb3      default              # size
color index_number    #a5935f    default              # number

color indicator             default         #222120
color sidebar_indicator     #be764c  #222120
color sidebar_highlight     default         #222120
color sidebar_background    #958575           default
color sidebar_divider       #3c8fb3    default
color sidebar_flagged       #3c8fb3    default
color sidebar_new           #de5e5e          default
color sidebar_ordinary      #868b37   default
color sidebar_spool_file    #af9e6b       default
color sidebar_unread        #de5e5e          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold