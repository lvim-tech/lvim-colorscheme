# LvimGruvbox_soft colors for Neomutt

# Basic Colors
color normal          #9b8a79             default         # normal text
color indicator       default           #282726      # selected item
color tree            #569a5e      default         # thread arrows
color status          #3995bb      default         # status line
color error           #ec5a5a       default         # error messages
color message         #8d9333     default         # info messages
color markers         #c67a4c    default         # + at line wrapping
color attachment      #d07352   default         # attachment info
color search          #a5935f    default         # search matches
color tilde           #64584e        default         # ~ empty lines

# Message Headers
color hdrdefault      #a18770        default         # default header
color header          #4b95ba           default         '^From:'
color header          #9289a5    default         '^Subject:'
color header          #5d9a65           default         '^User-Agent:.*Mutt'
color header          #569a5e      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #8c9045          default         # quoted text
color quoted1         #3995bb      default         # nested quote
color quoted2         #918aa2         default         # nested quote 2
color quoted3         #569a5e      default         # nested quote 3
color quoted4         #a5935f    default         # nested quote 4
color quoted5         #c37960        default         # nested quote 5
color signature       #a18770        default         # signature
color bold            #c47d54         default         # bold text
color underline       #c67a4c    default         # underlined text

# Message Index
color index           #5d9a65           default         ~Q  # replied messages
color index           #ec5a5a       default         ~D  # deleted messages
color index           #a18770        default         ~O  # old messages
color index           #3995bb      default         ~P  # from me
color index           #a5935f    default         ~T  # tagged messages
color index           #c47d54         default         ~F  # flagged messages
color index           #9289a5    default         ~v  # collapsed thread
color index           #c37960        default         ~k  # GPG
color index           #8d9333     default         ~N  # new messages
color index_author    #569a5e      default         .*  # all authors

# Special Email Elements
color body            #3995bb      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #569a5e      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #af9e6b         default         "\\[[0-9]+\\]"
color body            #a5935f    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #e16666            default         ~D   # deleted
color index_flags     #569a5e      default         ~g   # signed
color index_flags     #3995bb      default         ~G   # encrypted
color index_author    #8d9333     default         ~P   # from me
color index_author    #c67a4c    default         ~F   # flagged
color index_author    #c67a4c    default         ~l   # mailing lists
color index_flags     #8c9045          default         ~N   # new
color index_flags     #ec5a5a       default         ~l   # lists
color index_date      #e16666            default              # date
color index_size      #3995bb      default              # size
color index_number    #a5935f    default              # number

color indicator             default         #282726
color sidebar_indicator     #ca7c4c  #282726
color sidebar_highlight     default         #282726
color sidebar_background    #9b8a79           default
color sidebar_divider       #3995bb    default
color sidebar_flagged       #3995bb    default
color sidebar_new           #e16666          default
color sidebar_ordinary      #8d9333   default
color sidebar_spool_file    #af9e6b       default
color sidebar_unread        #e16666          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold