# LvimSolarized_soft colors for Neomutt

# Basic Colors
color normal          #9da4a4             default         # normal text
color indicator       default           #003441      # selected item
color tree            #3ca49d      default         # thread arrows
color status          #429bd5      default         # status line
color error           #ef6c6a       default         # error messages
color message         #8e9e17     default         # info messages
color markers         #e9733b    default         # + at line wrapping
color attachment      #e767a5   default         # attachment info
color search          #af913e    default         # search matches
color tilde           #5d6a6f        default         # ~ empty lines

# Message Headers
color hdrdefault      #809aa4        default         # default header
color header          #4f9dd2           default         '^From:'
color header          #9092b6    default         '^Subject:'
color header          #4aa39c           default         '^User-Agent:.*Mutt'
color header          #3ca49d      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #8f9d33          default         # quoted text
color quoted1         #429bd5      default         # nested quote
color quoted2         #9293b3         default         # nested quote 2
color quoted3         #3ca49d      default         # nested quote 3
color quoted4         #af913e    default         # nested quote 4
color quoted5         #e06fa5        default         # nested quote 5
color signature       #809aa4        default         # signature
color bold            #e27647         default         # bold text
color underline       #e9733b    default         # underlined text

# Message Index
color index           #4aa39c           default         ~Q  # replied messages
color index           #ef6c6a       default         ~D  # deleted messages
color index           #809aa4        default         ~O  # old messages
color index           #429bd5      default         ~P  # from me
color index           #af913e    default         ~T  # tagged messages
color index           #e27647         default         ~F  # flagged messages
color index           #9092b6    default         ~v  # collapsed thread
color index           #e06fa5        default         ~k  # GPG
color index           #8e9e17     default         ~N  # new messages
color index_author    #3ca49d      default         .*  # all authors

# Special Email Elements
color body            #429bd5      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #3ca49d      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #b09148         default         "\\[[0-9]+\\]"
color body            #af913e    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #e77371            default         ~D   # deleted
color index_flags     #3ca49d      default         ~g   # signed
color index_flags     #429bd5      default         ~G   # encrypted
color index_author    #8e9e17     default         ~P   # from me
color index_author    #e9733b    default         ~F   # flagged
color index_author    #e9733b    default         ~l   # mailing lists
color index_flags     #8f9d33          default         ~N   # new
color index_flags     #ef6c6a       default         ~l   # lists
color index_date      #e77371            default              # date
color index_size      #429bd5      default              # size
color index_number    #af913e    default              # number

color indicator             default         #003441
color sidebar_indicator     #ee743a  #003441
color sidebar_highlight     default         #003441
color sidebar_background    #9da4a4           default
color sidebar_divider       #429bd5    default
color sidebar_flagged       #429bd5    default
color sidebar_new           #e77371          default
color sidebar_ordinary      #8e9e17   default
color sidebar_spool_file    #b09148       default
color sidebar_unread        #e77371          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold