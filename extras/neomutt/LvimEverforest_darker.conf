# LvimEverforest_darker colors for Neomutt

# Basic Colors
color normal          #7d8b7a             default         # normal text
color indicator       default           #20262a      # selected item
color tree            #54945d      default         # thread arrows
color status          #2891b8      default         # status line
color error           #f24848       default         # error messages
color message         #888d12     default         # info messages
color markers         #c5733a    default         # + at line wrapping
color attachment      #c96f4e   default         # attachment info
color search          #a6935a    default         # search matches
color tilde           #535d4e        default         # ~ empty lines

# Message Headers
color hdrdefault      #788d6d        default         # default header
color header          #3d91b6           default         '^From:'
color header          #8d83a0    default         '^Subject:'
color header          #5b9463           default         '^User-Agent:.*Mutt'
color header          #54945d      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #878b35          default         # quoted text
color quoted1         #2891b8      default         # nested quote
color quoted2         #8c849d         default         # nested quote 2
color quoted3         #54945d      default         # nested quote 3
color quoted4         #a6935a    default         # nested quote 4
color quoted5         #bb755e        default         # nested quote 5
color signature       #788d6d        default         # signature
color bold            #cc7942         default         # bold text
color underline       #c5733a    default         # underlined text

# Message Index
color index           #5b9463           default         ~Q  # replied messages
color index           #f24848       default         ~D  # deleted messages
color index           #788d6d        default         ~O  # old messages
color index           #2891b8      default         ~P  # from me
color index           #a6935a    default         ~T  # tagged messages
color index           #cc7942         default         ~F  # flagged messages
color index           #8d83a0    default         ~v  # collapsed thread
color index           #bb755e        default         ~k  # GPG
color index           #888d12     default         ~N  # new messages
color index_author    #54945d      default         .*  # all authors

# Special Email Elements
color body            #2891b8      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #54945d      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #af9e6b         default         "\\[[0-9]+\\]"
color body            #a6935a    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #de5e5e            default         ~D   # deleted
color index_flags     #54945d      default         ~g   # signed
color index_flags     #2891b8      default         ~G   # encrypted
color index_author    #888d12     default         ~P   # from me
color index_author    #c5733a    default         ~F   # flagged
color index_author    #c5733a    default         ~l   # mailing lists
color index_flags     #878b35          default         ~N   # new
color index_flags     #f24848       default         ~l   # lists
color index_date      #de5e5e            default              # date
color index_size      #2891b8      default              # size
color index_number    #a6935a    default              # number

color indicator             default         #20262a
color sidebar_indicator     #ce7637  #20262a
color sidebar_highlight     default         #20262a
color sidebar_background    #7d8b7a           default
color sidebar_divider       #2891b8    default
color sidebar_flagged       #2891b8    default
color sidebar_new           #de5e5e          default
color sidebar_ordinary      #888d12   default
color sidebar_spool_file    #af9e6b       default
color sidebar_unread        #de5e5e          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold