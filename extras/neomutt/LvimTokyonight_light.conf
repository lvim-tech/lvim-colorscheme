# LvimTokyonight_light colors for Neomutt

# Basic Colors
color normal          #5e8888             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #63809a      default         # thread arrows
color status          #7487bd      default         # status line
color error           #bd606f       default         # error messages
color message         #6c7e5b     default         # info messages
color markers         #8b604e    default         # + at line wrapping
color attachment      #816ab0   default         # attachment info
color search          #9d8465    default         # search matches
color tilde           #8085a2        default         # ~ empty lines

# Message Headers
color hdrdefault      #8085a2        default         # default header
color header          #6579ac           default         '^From:'
color header          #988cb0    default         '^Subject:'
color header          #587387           default         '^User-Agent:.*Mutt'
color header          #63809a      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #606f52          default         # quoted text
color quoted1         #7487bd      default         # nested quote
color quoted2         #8b7ea3         default         # nested quote 2
color quoted3         #63809a      default         # nested quote 3
color quoted4         #9d8465    default         # nested quote 4
color quoted5         #765ba6        default         # nested quote 5
color signature       #8085a2        default         # signature
color bold            #b17f67         default         # bold text
color underline       #8b604e    default         # underlined text

# Message Index
color index           #587387           default         ~Q  # replied messages
color index           #bd606f       default         ~D  # deleted messages
color index           #8085a2        default         ~O  # old messages
color index           #7487bd      default         ~P  # from me
color index           #9d8465    default         ~T  # tagged messages
color index           #b17f67         default         ~F  # flagged messages
color index           #988cb0    default         ~v  # collapsed thread
color index           #765ba6        default         ~k  # GPG
color index           #6c7e5b     default         ~N  # new messages
color index_author    #63809a      default         .*  # all authors

# Special Email Elements
color body            #7487bd      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #63809a      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #927d61         default         "\\[[0-9]+\\]"
color body            #9d8465    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #ab5867            default         ~D   # deleted
color index_flags     #63809a      default         ~g   # signed
color index_flags     #7487bd      default         ~G   # encrypted
color index_author    #6c7e5b     default         ~P   # from me
color index_author    #8b604e    default         ~F   # flagged
color index_author    #8b604e    default         ~l   # mailing lists
color index_flags     #606f52          default         ~N   # new
color index_flags     #bd606f       default         ~l   # lists
color index_date      #ab5867            default              # date
color index_size      #7487bd      default              # size
color index_number    #9d8465    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #8b604e  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #5e8888           default
color sidebar_divider       #7487bd    default
color sidebar_flagged       #7487bd    default
color sidebar_new           #ab5867          default
color sidebar_ordinary      #6c7e5b   default
color sidebar_spool_file    #927d61       default
color sidebar_unread        #ab5867          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold