# LvimTokyonight_light colors for Neomutt

# Basic Colors
color normal          #4e6767             default         # normal text
color indicator       default           #e5e5e5      # selected item
color tree            #526374      default         # thread arrows
color status          #576283      default         # status line
color error           #8c5059       default         # error messages
color message         #5a664e     default         # info messages
color markers         #805a4a    default         # + at line wrapping
color attachment      #6c5796   default         # attachment info
color search          #6e6050    default         # search matches
color tilde           #8085a2        default         # ~ empty lines

# Message Headers
color hdrdefault      #5e6278        default         # default header
color header          #546182           default         '^From:'
color header          #675d7b    default         '^Subject:'
color header          #4f6373           default         '^User-Agent:.*Mutt'
color header          #526374      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #5a674e          default         # quoted text
color quoted1         #576283      default         # nested quote
color quoted2         #675c7a         default         # nested quote 2
color quoted3         #526374      default         # nested quote 3
color quoted4         #6e6050    default         # nested quote 4
color quoted5         #6d5599        default         # nested quote 5
color signature       #5e6278        default         # signature
color bold            #785c50         default         # bold text
color underline       #805a4a    default         # underlined text

# Message Index
color index           #4f6373           default         ~Q  # replied messages
color index           #8c5059       default         ~D  # deleted messages
color index           #5e6278        default         ~O  # old messages
color index           #576283      default         ~P  # from me
color index           #6e6050    default         ~T  # tagged messages
color index           #785c50         default         ~F  # flagged messages
color index           #675d7b    default         ~v  # collapsed thread
color index           #6d5599        default         ~k  # GPG
color index           #5a664e     default         ~N  # new messages
color index_author    #526374      default         .*  # all authors

# Special Email Elements
color body            #576283      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #526374      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #6e6050         default         "\\[[0-9]+\\]"
color body            #6e6050    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #904f5b            default         ~D   # deleted
color index_flags     #526374      default         ~g   # signed
color index_flags     #576283      default         ~G   # encrypted
color index_author    #5a664e     default         ~P   # from me
color index_author    #805a4a    default         ~F   # flagged
color index_author    #805a4a    default         ~l   # mailing lists
color index_flags     #5a674e          default         ~N   # new
color index_flags     #8c5059       default         ~l   # lists
color index_date      #904f5b            default              # date
color index_size      #576283      default              # size
color index_number    #6e6050    default              # number

color indicator             default         #e5e5e5
color sidebar_indicator     #845c4c  #e5e5e5
color sidebar_highlight     default         #e5e5e5
color sidebar_background    #4e6767           default
color sidebar_divider       #576283    default
color sidebar_flagged       #576283    default
color sidebar_new           #904f5b          default
color sidebar_ordinary      #5a664e   default
color sidebar_spool_file    #6e6050       default
color sidebar_unread        #904f5b          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold