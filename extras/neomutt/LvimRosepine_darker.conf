# LvimRosepine_darker colors for Neomutt

# Basic Colors
color normal          #b3afb2             default         # normal text
color indicator       default           #171519      # selected item
color tree            #708282      default         # thread arrows
color status          #68838d      default         # status line
color error           #a96e7b       default         # error messages
color message         #6f8573     default         # info messages
color markers         #9d7978    default         # + at line wrapping
color attachment      #86789a   default         # attachment info
color search          #ac9682    default         # search matches
color tilde           #896882        default         # ~ empty lines

# Message Headers
color hdrdefault      #9a7292        default         # default header
color header          #6c828c           default         '^From:'
color header          #817d8d    default         '^Subject:'
color header          #788787           default         '^User-Agent:.*Mutt'
color header          #708282      default         '^User-Agent: Mozilla/5.0.*Linux'

# Message Body
color quoted          #788b7c          default         # quoted text
color quoted1         #68838d      default         # nested quote
color quoted2         #7f7c89         default         # nested quote 2
color quoted3         #708282      default         # nested quote 3
color quoted4         #ac9682    default         # nested quote 4
color quoted5         #9084a2        default         # nested quote 5
color signature       #9a7292        default         # signature
color bold            #a98a89         default         # bold text
color underline       #9d7978    default         # underlined text

# Message Index
color index           #788787           default         ~Q  # replied messages
color index           #a96e7b       default         ~D  # deleted messages
color index           #9a7292        default         ~O  # old messages
color index           #68838d      default         ~P  # from me
color index           #ac9682    default         ~T  # tagged messages
color index           #a98a89         default         ~F  # flagged messages
color index           #817d8d    default         ~v  # collapsed thread
color index           #9084a2        default         ~k  # GPG
color index           #6f8573     default         ~N  # new messages
color index_author    #708282      default         .*  # all authors

# Special Email Elements
color body            #68838d      default         "[-a-z_0-9.+]+@[-a-z_0-9.]+"
color body            #708282      default         "((ftp|http|https)://|news:)[^ >)\"\t]+"
color body            #b6a18b         default         "\\[[0-9]+\\]"
color body            #ac9682    default         "\\[\\.\\.\\.?\\]"

# Index Flags and Metadata
color index_flags     #a0727c            default         ~D   # deleted
color index_flags     #708282      default         ~g   # signed
color index_flags     #68838d      default         ~G   # encrypted
color index_author    #6f8573     default         ~P   # from me
color index_author    #9d7978    default         ~F   # flagged
color index_author    #9d7978    default         ~l   # mailing lists
color index_flags     #788b7c          default         ~N   # new
color index_flags     #a96e7b       default         ~l   # lists
color index_date      #a0727c            default              # date
color index_size      #68838d      default              # size
color index_number    #ac9682    default              # number

color indicator             default         #171519
color sidebar_indicator     #9d7978  #171519
color sidebar_highlight     default         #171519
color sidebar_background    #b3afb2           default
color sidebar_divider       #68838d    default
color sidebar_flagged       #68838d    default
color sidebar_new           #a0727c          default
color sidebar_ordinary      #6f8573   default
color sidebar_spool_file    #b6a18b       default
color sidebar_unread        #a0727c          default


# Mono Settings
mono bold             bold
mono underline        underline
mono indicator        reverse
mono error            bold