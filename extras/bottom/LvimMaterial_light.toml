# Lvim Colorscheme MaterialLight

[styles.cpu]
all_entry_color = "#5e8888"
avg_entry_color = "#b04556"
cpu_core_colors = ["#4d6cae", "#6f864f", "#8e7347", "#c9745b", "#806594", "#498776", "#578ca5", "#b14b51"]

[styles.memory]
ram_color = "#6f864f"
cache_color = "#578ca5"
swap_color = "#c9745b"
arc_color = "#498776"

[styles.network]
rx_color = "#6f864f"
tx_color = "#b04556"
rx_total_color = "#748f51"
tx_total_color = "#c7495c"

[styles.battery]
high_battery_color = "#6f864f"
medium_battery_color = "#8e7347"
low_battery_color = "#b14b51"

[styles.tables]
headers = { color = "#4d6cae", bold = true }

[styles.graphs]
graph_color = "#798991"
legend_text = "#7a8990"

[styles.widgets]
border_color = "#eeeeee"
selected_border_color = "#4d6cae"
widget_title = { color = "#55a6ab", bold = true }
text = "#5e8888"
selected_text = { color = "#dadada", bg_color = "#4d6cae" }
disabled_text = "#798991"
