[styles.memory]
ram_color = "#7b7e3d"
cache_color = "#5c8861"
swap_color = "#8d522b"
arc_color = "#3d8b7c"

[styles.network]
rx_color = "#7b7e3d"
tx_color = "#915a47"
rx_total_color = "#8a8e46"
tx_total_color = "#a96047"

[styles.battery]
high_battery_color = "#7b7e3d"
