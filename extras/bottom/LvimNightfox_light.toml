cpu_core_colors = ["#4a607e", "#6b8578", "#86774d", "#a9754b", "#725b95", "#4e7f80", "#4e7f80", "#a65c6e"]

[styles.memory]
ram_color = "#6b8578"
cache_color = "#4e7f80"
