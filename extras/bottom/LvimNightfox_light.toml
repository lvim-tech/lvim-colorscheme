cpu_core_colors = ["#546d8e", "#749182", "#897a50", "#ac7a53", "#8069a2", "#599181", "#5b8e8f", "#a75d70"]

[styles.memory]
ram_color = "#749182"
cache_color = "#5b8e8f"
swap_color = "#ac7a53"
arc_color = "#599181"

[styles.network]
rx_color = "#749182"
tx_color = "#755a88"
rx_total_color = "#557063"
tx_total_color = "#84679c"

[styles.battery]
high_battery_color = "#749182"
medium_battery_color = "#897a50"
