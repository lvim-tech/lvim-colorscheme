# Lvim Colorscheme LvimLight

[styles.cpu]
all_entry_color = "#5e8888"
avg_entry_color = "#af5543"
cpu_core_colors = ["#457da3", "#55673c", "#856e42", "#aa703f", "#4d86b6", "#458677", "#3e7a89", "#ae4b41"]

[styles.memory]
ram_color = "#55673c"
cache_color = "#3e7a89"
swap_color = "#aa703f"
arc_color = "#458677"

[styles.network]
rx_color = "#55673c"
tx_color = "#af5543"
rx_total_color = "#637646"
tx_total_color = "#c15d4a"

[styles.battery]
high_battery_color = "#55673c"
medium_battery_color = "#856e42"
low_battery_color = "#ae4b41"

[styles.tables]
headers = { color = "#457da3", bold = true }

[styles.graphs]
graph_color = "#789698"
legend_text = "#93b6b6"

[styles.widgets]
border_color = "#eeeeee"
selected_border_color = "#457da3"
widget_title = { color = "#55a6ab", bold = true }
text = "#5e8888"
selected_text = { color = "#dadada", bg_color = "#457da3" }
disabled_text = "#789698"
