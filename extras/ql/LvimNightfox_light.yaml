---
# LvimNightfox_light
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimNightfox_light"

name: LvimNightfox_light

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#546d8e"
    # Section headings and step markers.
    accent_alt: "#a17351"
    # Default foreground.
    text: "#425353"
    # Descriptions, hints.
    muted: "#646f7d"
    # Unfocused borders.
    subtle: "#b1b1b1"
    # Completed operations.
    success: "#6b8377"
    # Non-fatal problems.
    warning: "#a75d70"
    # Failures.
    error: "#a75d70"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
