---
# LvimTokyonight_darker
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimTokyonight_darker"

name: LvimTokyonight_darker

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#6073a4"
    # Section headings and step markers.
    accent_alt: "#bb866d"
    # Default foreground.
    text: "#b2b6c7"
    # Descriptions, hints.
    muted: "#6a7190"
    # Unfocused borders.
    subtle: "#303d56"
    # Completed operations.
    success: "#788a67"
    # Non-fatal problems.
    warning: "#bb6171"
    # Failures.
    error: "#bb6171"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
