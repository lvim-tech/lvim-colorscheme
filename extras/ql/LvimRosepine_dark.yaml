---
# LvimRosepine_dark
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimRosepine_dark"

name: LvimRosepine_dark

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#5d6d74"
    # Section headings and step markers.
    accent_alt: "#a98a89"
    # Default foreground.
    text: "#b3afb2"
    # Descriptions, hints.
    muted: "#896882"
    # Unfocused borders.
    subtle: "#423b49"
    # Completed operations.
    success: "#788b7c"
    # Non-fatal problems.
    warning: "#a0727c"
    # Failures.
    error: "#a0727c"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#010101"
