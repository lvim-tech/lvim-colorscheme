---
# LvimBase_light
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimBase_light"

name: LvimBase_light

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#457da3"
    # Section headings and step markers.
    accent_alt: "#aa703f"
    # Default foreground.
    text: "#425353"
    # Descriptions, hints.
    muted: "#6c8384"
    # Unfocused borders.
    subtle: "#b1b1b1"
    # Completed operations.
    success: "#55673c"
    # Non-fatal problems.
    warning: "#ae4b41"
    # Failures.
    error: "#ae4b41"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
