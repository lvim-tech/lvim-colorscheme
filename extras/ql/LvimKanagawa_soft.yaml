---
# LvimKanagawa_soft
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimKanagawa_soft"

name: LvimKanagawa_soft

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#506fa5"
    # Section headings and step markers.
    accent_alt: "#bf8f62"
    # Default foreground.
    text: "#a0a0bc"
    # Descriptions, hints.
    muted: "#717193"
    # Unfocused borders.
    subtle: "#434554"
    # Completed operations.
    success: "#6c7f54"
    # Non-fatal problems.
    warning: "#ba5454"
    # Failures.
    error: "#ba5454"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#030303"
