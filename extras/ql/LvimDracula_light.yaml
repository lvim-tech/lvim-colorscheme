---
# LvimDracula_light
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimDracula_light"

name: LvimDracula_light

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#517079"
    # Section headings and step markers.
    accent_alt: "#957860"
    # Default foreground.
    text: "#425252"
    # Descriptions, hints.
    muted: "#6b728f"
    # Unfocused borders.
    subtle: "#b1b1b1"
    # Completed operations.
    success: "#466d4e"
    # Non-fatal problems.
    warning: "#af5959"
    # Failures.
    error: "#af5959"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
