---
# LvimNord_light
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimNord_light"

name: LvimNord_light

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#596a7c"
    # Section headings and step markers.
    accent_alt: "#7a564b"
    # Default foreground.
    text: "#425353"
    # Descriptions, hints.
    muted: "#6b7689"
    # Unfocused borders.
    subtle: "#b1b1b1"
    # Completed operations.
    success: "#738168"
    # Non-fatal problems.
    warning: "#976065"
    # Failures.
    error: "#976065"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
