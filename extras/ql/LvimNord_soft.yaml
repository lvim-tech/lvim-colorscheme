---
# LvimNord_soft
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimNord_soft"

name: LvimNord_soft

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#73889e"
    # Section headings and step markers.
    accent_alt: "#b88473"
    # Default foreground.
    text: "#b3bac6"
    # Descriptions, hints.
    muted: "#6e798e"
    # Unfocused borders.
    subtle: "#404c65"
    # Completed operations.
    success: "#879978"
    # Non-fatal problems.
    warning: "#ac6e74"
    # Failures.
    error: "#ac6e74"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#282d38"
