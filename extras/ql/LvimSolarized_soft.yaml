---
# LvimSolarized_soft
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimSolarized_soft"

name: LvimSolarized_soft

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#4f7ea3"
    # Section headings and step markers.
    accent_alt: "#b46548"
    # Default foreground.
    text: "#a7afaf"
    # Descriptions, hints.
    muted: "#697a80"
    # Unfocused borders.
    subtle: "#005669"
    # Completed operations.
    success: "#727c3e"
    # Non-fatal problems.
    warning: "#c7504e"
    # Failures.
    error: "#c7504e"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
