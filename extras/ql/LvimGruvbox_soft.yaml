---
# LvimGruvbox_soft
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimGruvbox_soft"

name: LvimGruvbox_soft

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#4a748c"
    # Section headings and step markers.
    accent_alt: "#c47d54"
    # Default foreground.
    text: "#b49f88"
    # Descriptions, hints.
    muted: "#7f6d5e"
    # Unfocused borders.
    subtle: "#484543"
    # Completed operations.
    success: "#757845"
    # Non-fatal problems.
    warning: "#ca4f4f"
    # Failures.
    error: "#ca4f4f"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
