---
# LvimSolarized_darker
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimSolarized_darker"

name: LvimSolarized_darker

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#4f7ea3"
    # Section headings and step markers.
    accent_alt: "#b46548"
    # Default foreground.
    text: "#9da4a4"
    # Descriptions, hints.
    muted: "#5d6a6f"
    # Unfocused borders.
    subtle: "#004452"
    # Completed operations.
    success: "#727c3e"
    # Non-fatal problems.
    warning: "#c24f4d"
    # Failures.
    error: "#c24f4d"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
