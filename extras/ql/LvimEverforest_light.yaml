---
# LvimEverforest_light
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimEverforest_light"

name: LvimEverforest_light

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#4f839e"
    # Section headings and step markers.
    accent_alt: "#8d522b"
    # Default foreground.
    text: "#425353"
    # Descriptions, hints.
    muted: "#6b7865"
    # Unfocused borders.
    subtle: "#b1b1b1"
    # Completed operations.
    success: "#7b7e3d"
    # Non-fatal problems.
    warning: "#c74d4d"
    # Failures.
    error: "#c74d4d"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
