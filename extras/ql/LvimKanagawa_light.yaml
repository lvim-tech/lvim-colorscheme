---
# LvimKanagawa_light
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimKanagawa_light"

name: LvimKanagawa_light

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#607db4"
    # Section headings and step markers.
    accent_alt: "#9d7754"
    # Default foreground.
    text: "#425252"
    # Descriptions, hints.
    muted: "#777798"
    # Unfocused borders.
    subtle: "#b1b1b1"
    # Completed operations.
    success: "#697b51"
    # Non-fatal problems.
    warning: "#c35959"
    # Failures.
    error: "#c35959"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
