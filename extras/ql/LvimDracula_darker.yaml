---
# LvimDracula_darker
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimDracula_darker"

name: LvimDracula_darker

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#638993"
    # Section headings and step markers.
    accent_alt: "#b58f70"
    # Default foreground.
    text: "#c7c7b3"
    # Descriptions, hints.
    muted: "#727a98"
    # Unfocused borders.
    subtle: "#383f56"
    # Completed operations.
    success: "#62966d"
    # Non-fatal problems.
    warning: "#bc6060"
    # Failures.
    error: "#bc6060"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#1d1f27"
