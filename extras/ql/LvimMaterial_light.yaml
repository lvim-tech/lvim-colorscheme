---
# LvimMaterial_light
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimMaterial_light"

name: LvimMaterial_light

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#4d6cae"
    # Section headings and step markers.
    accent_alt: "#b36b57"
    # Default foreground.
    text: "#425252"
    # Descriptions, hints.
    muted: "#64747c"
    # Unfocused borders.
    subtle: "#b1b1b1"
    # Completed operations.
    success: "#6f864f"
    # Non-fatal problems.
    warning: "#b14b51"
    # Failures.
    error: "#b14b51"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
