---
# LvimGruvbox_light
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimGruvbox_light"

name: LvimGruvbox_light

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#57829c"
    # Section headings and step markers.
    accent_alt: "#875537"
    # Default foreground.
    text: "#425252"
    # Descriptions, hints.
    muted: "#877666"
    # Unfocused borders.
    subtle: "#b1b1b1"
    # Completed operations.
    success: "#7a7d48"
    # Non-fatal problems.
    warning: "#c74e4e"
    # Failures.
    error: "#c74e4e"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
