---
# LvimEverforest_darker
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimEverforest_darker"

name: LvimEverforest_darker

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#42728b"
    # Section headings and step markers.
    accent_alt: "#cc7942"
    # Default foreground.
    text: "#92a38c"
    # Descriptions, hints.
    muted: "#717e6a"
    # Unfocused borders.
    subtle: "#35444f"
    # Completed operations.
    success: "#75783a"
    # Non-fatal problems.
    warning: "#cb4f4f"
    # Failures.
    error: "#cb4f4f"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#010101"
