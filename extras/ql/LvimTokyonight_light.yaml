---
# LvimTokyonight_light
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimTokyonight_light"

name: LvimTokyonight_light

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#6579ac"
    # Section headings and step markers.
    accent_alt: "#9e7460"
    # Default foreground.
    text: "#425353"
    # Descriptions, hints.
    muted: "#717897"
    # Unfocused borders.
    subtle: "#b1b1b1"
    # Completed operations.
    success: "#606f52"
    # Non-fatal problems.
    warning: "#ab5867"
    # Failures.
    error: "#ab5867"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
