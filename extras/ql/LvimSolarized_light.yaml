---
# LvimSolarized_light
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimSolarized_light"

name: LvimSolarized_light

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#4c799d"
    # Section headings and step markers.
    accent_alt: "#ab6044"
    # Default foreground.
    text: "#425252"
    # Descriptions, hints.
    muted: "#657479"
    # Unfocused borders.
    subtle: "#b1b1b1"
    # Completed operations.
    success: "#727c3e"
    # Non-fatal problems.
    warning: "#ca5350"
    # Failures.
    error: "#ca5350"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
