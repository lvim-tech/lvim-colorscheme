---
# LvimBase_darker
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimBase_darker"

name: LvimBase_darker

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#447ca2"
    # Section headings and step markers.
    accent_alt: "#e19556"
    # Default foreground.
    text: "#68a8a8"
    # Descriptions, hints.
    muted: "#546f70"
    # Unfocused borders.
    subtle: "#31444d"
    # Completed operations.
    success: "#7e965a"
    # Non-fatal problems.
    warning: "#d75e52"
    # Failures.
    error: "#d75e52"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
