---
# LvimNightfox_soft
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimNightfox_soft"

name: LvimNightfox_soft

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#6885ad"
    # Section headings and step markers.
    accent_alt: "#c88e62"
    # Default foreground.
    text: "#bcbdbd"
    # Descriptions, hints.
    muted: "#758292"
    # Unfocused borders.
    subtle: "#26486c"
    # Completed operations.
    success: "#7b998a"
    # Non-fatal problems.
    warning: "#b26377"
    # Failures.
    error: "#b26377"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#171b23"
