---
# LvimRosepine_light
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimRosepine_light"

name: LvimRosepine_light

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#6f8289"
    # Section headings and step markers.
    accent_alt: "#987675"
    # Default foreground.
    text: "#425353"
    # Descriptions, hints.
    muted: "#926f8a"
    # Unfocused borders.
    subtle: "#b1b1b1"
    # Completed operations.
    success: "#5d6c60"
    # Non-fatal problems.
    warning: "#8e656e"
    # Failures.
    error: "#8e656e"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
