---
# LvimMaterial_soft
# Generated by lvim-colorscheme for ql — https://github.com/lvim-tech/ql
#
# Install:
#   mkdir -p ~/.config/ql/themes
#   cp extras/ql/*.yaml ~/.config/ql/themes/
#
# Use, in ~/.config/ql/config.toml: [theme] name = "LvimMaterial_soft"

name: LvimMaterial_soft

colors:
    # Selection cursor, focused list border and the title badge background.
    accent: "#5b7fcb"
    # Section headings and step markers.
    accent_alt: "#d37a60"
    # Default foreground.
    text: "#b2c7c7"
    # Descriptions, hints.
    muted: "#6e7f87"
    # Unfocused borders.
    subtle: "#37525e"
    # Completed operations.
    success: "#90ad68"
    # Non-fatal problems.
    warning: "#d05e64"
    # Failures.
    error: "#d05e64"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#141718"
