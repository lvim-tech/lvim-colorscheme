---
# LvimNord_dark
# Generated by lvim-colorscheme for mailforge — https://github.com/lvim-tech/mailforge
#
# Install:
#   mkdir -p ~/.config/mailforge/themes
#   cp extras/mailforge/*.yaml ~/.config/mailforge/themes/
#
# Use, in mailforge's config: theme: LvimNord_dark
#
# fg and dim already clear their contrast floor against BOTH bg and bg_alt
# (4.5 and 3.2), so mailforge's own load-time lift has nothing left to do here;
# a missing role still falls back to the built-in Everforest.

name: LvimNord_dark

colors:
    # Base background and the one-step-off surface (selected rows).
    bg: "#232831"
    bg_alt: "#2c313a"
    # Default foreground and the dimmed secondary text.
    fg: "#b3bac6"
    dim: "#79808c"
    # Semantic hues: red open-now, yellow caution, green verified, blue key,
    # purple prior/context, orange note.
    red: "#ac6e74"
    yellow: "#c3a870"
    green: "#879978"
    blue: "#73889e"
    purple: "#887f93"
    orange: "#b88473"
