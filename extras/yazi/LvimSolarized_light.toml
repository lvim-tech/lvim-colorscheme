#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme SolarizedLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#7b888e", italic = true }

# Find
find_keyword  = { fg = "#dadada", bg = "#c3643d", bold = true }
find_position = { fg = "#407fac", bg = "#d4dade", bold = true }

# Symlink
symlink_target = { fg = "#798890", italic = true }

# Marker
marker_copied   = { fg = "#967a20", bg = "#967a20" }
marker_cut      = { fg = "#cc5452", bg = "#cc5452" }
marker_marked   = { fg = "#bd5588", bg = "#bd5588" }
marker_selected = { fg = "#39739c", bg = "#39739c" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#5e8888", bg = "#7a881e" }
count_cut      = { fg = "#5e8888", bg = "#dc5d5b" }
count_selected = { fg = "#5e8888", bg = "#3a8580" }

# Border
border_symbol = "│"
border_style  = { fg = "#8f9a46" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#e9e9e9" }
current = { bg = "#e9e9e9" }
preview = { bg = "#e9e9e9" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#5e8888", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#b6b6b6", bg = "#39739c", bold = true }
normal_alt  = { fg = "#39739c", bg = "#3c7478" }

select_main = { fg = "#b6b6b6", bg = "#bd5588", bold = true }
select_alt  = { fg = "#bd5588", bg = "#3c7478" }

unset_main  = { fg = "#b6b6b6", bg = "#626587", bold = true }
unset_alt   = { fg = "#626587", bg = "#3c7478" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#7b888e", bold = true }
progress_normal = { fg = "#707c19", bg = "#dadada" }
progress_error  = { fg = "#dadada", bg = "#cc5452" }

# Permissions
perm_type  = { fg = "#39739c" }
perm_read  = { fg = "#896f1c" }
perm_write = { fg = "#cc5452" }
perm_exec  = { fg = "#707c19" }
perm_sep   = { fg = "#798890" }

[pick]
border   = { fg = "#8f9a46" }
active   = { fg = "#5e8888",  bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

[input]
border   = { fg = "#407fac" }
title    = { fg = "#407fac" }
value    = { fg = "#626587" }
selected = { bg = "#e9e9e9" }

[cmp]
border   = { fg = "#407fac" }
active   = { fg = "#5e8888", bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#8f9a46" }
title   = { fg = "#8f9a46" }
hovered = { fg = "#5e8888", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#347873" }
rest            = { fg = "#39739c" }
desc            = { fg = "#bd5588" }
separator       = " ➜ "
separator_style = { fg = "#798890" }

[confirm]
border  = { fg = "#407fac" }
title   = { fg = "#8f9a46" }
body    = {}
list    = {}
btn_yes = { bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#8f9a46" }
title    = { fg = "#8f9a46" }
tbl_col  = { fg = "#39739c" }
tbl_cell = { fg = "#896f1c", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#407fac" }
title_warn  = { fg = "#d26d43" }
title_error = { fg = "#dc5d5b" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#707c19" }
run     = { fg = "#bd5588" }
desc    = { fg = "#3c7478" }
hovered = { bg = "#e9e9e9", bold = true }
footer  = { fg = "#5e8888", bg = "#E4E4E4" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#896f1c" },

	# Media
	{ mime = "{audio,video}/*", fg = "#bd5588" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#cc5452" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#347873" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#798890" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#cc5452" },
	{ url = "*", is = "exec"  , fg = "#707c19" },
	{ url = "*", is = "dummy", bg = "#cc5452" },
	{ url = "*/", is = "dummy", bg = "#cc5452" },

	# Fallback
	{ url = "*/", fg = "#39739c" }
]
    