#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme SolarizedLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#ab6044", bold = true }
find_position = { fg = "#476567", bg = "#d6dbdf", bold = true }

# Symlink
symlink_target = { fg = "#75838a", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#836f3c", bg = "#836f3c" }
marker_cut      = { fg = "#ca5350", bg = "#ca5350" }
marker_marked   = { fg = "#b35181", bg = "#b35181" }
marker_selected = { fg = "#4c799d", bg = "#4c799d" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#7f8a46" }
count_cut      = { fg = "#fcfcfc", bg = "#d85c5a" }
count_selected = { fg = "#fcfcfc", bg = "#4c8d73" }

# Border
border_symbol = "│"
border_style  = { fg = "#939c66" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#fcfcfc", bg = "#4c799d", bold = true }
normal_alt  = { fg = "#3e5265", bg = "#c4c4c4" }

select_main = { fg = "#f9f9f9", bg = "#b35181", bold = true }
select_alt  = { fg = "#744158", bg = "#c4c4c4" }

unset_main  = { fg = "#fcfcfc", bg = "#707293", bold = true }
unset_alt   = { fg = "#4d4e65", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#fcfcfc", bg = "#ca5350" }

# Permissions
perm_type  = { fg = "#486985" }
perm_read  = { fg = "#756235" }
perm_write = { fg = "#a24b49" }
perm_exec  = { fg = "#62693d" }
perm_sep   = { fg = "#75838a" }

[pick]
border   = { fg = "#5586ae" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#5586ae" }
title    = { fg = "#5586ae" }
value    = { fg = "#616382" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#5586ae" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#939c66" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#416662" }
rest            = { fg = "#45617a" }
desc            = { fg = "#8e4869" }
separator       = " ➜ "
separator_style = { fg = "#717d84" }

[confirm]
border  = { fg = "#5586ae" }
title   = { fg = "#5586ae" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#939c66" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#486985" }
tbl_cell = { fg = "#786435", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#4c6983" }
title_warn  = { fg = "#8d5645" }
title_error = { fg = "#a14c4b" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#62693d" }
run     = { fg = "#974b6f" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#756235" },

	# Media
	{ mime = "{audio,video}/*", fg = "#974b6f" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a24b49" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#436b67" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#75838a" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#ca5350" },
	{ url = "*", is = "exec"  , fg = "#62693d" },
	{ url = "*", is = "dummy", bg = "#ca5350" },
	{ url = "*/", is = "dummy", bg = "#ca5350" },

	# Fallback
	{ url = "*/", fg = "#486985" }
]
    