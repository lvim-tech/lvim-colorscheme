#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme SolarizedLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#c3643d", bold = true }
find_position = { fg = "#466264", bg = "#d4dade", bold = true }

# Symlink
symlink_target = { fg = "#75838a", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#967a20", bg = "#967a20" }
marker_cut      = { fg = "#cc5452", bg = "#cc5452" }
marker_marked   = { fg = "#bd5588", bg = "#bd5588" }
marker_selected = { fg = "#39739c", bg = "#39739c" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#7a881e" }
count_cut      = { fg = "#fcfcfc", bg = "#dc5d5b" }
count_selected = { fg = "#fcfcfc", bg = "#3a8580" }

# Border
border_symbol = "│"
border_style  = { fg = "#8f9a46" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#f1f1f1", bg = "#39739c", bold = true }
normal_alt  = { fg = "#38546b", bg = "#c4c4c4" }

select_main = { fg = "#fcfcfc", bg = "#bd5588", bold = true }
select_alt  = { fg = "#714156", bg = "#c4c4c4" }

unset_main  = { fg = "#e8e8e8", bg = "#626587", bold = true }
unset_alt   = { fg = "#4e5068", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#fcfcfc", bg = "#cc5452" }

# Permissions
perm_type  = { fg = "#3a688b" }
perm_read  = { fg = "#796327" }
perm_write = { fg = "#a04b49" }
perm_exec  = { fg = "#606929" }
perm_sep   = { fg = "#75838a" }

[pick]
border   = { fg = "#407fac" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#407fac" }
title    = { fg = "#407fac" }
value    = { fg = "#606384" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#407fac" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#8f9a46" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#366763" }
rest            = { fg = "#3a6383" }
desc            = { fg = "#8e4a6a" }
separator       = " ➜ "
separator_style = { fg = "#717d84" }

[confirm]
border  = { fg = "#407fac" }
title   = { fg = "#407fac" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#8f9a46" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#3a688b" }
tbl_cell = { fg = "#7c6525", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#41698a" }
title_warn  = { fg = "#935641" }
title_error = { fg = "#a24a49" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#606929" }
run     = { fg = "#974d70" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#796327" },

	# Media
	{ mime = "{audio,video}/*", fg = "#974d70" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a04b49" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#366f6b" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#75838a" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#cc5452" },
	{ url = "*", is = "exec"  , fg = "#606929" },
	{ url = "*", is = "dummy", bg = "#cc5452" },
	{ url = "*/", is = "dummy", bg = "#cc5452" },

	# Fallback
	{ url = "*/", fg = "#3a688b" }
]
    