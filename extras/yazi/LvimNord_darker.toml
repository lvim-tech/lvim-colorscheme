#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme NordDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#848b98", italic = true }

# Find
find_keyword  = { fg = "#14171c", bg = "#ba8574", bold = true }
find_position = { fg = "#6f89a4", bg = "#252b34", bold = true }

# Symlink
symlink_target = { fg = "#677185", italic = true }

# Marker
marker_copied   = { fg = "#c3a25d", bg = "#c3a25d" }
marker_cut      = { fg = "#af7177", bg = "#af7177" }
marker_marked   = { fg = "#a58aa0", bg = "#a58aa0" }
marker_selected = { fg = "#8097af", bg = "#8097af" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#b3bac6", bg = "#89a076" }
count_cut      = { fg = "#b3bac6", bg = "#a66067" }
count_selected = { fg = "#b3bac6", bg = "#789f9d" }

# Border
border_symbol = "│"
border_style  = { fg = "#738766" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#252a33" }
current = { bg = "#252a33" }
preview = { bg = "#252a33" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#b3bac6", bg = "#252a33", bold = true }
inactive = { fg = "#b0b3ba", bg = "#1d2128" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#171a20", bg = "#8097af", bold = true }
normal_alt  = { fg = "#8097af", bg = "#b0b3ba" }

select_main = { fg = "#171a20", bg = "#a58aa0", bold = true }
select_alt  = { fg = "#a58aa0", bg = "#b0b3ba" }

unset_main  = { fg = "#171a20", bg = "#9b93a4", bold = true }
unset_alt   = { fg = "#9b93a4", bg = "#b0b3ba" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#848b98", bold = true }
progress_normal = { fg = "#97ab86", bg = "#14171c" }
progress_error  = { fg = "#14171c", bg = "#af7177" }

# Permissions
perm_type  = { fg = "#8097af" }
perm_read  = { fg = "#cbae72" }
perm_write = { fg = "#af7177" }
perm_exec  = { fg = "#97ab86" }
perm_sep   = { fg = "#677185" }

[pick]
border   = { fg = "#738766" }
active   = { fg = "#b3bac6",  bg = "#252a33" }
inactive = { fg = "#b3bac6" }

[input]
border   = { fg = "#6f89a4" }
title    = { fg = "#6f89a4" }
value    = { fg = "#9b93a4" }
selected = { bg = "#252a33" }

[cmp]
border   = { fg = "#6f89a4" }
active   = { fg = "#b3bac6", bg = "#252a33" }
inactive = { fg = "#b3bac6" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#738766" }
title   = { fg = "#738766" }
hovered = { fg = "#b3bac6", bg = "#252a33" }

[which]
cols            = 3
mask            = { bg = "#14171c" }
cand            = { fg = "#7eaab7" }
rest            = { fg = "#8097af" }
desc            = { fg = "#a58aa0" }
separator       = " ➜ "
separator_style = { fg = "#677185" }

[confirm]
border  = { fg = "#6f89a4" }
title   = { fg = "#738766" }
body    = {}
list    = {}
btn_yes = { bg = "#252a33" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#738766" }
title    = { fg = "#738766" }
tbl_col  = { fg = "#8097af" }
tbl_cell = { fg = "#cbae72", bg = "#252a33" }

[notify]
title_info  = { fg = "#6f89a4" }
title_warn  = { fg = "#b17562" }
title_error = { fg = "#a66067" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#97ab86" }
run     = { fg = "#a58aa0" }
desc    = { fg = "#b0b3ba" }
hovered = { bg = "#252a33", bold = true }
footer  = { fg = "#b3bac6", bg = "#1d2128" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#cbae72" },

	# Media
	{ mime = "{audio,video}/*", fg = "#a58aa0" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#af7177" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#7eaab7" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#677185" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#af7177" },
	{ url = "*", is = "exec"  , fg = "#97ab86" },
	{ url = "*", is = "dummy", bg = "#af7177" },
	{ url = "*/", is = "dummy", bg = "#af7177" },

	# Fallback
	{ url = "*/", fg = "#8097af" }
]
    