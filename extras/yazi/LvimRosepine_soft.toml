#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme RosepineSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#b4b2c7", italic = true }

# Find
find_keyword  = { fg = "#141321", bg = "#c68784", bold = true }
find_position = { fg = "#b8b5c4", bg = "#212232", bold = true }

# Symlink
symlink_target = { fg = "#746e91", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#d09a4f", bg = "#d09a4f" }
marker_cut      = { fg = "#cd6985", bg = "#cd6985" }
marker_marked   = { fg = "#9f80c4", bg = "#9f80c4" }
marker_selected = { fg = "#416d7f", bg = "#416d7f" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#141321", bg = "#71a7b0" }
count_cut      = { fg = "#fefeff", bg = "#c65474" }
count_selected = { fg = "#d9d7e0", bg = "#3b6374" }

# Border
border_symbol = "│"
border_style  = { fg = "#608b95" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#2d2a3b" }
current = { bg = "#312e42" }
preview = { bg = "#312e42" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#b8b5c4", bg = "#2d2a3b", bold = true }
inactive = { fg = "#9694a3", bg = "#1e1b2b" }

[mode]
normal_main = { fg = "#e6e4ff", bg = "#416d7f", bold = true }
normal_alt  = { fg = "#0cb3dc", bg = "#3b384b" }

select_main = { fg = "#141321", bg = "#9f80c4", bold = true }
select_alt  = { fg = "#b599d7", bg = "#3b384b" }

unset_main  = { fg = "#141321", bg = "#958fa7", bold = true }
unset_alt   = { fg = "#a7a2b8", bg = "#3b384b" }

[status]
# Progress
progress_label  = { fg = "#b4b2c7", bold = true }
progress_normal = { fg = "#b8b5c4", bg = "#141321" }
progress_error  = { fg = "#141321", bg = "#cd6985" }

# Permissions
perm_type  = { fg = "#3e8fab" }
perm_read  = { fg = "#d6a765" }
perm_write = { fg = "#cd6985" }
perm_exec  = { fg = "#83b2ba" }
perm_sep   = { fg = "#746e91" }

[pick]
border   = { fg = "#3c6e82" }
active   = { fg = "#b8b5c4", bg = "#2d2a3b" }
inactive = { fg = "#b4b2c7" }

[input]
border   = { fg = "#3c6e82" }
title    = { fg = "#3c6e82" }
value    = { fg = "#958fa7" }
selected = { fg = "#b8b5c4", bg = "#2d2a3b" }

[cmp]
border   = { fg = "#3c6e82" }
active   = { fg = "#b8b5c4", bg = "#2d2a3b" }
inactive = { fg = "#b4b2c7" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#608b95" }
title   = { fg = "#b4b2c7" }
hovered = { fg = "#b8b5c4", bg = "#2d2a3b" }

[which]
cols            = 3
mask            = { bg = "#141321" }
cand            = { fg = "#83b2ba" }
rest            = { fg = "#4089a3" }
desc            = { fg = "#9f80c4" }
separator       = " ➜ "
separator_style = { fg = "#746e91" }

[confirm]
border  = { fg = "#3c6e82" }
title   = { fg = "#3c6e82" }
body    = {}
list    = {}
btn_yes = { fg = "#b8b5c4", bg = "#2d2a3b" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#608b95" }
title    = { fg = "#b4b2c7" }
tbl_col  = { fg = "#3e8fab" }
tbl_cell = { fg = "#d6a765", bg = "#2d2a3b" }

[notify]
title_info  = { fg = "#2f90b0" }
title_warn  = { fg = "#bd7370" }
title_error = { fg = "#d8597d" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#83b2ba" }
run     = { fg = "#9f80c4" }
desc    = { fg = "#9694a3" }
hovered = { fg = "#b8b5c4", bg = "#2d2a3b", bold = true }
footer  = { fg = "#b8b5c4", bg = "#2d2a3b" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#d6a765" },

	# Media
	{ mime = "{audio,video}/*", fg = "#9f80c4" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#cd6985" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#83b2ba" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#746e91" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#cd6985" },
	{ url = "*", is = "exec"  , fg = "#83b2ba" },
	{ url = "*", is = "dummy", bg = "#cd6985" },
	{ url = "*/", is = "dummy", bg = "#cd6985" },

	# Fallback
	{ url = "*/", fg = "#3e8fab" }
]
    