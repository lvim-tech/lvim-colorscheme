#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme SolarizedDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#9da4a4", italic = true }

# Find
find_keyword  = { fg = "#fafdff", bg = "#b46548", bold = true }
find_position = { fg = "#969e9e", bg = "#072732", bold = true }

# Symlink
symlink_target = { fg = "#5d6a6f", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#917b43", bg = "#917b43" }
marker_cut      = { fg = "#c24f4d", bg = "#c24f4d" }
marker_marked   = { fg = "#c0578a", bg = "#c0578a" }
marker_selected = { fg = "#4f7ea3", bg = "#4f7ea3" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#d1f0ff", bg = "#666f37" }
count_cut      = { fg = "#d1f0ff", bg = "#b34644" }
count_selected = { fg = "#dff5ff", bg = "#407862" }

# Border
border_symbol = "│"
border_style  = { fg = "#525f34" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#002c37" }
current = { bg = "#00333f" }
preview = { bg = "#00333f" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#969e9e", bg = "#022129", bold = true }
inactive = { fg = "#6c777b", bg = "#001f27" }

[mode]
normal_main = { fg = "#fafdff", bg = "#4f7ea3", bold = true }
normal_alt  = { fg = "#4ca5e0", bg = "#003a47" }

select_main = { fg = "#fafdff", bg = "#c0578a", bold = true }
select_alt  = { fg = "#e57bac", bg = "#003a47" }

unset_main  = { fg = "#fafdff", bg = "#757797", bold = true }
unset_alt   = { fg = "#9a9bba", bg = "#003a47" }

[status]
# Progress
progress_label  = { fg = "#9da4a4", bold = true }
progress_normal = { fg = "#969e9e", bg = "#001b23" }
progress_error  = { fg = "#fafdff", bg = "#c24f4d" }

# Permissions
perm_type  = { fg = "#5089b4" }
perm_read  = { fg = "#9f8549" }
perm_write = { fg = "#dd5755" }
perm_exec  = { fg = "#7e8a3c" }
perm_sep   = { fg = "#5d6a6f" }

[pick]
border   = { fg = "#477193" }
active   = { fg = "#969e9e", bg = "#022129" }
inactive = { fg = "#9da4a4" }

[input]
border   = { fg = "#477193" }
title    = { fg = "#477193" }
value    = { fg = "#7f81a2" }
selected = { fg = "#969e9e", bg = "#022129" }

[cmp]
border   = { fg = "#477193" }
active   = { fg = "#969e9e", bg = "#022129" }
inactive = { fg = "#9da4a4" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#525f34" }
title   = { fg = "#9da4a4" }
hovered = { fg = "#969e9e", bg = "#022129" }

[which]
cols            = 3
mask            = { bg = "#001b23" }
cand            = { fg = "#4c8b85" }
rest            = { fg = "#5086af" }
desc            = { fg = "#ca5990" }
separator       = " ➜ "
separator_style = { fg = "#5d6a6f" }

[confirm]
border  = { fg = "#477193" }
title   = { fg = "#477193" }
body    = {}
list    = {}
btn_yes = { fg = "#969e9e", bg = "#022129" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#525f34" }
title    = { fg = "#9da4a4" }
tbl_col  = { fg = "#5089b4" }
tbl_cell = { fg = "#9f8549", bg = "#022129" }

[notify]
title_info  = { fg = "#488ab9" }
title_warn  = { fg = "#cc6a41" }
title_error = { fg = "#e54f4b" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#7e8a3c" }
run     = { fg = "#cf5a93" }
desc    = { fg = "#6c777b" }
hovered = { fg = "#969e9e", bg = "#022129", bold = true }
footer  = { fg = "#969e9e", bg = "#022129" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#9f8549" },

	# Media
	{ mime = "{audio,video}/*", fg = "#cf5a93" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#dd5755" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#4c8e88" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#5d6a6f" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#c24f4d" },
	{ url = "*", is = "exec"  , fg = "#7e8a3c" },
	{ url = "*", is = "dummy", bg = "#c24f4d" },
	{ url = "*/", is = "dummy", bg = "#c24f4d" },

	# Fallback
	{ url = "*/", fg = "#5089b4" }
]
    