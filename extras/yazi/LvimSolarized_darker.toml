#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme SolarizedDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#9da4a4", italic = true }

# Find
find_keyword  = { fg = "#e1f7ff", bg = "#ac5835", bold = true }
find_position = { fg = "#969e9e", bg = "#062834", bold = true }

# Symlink
symlink_target = { fg = "#5d6a6f", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#886e1c", bg = "#886e1c" }
marker_cut      = { fg = "#bf4e4c", bg = "#bf4e4c" }
marker_marked   = { fg = "#b75283", bg = "#b75283" }
marker_selected = { fg = "#4386b5", bg = "#4386b5" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#d9f5ff", bg = "#687418" }
count_cut      = { fg = "#c0efff", bg = "#b34240" }
count_selected = { fg = "#f7fdff", bg = "#38807b" }

# Border
border_symbol = "│"
border_style  = { fg = "#53631b" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#06303a" }
current = { bg = "#01333d" }
preview = { bg = "#01333d" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#969e9e", bg = "#06303a", bold = true }
inactive = { fg = "#6c777b", bg = "#001f27" }

[mode]
normal_main = { fg = "#001318", bg = "#4386b5", bold = true }
normal_alt  = { fg = "#18aef8", bg = "#0c404c" }

select_main = { fg = "#feffff", bg = "#b75283", bold = true }
select_alt  = { fg = "#ec81b2", bg = "#0c404c" }

unset_main  = { fg = "#001318", bg = "#8385a2", bold = true }
unset_alt   = { fg = "#a0a2bd", bg = "#0c404c" }

[status]
# Progress
progress_label  = { fg = "#9da4a4", bold = true }
progress_normal = { fg = "#969e9e", bg = "#001318" }
progress_error  = { fg = "#effbff", bg = "#bf4e4c" }

# Permissions
perm_type  = { fg = "#418cbe" }
perm_read  = { fg = "#a08010" }
perm_write = { fg = "#de5856" }
perm_exec  = { fg = "#7e8d00" }
perm_sep   = { fg = "#5d6a6f" }

[pick]
border   = { fg = "#3d7aa5" }
active   = { fg = "#969e9e", bg = "#06303a" }
inactive = { fg = "#9da4a4" }

[input]
border   = { fg = "#3d7aa5" }
title    = { fg = "#3d7aa5" }
value    = { fg = "#8385a2" }
selected = { fg = "#969e9e", bg = "#06303a" }

[cmp]
border   = { fg = "#3d7aa5" }
active   = { fg = "#969e9e", bg = "#06303a" }
inactive = { fg = "#9da4a4" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#53631b" }
title   = { fg = "#9da4a4" }
hovered = { fg = "#969e9e", bg = "#06303a" }

[which]
cols            = 3
mask            = { bg = "#001318" }
cand            = { fg = "#3e8d87" }
rest            = { fg = "#4386b5" }
desc            = { fg = "#c6548c" }
separator       = " ➜ "
separator_style = { fg = "#5d6a6f" }

[confirm]
border  = { fg = "#3d7aa5" }
title   = { fg = "#3d7aa5" }
body    = {}
list    = {}
btn_yes = { fg = "#969e9e", bg = "#06303a" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#53631b" }
title    = { fg = "#9da4a4" }
tbl_col  = { fg = "#418cbe" }
tbl_cell = { fg = "#b38f00", bg = "#06303a" }

[notify]
title_info  = { fg = "#368bc0" }
title_warn  = { fg = "#d66016" }
title_error = { fg = "#ea4a47" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#7e8d00" }
run     = { fg = "#d55696" }
desc    = { fg = "#6c777b" }
hovered = { fg = "#969e9e", bg = "#06303a", bold = true }
footer  = { fg = "#969e9e", bg = "#06303a" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#a08010" },

	# Media
	{ mime = "{audio,video}/*", fg = "#d55696" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#de5856" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#3d908a" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#5d6a6f" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#bf4e4c" },
	{ url = "*", is = "exec"  , fg = "#7e8d00" },
	{ url = "*", is = "dummy", bg = "#bf4e4c" },
	{ url = "*/", is = "dummy", bg = "#bf4e4c" },

	# Fallback
	{ url = "*/", fg = "#418cbe" }
]
    