#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme DraculaDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#c7c7b3", italic = true }

# Find
find_keyword  = { fg = "#20222c", bg = "#b58f70", bold = true }
find_position = { fg = "#c2c2b7", bg = "#292f39", bold = true }

# Symlink
symlink_target = { fg = "#727a98", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#a3a975", bg = "#a3a975" }
marker_cut      = { fg = "#bc6060", bg = "#bc6060" }
marker_marked   = { fg = "#bf6f9a", bg = "#bf6f9a" }
marker_selected = { fg = "#638993", bg = "#638993" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fdfdff", bg = "#598861" }
count_cut      = { fg = "#f2f4ff", bg = "#b15353" }
count_selected = { fg = "#fdfdff", bg = "#577f74" }

# Border
border_symbol = "│"
border_style  = { fg = "#4e7457" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#2d303f" }
current = { bg = "#333749" }
preview = { bg = "#333749" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#c2c2b7", bg = "#262832", bold = true }
inactive = { fg = "#c6c6c3", bg = "#242630" }

[mode]
normal_main = { fg = "#fdfdff", bg = "#638993", bold = true }
normal_alt  = { fg = "#72b1c1", bg = "#373b4e" }

select_main = { fg = "#fdfdff", bg = "#bf6f9a", bold = true }
select_alt  = { fg = "#d492b4", bg = "#373b4e" }

unset_main  = { fg = "#eff1ff", bg = "#796496", bold = true }
unset_alt   = { fg = "#b19ecd", bg = "#373b4e" }

[status]
# Progress
progress_label  = { fg = "#c7c7b3", bold = true }
progress_normal = { fg = "#c2c2b7", bg = "#20222c" }
progress_error  = { fg = "#fdfdff", bg = "#bc6060" }

# Permissions
perm_type  = { fg = "#6894a0" }
perm_read  = { fg = "#adb27e" }
perm_write = { fg = "#cc7575" }
perm_exec  = { fg = "#63996f" }
perm_sep   = { fg = "#727a98" }

[pick]
border   = { fg = "#597c86" }
active   = { fg = "#c2c2b7", bg = "#262832" }
inactive = { fg = "#c7c7b3" }

[input]
border   = { fg = "#597c86" }
title    = { fg = "#597c86" }
value    = { fg = "#9a85b9" }
selected = { fg = "#c2c2b7", bg = "#262832" }

[cmp]
border   = { fg = "#597c86" }
active   = { fg = "#c2c2b7", bg = "#262832" }
inactive = { fg = "#c7c7b3" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#4e7457" }
title   = { fg = "#c7c7b3" }
hovered = { fg = "#c2c2b7", bg = "#262832" }

[which]
cols            = 3
mask            = { bg = "#20222c" }
cand            = { fg = "#66938a" }
rest            = { fg = "#67919c" }
desc            = { fg = "#c1729c" }
separator       = " ➜ "
separator_style = { fg = "#727a98" }

[confirm]
border  = { fg = "#597c86" }
title   = { fg = "#597c86" }
body    = {}
list    = {}
btn_yes = { fg = "#c2c2b7", bg = "#262832" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#4e7457" }
title    = { fg = "#c7c7b3" }
tbl_col  = { fg = "#6894a0" }
tbl_cell = { fg = "#adb27e", bg = "#262832" }

[notify]
title_info  = { fg = "#6395a3" }
title_warn  = { fg = "#b18664" }
title_error = { fg = "#d87070" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#63996f" }
run     = { fg = "#c3759f" }
desc    = { fg = "#c6c6c3" }
hovered = { fg = "#c2c2b7", bg = "#262832", bold = true }
footer  = { fg = "#c2c2b7", bg = "#262832" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#adb27e" },

	# Media
	{ mime = "{audio,video}/*", fg = "#c3759f" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#cc7575" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#67968d" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#727a98" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#bc6060" },
	{ url = "*", is = "exec"  , fg = "#63996f" },
	{ url = "*", is = "dummy", bg = "#bc6060" },
	{ url = "*/", is = "dummy", bg = "#bc6060" },

	# Fallback
	{ url = "*/", fg = "#6894a0" }
]
    