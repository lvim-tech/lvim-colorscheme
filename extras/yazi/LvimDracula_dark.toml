#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme DraculaDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#c7c7b3", italic = true }

# Find
find_keyword  = { fg = "#1b1d25", bg = "#de9f5c", bold = true }
find_position = { fg = "#c2c2b7", bg = "#283541", bold = true }

# Symlink
symlink_target = { fg = "#727a98", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#c9d451", bg = "#c9d451" }
marker_cut      = { fg = "#dd5757", bg = "#dd5757" }
marker_marked   = { fg = "#dc61a8", bg = "#dc61a8" }
marker_selected = { fg = "#65c8dd", bg = "#65c8dd" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#1b1d25", bg = "#42d367" }
count_cut      = { fg = "#ffffff", bg = "#d84040" }
count_selected = { fg = "#1b1d25", bg = "#4dc0d8" }

# Border
border_symbol = "│"
border_style  = { fg = "#3cb05c" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#2e303d" }
current = { bg = "#343647" }
preview = { bg = "#343647" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#c2c2b7", bg = "#2c2e3a", bold = true }
inactive = { fg = "#c6c6c3", bg = "#242630" }

[mode]
normal_main = { fg = "#1b1d25", bg = "#65c8dd", bold = true }
normal_alt  = { fg = "#65c8dd", bg = "#3a3c4e" }

select_main = { fg = "#1b1d25", bg = "#dc61a8", bold = true }
select_alt  = { fg = "#ec86be", bg = "#3a3c4e" }

unset_main  = { fg = "#1b1d25", bg = "#9c80c3", bold = true }
unset_alt   = { fg = "#b59cd9", bg = "#3a3c4e" }

[status]
# Progress
progress_label  = { fg = "#c7c7b3", bold = true }
progress_normal = { fg = "#c2c2b7", bg = "#1b1d25" }
progress_error  = { fg = "#ffffff", bg = "#dd5757" }

# Permissions
perm_type  = { fg = "#65c8dd" }
perm_read  = { fg = "#d0da68" }
perm_write = { fg = "#e36767" }
perm_exec  = { fg = "#58d879" }
perm_sep   = { fg = "#727a98" }

[pick]
border   = { fg = "#4dc0d8" }
active   = { fg = "#c2c2b7", bg = "#2c2e3a" }
inactive = { fg = "#c7c7b3" }

[input]
border   = { fg = "#4dc0d8" }
title    = { fg = "#4dc0d8" }
value    = { fg = "#9c80c3" }
selected = { fg = "#c2c2b7", bg = "#2c2e3a" }

[cmp]
border   = { fg = "#4dc0d8" }
active   = { fg = "#c2c2b7", bg = "#2c2e3a" }
inactive = { fg = "#c7c7b3" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#3cb05c" }
title   = { fg = "#c7c7b3" }
hovered = { fg = "#c2c2b7", bg = "#2c2e3a" }

[which]
cols            = 3
mask            = { bg = "#1b1d25" }
cand            = { fg = "#61dfca" }
rest            = { fg = "#65c8dd" }
desc            = { fg = "#dc61a8" }
separator       = " ➜ "
separator_style = { fg = "#727a98" }

[confirm]
border  = { fg = "#4dc0d8" }
title   = { fg = "#4dc0d8" }
body    = {}
list    = {}
btn_yes = { fg = "#c2c2b7", bg = "#2c2e3a" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#3cb05c" }
title    = { fg = "#c7c7b3" }
tbl_col  = { fg = "#65c8dd" }
tbl_cell = { fg = "#d0da68", bg = "#2c2e3a" }

[notify]
title_info  = { fg = "#4dc0d8" }
title_warn  = { fg = "#d99144" }
title_error = { fg = "#f15d5d" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#58d879" }
run     = { fg = "#dc61a8" }
desc    = { fg = "#c6c6c3" }
hovered = { fg = "#c2c2b7", bg = "#2c2e3a", bold = true }
footer  = { fg = "#c2c2b7", bg = "#2c2e3a" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#d0da68" },

	# Media
	{ mime = "{audio,video}/*", fg = "#dc61a8" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e36767" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#61dfca" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#727a98" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#dd5757" },
	{ url = "*", is = "exec"  , fg = "#58d879" },
	{ url = "*", is = "dummy", bg = "#dd5757" },
	{ url = "*/", is = "dummy", bg = "#dd5757" },

	# Fallback
	{ url = "*/", fg = "#65c8dd" }
]
    