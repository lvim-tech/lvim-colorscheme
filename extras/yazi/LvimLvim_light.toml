#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme LvimLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#a96400", bold = true }
find_position = { fg = "#466264", bg = "#cfdbe0", bold = true }

# Symlink
symlink_target = { fg = "#6d8587", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#876826", bg = "#876826" }
marker_cut      = { fg = "#ac4135", bg = "#ac4135" }
marker_marked   = { fg = "#bc533c", bg = "#bc533c" }
marker_selected = { fg = "#0879a9", bg = "#0879a9" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#dddddd", bg = "#556738" }
count_cut      = { fg = "#f1f1f1", bg = "#c53f30" }
count_selected = { fg = "#fcfcfc", bg = "#2a9b86" }

# Border
border_symbol = "│"
border_style  = { fg = "#72805a" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#f9f9f9", bg = "#0879a9", bold = true }
normal_alt  = { fg = "#2e536d", bg = "#c4c4c4" }

select_main = { fg = "#fcfcfc", bg = "#bc533c", bold = true }
select_alt  = { fg = "#7b4137", bg = "#c4c4c4" }

unset_main  = { fg = "#fcfcfc", bg = "#1981bd", bold = true }
unset_alt   = { fg = "#335470", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#e2e2e2", bg = "#ac4135" }

# Permissions
perm_type  = { fg = "#246b92" }
perm_read  = { fg = "#7b6330" }
perm_write = { fg = "#ac4135" }
perm_exec  = { fg = "#5c6b47" }
perm_sep   = { fg = "#6d8587" }

[pick]
border   = { fg = "#0d8abf" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#0d8abf" }
title    = { fg = "#0d8abf" }
value    = { fg = "#326892" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#0d8abf" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#72805a" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#226674" }
rest            = { fg = "#2a6385" }
desc            = { fg = "#96493b" }
separator       = " ➜ "
separator_style = { fg = "#687d7f" }

[confirm]
border  = { fg = "#0d8abf" }
title   = { fg = "#0d8abf" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#72805a" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#246b92" }
tbl_cell = { fg = "#7e652f", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#336b8e" }
title_warn  = { fg = "#935625" }
title_error = { fg = "#b03e32" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#5c6b47" }
run     = { fg = "#9f4c3c" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#7b6330" },

	# Media
	{ mime = "{audio,video}/*", fg = "#9f4c3c" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ac4135" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#196e7f" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#6d8587" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#ac4135" },
	{ url = "*", is = "exec"  , fg = "#5c6b47" },
	{ url = "*", is = "dummy", bg = "#ac4135" },
	{ url = "*/", is = "dummy", bg = "#ac4135" },

	# Fallback
	{ url = "*/", fg = "#246b92" }
]
    