#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme LvimLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#93b6b6", italic = true }

# Find
find_keyword  = { fg = "#dadada", bg = "#a96400", bold = true }
find_position = { fg = "#0d8abf", bg = "#cfdbe0", bold = true }

# Symlink
symlink_target = { fg = "#789698", italic = true }

# Marker
marker_copied   = { fg = "#876826", bg = "#876826" }
marker_cut      = { fg = "#ac4135", bg = "#ac4135" }
marker_marked   = { fg = "#bc533c", bg = "#bc533c" }
marker_selected = { fg = "#0879a9", bg = "#0879a9" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#5e8888", bg = "#556738" }
count_cut      = { fg = "#5e8888", bg = "#c53f30" }
count_selected = { fg = "#5e8888", bg = "#2a9b86" }

# Border
border_symbol = "│"
border_style  = { fg = "#72805a" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#e9e9e9" }
current = { bg = "#e9e9e9" }
preview = { bg = "#e9e9e9" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#5e8888", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#b6b6b6", bg = "#0879a9", bold = true }
normal_alt  = { fg = "#0879a9", bg = "#3c7478" }

select_main = { fg = "#b6b6b6", bg = "#bc533c", bold = true }
select_alt  = { fg = "#bc533c", bg = "#3c7478" }

unset_main  = { fg = "#b6b6b6", bg = "#1981bd", bold = true }
unset_alt   = { fg = "#1981bd", bg = "#3c7478" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#93b6b6", bold = true }
progress_normal = { fg = "#748c50", bg = "#dadada" }
progress_error  = { fg = "#dadada", bg = "#ac4135" }

# Permissions
perm_type  = { fg = "#0879a9" }
perm_read  = { fg = "#7e652f" }
perm_write = { fg = "#ac4135" }
perm_exec  = { fg = "#748c50" }
perm_sep   = { fg = "#789698" }

[pick]
border   = { fg = "#72805a" }
active   = { fg = "#5e8888",  bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

[input]
border   = { fg = "#0d8abf" }
title    = { fg = "#0d8abf" }
value    = { fg = "#1981bd" }
selected = { bg = "#e9e9e9" }

[cmp]
border   = { fg = "#0d8abf" }
active   = { fg = "#5e8888", bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#72805a" }
title   = { fg = "#72805a" }
hovered = { fg = "#5e8888", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#01778a" }
rest            = { fg = "#0879a9" }
desc            = { fg = "#bc533c" }
separator       = " ➜ "
separator_style = { fg = "#789698" }

[confirm]
border  = { fg = "#0d8abf" }
title   = { fg = "#72805a" }
body    = {}
list    = {}
btn_yes = { bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#72805a" }
title    = { fg = "#72805a" }
tbl_col  = { fg = "#0879a9" }
tbl_cell = { fg = "#7e652f", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#0d8abf" }
title_warn  = { fg = "#b66400" }
title_error = { fg = "#c53f30" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#748c50" }
run     = { fg = "#bc533c" }
desc    = { fg = "#3c7478" }
hovered = { bg = "#e9e9e9", bold = true }
footer  = { fg = "#5e8888", bg = "#E4E4E4" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#7e652f" },

	# Media
	{ mime = "{audio,video}/*", fg = "#bc533c" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ac4135" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#01778a" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#789698" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#ac4135" },
	{ url = "*", is = "exec"  , fg = "#748c50" },
	{ url = "*", is = "dummy", bg = "#ac4135" },
	{ url = "*/", is = "dummy", bg = "#ac4135" },

	# Fallback
	{ url = "*/", fg = "#0879a9" }
]
    