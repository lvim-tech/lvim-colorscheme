#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme LvimDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#374646", italic = true }

# Find
find_keyword  = { fg = "#141819", bg = "#FF9C2A", bold = true }
find_position = { fg = "#0974a1", bg = "#1a2a31", bold = true }

# Symlink
symlink_target = { fg = "#4d6263", italic = true }

# Marker
marker_copied   = { fg = "#eab749", bg = "#eab749" }
marker_cut      = { fg = "#e65e4f", bg = "#e65e4f" }
marker_marked   = { fg = "#c75940", bg = "#c75940" }
marker_selected = { fg = "#0A85B9", bg = "#0A85B9" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#5e8888", bg = "#7d9654" }
count_cut      = { fg = "#5e8888", bg = "#e34a39" }
count_selected = { fg = "#5e8888", bg = "#1c7060" }

# Border
border_symbol = "│"
border_style  = { fg = "#6a7f4b" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#272f34" }
current = { bg = "#272f34" }
preview = { bg = "#272f34" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#5e8888", bg = "#272f34", bold = true }
inactive = { fg = "#3c7478", bg = "#1c2225" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#161b1e", bg = "#0A85B9", bold = true }
normal_alt  = { fg = "#0A85B9", bg = "#3c7478" }

select_main = { fg = "#161b1e", bg = "#c75940", bold = true }
select_alt  = { fg = "#c75940", bg = "#3c7478" }

unset_main  = { fg = "#161b1e", bg = "#177ab3", bold = true }
unset_alt   = { fg = "#177ab3", bg = "#3c7478" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#374646", bold = true }
progress_normal = { fg = "#8AA55F", bg = "#141819" }
progress_error  = { fg = "#141819", bg = "#e65e4f" }

# Permissions
perm_type  = { fg = "#0A85B9" }
perm_read  = { fg = "#edc060" }
perm_write = { fg = "#e65e4f" }
perm_exec  = { fg = "#8AA55F" }
perm_sep   = { fg = "#4d6263" }

[pick]
border   = { fg = "#6a7f4b" }
active   = { fg = "#5e8888",  bg = "#272f34" }
inactive = { fg = "#5e8888" }

[input]
border   = { fg = "#0974a1" }
title    = { fg = "#0974a1" }
value    = { fg = "#177ab3" }
selected = { bg = "#272f34" }

[cmp]
border   = { fg = "#0974a1" }
active   = { fg = "#5e8888", bg = "#272f34" }
inactive = { fg = "#5e8888" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#6a7f4b" }
title   = { fg = "#6a7f4b" }
hovered = { fg = "#5e8888", bg = "#272f34" }

[which]
cols            = 3
mask            = { bg = "#141819" }
cand            = { fg = "#018FA6" }
rest            = { fg = "#0A85B9" }
desc            = { fg = "#c75940" }
separator       = " ➜ "
separator_style = { fg = "#4d6263" }

[confirm]
border  = { fg = "#0974a1" }
title   = { fg = "#6a7f4b" }
body    = {}
list    = {}
btn_yes = { bg = "#272f34" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#6a7f4b" }
title    = { fg = "#6a7f4b" }
tbl_col  = { fg = "#0A85B9" }
tbl_cell = { fg = "#edc060", bg = "#272f34" }

[notify]
title_info  = { fg = "#0974a1" }
title_warn  = { fg = "#ff9010" }
title_error = { fg = "#e34a39" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#8AA55F" }
run     = { fg = "#c75940" }
desc    = { fg = "#3c7478" }
hovered = { bg = "#272f34", bold = true }
footer  = { fg = "#5e8888", bg = "#1c2225" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#edc060" },

	# Media
	{ mime = "{audio,video}/*", fg = "#c75940" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e65e4f" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#018FA6" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#4d6263" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#e65e4f" },
	{ url = "*", is = "exec"  , fg = "#8AA55F" },
	{ url = "*", is = "dummy", bg = "#e65e4f" },
	{ url = "*/", is = "dummy", bg = "#e65e4f" },

	# Fallback
	{ url = "*/", fg = "#0A85B9" }
]
    