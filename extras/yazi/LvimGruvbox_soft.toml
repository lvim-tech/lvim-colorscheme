#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme GruvboxSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#9e8d7b", italic = true }

# Find
find_keyword  = { fg = "#242322", bg = "#c47d54", bold = true }
find_position = { fg = "#9f9182", bg = "#2a2d2e", bold = true }

# Symlink
symlink_target = { fg = "#7f6d5e", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#a5935f", bg = "#a5935f" }
marker_cut      = { fg = "#ca4f4f", bg = "#ca4f4f" }
marker_marked   = { fg = "#bb755e", bg = "#bb755e" }
marker_selected = { fg = "#497188", bg = "#497188" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#eee3d8", bg = "#65683b" }
count_cut      = { fg = "#f5efe9", bg = "#bd4343" }
count_selected = { fg = "#e6d7c7", bg = "#39675d" }

# Border
border_symbol = "│"
border_style  = { fg = "#595b37" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#333230" }
current = { bg = "#3a3836" }
preview = { bg = "#3a3836" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#9c8f80", bg = "#2a2928", bold = true }
inactive = { fg = "#8a7a6c", bg = "#282726" }

[mode]
normal_main = { fg = "#f5efe9", bg = "#497188", bold = true }
normal_alt  = { fg = "#3eb3e5", bg = "#3e3c3a" }

select_main = { fg = "#fffefe", bg = "#bb755e", bold = true }
select_alt  = { fg = "#e49277", bg = "#3e3c3a" }

unset_main  = { fg = "#e8dacb", bg = "#635d71", bold = true }
unset_alt   = { fg = "#aba4ba", bg = "#3e3c3a" }

[status]
# Progress
progress_label  = { fg = "#9e8d7b", bold = true }
progress_normal = { fg = "#968a7b", bg = "#242322" }
progress_error  = { fg = "#fffefe", bg = "#ca4f4f" }

# Permissions
perm_type  = { fg = "#4b98be" }
perm_read  = { fg = "#af9e6b" }
perm_write = { fg = "#e26969" }
perm_exec  = { fg = "#8f9345" }
perm_sep   = { fg = "#7f6d5e" }

[pick]
border   = { fg = "#417993" }
active   = { fg = "#9c8f80", bg = "#2a2928" }
inactive = { fg = "#9e8d7b" }

[input]
border   = { fg = "#417993" }
title    = { fg = "#417993" }
value    = { fg = "#918aa2" }
selected = { fg = "#9c8f80", bg = "#2a2928" }

[cmp]
border   = { fg = "#417993" }
active   = { fg = "#9c8f80", bg = "#2a2928" }
inactive = { fg = "#9e8d7b" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#595b37" }
title   = { fg = "#9e8d7b" }
hovered = { fg = "#9c8f80", bg = "#2a2928" }

[which]
cols            = 3
mask            = { bg = "#242322" }
cand            = { fg = "#5c9764" }
rest            = { fg = "#4c92b6" }
desc            = { fg = "#c37960" }
separator       = " ➜ "
separator_style = { fg = "#7c6b5c" }

[confirm]
border  = { fg = "#417993" }
title   = { fg = "#417993" }
body    = {}
list    = {}
btn_yes = { fg = "#9c8f80", bg = "#2a2928" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#595b37" }
title    = { fg = "#9e8d7b" }
tbl_col  = { fg = "#4b98be" }
tbl_cell = { fg = "#af9e6b", bg = "#2a2928" }

[notify]
title_info  = { fg = "#3798bf" }
title_warn  = { fg = "#ca7c4c" }
title_error = { fg = "#ed5f5f" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#8f9345" }
run     = { fg = "#c87b61" }
desc    = { fg = "#8a7a6c" }
hovered = { fg = "#9c8f80", bg = "#2a2928", bold = true }
footer  = { fg = "#9c8f80", bg = "#2a2928" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#af9e6b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#c87b61" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e26969" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#5e9d66" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#7f6d5e" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#ca4f4f" },
	{ url = "*", is = "exec"  , fg = "#8f9345" },
	{ url = "*", is = "dummy", bg = "#ca4f4f" },
	{ url = "*/", is = "dummy", bg = "#ca4f4f" },

	# Fallback
	{ url = "*/", fg = "#4b98be" }
]
    