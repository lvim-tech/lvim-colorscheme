#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme GruvboxSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#544c45", italic = true }

# Find
find_keyword  = { fg = "#1e1d1a", bg = "#cc7942", bold = true }
find_position = { fg = "#3a6479", bg = "#2a2d2e", bold = true }

# Symlink
symlink_target = { fg = "#64584e", italic = true }

# Marker
marker_copied   = { fg = "#a6935a", bg = "#a6935a" }
marker_cut      = { fg = "#cb4f4f", bg = "#cb4f4f" }
marker_marked   = { fg = "#bb755e", bg = "#bb755e" }
marker_selected = { fg = "#42728b", bg = "#42728b" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#645c54", bg = "#656831" }
count_cut      = { fg = "#645c54", bg = "#c53b3b" }
count_selected = { fg = "#645c54", bg = "#2d695d" }

# Border
border_symbol = "│"
border_style  = { fg = "#595b2f" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#32302f" }
current = { bg = "#32302f" }
preview = { bg = "#32302f" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#645c54", bg = "#32302f", bold = true }
inactive = { fg = "#5c544d", bg = "#282726" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#201f1e", bg = "#42728b", bold = true }
normal_alt  = { fg = "#42728b", bg = "#5c544d" }

select_main = { fg = "#201f1e", bg = "#bb755e", bold = true }
select_alt  = { fg = "#bb755e", bg = "#5c544d" }

unset_main  = { fg = "#201f1e", bg = "#635d71", bold = true }
unset_alt   = { fg = "#635d71", bg = "#5c544d" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#544c45", bold = true }
progress_normal = { fg = "#75783a", bg = "#1e1d1a" }
progress_error  = { fg = "#1e1d1a", bg = "#cb4f4f" }

# Permissions
perm_type  = { fg = "#42728b" }
perm_read  = { fg = "#af9e6b" }
perm_write = { fg = "#cb4f4f" }
perm_exec  = { fg = "#75783a" }
perm_sep   = { fg = "#64584e" }

[pick]
border   = { fg = "#595b2f" }
active   = { fg = "#645c54",  bg = "#32302f" }
inactive = { fg = "#645c54" }

[input]
border   = { fg = "#3a6479" }
title    = { fg = "#3a6479" }
value    = { fg = "#635d71" }
selected = { bg = "#32302f" }

[cmp]
border   = { fg = "#3a6479" }
active   = { fg = "#645c54", bg = "#32302f" }
inactive = { fg = "#645c54" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#595b2f" }
title   = { fg = "#595b2f" }
hovered = { fg = "#645c54", bg = "#32302f" }

[which]
cols            = 3
mask            = { bg = "#1e1d1a" }
cand            = { fg = "#527a57" }
rest            = { fg = "#42728b" }
desc            = { fg = "#bb755e" }
separator       = " ➜ "
separator_style = { fg = "#64584e" }

[confirm]
border  = { fg = "#3a6479" }
title   = { fg = "#595b2f" }
body    = {}
list    = {}
btn_yes = { bg = "#32302f" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#595b2f" }
title    = { fg = "#595b2f" }
tbl_col  = { fg = "#42728b" }
tbl_cell = { fg = "#af9e6b", bg = "#32302f" }

[notify]
title_info  = { fg = "#3a6479" }
title_warn  = { fg = "#b86d3c" }
title_error = { fg = "#c53b3b" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#75783a" }
run     = { fg = "#bb755e" }
desc    = { fg = "#5c544d" }
hovered = { bg = "#32302f", bold = true }
footer  = { fg = "#645c54", bg = "#282726" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#af9e6b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#bb755e" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#cb4f4f" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#527a57" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#64584e" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#cb4f4f" },
	{ url = "*", is = "exec"  , fg = "#75783a" },
	{ url = "*", is = "dummy", bg = "#cb4f4f" },
	{ url = "*/", is = "dummy", bg = "#cb4f4f" },

	# Fallback
	{ url = "*/", fg = "#42728b" }
]
    