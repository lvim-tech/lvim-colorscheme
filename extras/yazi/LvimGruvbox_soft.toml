#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme GruvboxSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#9e8d7b", italic = true }

# Find
find_keyword  = { fg = "#1e1d1a", bg = "#cc7942", bold = true }
find_position = { fg = "#9f9182", bg = "#2a2d2e", bold = true }

# Symlink
symlink_target = { fg = "#7f6d5e", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#a6935a", bg = "#a6935a" }
marker_cut      = { fg = "#cb4f4f", bg = "#cb4f4f" }
marker_marked   = { fg = "#bb755e", bg = "#bb755e" }
marker_selected = { fg = "#42728b", bg = "#42728b" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#ffe14b", bg = "#656831" }
count_cut      = { fg = "#fff0bc", bg = "#c53b3b" }
count_selected = { fg = "#f8d900", bg = "#2d695d" }

# Border
border_symbol = "│"
border_style  = { fg = "#595b2f" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#343231" }
current = { bg = "#3b3937" }
preview = { bg = "#3b3937" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#a59786", bg = "#32302f", bold = true }
inactive = { fg = "#8a7a6c", bg = "#282726" }

[mode]
normal_main = { fg = "#fff0bc", bg = "#42728b", bold = true }
normal_alt  = { fg = "#00b5ea", bg = "#403c3b" }

select_main = { fg = "#1e1d1a", bg = "#bb755e", bold = true }
select_alt  = { fg = "#e49277", bg = "#403c3b" }

unset_main  = { fg = "#fbdc00", bg = "#635d71", bold = true }
unset_alt   = { fg = "#aba4ba", bg = "#403c3b" }

[status]
# Progress
progress_label  = { fg = "#9e8d7b", bold = true }
progress_normal = { fg = "#908577", bg = "#1e1d1a" }
progress_error  = { fg = "#fffefc", bg = "#cb4f4f" }

# Permissions
perm_type  = { fg = "#3a97bf" }
perm_read  = { fg = "#af9e6b" }
perm_write = { fg = "#e36a6a" }
perm_exec  = { fg = "#8f9330" }
perm_sep   = { fg = "#7f6d5e" }

[pick]
border   = { fg = "#397793" }
active   = { fg = "#a59786", bg = "#32302f" }
inactive = { fg = "#9e8d7b" }

[input]
border   = { fg = "#397793" }
title    = { fg = "#397793" }
value    = { fg = "#918aa2" }
selected = { fg = "#a59786", bg = "#32302f" }

[cmp]
border   = { fg = "#397793" }
active   = { fg = "#a59786", bg = "#32302f" }
inactive = { fg = "#9e8d7b" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#595b2f" }
title   = { fg = "#9e8d7b" }
hovered = { fg = "#a59786", bg = "#32302f" }

[which]
cols            = 3
mask            = { bg = "#1e1d1a" }
cand            = { fg = "#5a9162" }
rest            = { fg = "#3e8eb2" }
desc            = { fg = "#bb755e" }
separator       = " ➜ "
separator_style = { fg = "#766659" }

[confirm]
border  = { fg = "#397793" }
title   = { fg = "#397793" }
body    = {}
list    = {}
btn_yes = { fg = "#a59786", bg = "#32302f" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#595b2f" }
title    = { fg = "#9e8d7b" }
tbl_col  = { fg = "#3a97bf" }
tbl_cell = { fg = "#af9e6b", bg = "#32302f" }

[notify]
title_info  = { fg = "#179ac5" }
title_warn  = { fg = "#d37836" }
title_error = { fg = "#f65757" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#8f9330" }
run     = { fg = "#c87b61" }
desc    = { fg = "#8a7a6c" }
hovered = { fg = "#a59786", bg = "#32302f", bold = true }
footer  = { fg = "#a59786", bg = "#32302f" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#af9e6b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#c87b61" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e36a6a" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#5e9d66" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#7f6d5e" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#cb4f4f" },
	{ url = "*", is = "exec"  , fg = "#8f9330" },
	{ url = "*", is = "dummy", bg = "#cb4f4f" },
	{ url = "*/", is = "dummy", bg = "#cb4f4f" },

	# Fallback
	{ url = "*/", fg = "#3a97bf" }
]
    