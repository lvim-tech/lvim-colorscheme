#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme KanagawaDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#8585a4", italic = true }

# Find
find_keyword  = { fg = "#17181c", bg = "#c99460", bold = true }
find_position = { fg = "#8d8dac", bg = "#242832", bold = true }

# Symlink
symlink_target = { fg = "#686896", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#debe7e", bg = "#debe7e" }
marker_cut      = { fg = "#b65252", bg = "#b65252" }
marker_marked   = { fg = "#c4746e", bg = "#c4746e" }
marker_selected = { fg = "#4d699b", bg = "#4d699b" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfdff", bg = "#697b52" }
count_cut      = { fg = "#eaeeff", bg = "#b24b4b" }
count_selected = { fg = "#fcfdff", bg = "#4b869b" }

# Border
border_symbol = "│"
border_style  = { fg = "#5a6949" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#2b2c36" }
current = { bg = "#31333f" }
preview = { bg = "#31333f" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#8a8aaa", bg = "#25262d", bold = true }
inactive = { fg = "#747492", bg = "#202127" }

[mode]
normal_main = { fg = "#e3e8ff", bg = "#4d699b", bold = true }
normal_alt  = { fg = "#74a2f0", bg = "#353744" }

select_main = { fg = "#17181c", bg = "#c4746e", bold = true }
select_alt  = { fg = "#d2918d", bg = "#353744" }

unset_main  = { fg = "#f5f7ff", bg = "#766b90", bold = true }
unset_alt   = { fg = "#a79dc0", bg = "#353744" }

[status]
# Progress
progress_label  = { fg = "#8585a4", bold = true }
progress_normal = { fg = "#8080a0", bg = "#17181c" }
progress_error  = { fg = "#f5f7ff", bg = "#b65252" }

# Permissions
perm_type  = { fg = "#548adc" }
perm_read  = { fg = "#e0c286" }
perm_write = { fg = "#d76565" }
perm_exec  = { fg = "#7a925c" }
perm_sep   = { fg = "#686896" }

[pick]
border   = { fg = "#4d6ba2" }
active   = { fg = "#8a8aaa", bg = "#25262d" }
inactive = { fg = "#8585a4" }

[input]
border   = { fg = "#4d6ba2" }
title    = { fg = "#4d6ba2" }
value    = { fg = "#8d82a8" }
selected = { fg = "#8a8aaa", bg = "#25262d" }

[cmp]
border   = { fg = "#4d6ba2" }
active   = { fg = "#8a8aaa", bg = "#25262d" }
inactive = { fg = "#8585a4" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#5a6949" }
title   = { fg = "#8585a4" }
hovered = { fg = "#8a8aaa", bg = "#25262d" }

[which]
cols            = 3
mask            = { bg = "#17181c" }
cand            = { fg = "#5f8982" }
rest            = { fg = "#5482cc" }
desc            = { fg = "#c4746e" }
separator       = " ➜ "
separator_style = { fg = "#61618d" }

[confirm]
border  = { fg = "#4d6ba2" }
title   = { fg = "#4d6ba2" }
body    = {}
list    = {}
btn_yes = { fg = "#8a8aaa", bg = "#25262d" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#5a6949" }
title    = { fg = "#8585a4" }
tbl_col  = { fg = "#548adc" }
tbl_cell = { fg = "#e0c286", bg = "#25262d" }

[notify]
title_info  = { fg = "#518ae0" }
title_warn  = { fg = "#c68f58" }
title_error = { fg = "#de5f5f" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#7a925c" }
run     = { fg = "#c4746e" }
desc    = { fg = "#747492" }
hovered = { fg = "#8a8aaa", bg = "#25262d", bold = true }
footer  = { fg = "#8a8aaa", bg = "#25262d" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#e0c286" },

	# Media
	{ mime = "{audio,video}/*", fg = "#c4746e" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d76565" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#63928a" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#686896" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#b65252" },
	{ url = "*", is = "exec"  , fg = "#7a925c" },
	{ url = "*", is = "dummy", bg = "#b65252" },
	{ url = "*/", is = "dummy", bg = "#b65252" },

	# Fallback
	{ url = "*/", fg = "#548adc" }
]
    