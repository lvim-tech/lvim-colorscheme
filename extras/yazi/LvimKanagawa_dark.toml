#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme KanagawaDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#8585a4", italic = true }

# Find
find_keyword  = { fg = "#1c1d23", bg = "#bf8f62", bold = true }
find_position = { fg = "#8d8dac", bg = "#242832", bold = true }

# Symlink
symlink_target = { fg = "#686896", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#cbae75", bg = "#cbae75" }
marker_cut      = { fg = "#ba5454", bg = "#ba5454" }
marker_marked   = { fg = "#c4726c", bg = "#c4726c" }
marker_selected = { fg = "#4e6a9c", bg = "#4e6a9c" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#f1f3ff", bg = "#64754e" }
count_cut      = { fg = "#edf0ff", bg = "#b34b4b" }
count_selected = { fg = "#f8f9ff", bg = "#4c798b" }

# Border
border_symbol = "│"
border_style  = { fg = "#566446" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#2c2d37" }
current = { bg = "#30323d" }
preview = { bg = "#30323d" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#8787a7", bg = "#222329", bold = true }
inactive = { fg = "#747492", bg = "#202127" }

[mode]
normal_main = { fg = "#e6eaff", bg = "#4e6a9c", bold = true }
normal_alt  = { fg = "#77a3f0", bg = "#363845" }

select_main = { fg = "#1c1d23", bg = "#c4726c", bold = true }
select_alt  = { fg = "#d4928e", bg = "#363845" }

unset_main  = { fg = "#eaedff", bg = "#70658b", bold = true }
unset_alt   = { fg = "#a89ec3", bg = "#363845" }

[status]
# Progress
progress_label  = { fg = "#8585a4", bold = true }
progress_normal = { fg = "#8282a2", bg = "#1c1d23" }
progress_error  = { fg = "#fbfcff", bg = "#ba5454" }

# Permissions
perm_type  = { fg = "#5588d7" }
perm_read  = { fg = "#d1b57c" }
perm_write = { fg = "#d66666" }
perm_exec  = { fg = "#789059" }
perm_sep   = { fg = "#686896" }

[pick]
border   = { fg = "#4d6ca4" }
active   = { fg = "#8787a7", bg = "#222329" }
inactive = { fg = "#8585a4" }

[input]
border   = { fg = "#4d6ca4" }
title    = { fg = "#4d6ca4" }
value    = { fg = "#8f83ab" }
selected = { fg = "#8787a7", bg = "#222329" }

[cmp]
border   = { fg = "#4d6ca4" }
active   = { fg = "#8787a7", bg = "#222329" }
inactive = { fg = "#8585a4" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#566446" }
title   = { fg = "#8585a4" }
hovered = { fg = "#8787a7", bg = "#222329" }

[which]
cols            = 3
mask            = { bg = "#1c1d23" }
cand            = { fg = "#608e86" }
rest            = { fg = "#5586d2" }
desc            = { fg = "#c4726c" }
separator       = " ➜ "
separator_style = { fg = "#656593" }

[confirm]
border  = { fg = "#4d6ca4" }
title   = { fg = "#4d6ca4" }
body    = {}
list    = {}
btn_yes = { fg = "#8787a7", bg = "#222329" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#566446" }
title    = { fg = "#8585a4" }
tbl_col  = { fg = "#5588d7" }
tbl_cell = { fg = "#d1b57c", bg = "#222329" }

[notify]
title_info  = { fg = "#5188dc" }
title_warn  = { fg = "#b7875b" }
title_error = { fg = "#df5f5f" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#789059" }
run     = { fg = "#c4726c" }
desc    = { fg = "#747492" }
hovered = { fg = "#8787a7", bg = "#222329", bold = true }
footer  = { fg = "#8787a7", bg = "#222329" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#d1b57c" },

	# Media
	{ mime = "{audio,video}/*", fg = "#c4726c" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d66666" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#629189" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#686896" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#ba5454" },
	{ url = "*", is = "exec"  , fg = "#789059" },
	{ url = "*", is = "dummy", bg = "#ba5454" },
	{ url = "*/", is = "dummy", bg = "#ba5454" },

	# Fallback
	{ url = "*/", fg = "#5588d7" }
]
    