#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme MaterialLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#c77259", bold = true }
find_position = { fg = "#466264", bg = "#d4d8e2", bold = true }

# Symlink
symlink_target = { fg = "#75848b", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#97722c", bg = "#97722c" }
marker_cut      = { fg = "#a9484d", bg = "#a9484d" }
marker_marked   = { fg = "#b44356", bg = "#b44356" }
marker_selected = { fg = "#3c62a8", bg = "#3c62a8" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#617c3b" }
count_cut      = { fg = "#fcfcfc", bg = "#c34e54" }
count_selected = { fg = "#eeeeee", bg = "#217864" }

# Border
border_symbol = "│"
border_style  = { fg = "#7b915d" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#e0e0e0", bg = "#3c62a8", bold = true }
normal_alt  = { fg = "#394f7f", bg = "#c4c4c4" }

select_main = { fg = "#ebebeb", bg = "#b44356", bold = true }
select_alt  = { fg = "#7e3a44", bg = "#c4c4c4" }

unset_main  = { fg = "#dadada", bg = "#6f567f", bold = true }
unset_alt   = { fg = "#5d4a69", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#e8e8e8", bg = "#a9484d" }

# Permissions
perm_type  = { fg = "#3c62a8" }
perm_read  = { fg = "#7a6138" }
perm_write = { fg = "#a4474c" }
perm_exec  = { fg = "#576a3f" }
perm_sep   = { fg = "#75848b" }

[pick]
border   = { fg = "#436fcb" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#436fcb" }
title    = { fg = "#436fcb" }
value    = { fg = "#6f567f" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#436fcb" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#7b915d" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#3e6373" }
rest            = { fg = "#3c5d9d" }
desc            = { fg = "#9b404e" }
separator       = " ➜ "
separator_style = { fg = "#6f7c82" }

[confirm]
border  = { fg = "#436fcb" }
title   = { fg = "#436fcb" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#7b915d" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#3c62a8" }
tbl_cell = { fg = "#7e6438", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#4363ae" }
title_warn  = { fg = "#9d4f38" }
title_error = { fg = "#a5494d" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#576a3f" }
run     = { fg = "#aa4253" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#7a6138" },

	# Media
	{ mime = "{audio,video}/*", fg = "#aa4253" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a4474c" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#406b7e" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#75848b" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#a9484d" },
	{ url = "*", is = "exec"  , fg = "#576a3f" },
	{ url = "*", is = "dummy", bg = "#a9484d" },
	{ url = "*/", is = "dummy", bg = "#a9484d" },

	# Fallback
	{ url = "*/", fg = "#3c62a8" }
]
    