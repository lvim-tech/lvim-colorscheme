#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme MaterialLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#7a8990", italic = true }

# Find
find_keyword  = { fg = "#dadada", bg = "#c77259", bold = true }
find_position = { fg = "#436fcb", bg = "#d4d8e2", bold = true }

# Symlink
symlink_target = { fg = "#798991", italic = true }

# Marker
marker_copied   = { fg = "#97722c", bg = "#97722c" }
marker_cut      = { fg = "#a9484d", bg = "#a9484d" }
marker_marked   = { fg = "#b44356", bg = "#b44356" }
marker_selected = { fg = "#3c62a8", bg = "#3c62a8" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#5e8888", bg = "#617c3b" }
count_cut      = { fg = "#5e8888", bg = "#c34e54" }
count_selected = { fg = "#5e8888", bg = "#217864" }

# Border
border_symbol = "│"
border_style  = { fg = "#7b915d" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#e9e9e9" }
current = { bg = "#e9e9e9" }
preview = { bg = "#e9e9e9" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#5e8888", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#b6b6b6", bg = "#3c62a8", bold = true }
normal_alt  = { fg = "#3c62a8", bg = "#3c7478" }

select_main = { fg = "#b6b6b6", bg = "#b44356", bold = true }
select_alt  = { fg = "#b44356", bg = "#3c7478" }

unset_main  = { fg = "#b6b6b6", bg = "#6f567f", bold = true }
unset_alt   = { fg = "#6f567f", bg = "#3c7478" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#7a8990", bold = true }
progress_normal = { fg = "#5f7541", bg = "#dadada" }
progress_error  = { fg = "#dadada", bg = "#a9484d" }

# Permissions
perm_type  = { fg = "#3c62a8" }
perm_read  = { fg = "#8b6d37" }
perm_write = { fg = "#a9484d" }
perm_exec  = { fg = "#5f7541" }
perm_sep   = { fg = "#798991" }

[pick]
border   = { fg = "#7b915d" }
active   = { fg = "#5e8888",  bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

[input]
border   = { fg = "#436fcb" }
title    = { fg = "#436fcb" }
value    = { fg = "#6f567f" }
selected = { bg = "#e9e9e9" }

[cmp]
border   = { fg = "#436fcb" }
active   = { fg = "#5e8888", bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#7b915d" }
title   = { fg = "#7b915d" }
hovered = { fg = "#5e8888", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#407e97" }
rest            = { fg = "#3c62a8" }
desc            = { fg = "#b44356" }
separator       = " ➜ "
separator_style = { fg = "#798991" }

[confirm]
border  = { fg = "#436fcb" }
title   = { fg = "#7b915d" }
body    = {}
list    = {}
btn_yes = { bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#7b915d" }
title    = { fg = "#7b915d" }
tbl_col  = { fg = "#3c62a8" }
tbl_cell = { fg = "#8b6d37", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#436fcb" }
title_warn  = { fg = "#a25038" }
title_error = { fg = "#c34e54" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#5f7541" }
run     = { fg = "#b44356" }
desc    = { fg = "#3c7478" }
hovered = { bg = "#e9e9e9", bold = true }
footer  = { fg = "#5e8888", bg = "#E4E4E4" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#8b6d37" },

	# Media
	{ mime = "{audio,video}/*", fg = "#b44356" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a9484d" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#407e97" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#798991" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#a9484d" },
	{ url = "*", is = "exec"  , fg = "#5f7541" },
	{ url = "*", is = "dummy", bg = "#a9484d" },
	{ url = "*/", is = "dummy", bg = "#a9484d" },

	# Fallback
	{ url = "*/", fg = "#3c62a8" }
]
    