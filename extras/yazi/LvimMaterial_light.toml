#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme MaterialLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#c9745b", bold = true }
find_position = { fg = "#466264", bg = "#d6d9e2", bold = true }

# Symlink
symlink_target = { fg = "#75848b", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#997947", bg = "#997947" }
marker_cut      = { fg = "#b14b51", bg = "#b14b51" }
marker_marked   = { fg = "#b04556", bg = "#b04556" }
marker_selected = { fg = "#4d6cae", bg = "#4d6cae" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#748f51" }
count_cut      = { fg = "#fcfcfc", bg = "#ca5157" }
count_selected = { fg = "#fcfcfc", bg = "#4a8f7c" }

# Border
border_symbol = "│"
border_style  = { fg = "#8aa06e" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#f1f1f1", bg = "#4d6cae", bold = true }
normal_alt  = { fg = "#405075", bg = "#c4c4c4" }

select_main = { fg = "#ebebeb", bg = "#b04556", bold = true }
select_alt  = { fg = "#803c45", bg = "#c4c4c4" }

unset_main  = { fg = "#f4f4f4", bg = "#806594", bold = true }
unset_alt   = { fg = "#594b64", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#eeeeee", bg = "#b14b51" }

# Permissions
perm_type  = { fg = "#4b659f" }
perm_read  = { fg = "#776343" }
perm_write = { fg = "#a2484d" }
perm_exec  = { fg = "#5b6b47" }
perm_sep   = { fg = "#75848b" }

[pick]
border   = { fg = "#577acd" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#577acd" }
title    = { fg = "#577acd" }
value    = { fg = "#735d84" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#577acd" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#8aa06e" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#496371" }
rest            = { fg = "#485e90" }
desc            = { fg = "#9c4250" }
separator       = " ➜ "
separator_style = { fg = "#6f7c82" }

[confirm]
border  = { fg = "#577acd" }
title   = { fg = "#577acd" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#8aa06e" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#4b659f" }
tbl_cell = { fg = "#7a6544", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#4f649e" }
title_warn  = { fg = "#97523f" }
title_error = { fg = "#a2494d" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#5b6b47" }
run     = { fg = "#a64453" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#776343" },

	# Media
	{ mime = "{audio,video}/*", fg = "#a64453" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a2484d" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#4b6978" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#75848b" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#b14b51" },
	{ url = "*", is = "exec"  , fg = "#5b6b47" },
	{ url = "*", is = "dummy", bg = "#b14b51" },
	{ url = "*/", is = "dummy", bg = "#b14b51" },

	# Fallback
	{ url = "*/", fg = "#4b659f" }
]
    