#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme NightfoxLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#696e75", italic = true }

# Find
find_keyword  = { fg = "#dadada", bg = "#a9754b", bold = true }
find_position = { fg = "#4f6e97", bg = "#d5d8dc", bold = true }

# Symlink
symlink_target = { fg = "#646f7d", italic = true }

# Marker
marker_copied   = { fg = "#907d48", bg = "#907d48" }
marker_cut      = { fg = "#a65c6e", bg = "#a65c6e" }
marker_marked   = { fg = "#725986", bg = "#725986" }
marker_selected = { fg = "#4a607e", bg = "#4a607e" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#5e8888", bg = "#6d8f7f" }
count_cut      = { fg = "#5e8888", bg = "#c35f78" }
count_selected = { fg = "#5e8888", bg = "#498789" }

# Border
border_symbol = "│"
border_style  = { fg = "#85a093" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#e9e9e9" }
current = { bg = "#e9e9e9" }
preview = { bg = "#e9e9e9" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#5e8888", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#b6b6b6", bg = "#4a607e", bold = true }
normal_alt  = { fg = "#4a607e", bg = "#3c7478" }

select_main = { fg = "#b6b6b6", bg = "#725986", bold = true }
select_alt  = { fg = "#725986", bg = "#3c7478" }

unset_main  = { fg = "#b6b6b6", bg = "#725b95", bold = true }
unset_alt   = { fg = "#725b95", bg = "#3c7478" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#696e75", bold = true }
progress_normal = { fg = "#6b8578", bg = "#dadada" }
progress_error  = { fg = "#dadada", bg = "#a65c6e" }

# Permissions
perm_type  = { fg = "#4a607e" }
perm_read  = { fg = "#86774d" }
perm_write = { fg = "#a65c6e" }
perm_exec  = { fg = "#6b8578" }
perm_sep   = { fg = "#646f7d" }

[pick]
border   = { fg = "#85a093" }
active   = { fg = "#5e8888",  bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

[input]
border   = { fg = "#4f6e97" }
title    = { fg = "#4f6e97" }
value    = { fg = "#725b95" }
selected = { bg = "#e9e9e9" }

[cmp]
border   = { fg = "#4f6e97" }
active   = { fg = "#5e8888", bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#85a093" }
title   = { fg = "#85a093" }
hovered = { fg = "#5e8888", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#4e7f80" }
rest            = { fg = "#4a607e" }
desc            = { fg = "#725986" }
separator       = " ➜ "
separator_style = { fg = "#646f7d" }

[confirm]
border  = { fg = "#4f6e97" }
title   = { fg = "#85a093" }
body    = {}
list    = {}
btn_yes = { bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#85a093" }
title    = { fg = "#85a093" }
tbl_col  = { fg = "#4a607e" }
tbl_cell = { fg = "#86774d", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#4f6e97" }
title_warn  = { fg = "#bc7843" }
title_error = { fg = "#c35f78" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#6b8578" }
run     = { fg = "#725986" }
desc    = { fg = "#3c7478" }
hovered = { bg = "#e9e9e9", bold = true }
footer  = { fg = "#5e8888", bg = "#E4E4E4" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#86774d" },

	# Media
	{ mime = "{audio,video}/*", fg = "#725986" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a65c6e" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#4e7f80" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#646f7d" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#a65c6e" },
	{ url = "*", is = "exec"  , fg = "#6b8578" },
	{ url = "*", is = "dummy", bg = "#a65c6e" },
	{ url = "*/", is = "dummy", bg = "#a65c6e" },

	# Fallback
	{ url = "*/", fg = "#4a607e" }
]
    