#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme NightfoxLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#ac7a53", bold = true }
find_position = { fg = "#466264", bg = "#d6dade", bold = true }

# Symlink
symlink_target = { fg = "#646f7d", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#938151", bg = "#938151" }
marker_cut      = { fg = "#a75d70", bg = "#a75d70" }
marker_marked   = { fg = "#755a88", bg = "#755a88" }
marker_selected = { fg = "#546d8e", bg = "#546d8e" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#ebebeb", bg = "#557063" }
count_cut      = { fg = "#fcfcfc", bg = "#c55f78" }
count_selected = { fg = "#e0e0e0", bg = "#3e6b5e" }

# Border
border_symbol = "│"
border_style  = { fg = "#72877d" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#eeeeee", bg = "#546d8e", bold = true }
normal_alt  = { fg = "#445266", bg = "#c4c4c4" }

select_main = { fg = "#e2e2e2", bg = "#755a88", bold = true }
select_alt  = { fg = "#5c4a69", bg = "#c4c4c4" }

unset_main  = { fg = "#fcfcfc", bg = "#8069a2", bold = true }
unset_alt   = { fg = "#564a69", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#fcfcfc", bg = "#a75d70" }

# Permissions
perm_type  = { fg = "#506582" }
perm_read  = { fg = "#6f6448" }
perm_write = { fg = "#8e5362" }
perm_exec  = { fg = "#586860" }
perm_sep   = { fg = "#646f7d" }

[pick]
border   = { fg = "#597ba8" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#597ba8" }
title    = { fg = "#597ba8" }
value    = { fg = "#705c8d" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#597ba8" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#72877d" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#496262" }
rest            = { fg = "#4d607b" }
desc            = { fg = "#6f5680" }
separator       = " ➜ "
separator_style = { fg = "#646f7d" }

[confirm]
border  = { fg = "#597ba8" }
title   = { fg = "#597ba8" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#72877d" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#506582" }
tbl_cell = { fg = "#716649", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#4f6787" }
title_warn  = { fg = "#835739" }
title_error = { fg = "#93505f" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#586860" }
run     = { fg = "#755a88" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#6f6448" },

	# Media
	{ mime = "{audio,video}/*", fg = "#755a88" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#8e5362" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#4d6a6a" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#646f7d" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#a75d70" },
	{ url = "*", is = "exec"  , fg = "#586860" },
	{ url = "*", is = "dummy", bg = "#a75d70" },
	{ url = "*/", is = "dummy", bg = "#a75d70" },

	# Fallback
	{ url = "*/", fg = "#506582" }
]
    