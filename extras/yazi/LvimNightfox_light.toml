#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme NightfoxLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#a9754b", bold = true }
find_position = { fg = "#466264", bg = "#d5d8dc", bold = true }

# Symlink
symlink_target = { fg = "#646f7d", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#907d48", bg = "#907d48" }
marker_cut      = { fg = "#a65c6e", bg = "#a65c6e" }
marker_marked   = { fg = "#725986", bg = "#725986" }
marker_selected = { fg = "#4a607e", bg = "#4a607e" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#6d8f7f" }
count_cut      = { fg = "#fcfcfc", bg = "#c35f78" }
count_selected = { fg = "#fcfcfc", bg = "#498789" }

# Border
border_symbol = "│"
border_style  = { fg = "#85a093" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#dadada", bg = "#4a607e", bold = true }
normal_alt  = { fg = "#425168", bg = "#c4c4c4" }

select_main = { fg = "#e0e0e0", bg = "#725986", bold = true }
select_alt  = { fg = "#5a4968", bg = "#c4c4c4" }

unset_main  = { fg = "#e5e5e5", bg = "#725b95", bold = true }
unset_alt   = { fg = "#584a6f", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#f9f9f9", bg = "#a65c6e" }

# Permissions
perm_type  = { fg = "#4a607e" }
perm_read  = { fg = "#6e6346" }
perm_write = { fg = "#915462" }
perm_exec  = { fg = "#596a61" }
perm_sep   = { fg = "#646f7d" }

[pick]
border   = { fg = "#4f6e97" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#4f6e97" }
title    = { fg = "#4f6e97" }
value    = { fg = "#725b95" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#4f6e97" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#85a093" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#456364" }
rest            = { fg = "#4a607e" }
desc            = { fg = "#6c557e" }
separator       = " ➜ "
separator_style = { fg = "#646f7d" }

[confirm]
border  = { fg = "#4f6e97" }
title   = { fg = "#4f6e97" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#85a093" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#4a607e" }
tbl_cell = { fg = "#746848", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#4c668b" }
title_warn  = { fg = "#855b41" }
title_error = { fg = "#955161" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#596a61" }
run     = { fg = "#725986" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#6e6346" },

	# Media
	{ mime = "{audio,video}/*", fg = "#725986" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#915462" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#486c6c" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#646f7d" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#a65c6e" },
	{ url = "*", is = "exec"  , fg = "#596a61" },
	{ url = "*", is = "dummy", bg = "#a65c6e" },
	{ url = "*/", is = "dummy", bg = "#a65c6e" },

	# Fallback
	{ url = "*/", fg = "#4a607e" }
]
    