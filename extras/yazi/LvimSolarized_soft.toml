#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme SolarizedSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#5f6a6e", italic = true }

# Find
find_keyword  = { fg = "#002832", bg = "#ac5835", bold = true }
find_position = { fg = "#3d7aa5", bg = "#063b4b", bold = true }

# Symlink
symlink_target = { fg = "#5d6a6f", italic = true }

# Marker
marker_copied   = { fg = "#886e1c", bg = "#886e1c" }
marker_cut      = { fg = "#bf4e4c", bg = "#bf4e4c" }
marker_marked   = { fg = "#b75283", bg = "#b75283" }
marker_selected = { fg = "#4386b5", bg = "#4386b5" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#9da4a4", bg = "#687418" }
count_cut      = { fg = "#9da4a4", bg = "#b34240" }
count_selected = { fg = "#9da4a4", bg = "#38807b" }

# Border
border_symbol = "│"
border_style  = { fg = "#536720" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#084452" }
current = { bg = "#084452" }
preview = { bg = "#084452" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#9da4a4", bg = "#084452", bold = true }
inactive = { fg = "#6c777b", bg = "#003441" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#002a34", bg = "#4386b5", bold = true }
normal_alt  = { fg = "#4386b5", bg = "#6c777b" }

select_main = { fg = "#002a34", bg = "#b75283", bold = true }
select_alt  = { fg = "#b75283", bg = "#6c777b" }

unset_main  = { fg = "#002a34", bg = "#8385a2", bold = true }
unset_alt   = { fg = "#8385a2", bg = "#6c777b" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#5f6a6e", bold = true }
progress_normal = { fg = "#727f1a", bg = "#002832" }
progress_error  = { fg = "#002832", bg = "#bf4e4c" }

# Permissions
perm_type  = { fg = "#4386b5" }
perm_read  = { fg = "#96791f" }
perm_write = { fg = "#bf4e4c" }
perm_exec  = { fg = "#727f1a" }
perm_sep   = { fg = "#5d6a6f" }

[pick]
border   = { fg = "#536720" }
active   = { fg = "#9da4a4",  bg = "#084452" }
inactive = { fg = "#9da4a4" }

[input]
border   = { fg = "#3d7aa5" }
title    = { fg = "#3d7aa5" }
value    = { fg = "#8385a2" }
selected = { bg = "#084452" }

[cmp]
border   = { fg = "#3d7aa5" }
active   = { fg = "#9da4a4", bg = "#084452" }
inactive = { fg = "#9da4a4" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#536720" }
title   = { fg = "#536720" }
hovered = { fg = "#9da4a4", bg = "#084452" }

[which]
cols            = 3
mask            = { bg = "#002832" }
cand            = { fg = "#3e8d87" }
rest            = { fg = "#4386b5" }
desc            = { fg = "#b75283" }
separator       = " ➜ "
separator_style = { fg = "#5d6a6f" }

[confirm]
border  = { fg = "#3d7aa5" }
title   = { fg = "#536720" }
body    = {}
list    = {}
btn_yes = { bg = "#084452" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#536720" }
title    = { fg = "#536720" }
tbl_col  = { fg = "#4386b5" }
tbl_cell = { fg = "#96791f", bg = "#084452" }

[notify]
title_info  = { fg = "#3d7aa5" }
title_warn  = { fg = "#9d5030" }
title_error = { fg = "#b34240" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#727f1a" }
run     = { fg = "#b75283" }
desc    = { fg = "#6c777b" }
hovered = { bg = "#084452", bold = true }
footer  = { fg = "#9da4a4", bg = "#003441" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#96791f" },

	# Media
	{ mime = "{audio,video}/*", fg = "#b75283" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#bf4e4c" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#3e8d87" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#5d6a6f" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#bf4e4c" },
	{ url = "*", is = "exec"  , fg = "#727f1a" },
	{ url = "*", is = "dummy", bg = "#bf4e4c" },
	{ url = "*/", is = "dummy", bg = "#bf4e4c" },

	# Fallback
	{ url = "*/", fg = "#4386b5" }
]
    