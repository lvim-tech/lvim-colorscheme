#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme SolarizedSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#9da4a4", italic = true }

# Find
find_keyword  = { fg = "#e5f7ff", bg = "#ac5835", bold = true }
find_position = { fg = "#98a1a1", bg = "#063b4b", bold = true }

# Symlink
symlink_target = { fg = "#6b7c83", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#886e1c", bg = "#886e1c" }
marker_cut      = { fg = "#bf4e4c", bg = "#bf4e4c" }
marker_marked   = { fg = "#b75283", bg = "#b75283" }
marker_selected = { fg = "#4386b5", bg = "#4386b5" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#def5ff", bg = "#687418" }
count_cut      = { fg = "#c8eeff", bg = "#b34240" }
count_selected = { fg = "#f9fdff", bg = "#38807b" }

# Border
border_symbol = "│"
border_style  = { fg = "#536720" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#084452" }
current = { bg = "#024756" }
preview = { bg = "#024756" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#a2acac", bg = "#084452", bold = true }
inactive = { fg = "#79878c", bg = "#003441" }

[mode]
normal_main = { fg = "#f9fdff", bg = "#4386b5", bold = true }
normal_alt  = { fg = "#79c4ff", bg = "#105363" }

select_main = { fg = "#f9fdff", bg = "#b75283", bold = true }
select_alt  = { fg = "#f7a3c7", bg = "#105363" }

unset_main  = { fg = "#f9fdff", bg = "#8385a2", bold = true }
unset_alt   = { fg = "#b9bbd1", bg = "#105363" }

[status]
# Progress
progress_label  = { fg = "#9da4a4", bold = true }
progress_normal = { fg = "#969e9e", bg = "#002832" }
progress_error  = { fg = "#f3fbff", bg = "#bf4e4c" }

# Permissions
perm_type  = { fg = "#34a0df" }
perm_read  = { fg = "#b79200" }
perm_write = { fg = "#e87472" }
perm_exec  = { fg = "#8fa000" }
perm_sep   = { fg = "#6b7c83" }

[pick]
border   = { fg = "#3b80ae" }
active   = { fg = "#a2acac", bg = "#084452" }
inactive = { fg = "#9da4a4" }

[input]
border   = { fg = "#3b80ae" }
title    = { fg = "#3b80ae" }
value    = { fg = "#9395b1" }
selected = { fg = "#a2acac", bg = "#084452" }

[cmp]
border   = { fg = "#3b80ae" }
active   = { fg = "#a2acac", bg = "#084452" }
inactive = { fg = "#9da4a4" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#536720" }
title   = { fg = "#9da4a4" }
hovered = { fg = "#a2acac", bg = "#084452" }

[which]
cols            = 3
mask            = { bg = "#002832" }
cand            = { fg = "#3a9992" }
rest            = { fg = "#3f91c7" }
desc            = { fg = "#de5f9d" }
separator       = " ➜ "
separator_style = { fg = "#637277" }

[confirm]
border  = { fg = "#3b80ae" }
title   = { fg = "#3b80ae" }
body    = {}
list    = {}
btn_yes = { fg = "#a2acac", bg = "#084452" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#536720" }
title    = { fg = "#9da4a4" }
tbl_col  = { fg = "#34a0df" }
tbl_cell = { fg = "#cda400", bg = "#084452" }

[notify]
title_info  = { fg = "#179fe2" }
title_warn  = { fg = "#f66c00" }
title_error = { fg = "#f46a68" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#8fa000" }
run     = { fg = "#e46fa7" }
desc    = { fg = "#79878c" }
hovered = { fg = "#a2acac", bg = "#084452", bold = true }
footer  = { fg = "#a2acac", bg = "#084452" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#b79200" },

	# Media
	{ mime = "{audio,video}/*", fg = "#e46fa7" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e87472" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#2fa9a1" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#6b7c83" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#bf4e4c" },
	{ url = "*", is = "exec"  , fg = "#8fa000" },
	{ url = "*", is = "dummy", bg = "#bf4e4c" },
	{ url = "*/", is = "dummy", bg = "#bf4e4c" },

	# Fallback
	{ url = "*/", fg = "#34a0df" }
]
    