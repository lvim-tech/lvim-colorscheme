#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme SolarizedSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#9da4a4", italic = true }

# Find
find_keyword  = { fg = "#fdfeff", bg = "#b46548", bold = true }
find_position = { fg = "#98a1a1", bg = "#073a49", bold = true }

# Symlink
symlink_target = { fg = "#6b7c83", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#917b43", bg = "#917b43" }
marker_cut      = { fg = "#c24f4d", bg = "#c24f4d" }
marker_marked   = { fg = "#c0578a", bg = "#c0578a" }
marker_selected = { fg = "#4f7ea3", bg = "#4f7ea3" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#d6f1ff", bg = "#666f37" }
count_cut      = { fg = "#cfefff", bg = "#b34644" }
count_selected = { fg = "#e4f5ff", bg = "#407862" }

# Border
border_symbol = "│"
border_style  = { fg = "#526339" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#00404f" }
current = { bg = "#004757" }
preview = { bg = "#004757" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#969e9e", bg = "#023643", bold = true }
inactive = { fg = "#79878c", bg = "#003441" }

[mode]
normal_main = { fg = "#fdfeff", bg = "#4f7ea3", bold = true }
normal_alt  = { fg = "#63bbf9", bg = "#004c5d" }

select_main = { fg = "#fdfeff", bg = "#c0578a", bold = true }
select_alt  = { fg = "#f098bf", bg = "#004c5d" }

unset_main  = { fg = "#fdfeff", bg = "#757797", bold = true }
unset_alt   = { fg = "#b0b1cc", bg = "#004c5d" }

[status]
# Progress
progress_label  = { fg = "#9da4a4", bold = true }
progress_normal = { fg = "#969e9e", bg = "#00303d" }
progress_error  = { fg = "#fdfeff", bg = "#c24f4d" }

# Permissions
perm_type  = { fg = "#4f9dd2" }
perm_read  = { fg = "#b39447" }
perm_write = { fg = "#e77371" }
perm_exec  = { fg = "#91a031" }
perm_sep   = { fg = "#6b7c83" }

[pick]
border   = { fg = "#487ea8" }
active   = { fg = "#969e9e", bg = "#023643" }
inactive = { fg = "#9da4a4" }

[input]
border   = { fg = "#487ea8" }
title    = { fg = "#487ea8" }
value    = { fg = "#9496b5" }
selected = { fg = "#969e9e", bg = "#023643" }

[cmp]
border   = { fg = "#487ea8" }
active   = { fg = "#969e9e", bg = "#023643" }
inactive = { fg = "#9da4a4" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#526339" }
title   = { fg = "#9da4a4" }
hovered = { fg = "#969e9e", bg = "#023643" }

[which]
cols            = 3
mask            = { bg = "#00303d" }
cand            = { fg = "#4ba099" }
rest            = { fg = "#509ace" }
desc            = { fg = "#de6ca3" }
separator       = " ➜ "
separator_style = { fg = "#67777d" }

[confirm]
border  = { fg = "#487ea8" }
title   = { fg = "#487ea8" }
body    = {}
list    = {}
btn_yes = { fg = "#969e9e", bg = "#023643" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#526339" }
title    = { fg = "#9da4a4" }
tbl_col  = { fg = "#4f9dd2" }
tbl_cell = { fg = "#b79746", bg = "#023643" }

[notify]
title_info  = { fg = "#3ea0de" }
title_warn  = { fg = "#ee743a" }
title_error = { fg = "#f0706e" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#91a031" }
run     = { fg = "#e273a7" }
desc    = { fg = "#79878c" }
hovered = { fg = "#969e9e", bg = "#023643", bold = true }
footer  = { fg = "#969e9e", bg = "#023643" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#b39447" },

	# Media
	{ mime = "{audio,video}/*", fg = "#e273a7" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e77371" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#49a69f" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#6b7c83" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#c24f4d" },
	{ url = "*", is = "exec"  , fg = "#91a031" },
	{ url = "*", is = "dummy", bg = "#c24f4d" },
	{ url = "*/", is = "dummy", bg = "#c24f4d" },

	# Fallback
	{ url = "*/", fg = "#4f9dd2" }
]
    