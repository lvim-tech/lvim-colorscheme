#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme TokyonightDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#b2b6c7", italic = true }

# Find
find_keyword  = { fg = "#191c24", bg = "#bb866d", bold = true }
find_position = { fg = "#b5b9ca", bg = "#232733", bold = true }

# Symlink
symlink_target = { fg = "#636988", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#ad9170", bg = "#ad9170" }
marker_cut      = { fg = "#bb6171", bg = "#bb6171" }
marker_marked   = { fg = "#907bba", bg = "#907bba" }
marker_selected = { fg = "#6073a4", bg = "#6073a4" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfdff", bg = "#697b58" }
count_cut      = { fg = "#f5f7ff", bg = "#ac5764" }
count_selected = { fg = "#e1e9ff", bg = "#4e6f66" }

# Border
border_symbol = "│"
border_style  = { fg = "#5a694e" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#272c3a" }
current = { bg = "#2c3344" }
preview = { bg = "#2c3344" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#b5b9ca", bg = "#1f222a", bold = true }
inactive = { fg = "#7f8296", bg = "#1d2028" }

[mode]
normal_main = { fg = "#fcfdff", bg = "#6073a4", bold = true }
normal_alt  = { fg = "#8a9fd8", bg = "#303749" }

select_main = { fg = "#191c24", bg = "#907bba", bold = true }
select_alt  = { fg = "#a996d1", bg = "#303749" }

unset_main  = { fg = "#e5ecff", bg = "#73638e", bold = true }
unset_alt   = { fg = "#a999c4", bg = "#303749" }

[status]
# Progress
progress_label  = { fg = "#b2b6c7", bold = true }
progress_normal = { fg = "#b5b9ca", bg = "#191c24" }
progress_error  = { fg = "#fcfdff", bg = "#bb6171" }

# Permissions
perm_type  = { fg = "#6f87c4" }
perm_read  = { fg = "#b79d7b" }
perm_write = { fg = "#c86b7b" }
perm_exec  = { fg = "#7a8d68" }
perm_sep   = { fg = "#636988" }

[pick]
border   = { fg = "#576a9c" }
active   = { fg = "#b5b9ca", bg = "#1f222a" }
inactive = { fg = "#b2b6c7" }

[input]
border   = { fg = "#576a9c" }
title    = { fg = "#576a9c" }
value    = { fg = "#9281af" }
selected = { fg = "#b5b9ca", bg = "#1f222a" }

[cmp]
border   = { fg = "#576a9c" }
active   = { fg = "#b5b9ca", bg = "#1f222a" }
inactive = { fg = "#b2b6c7" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#5a694e" }
title   = { fg = "#b2b6c7" }
hovered = { fg = "#b5b9ca", bg = "#1f222a" }

[which]
cols            = 3
mask            = { bg = "#191c24" }
cand            = { fg = "#6787a0" }
rest            = { fg = "#6c85c1" }
desc            = { fg = "#907bba" }
separator       = " ➜ "
separator_style = { fg = "#616784" }

[confirm]
border  = { fg = "#576a9c" }
title   = { fg = "#576a9c" }
body    = {}
list    = {}
btn_yes = { fg = "#b5b9ca", bg = "#1f222a" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#5a694e" }
title    = { fg = "#b2b6c7" }
tbl_col  = { fg = "#6f87c4" }
tbl_cell = { fg = "#b79d7b", bg = "#1f222a" }

[notify]
title_info  = { fg = "#6985cb" }
title_warn  = { fg = "#b17a63" }
title_error = { fg = "#cf6878" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#7a8d68" }
run     = { fg = "#937ebd" }
desc    = { fg = "#7f8296" }
hovered = { fg = "#b5b9ca", bg = "#1f222a", bold = true }
footer  = { fg = "#b5b9ca", bg = "#1f222a" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#b79d7b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#937ebd" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c86b7b" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#6a8da7" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#636988" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#bb6171" },
	{ url = "*", is = "exec"  , fg = "#7a8d68" },
	{ url = "*", is = "dummy", bg = "#bb6171" },
	{ url = "*/", is = "dummy", bg = "#bb6171" },

	# Fallback
	{ url = "*/", fg = "#6f87c4" }
]
    