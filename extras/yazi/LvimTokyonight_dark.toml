#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme TokyonightDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#5e6274", italic = true }

# Find
find_keyword  = { fg = "#13131a", bg = "#dd8b5a", bold = true }
find_position = { fg = "#4e78d1", bg = "#1f2437", bold = true }

# Symlink
symlink_target = { fg = "#616784", italic = true }

# Marker
marker_copied   = { fg = "#bd9357", bg = "#bd9357" }
marker_cut      = { fg = "#d76479", bg = "#d76479" }
marker_marked   = { fg = "#9470d5", bg = "#9470d5" }
marker_selected = { fg = "#6589d7", bg = "#6589d7" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#b2b6c7", bg = "#8fb468" }
count_cut      = { fg = "#b2b6c7", bg = "#d14d66" }
count_selected = { fg = "#b2b6c7", bg = "#31927e" }

# Border
border_symbol = "│"
border_style  = { fg = "#78955b" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#222534" }
current = { bg = "#222534" }
preview = { bg = "#222534" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#b2b6c7", bg = "#222534", bold = true }
inactive = { fg = "#7f8296", bg = "#1a1b26" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#15161e", bg = "#6589d7", bold = true }
normal_alt  = { fg = "#6589d7", bg = "#7f8296" }

select_main = { fg = "#15161e", bg = "#9470d5", bold = true }
select_alt  = { fg = "#9470d5", bg = "#7f8296" }

unset_main  = { fg = "#15161e", bg = "#9381b3", bold = true }
unset_alt   = { fg = "#9381b3", bg = "#7f8296" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#5e6274", bold = true }
progress_normal = { fg = "#9dbd7b", bg = "#13131a" }
progress_error  = { fg = "#13131a", bg = "#d76479" }

# Permissions
perm_type  = { fg = "#6589d7" }
perm_read  = { fg = "#c5a06b" }
perm_write = { fg = "#d76479" }
perm_exec  = { fg = "#9dbd7b" }
perm_sep   = { fg = "#616784" }

[pick]
border   = { fg = "#78955b" }
active   = { fg = "#b2b6c7",  bg = "#222534" }
inactive = { fg = "#b2b6c7" }

[input]
border   = { fg = "#4e78d1" }
title    = { fg = "#4e78d1" }
value    = { fg = "#9381b3" }
selected = { bg = "#222534" }

[cmp]
border   = { fg = "#4e78d1" }
active   = { fg = "#b2b6c7", bg = "#222534" }
inactive = { fg = "#b2b6c7" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#78955b" }
title   = { fg = "#78955b" }
hovered = { fg = "#b2b6c7", bg = "#222534" }

[which]
cols            = 3
mask            = { bg = "#13131a" }
cand            = { fg = "#60b0de" }
rest            = { fg = "#6589d7" }
desc            = { fg = "#9470d5" }
separator       = " ➜ "
separator_style = { fg = "#616784" }

[confirm]
border  = { fg = "#4e78d1" }
title   = { fg = "#78955b" }
body    = {}
list    = {}
btn_yes = { bg = "#222534" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#78955b" }
title    = { fg = "#78955b" }
tbl_col  = { fg = "#6589d7" }
tbl_cell = { fg = "#c5a06b", bg = "#222534" }

[notify]
title_info  = { fg = "#4e78d1" }
title_warn  = { fg = "#d87b43" }
title_error = { fg = "#d14d66" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#9dbd7b" }
run     = { fg = "#9470d5" }
desc    = { fg = "#7f8296" }
hovered = { bg = "#222534", bold = true }
footer  = { fg = "#b2b6c7", bg = "#1a1b26" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#c5a06b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#9470d5" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d76479" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#60b0de" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#616784" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#d76479" },
	{ url = "*", is = "exec"  , fg = "#9dbd7b" },
	{ url = "*", is = "dummy", bg = "#d76479" },
	{ url = "*/", is = "dummy", bg = "#d76479" },

	# Fallback
	{ url = "*/", fg = "#6589d7" }
]
    