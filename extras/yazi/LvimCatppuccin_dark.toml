#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme CatppuccinDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#b2b7c7", italic = true }

# Find
find_keyword  = { fg = "#11111b", bg = "#da9366", bold = true }
find_position = { fg = "#b2b7c7", bg = "#23283f", bold = true }

# Symlink
symlink_target = { fg = "#6c7393", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#d2ad5c", bg = "#d2ad5c" }
marker_cut      = { fg = "#d36d89", bg = "#d36d89" }
marker_marked   = { fg = "#d07fba", bg = "#d07fba" }
marker_selected = { fg = "#6793da", bg = "#6793da" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#11111b", bg = "#71b96b" }
count_cut      = { fg = "#11111b", bg = "#cc5777" }
count_selected = { fg = "#11111b", bg = "#66baac" }

# Border
border_symbol = "│"
border_style  = { fg = "#609a5f" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#292a39" }
current = { bg = "#2f3044" }
preview = { bg = "#2f3044" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#b2b7c7", bg = "#292a39", bold = true }
inactive = { fg = "#9b9eaa", bg = "#1e1e2e" }

[mode]
normal_main = { fg = "#11111b", bg = "#6793da", bold = true }
normal_alt  = { fg = "#79a0e4", bg = "#343644" }

select_main = { fg = "#11111b", bg = "#d07fba", bold = true }
select_alt  = { fg = "#d689c0", bg = "#343644" }

unset_main  = { fg = "#11111b", bg = "#a183c5", bold = true }
unset_alt   = { fg = "#b094d2", bg = "#343644" }

[status]
# Progress
progress_label  = { fg = "#b2b7c7", bold = true }
progress_normal = { fg = "#b2b7c7", bg = "#11111b" }
progress_error  = { fg = "#11111b", bg = "#d36d89" }

# Permissions
perm_type  = { fg = "#6793da" }
perm_read  = { fg = "#d8b973" }
perm_write = { fg = "#d36d89" }
perm_exec  = { fg = "#84c27f" }
perm_sep   = { fg = "#6c7393" }

[pick]
border   = { fg = "#5082d4" }
active   = { fg = "#b2b7c7", bg = "#292a39" }
inactive = { fg = "#b2b7c7" }

[input]
border   = { fg = "#5082d4" }
title    = { fg = "#5082d4" }
value    = { fg = "#a183c5" }
selected = { fg = "#b2b7c7", bg = "#292a39" }

[cmp]
border   = { fg = "#5082d4" }
active   = { fg = "#b2b7c7", bg = "#292a39" }
inactive = { fg = "#b2b7c7" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#609a5f" }
title   = { fg = "#b2b7c7" }
hovered = { fg = "#b2b7c7", bg = "#292a39" }

[which]
cols            = 3
mask            = { bg = "#11111b" }
cand            = { fg = "#71becc" }
rest            = { fg = "#6793da" }
desc            = { fg = "#d07fba" }
separator       = " ➜ "
separator_style = { fg = "#6c7393" }

[confirm]
border  = { fg = "#5082d4" }
title   = { fg = "#5082d4" }
body    = {}
list    = {}
btn_yes = { fg = "#b2b7c7", bg = "#292a39" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#609a5f" }
title    = { fg = "#b2b7c7" }
tbl_col  = { fg = "#6793da" }
tbl_cell = { fg = "#d8b973", bg = "#292a39" }

[notify]
title_info  = { fg = "#5087df" }
title_warn  = { fg = "#d4834f" }
title_error = { fg = "#d86181" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#84c27f" }
run     = { fg = "#d07fba" }
desc    = { fg = "#9b9eaa" }
hovered = { fg = "#b2b7c7", bg = "#292a39", bold = true }
footer  = { fg = "#b2b7c7", bg = "#292a39" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#d8b973" },

	# Media
	{ mime = "{audio,video}/*", fg = "#d07fba" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d36d89" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#71becc" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#6c7393" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#d36d89" },
	{ url = "*", is = "exec"  , fg = "#84c27f" },
	{ url = "*", is = "dummy", bg = "#d36d89" },
	{ url = "*/", is = "dummy", bg = "#d36d89" },

	# Fallback
	{ url = "*/", fg = "#6793da" }
]
    