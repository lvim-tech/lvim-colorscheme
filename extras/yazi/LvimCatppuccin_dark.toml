#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme CatppuccinDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#b2b7c7", italic = true }

# Find
find_keyword  = { fg = "#191a23", bg = "#b88970", bold = true }
find_position = { fg = "#b2b7c7", bg = "#232532", bold = true }

# Symlink
symlink_target = { fg = "#6c7393", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#af9973", bg = "#af9973" }
marker_cut      = { fg = "#b7657a", bg = "#b7657a" }
marker_marked   = { fg = "#b976a7", bg = "#b976a7" }
marker_selected = { fg = "#6076a0", bg = "#6076a0" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fdfeff", bg = "#5b7e59" }
count_cut      = { fg = "#f7f7ff", bg = "#a85a6d" }
count_selected = { fg = "#fafbff", bg = "#577972" }

# Border
border_symbol = "│"
border_style  = { fg = "#4f6b4f" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#282a39" }
current = { bg = "#2e3044" }
preview = { bg = "#2e3044" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#b2b7c7", bg = "#1f2029", bold = true }
inactive = { fg = "#9b9eaa", bg = "#1d1e27" }

[mode]
normal_main = { fg = "#fdfeff", bg = "#6076a0", bold = true }
normal_alt  = { fg = "#829fd7", bg = "#323449" }

select_main = { fg = "#191a23", bg = "#b976a7", bold = true }
select_alt  = { fg = "#c88bb7", bg = "#323449" }

unset_main  = { fg = "#edeeff", bg = "#7c609b", bold = true }
unset_alt   = { fg = "#af94d0", bg = "#323449" }

[status]
# Progress
progress_label  = { fg = "#b2b7c7", bold = true }
progress_normal = { fg = "#b2b7c7", bg = "#191a23" }
progress_error  = { fg = "#fdfeff", bg = "#b7657a" }

# Permissions
perm_type  = { fg = "#6a88be" }
perm_read  = { fg = "#b8a47e" }
perm_write = { fg = "#c26b81" }
perm_exec  = { fg = "#6d906b" }
perm_sep   = { fg = "#6c7393" }

[pick]
border   = { fg = "#556a95" }
active   = { fg = "#b2b7c7", bg = "#1f2029" }
inactive = { fg = "#b2b7c7" }

[input]
border   = { fg = "#556a95" }
title    = { fg = "#556a95" }
value    = { fg = "#9679b9" }
selected = { fg = "#b2b7c7", bg = "#1f2029" }

[cmp]
border   = { fg = "#556a95" }
active   = { fg = "#b2b7c7", bg = "#1f2029" }
inactive = { fg = "#b2b7c7" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#4f6b4f" }
title   = { fg = "#b2b7c7" }
hovered = { fg = "#b2b7c7", bg = "#1f2029" }

[which]
cols            = 3
mask            = { bg = "#191a23" }
cand            = { fg = "#668a91" }
rest            = { fg = "#6783b5" }
desc            = { fg = "#b976a7" }
separator       = " ➜ "
separator_style = { fg = "#6c7393" }

[confirm]
border  = { fg = "#556a95" }
title   = { fg = "#556a95" }
body    = {}
list    = {}
btn_yes = { fg = "#b2b7c7", bg = "#1f2029" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#4f6b4f" }
title    = { fg = "#b2b7c7" }
tbl_col  = { fg = "#6a88be" }
tbl_cell = { fg = "#b8a47e", bg = "#1f2029" }

[notify]
title_info  = { fg = "#6386c7" }
title_warn  = { fg = "#ac7a63" }
title_error = { fg = "#c96880" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#6d906b" }
run     = { fg = "#b976a7" }
desc    = { fg = "#9b9eaa" }
hovered = { fg = "#b2b7c7", bg = "#1f2029", bold = true }
footer  = { fg = "#b2b7c7", bg = "#1f2029" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#b8a47e" },

	# Media
	{ mime = "{audio,video}/*", fg = "#b976a7" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c26b81" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#688d94" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#6c7393" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#b7657a" },
	{ url = "*", is = "exec"  , fg = "#6d906b" },
	{ url = "*", is = "dummy", bg = "#b7657a" },
	{ url = "*/", is = "dummy", bg = "#b7657a" },

	# Fallback
	{ url = "*/", fg = "#6a88be" }
]
    