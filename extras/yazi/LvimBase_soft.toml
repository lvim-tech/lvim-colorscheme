#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme BaseSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#659c9c", italic = true }

# Find
find_keyword  = { fg = "#22292d", bg = "#e19556", bold = true }
find_position = { fg = "#55a6ab", bg = "#28333a", bold = true }

# Symlink
symlink_target = { fg = "#5b7d7e", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#d1aa64", bg = "#d1aa64" }
marker_cut      = { fg = "#d75e52", bg = "#d75e52" }
marker_marked   = { fg = "#c6614d", bg = "#c6614d" }
marker_selected = { fg = "#447ca2", bg = "#447ca2" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fafdff", bg = "#718650" }
count_cut      = { fg = "#fafdff", bg = "#cc5147" }
count_selected = { fg = "#b9e6ff", bg = "#366c5f" }

# Border
border_symbol = "│"
border_style  = { fg = "#62744a" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#2e383e" }
current = { bg = "#313d43" }
preview = { bg = "#313d43" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#55a6ab", bg = "#282f33", bold = true }
inactive = { fg = "#378b91", bg = "#262d31" }

[mode]
normal_main = { fg = "#fafdff", bg = "#447ca2", bold = true }
normal_alt  = { fg = "#37baff", bg = "#36444b" }

select_main = { fg = "#fafdff", bg = "#c6614d", bold = true }
select_alt  = { fg = "#f49485", bg = "#36444b" }

unset_main  = { fg = "#e1f4ff", bg = "#40719a", bold = true }
unset_alt   = { fg = "#4fb5ff", bg = "#36444b" }

[status]
# Progress
progress_label  = { fg = "#659c9c", bold = true }
progress_normal = { fg = "#55a6ab", bg = "#22292d" }
progress_error  = { fg = "#fafdff", bg = "#d75e52" }

# Permissions
perm_type  = { fg = "#399bd3" }
perm_read  = { fg = "#d8b36f" }
perm_write = { fg = "#e57167" }
perm_exec  = { fg = "#829c5b" }
perm_sep   = { fg = "#5b7d7e" }

[pick]
border   = { fg = "#387ba2" }
active   = { fg = "#55a6ab", bg = "#282f33" }
inactive = { fg = "#659c9c" }

[input]
border   = { fg = "#387ba2" }
title    = { fg = "#387ba2" }
value    = { fg = "#279be1" }
selected = { fg = "#55a6ab", bg = "#282f33" }

[cmp]
border   = { fg = "#387ba2" }
active   = { fg = "#55a6ab", bg = "#282f33" }
inactive = { fg = "#659c9c" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#62744a" }
title   = { fg = "#659c9c" }
hovered = { fg = "#55a6ab", bg = "#282f33" }

[which]
cols            = 3
mask            = { bg = "#22292d" }
cand            = { fg = "#3f9aae" }
rest            = { fg = "#3b98ce" }
desc            = { fg = "#e4694e" }
separator       = " ➜ "
separator_style = { fg = "#597779" }

[confirm]
border  = { fg = "#387ba2" }
title   = { fg = "#387ba2" }
body    = {}
list    = {}
btn_yes = { fg = "#55a6ab", bg = "#282f33" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#62744a" }
title    = { fg = "#659c9c" }
tbl_col  = { fg = "#399bd3" }
tbl_cell = { fg = "#d8b36f", bg = "#282f33" }

[notify]
title_info  = { fg = "#019dd8" }
title_warn  = { fg = "#da8950" }
title_error = { fg = "#ed6a60" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#829c5b" }
run     = { fg = "#e96f56" }
desc    = { fg = "#378b91" }
hovered = { fg = "#55a6ab", bg = "#282f33", bold = true }
footer  = { fg = "#55a6ab", bg = "#282f33" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#d8b36f" },

	# Media
	{ mime = "{audio,video}/*", fg = "#e96f56" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e57167" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#3ca0b5" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#5b7d7e" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#d75e52" },
	{ url = "*", is = "exec"  , fg = "#829c5b" },
	{ url = "*", is = "dummy", bg = "#d75e52" },
	{ url = "*/", is = "dummy", bg = "#d75e52" },

	# Fallback
	{ url = "*/", fg = "#399bd3" }
]
    