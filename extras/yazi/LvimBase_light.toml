#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme BaseLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#aa703f", bold = true }
find_position = { fg = "#476567", bg = "#d5dbdf", bold = true }

# Symlink
symlink_target = { fg = "#6d8587", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#8e7242", bg = "#8e7242" }
marker_cut      = { fg = "#ae4b41", bg = "#ae4b41" }
marker_marked   = { fg = "#af5543", bg = "#af5543" }
marker_selected = { fg = "#457da3", bg = "#457da3" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#f4f4f4", bg = "#637646" }
count_cut      = { fg = "#fcfcfc", bg = "#c54e44" }
count_selected = { fg = "#fcfcfc", bg = "#4f9987" }

# Border
border_symbol = "│"
border_style  = { fg = "#7d8c66" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#fcfcfc", bg = "#457da3", bold = true }
normal_alt  = { fg = "#3c5366", bg = "#c4c4c4" }

select_main = { fg = "#f4f4f4", bg = "#af5543", bold = true }
select_alt  = { fg = "#75423a", bg = "#c4c4c4" }

unset_main  = { fg = "#fcfcfc", bg = "#4d86b6", bold = true }
unset_alt   = { fg = "#3e5266", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#ebebeb", bg = "#ae4b41" }

# Permissions
perm_type  = { fg = "#436a87" }
perm_read  = { fg = "#756240" }
perm_write = { fg = "#a44940" }
perm_exec  = { fg = "#55673c" }
perm_sep   = { fg = "#6d8587" }

[pick]
border   = { fg = "#4e87ad" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#4e87ad" }
title    = { fg = "#4e87ad" }
value    = { fg = "#486988" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#4e87ad" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#7d8c66" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#3d646f" }
rest            = { fg = "#41627b" }
desc            = { fg = "#8f4b3f" }
separator       = " ➜ "
separator_style = { fg = "#687d7f" }

[confirm]
border  = { fg = "#4e87ad" }
title   = { fg = "#4e87ad" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#7d8c66" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#436a87" }
tbl_cell = { fg = "#786540", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#486a82" }
title_warn  = { fg = "#885b40" }
title_error = { fg = "#a74841" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#55673c" }
run     = { fg = "#9c4f41" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#756240" },

	# Media
	{ mime = "{audio,video}/*", fg = "#9c4f41" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a44940" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#3e6c78" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#6d8587" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#ae4b41" },
	{ url = "*", is = "exec"  , fg = "#55673c" },
	{ url = "*", is = "dummy", bg = "#ae4b41" },
	{ url = "*/", is = "dummy", bg = "#ae4b41" },

	# Fallback
	{ url = "*/", fg = "#436a87" }
]
    