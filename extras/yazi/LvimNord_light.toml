#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme NordLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#b27f6f", bold = true }
find_position = { fg = "#466264", bg = "#d6d8da", bold = true }

# Symlink
symlink_target = { fg = "#737d95", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#937944", bg = "#937944" }
marker_cut      = { fg = "#935d63", bg = "#935d63" }
marker_marked   = { fg = "#9e8299", bg = "#9e8299" }
marker_selected = { fg = "#768ba1", bg = "#768ba1" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#788c67" }
count_cut      = { fg = "#fcfcfc", bg = "#ae656c" }
count_selected = { fg = "#fcfcfc", bg = "#6a8d8b" }

# Border
border_symbol = "│"
border_style  = { fg = "#8e9e80" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#fcfcfc", bg = "#768ba1", bold = true }
normal_alt  = { fg = "#495159", bg = "#c4c4c4" }

select_main = { fg = "#fcfcfc", bg = "#9e8299", bold = true }
select_alt  = { fg = "#594e57", bg = "#c4c4c4" }

unset_main  = { fg = "#fcfcfc", bg = "#8d8497", bold = true }
unset_alt   = { fg = "#544f59", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#eeeeee", bg = "#935d63" }

# Permissions
perm_type  = { fg = "#5b6774" }
perm_read  = { fg = "#716245" }
perm_write = { fg = "#87585d" }
perm_exec  = { fg = "#5e6855" }
perm_sep   = { fg = "#737d95" }

[pick]
border   = { fg = "#556a80" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#556a80" }
title    = { fg = "#556a80" }
value    = { fg = "#696270" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#556a80" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#8e9e80" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#4e6168" }
rest            = { fg = "#555f6b" }
desc            = { fg = "#675964" }
separator       = " ➜ "
separator_style = { fg = "#717a92" }

[confirm]
border  = { fg = "#556a80" }
title   = { fg = "#556a80" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#8e9e80" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#5b6774" }
tbl_cell = { fg = "#786746", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#53677d" }
title_warn  = { fg = "#885a4d" }
title_error = { fg = "#8d575c" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#5e6855" }
run     = { fg = "#70606d" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#716245" },

	# Media
	{ mime = "{audio,video}/*", fg = "#70606d" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#87585d" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#536971" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#737d95" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#935d63" },
	{ url = "*", is = "exec"  , fg = "#5e6855" },
	{ url = "*", is = "dummy", bg = "#935d63" },
	{ url = "*/", is = "dummy", bg = "#935d63" },

	# Fallback
	{ url = "*/", fg = "#5b6774" }
]
    