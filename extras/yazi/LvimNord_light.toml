#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme NordLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#5f646e", italic = true }

# Find
find_keyword  = { fg = "#dadada", bg = "#b27f6f", bold = true }
find_position = { fg = "#556a80", bg = "#d6d8da", bold = true }

# Symlink
symlink_target = { fg = "#737d95", italic = true }

# Marker
marker_copied   = { fg = "#937944", bg = "#937944" }
marker_cut      = { fg = "#935d63", bg = "#935d63" }
marker_marked   = { fg = "#9e8299", bg = "#9e8299" }
marker_selected = { fg = "#768ba1", bg = "#768ba1" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#5e8888", bg = "#788c67" }
count_cut      = { fg = "#5e8888", bg = "#ae656c" }
count_selected = { fg = "#5e8888", bg = "#6a8d8b" }

# Border
border_symbol = "│"
border_style  = { fg = "#8e9e80" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#e9e9e9" }
current = { bg = "#e9e9e9" }
preview = { bg = "#e9e9e9" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#5e8888", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#b6b6b6", bg = "#768ba1", bold = true }
normal_alt  = { fg = "#768ba1", bg = "#3c7478" }

select_main = { fg = "#b6b6b6", bg = "#9e8299", bold = true }
select_alt  = { fg = "#9e8299", bg = "#3c7478" }

unset_main  = { fg = "#b6b6b6", bg = "#8d8497", bold = true }
unset_alt   = { fg = "#8d8497", bg = "#3c7478" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#5f646e", bold = true }
progress_normal = { fg = "#738366", bg = "#dadada" }
progress_error  = { fg = "#dadada", bg = "#935d63" }

# Permissions
perm_type  = { fg = "#768ba1" }
perm_read  = { fg = "#87734a" }
perm_write = { fg = "#935d63" }
perm_exec  = { fg = "#738366" }
perm_sep   = { fg = "#737d95" }

[pick]
border   = { fg = "#8e9e80" }
active   = { fg = "#5e8888",  bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

[input]
border   = { fg = "#556a80" }
title    = { fg = "#556a80" }
value    = { fg = "#8d8497" }
selected = { bg = "#e9e9e9" }

[cmp]
border   = { fg = "#556a80" }
active   = { fg = "#5e8888", bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#8e9e80" }
title   = { fg = "#8e9e80" }
hovered = { fg = "#5e8888", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#61848f" }
rest            = { fg = "#768ba1" }
desc            = { fg = "#9e8299" }
separator       = " ➜ "
separator_style = { fg = "#737d95" }

[confirm]
border  = { fg = "#556a80" }
title   = { fg = "#8e9e80" }
body    = {}
list    = {}
btn_yes = { bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#8e9e80" }
title    = { fg = "#8e9e80" }
tbl_col  = { fg = "#768ba1" }
tbl_cell = { fg = "#87734a", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#556a80" }
title_warn  = { fg = "#905e4f" }
title_error = { fg = "#ae656c" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#738366" }
run     = { fg = "#9e8299" }
desc    = { fg = "#3c7478" }
hovered = { bg = "#e9e9e9", bold = true }
footer  = { fg = "#5e8888", bg = "#E4E4E4" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#87734a" },

	# Media
	{ mime = "{audio,video}/*", fg = "#9e8299" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#935d63" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#61848f" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#737d95" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#935d63" },
	{ url = "*", is = "exec"  , fg = "#738366" },
	{ url = "*", is = "dummy", bg = "#935d63" },
	{ url = "*/", is = "dummy", bg = "#935d63" },

	# Fallback
	{ url = "*/", fg = "#768ba1" }
]
    