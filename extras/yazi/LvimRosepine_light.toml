#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme RosepineLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#c0716d", bold = true }
find_position = { fg = "#476567", bg = "#d7dddf", bold = true }

# Symlink
symlink_target = { fg = "#7d7799", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#a1763b", bg = "#a1763b" }
marker_cut      = { fg = "#a04a63", bg = "#a04a63" }
marker_marked   = { fg = "#75509c", bg = "#75509c" }
marker_selected = { fg = "#578fa6", bg = "#578fa6" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#5c8991" }
count_cut      = { fg = "#fcfcfc", bg = "#bb4f6d" }
count_selected = { fg = "#fcfcfc", bg = "#5e99b2" }

# Border
border_symbol = "│"
border_style  = { fg = "#779ba2" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#fcfcfc", bg = "#578fa6", bold = true }
normal_alt  = { fg = "#41545d", bg = "#c4c4c4" }

select_main = { fg = "#dddddd", bg = "#75509c", bold = true }
select_alt  = { fg = "#5e457a", bg = "#c4c4c4" }

unset_main  = { fg = "#fcfcfc", bg = "#8d87a0", bold = true }
unset_alt   = { fg = "#534f5f", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#e5e5e5", bg = "#a04a63" }

# Permissions
perm_type  = { fg = "#4b6976" }
perm_read  = { fg = "#7a6140" }
perm_write = { fg = "#a04a63" }
perm_exec  = { fg = "#526a6f" }
perm_sep   = { fg = "#7d7799" }

[pick]
border   = { fg = "#5a889c" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#5a889c" }
title    = { fg = "#5a889c" }
value    = { fg = "#676178" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#5a889c" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#779ba2" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#4d6366" }
rest            = { fg = "#496370" }
desc            = { fg = "#724f97" }
separator       = " ➜ "
separator_style = { fg = "#7d7799" }

[confirm]
border  = { fg = "#5a889c" }
title   = { fg = "#5a889c" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#779ba2" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#4b6976" }
tbl_cell = { fg = "#7e6341", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#4e6a78" }
title_warn  = { fg = "#905452" }
title_error = { fg = "#9e4960" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#526a6f" }
run     = { fg = "#75509c" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#7a6140" },

	# Media
	{ mime = "{audio,video}/*", fg = "#75509c" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a04a63" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#526a6f" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#7d7799" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#a04a63" },
	{ url = "*", is = "exec"  , fg = "#526a6f" },
	{ url = "*", is = "dummy", bg = "#a04a63" },
	{ url = "*/", is = "dummy", bg = "#a04a63" },

	# Fallback
	{ url = "*/", fg = "#4b6976" }
]
    