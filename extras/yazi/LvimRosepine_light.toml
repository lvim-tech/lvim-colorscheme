#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme RosepineLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#7c7a87", italic = true }

# Find
find_keyword  = { fg = "#dadada", bg = "#c0716d", bold = true }
find_position = { fg = "#5e99b2", bg = "#d7dddf", bold = true }

# Symlink
symlink_target = { fg = "#7d7799", italic = true }

# Marker
marker_copied   = { fg = "#a1763b", bg = "#a1763b" }
marker_cut      = { fg = "#a04a63", bg = "#a04a63" }
marker_marked   = { fg = "#75509c", bg = "#75509c" }
marker_selected = { fg = "#578fa6", bg = "#578fa6" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#5e8888", bg = "#5c8991" }
count_cut      = { fg = "#5e8888", bg = "#bb4f6d" }
count_selected = { fg = "#5e8888", bg = "#5e99b2" }

# Border
border_symbol = "│"
border_style  = { fg = "#779ba2" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#e9e9e9" }
current = { bg = "#e9e9e9" }
preview = { bg = "#e9e9e9" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#5e8888", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#b6b6b6", bg = "#578fa6", bold = true }
normal_alt  = { fg = "#578fa6", bg = "#3c7478" }

select_main = { fg = "#b6b6b6", bg = "#75509c", bold = true }
select_alt  = { fg = "#75509c", bg = "#3c7478" }

unset_main  = { fg = "#b6b6b6", bg = "#8d87a0", bold = true }
unset_alt   = { fg = "#8d87a0", bg = "#3c7478" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#7c7a87", bold = true }
progress_normal = { fg = "#5d8086", bg = "#dadada" }
progress_error  = { fg = "#dadada", bg = "#a04a63" }

# Permissions
perm_type  = { fg = "#578fa6" }
perm_read  = { fg = "#927143" }
perm_write = { fg = "#a04a63" }
perm_exec  = { fg = "#5d8086" }
perm_sep   = { fg = "#7d7799" }

[pick]
border   = { fg = "#779ba2" }
active   = { fg = "#5e8888",  bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

[input]
border   = { fg = "#5e99b2" }
title    = { fg = "#5e99b2" }
value    = { fg = "#8d87a0" }
selected = { bg = "#e9e9e9" }

[cmp]
border   = { fg = "#5e99b2" }
active   = { fg = "#5e8888", bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#779ba2" }
title   = { fg = "#779ba2" }
hovered = { fg = "#5e8888", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#5d8086" }
rest            = { fg = "#578fa6" }
desc            = { fg = "#75509c" }
separator       = " ➜ "
separator_style = { fg = "#7d7799" }

[confirm]
border  = { fg = "#5e99b2" }
title   = { fg = "#779ba2" }
body    = {}
list    = {}
btn_yes = { bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#779ba2" }
title    = { fg = "#779ba2" }
tbl_col  = { fg = "#578fa6" }
tbl_cell = { fg = "#927143", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#5e99b2" }
title_warn  = { fg = "#945654" }
title_error = { fg = "#bb4f6d" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#5d8086" }
run     = { fg = "#75509c" }
desc    = { fg = "#3c7478" }
hovered = { bg = "#e9e9e9", bold = true }
footer  = { fg = "#5e8888", bg = "#E4E4E4" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#927143" },

	# Media
	{ mime = "{audio,video}/*", fg = "#75509c" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a04a63" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#5d8086" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#7d7799" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#a04a63" },
	{ url = "*", is = "exec"  , fg = "#5d8086" },
	{ url = "*", is = "dummy", bg = "#a04a63" },
	{ url = "*/", is = "dummy", bg = "#a04a63" },

	# Fallback
	{ url = "*/", fg = "#578fa6" }
]
    