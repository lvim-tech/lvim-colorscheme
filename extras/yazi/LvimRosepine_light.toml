#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme RosepineLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#a58382", bold = true }
find_position = { fg = "#476567", bg = "#dadcdd", bold = true }

# Symlink
symlink_target = { fg = "#95718d", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#958270", bg = "#958270" }
marker_cut      = { fg = "#8e656e", bg = "#8e656e" }
marker_marked   = { fg = "#6d5f81", bg = "#6d5f81" }
marker_selected = { fg = "#73878f", bg = "#73878f" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#677b6b" }
count_cut      = { fg = "#fcfcfc", bg = "#a36e7a" }
count_selected = { fg = "#fcfcfc", bg = "#7b958d" }

# Border
border_symbol = "│"
border_style  = { fg = "#809083" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#fcfcfc", bg = "#73878f", bold = true }
normal_alt  = { fg = "#4a5155", bg = "#c4c4c4" }

select_main = { fg = "#e5e5e5", bg = "#6d5f81", bold = true }
select_alt  = { fg = "#554c62", bg = "#c4c4c4" }

unset_main  = { fg = "#fcfcfc", bg = "#7f7c88", bold = true }
unset_alt   = { fg = "#525058", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#f4f4f4", bg = "#8e656e" }

# Permissions
perm_type  = { fg = "#5c686d" }
perm_read  = { fg = "#6e6358" }
perm_write = { fg = "#805d64" }
perm_exec  = { fg = "#5b695e" }
perm_sep   = { fg = "#95718d" }

[pick]
border   = { fg = "#72848b" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#72848b" }
title    = { fg = "#72848b" }
value    = { fg = "#66636e" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#72848b" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#809083" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#566060" }
rest            = { fg = "#566064" }
desc            = { fg = "#655976" }
separator       = " ➜ "
separator_style = { fg = "#926f8a" }

[confirm]
border  = { fg = "#72848b" }
title   = { fg = "#72848b" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#809083" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#5c686d" }
tbl_cell = { fg = "#71655a", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#5c676c" }
title_warn  = { fg = "#7a5f5e" }
title_error = { fg = "#815c64" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#5b695e" }
run     = { fg = "#6d5f81" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#6e6358" },

	# Media
	{ mime = "{audio,video}/*", fg = "#6d5f81" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#805d64" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#5c6868" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#95718d" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#8e656e" },
	{ url = "*", is = "exec"  , fg = "#5b695e" },
	{ url = "*", is = "dummy", bg = "#8e656e" },
	{ url = "*/", is = "dummy", bg = "#8e656e" },

	# Fallback
	{ url = "*/", fg = "#5c686d" }
]
    