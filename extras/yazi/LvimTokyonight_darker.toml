#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme TokyonightDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#b2b6c7", italic = true }

# Find
find_keyword  = { fg = "#14171e", bg = "#bb866d", bold = true }
find_position = { fg = "#b5b9ca", bg = "#1e222d", bold = true }

# Symlink
symlink_target = { fg = "#616784", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#ad9170", bg = "#ad9170" }
marker_cut      = { fg = "#bb6171", bg = "#bb6171" }
marker_marked   = { fg = "#907bba", bg = "#907bba" }
marker_selected = { fg = "#6073a4", bg = "#6073a4" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fefeff", bg = "#697b58" }
count_cut      = { fg = "#f2f6ff", bg = "#ac5764" }
count_selected = { fg = "#e2eaff", bg = "#4e6f66" }

# Border
border_symbol = "│"
border_style  = { fg = "#59684d" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#222734" }
current = { bg = "#262e3e" }
preview = { bg = "#262e3e" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#b5b9ca", bg = "#1a1d24", bold = true }
inactive = { fg = "#7f8296", bg = "#181b22" }

[mode]
normal_main = { fg = "#fafbff", bg = "#6073a4", bold = true }
normal_alt  = { fg = "#879cd6", bg = "#2b3447" }

select_main = { fg = "#14171e", bg = "#907bba", bold = true }
select_alt  = { fg = "#a793cf", bg = "#2b3447" }

unset_main  = { fg = "#e6edff", bg = "#73638e", bold = true }
unset_alt   = { fg = "#a697c2", bg = "#2b3447" }

[status]
# Progress
progress_label  = { fg = "#b2b6c7", bold = true }
progress_normal = { fg = "#b5b9ca", bg = "#14171e" }
progress_error  = { fg = "#fefeff", bg = "#bb6171" }

# Permissions
perm_type  = { fg = "#6982bf" }
perm_read  = { fg = "#b79d7b" }
perm_write = { fg = "#c66778" }
perm_exec  = { fg = "#788a67" }
perm_sep   = { fg = "#616784" }

[pick]
border   = { fg = "#546593" }
active   = { fg = "#b5b9ca", bg = "#1a1d24" }
inactive = { fg = "#b2b6c7" }

[input]
border   = { fg = "#546593" }
title    = { fg = "#546593" }
value    = { fg = "#8d7caa" }
selected = { fg = "#b5b9ca", bg = "#1a1d24" }

[cmp]
border   = { fg = "#546593" }
active   = { fg = "#b5b9ca", bg = "#1a1d24" }
inactive = { fg = "#b2b6c7" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#59684d" }
title   = { fg = "#b2b6c7" }
hovered = { fg = "#b5b9ca", bg = "#1a1d24" }

[which]
cols            = 3
mask            = { bg = "#14171e" }
cand            = { fg = "#65859d" }
rest            = { fg = "#687fbb" }
desc            = { fg = "#907bba" }
separator       = " ➜ "
separator_style = { fg = "#616784" }

[confirm]
border  = { fg = "#546593" }
title   = { fg = "#546593" }
body    = {}
list    = {}
btn_yes = { fg = "#b5b9ca", bg = "#1a1d24" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#59684d" }
title    = { fg = "#b2b6c7" }
tbl_col  = { fg = "#6982bf" }
tbl_cell = { fg = "#b79d7b", bg = "#1a1d24" }

[notify]
title_info  = { fg = "#6682c8" }
title_warn  = { fg = "#ad7862" }
title_error = { fg = "#cb6172" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#788a67" }
run     = { fg = "#907bba" }
desc    = { fg = "#7f8296" }
hovered = { fg = "#b5b9ca", bg = "#1a1d24", bold = true }
footer  = { fg = "#b5b9ca", bg = "#1a1d24" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#b79d7b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#907bba" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c66778" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#6787a0" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#616784" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#bb6171" },
	{ url = "*", is = "exec"  , fg = "#788a67" },
	{ url = "*", is = "dummy", bg = "#bb6171" },
	{ url = "*/", is = "dummy", bg = "#bb6171" },

	# Fallback
	{ url = "*/", fg = "#6982bf" }
]
    