#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme GruvboxDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#958575", italic = true }

# Find
find_keyword  = { fg = "#181714", bg = "#cc7942", bold = true }
find_position = { fg = "#998c7e", bg = "#242829", bold = true }

# Symlink
symlink_target = { fg = "#79685a", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#a6935a", bg = "#a6935a" }
marker_cut      = { fg = "#cb4f4f", bg = "#cb4f4f" }
marker_marked   = { fg = "#bb755e", bg = "#bb755e" }
marker_selected = { fg = "#42728b", bg = "#42728b" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#ffe14c", bg = "#656831" }
count_cut      = { fg = "#fff0bc", bg = "#c53b3b" }
count_selected = { fg = "#f8d900", bg = "#2d695d" }

# Border
border_symbol = "│"
border_style  = { fg = "#585a2e" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#2e2c2b" }
current = { bg = "#353231" }
preview = { bg = "#353231" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#9c8f80", bg = "#2c2a29", bold = true }
inactive = { fg = "#817366", bg = "#222120" }

[mode]
normal_main = { fg = "#fff0bc", bg = "#42728b", bold = true }
normal_alt  = { fg = "#17afe2", bg = "#3c3837" }

select_main = { fg = "#181714", bg = "#bb755e", bold = true }
select_alt  = { fg = "#e38e72", bg = "#3c3837" }

unset_main  = { fg = "#fbdc00", bg = "#635d71", bold = true }
unset_alt   = { fg = "#a69fb5", bg = "#3c3837" }

[status]
# Progress
progress_label  = { fg = "#958575", bold = true }
progress_normal = { fg = "#8b8073", bg = "#181714" }
progress_error  = { fg = "#fffefc", bg = "#cb4f4f" }

# Permissions
perm_type  = { fg = "#3d91b6" }
perm_read  = { fg = "#af9e6b" }
perm_write = { fg = "#e06262" }
perm_exec  = { fg = "#8a8e33" }
perm_sep   = { fg = "#79685a" }

[pick]
border   = { fg = "#3a728c" }
active   = { fg = "#9c8f80", bg = "#2c2a29" }
inactive = { fg = "#958575" }

[input]
border   = { fg = "#3a728c" }
title    = { fg = "#3a728c" }
value    = { fg = "#8c849d" }
selected = { fg = "#9c8f80", bg = "#2c2a29" }

[cmp]
border   = { fg = "#3a728c" }
active   = { fg = "#9c8f80", bg = "#2c2a29" }
inactive = { fg = "#958575" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#585a2e" }
title   = { fg = "#958575" }
hovered = { fg = "#9c8f80", bg = "#2c2a29" }

[which]
cols            = 3
mask            = { bg = "#181714" }
cand            = { fg = "#588b5f" }
rest            = { fg = "#4088aa" }
desc            = { fg = "#bb755e" }
separator       = " ➜ "
separator_style = { fg = "#706155" }

[confirm]
border  = { fg = "#3a728c" }
title   = { fg = "#3a728c" }
body    = {}
list    = {}
btn_yes = { fg = "#9c8f80", bg = "#2c2a29" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#585a2e" }
title    = { fg = "#958575" }
tbl_col  = { fg = "#3d91b6" }
tbl_cell = { fg = "#af9e6b", bg = "#2c2a29" }

[notify]
title_info  = { fg = "#2394bc" }
title_warn  = { fg = "#c5733a" }
title_error = { fg = "#f34d4d" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#8a8e33" }
run     = { fg = "#bf775f" }
desc    = { fg = "#817366" }
hovered = { fg = "#9c8f80", bg = "#2c2a29", bold = true }
footer  = { fg = "#9c8f80", bg = "#2c2a29" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#af9e6b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#bf775f" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e06262" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#5c9764" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#79685a" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#cb4f4f" },
	{ url = "*", is = "exec"  , fg = "#8a8e33" },
	{ url = "*", is = "dummy", bg = "#cb4f4f" },
	{ url = "*/", is = "dummy", bg = "#cb4f4f" },

	# Fallback
	{ url = "*/", fg = "#3d91b6" }
]
    