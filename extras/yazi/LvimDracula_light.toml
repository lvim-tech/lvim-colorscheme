#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme DraculaLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#6b6b71", italic = true }

# Find
find_keyword  = { fg = "#dadada", bg = "#9e703f", bold = true }
find_position = { fg = "#307f90", bg = "#d2dadc", bold = true }

# Symlink
symlink_target = { fg = "#6b728f", italic = true }

# Marker
marker_copied   = { fg = "#636924", bg = "#636924" }
marker_cut      = { fg = "#ba4040", bg = "#ba4040" }
marker_marked   = { fg = "#9f3d77", bg = "#9f3d77" }
marker_selected = { fg = "#3a7885", bg = "#3a7885" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#5e8888", bg = "#25803c" }
count_cut      = { fg = "#5e8888", bg = "#d63f3f" }
count_selected = { fg = "#5e8888", bg = "#307f90" }

# Border
border_symbol = "│"
border_style  = { fg = "#4b945e" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#e9e9e9" }
current = { bg = "#e9e9e9" }
preview = { bg = "#e9e9e9" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#5e8888", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#b6b6b6", bg = "#3a7885", bold = true }
normal_alt  = { fg = "#3a7885", bg = "#3c7478" }

select_main = { fg = "#b6b6b6", bg = "#9f3d77", bold = true }
select_alt  = { fg = "#9f3d77", bg = "#3c7478" }

unset_main  = { fg = "#b6b6b6", bg = "#75519f", bold = true }
unset_alt   = { fg = "#75519f", bg = "#3c7478" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#6b6b71", bold = true }
progress_normal = { fg = "#2f7a42", bg = "#dadada" }
progress_error  = { fg = "#dadada", bg = "#ba4040" }

# Permissions
perm_type  = { fg = "#3a7885" }
perm_read  = { fg = "#60652c" }
perm_write = { fg = "#ba4040" }
perm_exec  = { fg = "#2f7a42" }
perm_sep   = { fg = "#6b728f" }

[pick]
border   = { fg = "#4b945e" }
active   = { fg = "#5e8888",  bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

[input]
border   = { fg = "#307f90" }
title    = { fg = "#307f90" }
value    = { fg = "#75519f" }
selected = { bg = "#e9e9e9" }

[cmp]
border   = { fg = "#307f90" }
active   = { fg = "#5e8888", bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#4b945e" }
title   = { fg = "#4b945e" }
hovered = { fg = "#5e8888", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#2d7065" }
rest            = { fg = "#3a7885" }
desc            = { fg = "#9f3d77" }
separator       = " ➜ "
separator_style = { fg = "#6b728f" }

[confirm]
border  = { fg = "#307f90" }
title   = { fg = "#4b945e" }
body    = {}
list    = {}
btn_yes = { bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#4b945e" }
title    = { fg = "#4b945e" }
tbl_col  = { fg = "#3a7885" }
tbl_cell = { fg = "#60652c", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#307f90" }
title_warn  = { fg = "#ae7435" }
title_error = { fg = "#d63f3f" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#2f7a42" }
run     = { fg = "#9f3d77" }
desc    = { fg = "#3c7478" }
hovered = { bg = "#e9e9e9", bold = true }
footer  = { fg = "#5e8888", bg = "#E4E4E4" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#60652c" },

	# Media
	{ mime = "{audio,video}/*", fg = "#9f3d77" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ba4040" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#2d7065" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#6b728f" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#ba4040" },
	{ url = "*", is = "exec"  , fg = "#2f7a42" },
	{ url = "*", is = "dummy", bg = "#ba4040" },
	{ url = "*/", is = "dummy", bg = "#ba4040" },

	# Fallback
	{ url = "*/", fg = "#3a7885" }
]
    