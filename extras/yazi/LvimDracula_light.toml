#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme DraculaLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#9e703f", bold = true }
find_position = { fg = "#466264", bg = "#d2dadc", bold = true }

# Symlink
symlink_target = { fg = "#6b728f", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#636924", bg = "#636924" }
marker_cut      = { fg = "#ba4040", bg = "#ba4040" }
marker_marked   = { fg = "#9f3d77", bg = "#9f3d77" }
marker_selected = { fg = "#3a7885", bg = "#3a7885" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#f4f4f4", bg = "#25803c" }
count_cut      = { fg = "#fcfcfc", bg = "#d63f3f" }
count_selected = { fg = "#fcfcfc", bg = "#307f90" }

# Border
border_symbol = "│"
border_style  = { fg = "#4b945e" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#f4f4f4", bg = "#3a7885", bold = true }
normal_alt  = { fg = "#37555c", bg = "#c4c4c4" }

select_main = { fg = "#dddddd", bg = "#9f3d77", bold = true }
select_alt  = { fg = "#7d3960", bg = "#c4c4c4" }

unset_main  = { fg = "#dddddd", bg = "#75519f", bold = true }
unset_alt   = { fg = "#5e467c", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#ebebeb", bg = "#ba4040" }

# Permissions
perm_type  = { fg = "#3b6d78" }
perm_read  = { fg = "#60652c" }
perm_write = { fg = "#af3f3f" }
perm_exec  = { fg = "#317140" }
perm_sep   = { fg = "#6b728f" }

[pick]
border   = { fg = "#307f90" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#307f90" }
title    = { fg = "#307f90" }
value    = { fg = "#75519f" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#307f90" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#4b945e" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#2f675e" }
rest            = { fg = "#3a656e" }
desc            = { fg = "#9a3d74" }
separator       = " ➜ "
separator_style = { fg = "#6b728f" }

[confirm]
border  = { fg = "#307f90" }
title   = { fg = "#307f90" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#4b945e" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#3b6d78" }
tbl_cell = { fg = "#60652c", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#366b78" }
title_warn  = { fg = "#845d39" }
title_error = { fg = "#b03e3e" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#317140" }
run     = { fg = "#9f3d77" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#60652c" },

	# Media
	{ mime = "{audio,video}/*", fg = "#9f3d77" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#af3f3f" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#2d7065" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#6b728f" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#ba4040" },
	{ url = "*", is = "exec"  , fg = "#317140" },
	{ url = "*", is = "dummy", bg = "#ba4040" },
	{ url = "*/", is = "dummy", bg = "#ba4040" },

	# Fallback
	{ url = "*/", fg = "#3b6d78" }
]
    