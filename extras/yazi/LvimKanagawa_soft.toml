#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme KanagawaSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#8d8dac", italic = true }

# Find
find_keyword  = { fg = "#1d1e22", bg = "#c99460", bold = true }
find_position = { fg = "#9292b1", bg = "#2a2d37", bold = true }

# Symlink
symlink_target = { fg = "#6d6d9c", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#debe7e", bg = "#debe7e" }
marker_cut      = { fg = "#b65252", bg = "#b65252" }
marker_marked   = { fg = "#c4746e", bg = "#c4746e" }
marker_selected = { fg = "#4d699b", bg = "#4d699b" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fdfdff", bg = "#697b52" }
count_cut      = { fg = "#ebeefb", bg = "#b24b4b" }
count_selected = { fg = "#fdfdff", bg = "#4b869b" }

# Border
border_symbol = "│"
border_style  = { fg = "#5c6a4b" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#31323b" }
current = { bg = "#353741" }
preview = { bg = "#353741" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#9292b1", bg = "#2b2c33", bold = true }
inactive = { fg = "#797997", bg = "#26272d" }

[mode]
normal_main = { fg = "#e4e8f9", bg = "#4d699b", bold = true }
normal_alt  = { fg = "#80aaf5", bg = "#3b3d4a" }

select_main = { fg = "#1d1e22", bg = "#c4746e", bold = true }
select_alt  = { fg = "#d79b97", bg = "#3b3d4a" }

unset_main  = { fg = "#f6f7fd", bg = "#766b90", bold = true }
unset_alt   = { fg = "#aea5c7", bg = "#3b3d4a" }

[status]
# Progress
progress_label  = { fg = "#8d8dac", bold = true }
progress_normal = { fg = "#8585a5", bg = "#1d1e22" }
progress_error  = { fg = "#f6f7fd", bg = "#b65252" }

# Permissions
perm_type  = { fg = "#588fe3" }
perm_read  = { fg = "#e0c286" }
perm_write = { fg = "#db7070" }
perm_exec  = { fg = "#7e975d" }
perm_sep   = { fg = "#6d6d9c" }

[pick]
border   = { fg = "#4e70ac" }
active   = { fg = "#9292b1", bg = "#2b2c33" }
inactive = { fg = "#8d8dac" }

[input]
border   = { fg = "#4e70ac" }
title    = { fg = "#4e70ac" }
value    = { fg = "#958ab0" }
selected = { fg = "#9292b1", bg = "#2b2c33" }

[cmp]
border   = { fg = "#4e70ac" }
active   = { fg = "#9292b1", bg = "#2b2c33" }
inactive = { fg = "#8d8dac" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#5c6a4b" }
title   = { fg = "#8d8dac" }
hovered = { fg = "#9292b1", bg = "#2b2c33" }

[which]
cols            = 3
mask            = { bg = "#1d1e22" }
cand            = { fg = "#628f87" }
rest            = { fg = "#5487d6" }
desc            = { fg = "#c4746e" }
separator       = " ➜ "
separator_style = { fg = "#656593" }

[confirm]
border  = { fg = "#4e70ac" }
title   = { fg = "#4e70ac" }
body    = {}
list    = {}
btn_yes = { fg = "#9292b1", bg = "#2b2c33" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#5c6a4b" }
title    = { fg = "#8d8dac" }
tbl_col  = { fg = "#588fe3" }
tbl_cell = { fg = "#e0c286", bg = "#2b2c33" }

[notify]
title_info  = { fg = "#578fe6" }
title_warn  = { fg = "#c68f58" }
title_error = { fg = "#e36a6a" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#7e975d" }
run     = { fg = "#c77a75" }
desc    = { fg = "#797997" }
hovered = { fg = "#9292b1", bg = "#2b2c33", bold = true }
footer  = { fg = "#9292b1", bg = "#2b2c33" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#e0c286" },

	# Media
	{ mime = "{audio,video}/*", fg = "#c77a75" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#db7070" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#65978f" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#6d6d9c" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#b65252" },
	{ url = "*", is = "exec"  , fg = "#7e975d" },
	{ url = "*", is = "dummy", bg = "#b65252" },
	{ url = "*/", is = "dummy", bg = "#b65252" },

	# Fallback
	{ url = "*/", fg = "#588fe3" }
]
    