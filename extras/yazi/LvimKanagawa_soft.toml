#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme KanagawaSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#4b4b61", italic = true }

# Find
find_keyword  = { fg = "#1d1e22", bg = "#c99460", bold = true }
find_position = { fg = "#4a6494", bg = "#2a2d37", bold = true }

# Symlink
symlink_target = { fg = "#4e4e73", italic = true }

# Marker
marker_copied   = { fg = "#debe7e", bg = "#debe7e" }
marker_cut      = { fg = "#b65252", bg = "#b65252" }
marker_marked   = { fg = "#c4746e", bg = "#c4746e" }
marker_selected = { fg = "#4d699b", bg = "#4d699b" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#54546d", bg = "#697b52" }
count_cut      = { fg = "#54546d", bg = "#b24b4b" }
count_selected = { fg = "#54546d", bg = "#4b869b" }

# Border
border_symbol = "│"
border_style  = { fg = "#5c6a4b" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#2b2c33" }
current = { bg = "#2b2c33" }
preview = { bg = "#2b2c33" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#54546d", bg = "#2b2c33", bold = true }
inactive = { fg = "#505067", bg = "#26272d" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#1e1f24", bg = "#4d699b", bold = true }
normal_alt  = { fg = "#4d699b", bg = "#505067" }

select_main = { fg = "#1e1f24", bg = "#c4746e", bold = true }
select_alt  = { fg = "#c4746e", bg = "#505067" }

unset_main  = { fg = "#1e1f24", bg = "#766b90", bold = true }
unset_alt   = { fg = "#766b90", bg = "#505067" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#4b4b61", bold = true }
progress_normal = { fg = "#6e8156", bg = "#1d1e22" }
progress_error  = { fg = "#1d1e22", bg = "#b65252" }

# Permissions
perm_type  = { fg = "#4d699b" }
perm_read  = { fg = "#e0c286" }
perm_write = { fg = "#b65252" }
perm_exec  = { fg = "#6e8156" }
perm_sep   = { fg = "#4e4e73" }

[pick]
border   = { fg = "#5c6a4b" }
active   = { fg = "#54546d",  bg = "#2b2c33" }
inactive = { fg = "#54546d" }

[input]
border   = { fg = "#4a6494" }
title    = { fg = "#4a6494" }
value    = { fg = "#766b90" }
selected = { bg = "#2b2c33" }

[cmp]
border   = { fg = "#4a6494" }
active   = { fg = "#54546d", bg = "#2b2c33" }
inactive = { fg = "#54546d" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#5c6a4b" }
title   = { fg = "#5c6a4b" }
hovered = { fg = "#54546d", bg = "#2b2c33" }

[which]
cols            = 3
mask            = { bg = "#1d1e22" }
cand            = { fg = "#597b75" }
rest            = { fg = "#4d699b" }
desc            = { fg = "#c4746e" }
separator       = " ➜ "
separator_style = { fg = "#4e4e73" }

[confirm]
border  = { fg = "#4a6494" }
title   = { fg = "#5c6a4b" }
body    = {}
list    = {}
btn_yes = { bg = "#2b2c33" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#5c6a4b" }
title    = { fg = "#5c6a4b" }
tbl_col  = { fg = "#4d699b" }
tbl_cell = { fg = "#e0c286", bg = "#2b2c33" }

[notify]
title_info  = { fg = "#4a6494" }
title_warn  = { fg = "#c68f58" }
title_error = { fg = "#b24b4b" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#6e8156" }
run     = { fg = "#c4746e" }
desc    = { fg = "#505067" }
hovered = { bg = "#2b2c33", bold = true }
footer  = { fg = "#54546d", bg = "#26272d" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#e0c286" },

	# Media
	{ mime = "{audio,video}/*", fg = "#c4746e" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#b65252" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#597b75" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#4e4e73" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#b65252" },
	{ url = "*", is = "exec"  , fg = "#6e8156" },
	{ url = "*", is = "dummy", bg = "#b65252" },
	{ url = "*/", is = "dummy", bg = "#b65252" },

	# Fallback
	{ url = "*/", fg = "#4d699b" }
]
    