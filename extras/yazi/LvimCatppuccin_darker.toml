#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme CatppuccinDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#868995", italic = true }

# Find
find_keyword  = { fg = "#0b0b12", bg = "#da9366", bold = true }
find_position = { fg = "#5082d4", bg = "#1e2337", bold = true }

# Symlink
symlink_target = { fg = "#6c7393", italic = true }

# Marker
marker_copied   = { fg = "#d2ad5c", bg = "#d2ad5c" }
marker_cut      = { fg = "#d36d89", bg = "#d36d89" }
marker_marked   = { fg = "#d07fba", bg = "#d07fba" }
marker_selected = { fg = "#6793da", bg = "#6793da" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#b2b7c7", bg = "#71b96b" }
count_cut      = { fg = "#b2b7c7", bg = "#cc5777" }
count_selected = { fg = "#b2b7c7", bg = "#66baac" }

# Border
border_symbol = "│"
border_style  = { fg = "#5f995d" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#232430" }
current = { bg = "#232430" }
preview = { bg = "#232430" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#b2b7c7", bg = "#232430", bold = true }
inactive = { fg = "#9b9eaa", bg = "#181825" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#13131e", bg = "#6793da", bold = true }
normal_alt  = { fg = "#6793da", bg = "#9b9eaa" }

select_main = { fg = "#13131e", bg = "#d07fba", bold = true }
select_alt  = { fg = "#d07fba", bg = "#9b9eaa" }

unset_main  = { fg = "#13131e", bg = "#a183c5", bold = true }
unset_alt   = { fg = "#a183c5", bg = "#9b9eaa" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#868995", bold = true }
progress_normal = { fg = "#84c27f", bg = "#0b0b12" }
progress_error  = { fg = "#0b0b12", bg = "#d36d89" }

# Permissions
perm_type  = { fg = "#6793da" }
perm_read  = { fg = "#d8b973" }
perm_write = { fg = "#d36d89" }
perm_exec  = { fg = "#84c27f" }
perm_sep   = { fg = "#6c7393" }

[pick]
border   = { fg = "#5f995d" }
active   = { fg = "#b2b7c7",  bg = "#232430" }
inactive = { fg = "#b2b7c7" }

[input]
border   = { fg = "#5082d4" }
title    = { fg = "#5082d4" }
value    = { fg = "#a183c5" }
selected = { bg = "#232430" }

[cmp]
border   = { fg = "#5082d4" }
active   = { fg = "#b2b7c7", bg = "#232430" }
inactive = { fg = "#b2b7c7" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#5f995d" }
title   = { fg = "#5f995d" }
hovered = { fg = "#b2b7c7", bg = "#232430" }

[which]
cols            = 3
mask            = { bg = "#0b0b12" }
cand            = { fg = "#71becc" }
rest            = { fg = "#6793da" }
desc            = { fg = "#d07fba" }
separator       = " ➜ "
separator_style = { fg = "#6c7393" }

[confirm]
border  = { fg = "#5082d4" }
title   = { fg = "#5f995d" }
body    = {}
list    = {}
btn_yes = { bg = "#232430" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#5f995d" }
title    = { fg = "#5f995d" }
tbl_col  = { fg = "#6793da" }
tbl_cell = { fg = "#d8b973", bg = "#232430" }

[notify]
title_info  = { fg = "#5082d4" }
title_warn  = { fg = "#d4834f" }
title_error = { fg = "#cc5777" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#84c27f" }
run     = { fg = "#d07fba" }
desc    = { fg = "#9b9eaa" }
hovered = { bg = "#232430", bold = true }
footer  = { fg = "#b2b7c7", bg = "#181825" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#d8b973" },

	# Media
	{ mime = "{audio,video}/*", fg = "#d07fba" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d36d89" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#71becc" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#6c7393" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#d36d89" },
	{ url = "*", is = "exec"  , fg = "#84c27f" },
	{ url = "*", is = "dummy", bg = "#d36d89" },
	{ url = "*/", is = "dummy", bg = "#d36d89" },

	# Fallback
	{ url = "*/", fg = "#6793da" }
]
    