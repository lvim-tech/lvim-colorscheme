#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme SolarizedDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#9da4a4", italic = true }

# Find
find_keyword  = { fg = "#fdfeff", bg = "#b46548", bold = true }
find_position = { fg = "#969e9e", bg = "#07323f", bold = true }

# Symlink
symlink_target = { fg = "#637277", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#917b43", bg = "#917b43" }
marker_cut      = { fg = "#c24f4d", bg = "#c24f4d" }
marker_marked   = { fg = "#c0578a", bg = "#c0578a" }
marker_selected = { fg = "#4f7ea3", bg = "#4f7ea3" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#d6f1ff", bg = "#666f37" }
count_cut      = { fg = "#cfefff", bg = "#b34644" }
count_selected = { fg = "#e4f6ff", bg = "#407862" }

# Border
border_symbol = "│"
border_style  = { fg = "#526137" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#003643" }
current = { bg = "#003e4c" }
preview = { bg = "#003e4c" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#969e9e", bg = "#022d38", bold = true }
inactive = { fg = "#727f83", bg = "#002b36" }

[mode]
normal_main = { fg = "#fdfeff", bg = "#4f7ea3", bold = true }
normal_alt  = { fg = "#48aeee", bg = "#004251" }

select_main = { fg = "#fdfeff", bg = "#c0578a", bold = true }
select_alt  = { fg = "#eb89b5", bg = "#004251" }

unset_main  = { fg = "#fdfeff", bg = "#757797", bold = true }
unset_alt   = { fg = "#a2a4c1", bg = "#004251" }

[status]
# Progress
progress_label  = { fg = "#9da4a4", bold = true }
progress_normal = { fg = "#969e9e", bg = "#002732" }
progress_error  = { fg = "#fdfeff", bg = "#c24f4d" }

# Permissions
perm_type  = { fg = "#5094c5" }
perm_read  = { fg = "#a68a49" }
perm_write = { fg = "#e36765" }
perm_exec  = { fg = "#879538" }
perm_sep   = { fg = "#637277" }

[pick]
border   = { fg = "#477497" }
active   = { fg = "#969e9e", bg = "#022d38" }
inactive = { fg = "#9da4a4" }

[input]
border   = { fg = "#477497" }
title    = { fg = "#477497" }
value    = { fg = "#8a8cac" }
selected = { fg = "#969e9e", bg = "#022d38" }

[cmp]
border   = { fg = "#477497" }
active   = { fg = "#969e9e", bg = "#022d38" }
inactive = { fg = "#9da4a4" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#526137" }
title   = { fg = "#9da4a4" }
hovered = { fg = "#969e9e", bg = "#022d38" }

[which]
cols            = 3
mask            = { bg = "#002732" }
cand            = { fg = "#4c9791" }
rest            = { fg = "#5091c1" }
desc            = { fg = "#d9619b" }
separator       = " ➜ "
separator_style = { fg = "#616f75" }

[confirm]
border  = { fg = "#477497" }
title   = { fg = "#477497" }
body    = {}
list    = {}
btn_yes = { fg = "#969e9e", bg = "#022d38" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#526137" }
title    = { fg = "#9da4a4" }
tbl_col  = { fg = "#5094c5" }
tbl_cell = { fg = "#a98c48", bg = "#022d38" }

[notify]
title_info  = { fg = "#4595cb" }
title_warn  = { fg = "#df703e" }
title_error = { fg = "#eb605e" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#879538" }
run     = { fg = "#db649e" }
desc    = { fg = "#727f83" }
hovered = { fg = "#969e9e", bg = "#022d38", bold = true }
footer  = { fg = "#969e9e", bg = "#022d38" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#a68a49" },

	# Media
	{ mime = "{audio,video}/*", fg = "#db649e" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e36765" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#4b9a93" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#637277" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#c24f4d" },
	{ url = "*", is = "exec"  , fg = "#879538" },
	{ url = "*", is = "dummy", bg = "#c24f4d" },
	{ url = "*/", is = "dummy", bg = "#c24f4d" },

	# Fallback
	{ url = "*/", fg = "#5094c5" }
]
    