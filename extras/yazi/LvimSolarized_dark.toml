#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme SolarizedDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#9da4a4", italic = true }

# Find
find_keyword  = { fg = "#e4f7ff", bg = "#ac5835", bold = true }
find_position = { fg = "#969e9e", bg = "#063341", bold = true }

# Symlink
symlink_target = { fg = "#637277", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#886e1c", bg = "#886e1c" }
marker_cut      = { fg = "#bf4e4c", bg = "#bf4e4c" }
marker_marked   = { fg = "#b75283", bg = "#b75283" }
marker_selected = { fg = "#4386b5", bg = "#4386b5" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#ddf5ff", bg = "#687418" }
count_cut      = { fg = "#c6efff", bg = "#b34240" }
count_selected = { fg = "#f8fdff", bg = "#38807b" }

# Border
border_symbol = "│"
border_style  = { fg = "#53651e" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#073b48" }
current = { bg = "#023e4c" }
preview = { bg = "#023e4c" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#98a1a1", bg = "#073b48", bold = true }
inactive = { fg = "#727f83", bg = "#002b36" }

[mode]
normal_main = { fg = "#f8fdff", bg = "#4386b5", bold = true }
normal_alt  = { fg = "#53bbff", bg = "#0e4b59" }

select_main = { fg = "#f8fdff", bg = "#b75283", bold = true }
select_alt  = { fg = "#f398c0", bg = "#0e4b59" }

unset_main  = { fg = "#001f27", bg = "#8385a2", bold = true }
unset_alt   = { fg = "#aeb0c8", bg = "#0e4b59" }

[status]
# Progress
progress_label  = { fg = "#9da4a4", bold = true }
progress_normal = { fg = "#969e9e", bg = "#001f27" }
progress_error  = { fg = "#f2fbff", bg = "#bf4e4c" }

# Permissions
perm_type  = { fg = "#3d94cc" }
perm_read  = { fg = "#ad8a00" }
perm_write = { fg = "#e46866" }
perm_exec  = { fg = "#859500" }
perm_sep   = { fg = "#637277" }

[pick]
border   = { fg = "#3d7aa5" }
active   = { fg = "#98a1a1", bg = "#073b48" }
inactive = { fg = "#9da4a4" }

[input]
border   = { fg = "#3d7aa5" }
title    = { fg = "#3d7aa5" }
value    = { fg = "#8b8daa" }
selected = { fg = "#98a1a1", bg = "#073b48" }

[cmp]
border   = { fg = "#3d7aa5" }
active   = { fg = "#98a1a1", bg = "#073b48" }
inactive = { fg = "#9da4a4" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#53651e" }
title   = { fg = "#9da4a4" }
hovered = { fg = "#98a1a1", bg = "#073b48" }

[which]
cols            = 3
mask            = { bg = "#001f27" }
cand            = { fg = "#3d908a" }
rest            = { fg = "#418cbe" }
desc            = { fg = "#d55696" }
separator       = " ➜ "
separator_style = { fg = "#5d6a6f" }

[confirm]
border  = { fg = "#3d7aa5" }
title   = { fg = "#3d7aa5" }
body    = {}
list    = {}
btn_yes = { fg = "#98a1a1", bg = "#073b48" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#53651e" }
title    = { fg = "#9da4a4" }
tbl_col  = { fg = "#3d94cc" }
tbl_cell = { fg = "#c09a00", bg = "#073b48" }

[notify]
title_info  = { fg = "#2a96d3" }
title_warn  = { fg = "#e96700" }
title_error = { fg = "#f05d5a" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#859500" }
run     = { fg = "#df63a0" }
desc    = { fg = "#727f83" }
hovered = { fg = "#98a1a1", bg = "#073b48", bold = true }
footer  = { fg = "#98a1a1", bg = "#073b48" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#ad8a00" },

	# Media
	{ mime = "{audio,video}/*", fg = "#df63a0" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e46866" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#389c95" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#637277" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#bf4e4c" },
	{ url = "*", is = "exec"  , fg = "#859500" },
	{ url = "*", is = "dummy", bg = "#bf4e4c" },
	{ url = "*/", is = "dummy", bg = "#bf4e4c" },

	# Fallback
	{ url = "*/", fg = "#3d94cc" }
]
    