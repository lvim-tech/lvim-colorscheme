#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme MaterialDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#b2c7c7", italic = true }

# Find
find_keyword  = { fg = "#1e292e", bg = "#d37a60", bold = true }
find_position = { fg = "#b8bec2", bg = "#273440", bold = true }

# Symlink
symlink_target = { fg = "#68777e", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#c79e5e", bg = "#c79e5e" }
marker_cut      = { fg = "#d05e64", bg = "#d05e64" }
marker_marked   = { fg = "#d75d70", bg = "#d75d70" }
marker_selected = { fg = "#5b7fcb", bg = "#5b7fcb" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#1e292e", bg = "#83a15c" }
count_cut      = { fg = "#feffff", bg = "#c34e54" }
count_selected = { fg = "#1e292e", bg = "#5bac96" }

# Border
border_symbol = "│"
border_style  = { fg = "#708a54" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#29383f" }
current = { bg = "#2b4048" }
preview = { bg = "#2b4048" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#b8bec2", bg = "#242f34", bold = true }
inactive = { fg = "#bbc8cd", bg = "#222d32" }

[mode]
normal_main = { fg = "#feffff", bg = "#5b7fcb", bold = true }
normal_alt  = { fg = "#91acf0", bg = "#2f444d" }

select_main = { fg = "#feffff", bg = "#d75d70", bold = true }
select_alt  = { fg = "#ec949f", bg = "#2f444d" }

unset_main  = { fg = "#feffff", bg = "#8f74a3", bold = true }
unset_alt   = { fg = "#bca5ce", bg = "#2f444d" }

[status]
# Progress
progress_label  = { fg = "#b2c7c7", bold = true }
progress_normal = { fg = "#b8bec2", bg = "#1e292e" }
progress_error  = { fg = "#feffff", bg = "#d05e64" }

# Permissions
perm_type  = { fg = "#6e91df" }
perm_read  = { fg = "#cfa96a" }
perm_write = { fg = "#d97478" }
perm_exec  = { fg = "#90ad68" }
perm_sep   = { fg = "#68777e" }

[pick]
border   = { fg = "#5074c6" }
active   = { fg = "#b8bec2", bg = "#242f34" }
inactive = { fg = "#b2c7c7" }

[input]
border   = { fg = "#5074c6" }
title    = { fg = "#5074c6" }
value    = { fg = "#a389b7" }
selected = { fg = "#b8bec2", bg = "#242f34" }

[cmp]
border   = { fg = "#5074c6" }
active   = { fg = "#b8bec2", bg = "#242f34" }
inactive = { fg = "#b2c7c7" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#708a54" }
title   = { fg = "#b2c7c7" }
hovered = { fg = "#b8bec2", bg = "#242f34" }

[which]
cols            = 3
mask            = { bg = "#1e292e" }
cand            = { fg = "#65a1bd" }
rest            = { fg = "#6b8edd" }
desc            = { fg = "#dd6c7c" }
separator       = " ➜ "
separator_style = { fg = "#66747b" }

[confirm]
border  = { fg = "#5074c6" }
title   = { fg = "#5074c6" }
body    = {}
list    = {}
btn_yes = { fg = "#b8bec2", bg = "#242f34" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#708a54" }
title    = { fg = "#b2c7c7" }
tbl_col  = { fg = "#6e91df" }
tbl_cell = { fg = "#cfa96a", bg = "#242f34" }

[notify]
title_info  = { fg = "#6b90eb" }
title_warn  = { fg = "#e37554" }
title_error = { fg = "#e56f75" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#90ad68" }
run     = { fg = "#df707f" }
desc    = { fg = "#bbc8cd" }
hovered = { fg = "#b8bec2", bg = "#242f34", bold = true }
footer  = { fg = "#b8bec2", bg = "#242f34" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#cfa96a" },

	# Media
	{ mime = "{audio,video}/*", fg = "#df707f" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d97478" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#65a1bd" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#68777e" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#d05e64" },
	{ url = "*", is = "exec"  , fg = "#90ad68" },
	{ url = "*", is = "dummy", bg = "#d05e64" },
	{ url = "*/", is = "dummy", bg = "#d05e64" },

	# Fallback
	{ url = "*/", fg = "#6e91df" }
]
    