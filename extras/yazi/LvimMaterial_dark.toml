#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme MaterialDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#b2c7c7", italic = true }

# Find
find_keyword  = { fg = "#1a2226", bg = "#d77c61", bold = true }
find_position = { fg = "#b8bec2", bg = "#263543", bold = true }

# Symlink
symlink_target = { fg = "#68777e", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#d9a544", bg = "#d9a544" }
marker_cut      = { fg = "#d1676c", bg = "#d1676c" }
marker_marked   = { fg = "#da596e", bg = "#da596e" }
marker_selected = { fg = "#618adf", bg = "#618adf" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#1a2226", bg = "#99c15f" }
count_cut      = { fg = "#fdfeff", bg = "#ca5157" }
count_selected = { fg = "#1a2226", bg = "#43d8b5" }

# Border
border_symbol = "│"
border_style  = { fg = "#81a356" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#2b3940" }
current = { bg = "#2e3e46" }
preview = { bg = "#2e3e46" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#b8bec2", bg = "#2a373d", bold = true }
inactive = { fg = "#bbc8cd", bg = "#222d32" }

[mode]
normal_main = { fg = "#1a2226", bg = "#618adf", bold = true }
normal_alt  = { fg = "#8caaf5", bg = "#32424a" }

select_main = { fg = "#fdfeff", bg = "#da596e", bold = true }
select_alt  = { fg = "#ef919d", bg = "#32424a" }

unset_main  = { fg = "#1a2226", bg = "#9e86b0", bold = true }
unset_alt   = { fg = "#b9a5c9", bg = "#32424a" }

[status]
# Progress
progress_label  = { fg = "#b2c7c7", bold = true }
progress_normal = { fg = "#b8bec2", bg = "#1a2226" }
progress_error  = { fg = "#1a2226", bg = "#d1676c" }

# Permissions
perm_type  = { fg = "#6b92e5" }
perm_read  = { fg = "#deb05c" }
perm_write = { fg = "#d77579" }
perm_exec  = { fg = "#a6c974" }
perm_sep   = { fg = "#68777e" }

[pick]
border   = { fg = "#4978da" }
active   = { fg = "#b8bec2", bg = "#2a373d" }
inactive = { fg = "#b2c7c7" }

[input]
border   = { fg = "#4978da" }
title    = { fg = "#4978da" }
value    = { fg = "#a189b2" }
selected = { fg = "#b8bec2", bg = "#2a373d" }

[cmp]
border   = { fg = "#4978da" }
active   = { fg = "#b8bec2", bg = "#2a373d" }
inactive = { fg = "#b2c7c7" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#81a356" }
title   = { fg = "#b2c7c7" }
hovered = { fg = "#b8bec2", bg = "#2a373d" }

[which]
cols            = 3
mask            = { bg = "#1a2226" }
cand            = { fg = "#63bbdf" }
rest            = { fg = "#618adf" }
desc            = { fg = "#dd6174" }
separator       = " ➜ "
separator_style = { fg = "#606d73" }

[confirm]
border  = { fg = "#4978da" }
title   = { fg = "#4978da" }
body    = {}
list    = {}
btn_yes = { fg = "#b8bec2", bg = "#2a373d" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#81a356" }
title    = { fg = "#b2c7c7" }
tbl_col  = { fg = "#6b92e5" }
tbl_cell = { fg = "#deb05c", bg = "#2a373d" }

[notify]
title_info  = { fg = "#658ff3" }
title_warn  = { fg = "#e9704a" }
title_error = { fg = "#e37075" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#a6c974" }
run     = { fg = "#e37081" }
desc    = { fg = "#bbc8cd" }
hovered = { fg = "#b8bec2", bg = "#2a373d", bold = true }
footer  = { fg = "#b8bec2", bg = "#2a373d" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#deb05c" },

	# Media
	{ mime = "{audio,video}/*", fg = "#e37081" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d77579" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#63bbdf" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#68777e" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#d1676c" },
	{ url = "*", is = "exec"  , fg = "#a6c974" },
	{ url = "*", is = "dummy", bg = "#d1676c" },
	{ url = "*/", is = "dummy", bg = "#d1676c" },

	# Fallback
	{ url = "*/", fg = "#6b92e5" }
]
    