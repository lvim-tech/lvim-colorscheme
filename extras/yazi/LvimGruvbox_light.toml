#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme GruvboxLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#b0a193", italic = true }

# Find
find_keyword  = { fg = "#dadada", bg = "#8d522b", bold = true }
find_position = { fg = "#5b97b6", bg = "#d6dcdf", bold = true }

# Symlink
symlink_target = { fg = "#a59283", italic = true }

# Marker
marker_copied   = { fg = "#998853", bg = "#998853" }
marker_cut      = { fg = "#c74d4d", bg = "#c74d4d" }
marker_marked   = { fg = "#915a47", bg = "#915a47" }
marker_selected = { fg = "#5089a6", bg = "#5089a6" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#5e8888", bg = "#8a8e46" }
count_cut      = { fg = "#5e8888", bg = "#e44a4a" }
count_selected = { fg = "#5e8888", bg = "#479e8d" }

# Border
border_symbol = "│"
border_style  = { fg = "#9c9f66" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#e9e9e9" }
current = { bg = "#e9e9e9" }
preview = { bg = "#e9e9e9" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#5e8888", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#b6b6b6", bg = "#5089a6", bold = true }
normal_alt  = { fg = "#5089a6", bg = "#3c7478" }

select_main = { fg = "#b6b6b6", bg = "#915a47", bold = true }
select_alt  = { fg = "#915a47", bg = "#3c7478" }

unset_main  = { fg = "#b6b6b6", bg = "#918c9d", bold = true }
unset_alt   = { fg = "#918c9d", bg = "#3c7478" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#b0a193", bold = true }
progress_normal = { fg = "#7b7e3d", bg = "#dadada" }
progress_error  = { fg = "#dadada", bg = "#c74d4d" }

# Permissions
perm_type  = { fg = "#5089a6" }
perm_read  = { fg = "#8f8156" }
perm_write = { fg = "#c74d4d" }
perm_exec  = { fg = "#7b7e3d" }
perm_sep   = { fg = "#a59283" }

[pick]
border   = { fg = "#9c9f66" }
active   = { fg = "#5e8888",  bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

[input]
border   = { fg = "#5b97b6" }
title    = { fg = "#5b97b6" }
value    = { fg = "#918c9d" }
selected = { bg = "#e9e9e9" }

[cmp]
border   = { fg = "#5b97b6" }
active   = { fg = "#5e8888", bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#9c9f66" }
title   = { fg = "#9c9f66" }
hovered = { fg = "#5e8888", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#5c8861" }
rest            = { fg = "#5089a6" }
desc            = { fg = "#915a47" }
separator       = " ➜ "
separator_style = { fg = "#a59283" }

[confirm]
border  = { fg = "#5b97b6" }
title   = { fg = "#9c9f66" }
body    = {}
list    = {}
btn_yes = { bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#9c9f66" }
title    = { fg = "#9c9f66" }
tbl_col  = { fg = "#5089a6" }
tbl_cell = { fg = "#8f8156", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#5b97b6" }
title_warn  = { fg = "#a05e33" }
title_error = { fg = "#e44a4a" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#7b7e3d" }
run     = { fg = "#915a47" }
desc    = { fg = "#3c7478" }
hovered = { bg = "#e9e9e9", bold = true }
footer  = { fg = "#5e8888", bg = "#E4E4E4" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#8f8156" },

	# Media
	{ mime = "{audio,video}/*", fg = "#915a47" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c74d4d" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#5c8861" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#a59283" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#c74d4d" },
	{ url = "*", is = "exec"  , fg = "#7b7e3d" },
	{ url = "*", is = "dummy", bg = "#c74d4d" },
	{ url = "*/", is = "dummy", bg = "#c74d4d" },

	# Fallback
	{ url = "*/", fg = "#5089a6" }
]
    