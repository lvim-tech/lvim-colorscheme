#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme GruvboxLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#dddddd", bg = "#8d522b", bold = true }
find_position = { fg = "#476567", bg = "#d6dcdf", bold = true }

# Symlink
symlink_target = { fg = "#8d7e73", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#998853", bg = "#998853" }
marker_cut      = { fg = "#c74d4d", bg = "#c74d4d" }
marker_marked   = { fg = "#915a47", bg = "#915a47" }
marker_selected = { fg = "#5089a6", bg = "#5089a6" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#8a8e46" }
count_cut      = { fg = "#fcfcfc", bg = "#e44a4a" }
count_selected = { fg = "#fcfcfc", bg = "#479e8d" }

# Border
border_symbol = "│"
border_style  = { fg = "#9c9f66" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#fcfcfc", bg = "#5089a6", bold = true }
normal_alt  = { fg = "#3f5460", bg = "#c4c4c4" }

select_main = { fg = "#e8e8e8", bg = "#915a47", bold = true }
select_alt  = { fg = "#6b473c", bg = "#c4c4c4" }

unset_main  = { fg = "#fcfcfc", bg = "#918c9d", bold = true }
unset_alt   = { fg = "#524f59", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#fcfcfc", bg = "#c74d4d" }

# Permissions
perm_type  = { fg = "#48687a" }
perm_read  = { fg = "#6c634a" }
perm_write = { fg = "#a44747" }
perm_exec  = { fg = "#67693d" }
perm_sep   = { fg = "#8d7e73" }

[pick]
border   = { fg = "#57869f" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#57869f" }
title    = { fg = "#57869f" }
value    = { fg = "#686473" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#57869f" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#9c9f66" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#4c664f" }
rest            = { fg = "#466374" }
desc            = { fg = "#815343" }
separator       = " ➜ "
separator_style = { fg = "#87796f" }

[confirm]
border  = { fg = "#57869f" }
title   = { fg = "#57869f" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#9c9f66" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#48687a" }
tbl_cell = { fg = "#72684c", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#4d6879" }
title_warn  = { fg = "#8f5735" }
title_error = { fg = "#ac4343" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#67693d" }
run     = { fg = "#8d5846" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#6c634a" },

	# Media
	{ mime = "{audio,video}/*", fg = "#8d5846" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a44747" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#4f6c52" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#8d7e73" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#c74d4d" },
	{ url = "*", is = "exec"  , fg = "#67693d" },
	{ url = "*", is = "dummy", bg = "#c74d4d" },
	{ url = "*/", is = "dummy", bg = "#c74d4d" },

	# Fallback
	{ url = "*/", fg = "#48687a" }
]
    