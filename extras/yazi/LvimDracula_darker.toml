#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme DraculaDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#828287", italic = true }

# Find
find_keyword  = { fg = "#15161c", bg = "#de9f5c", bold = true }
find_position = { fg = "#4dc0d8", bg = "#222f39", bold = true }

# Symlink
symlink_target = { fg = "#727a98", italic = true }

# Marker
marker_copied   = { fg = "#c9d451", bg = "#c9d451" }
marker_cut      = { fg = "#dd5757", bg = "#dd5757" }
marker_marked   = { fg = "#dc61a8", bg = "#dc61a8" }
marker_selected = { fg = "#65c8dd", bg = "#65c8dd" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#c7c7b3", bg = "#42d367" }
count_cut      = { fg = "#c7c7b3", bg = "#d84040" }
count_selected = { fg = "#c7c7b3", bg = "#4dc0d8" }

# Border
border_symbol = "│"
border_style  = { fg = "#3baf5a" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#252731" }
current = { bg = "#252731" }
preview = { bg = "#252731" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#c7c7b3", bg = "#252731", bold = true }
inactive = { fg = "#c6c6c3", bg = "#1d1f27" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#17191f", bg = "#65c8dd", bold = true }
normal_alt  = { fg = "#65c8dd", bg = "#c6c6c3" }

select_main = { fg = "#17191f", bg = "#dc61a8", bold = true }
select_alt  = { fg = "#dc61a8", bg = "#c6c6c3" }

unset_main  = { fg = "#17191f", bg = "#9c80c3", bold = true }
unset_alt   = { fg = "#9c80c3", bg = "#c6c6c3" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#828287", bold = true }
progress_normal = { fg = "#58d879", bg = "#15161c" }
progress_error  = { fg = "#15161c", bg = "#dd5757" }

# Permissions
perm_type  = { fg = "#65c8dd" }
perm_read  = { fg = "#d0da68" }
perm_write = { fg = "#dd5757" }
perm_exec  = { fg = "#58d879" }
perm_sep   = { fg = "#727a98" }

[pick]
border   = { fg = "#3baf5a" }
active   = { fg = "#c7c7b3",  bg = "#252731" }
inactive = { fg = "#c7c7b3" }

[input]
border   = { fg = "#4dc0d8" }
title    = { fg = "#4dc0d8" }
value    = { fg = "#9c80c3" }
selected = { bg = "#252731" }

[cmp]
border   = { fg = "#4dc0d8" }
active   = { fg = "#c7c7b3", bg = "#252731" }
inactive = { fg = "#c7c7b3" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#3baf5a" }
title   = { fg = "#3baf5a" }
hovered = { fg = "#c7c7b3", bg = "#252731" }

[which]
cols            = 3
mask            = { bg = "#15161c" }
cand            = { fg = "#61dfca" }
rest            = { fg = "#65c8dd" }
desc            = { fg = "#dc61a8" }
separator       = " ➜ "
separator_style = { fg = "#727a98" }

[confirm]
border  = { fg = "#4dc0d8" }
title   = { fg = "#3baf5a" }
body    = {}
list    = {}
btn_yes = { bg = "#252731" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#3baf5a" }
title    = { fg = "#3baf5a" }
tbl_col  = { fg = "#65c8dd" }
tbl_cell = { fg = "#d0da68", bg = "#252731" }

[notify]
title_info  = { fg = "#4dc0d8" }
title_warn  = { fg = "#d99144" }
title_error = { fg = "#d84040" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#58d879" }
run     = { fg = "#dc61a8" }
desc    = { fg = "#c6c6c3" }
hovered = { bg = "#252731", bold = true }
footer  = { fg = "#c7c7b3", bg = "#1d1f27" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#d0da68" },

	# Media
	{ mime = "{audio,video}/*", fg = "#dc61a8" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#dd5757" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#61dfca" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#727a98" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#dd5757" },
	{ url = "*", is = "exec"  , fg = "#58d879" },
	{ url = "*", is = "dummy", bg = "#dd5757" },
	{ url = "*/", is = "dummy", bg = "#dd5757" },

	# Fallback
	{ url = "*/", fg = "#65c8dd" }
]
    