#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme NightfoxSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#bcbdbd", italic = true }

# Find
find_keyword  = { fg = "#171f2b", bg = "#d49360", bold = true }
find_position = { fg = "#bcbcbd", bg = "#243144", bold = true }

# Symlink
symlink_target = { fg = "#758292", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#b9a15e", bg = "#b9a15e" }
marker_cut      = { fg = "#b46478", bg = "#b46478" }
marker_marked   = { fg = "#9b82af", bg = "#9b82af" }
marker_selected = { fg = "#7292bd", bg = "#7292bd" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#171f2b", bg = "#799e8c" }
count_cut      = { fg = "#f0f5ff", bg = "#ac5369" }
count_selected = { fg = "#171f2b", bg = "#62b2b4" }

# Border
border_symbol = "│"
border_style  = { fg = "#67867b" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#253347" }
current = { bg = "#27384f" }
preview = { bg = "#27384f" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#bcbcbd", bg = "#253347", bold = true }
inactive = { fg = "#b1b5bc", bg = "#1d2837" }

[mode]
normal_main = { fg = "#171f2b", bg = "#7292bd", bold = true }
normal_alt  = { fg = "#89aad7", bg = "#2d3e56" }

select_main = { fg = "#171f2b", bg = "#9b82af", bold = true }
select_alt  = { fg = "#b6a0c9", bg = "#2d3e56" }

unset_main  = { fg = "#171f2b", bg = "#9380b2", bold = true }
unset_alt   = { fg = "#b1a1cd", bg = "#2d3e56" }

[status]
# Progress
progress_label  = { fg = "#bcbdbd", bold = true }
progress_normal = { fg = "#bcbcbd", bg = "#171f2b" }
progress_error  = { fg = "#fdfeff", bg = "#b46478" }

# Permissions
perm_type  = { fg = "#7292bd" }
perm_read  = { fg = "#c1ac71" }
perm_write = { fg = "#c8768a" }
perm_exec  = { fg = "#89aa9a" }
perm_sep   = { fg = "#758292" }

[pick]
border   = { fg = "#5f84b4" }
active   = { fg = "#bcbcbd", bg = "#253347" }
inactive = { fg = "#bcbdbd" }

[input]
border   = { fg = "#5f84b4" }
title    = { fg = "#5f84b4" }
value    = { fg = "#9885b7" }
selected = { fg = "#bcbcbd", bg = "#253347" }

[cmp]
border   = { fg = "#5f84b4" }
active   = { fg = "#bcbcbd", bg = "#253347" }
inactive = { fg = "#bcbdbd" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#67867b" }
title   = { fg = "#bcbdbd" }
hovered = { fg = "#bcbcbd", bg = "#253347" }

[which]
cols            = 3
mask            = { bg = "#171f2b" }
cand            = { fg = "#75bbbd" }
rest            = { fg = "#7292bd" }
desc            = { fg = "#9b82af" }
separator       = " ➜ "
separator_style = { fg = "#758292" }

[confirm]
border  = { fg = "#5f84b4" }
title   = { fg = "#5f84b4" }
body    = {}
list    = {}
btn_yes = { fg = "#bcbcbd", bg = "#253347" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#67867b" }
title    = { fg = "#bcbdbd" }
tbl_col  = { fg = "#7292bd" }
tbl_cell = { fg = "#c1ac71", bg = "#253347" }

[notify]
title_info  = { fg = "#6491ca" }
title_warn  = { fg = "#ce844a" }
title_error = { fg = "#d96b86" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#89aa9a" }
run     = { fg = "#9e85b1" }
desc    = { fg = "#b1b5bc" }
hovered = { fg = "#bcbcbd", bg = "#253347", bold = true }
footer  = { fg = "#bcbcbd", bg = "#253347" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#c1ac71" },

	# Media
	{ mime = "{audio,video}/*", fg = "#9e85b1" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c8768a" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#75bbbd" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#758292" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#b46478" },
	{ url = "*", is = "exec"  , fg = "#89aa9a" },
	{ url = "*", is = "dummy", bg = "#b46478" },
	{ url = "*/", is = "dummy", bg = "#b46478" },

	# Fallback
	{ url = "*/", fg = "#7292bd" }
]
    