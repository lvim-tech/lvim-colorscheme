#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme NightfoxSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#7b8189", italic = true }

# Find
find_keyword  = { fg = "#171f2b", bg = "#d49360", bold = true }
find_position = { fg = "#5f84b4", bg = "#243144", bold = true }

# Symlink
symlink_target = { fg = "#758292", italic = true }

# Marker
marker_copied   = { fg = "#b9a15e", bg = "#b9a15e" }
marker_cut      = { fg = "#b46478", bg = "#b46478" }
marker_marked   = { fg = "#9b82af", bg = "#9b82af" }
marker_selected = { fg = "#7292bd", bg = "#7292bd" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#bcbdbd", bg = "#799e8c" }
count_cut      = { fg = "#bcbdbd", bg = "#ac5369" }
count_selected = { fg = "#bcbdbd", bg = "#62b2b4" }

# Border
border_symbol = "│"
border_style  = { fg = "#67867b" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#253347" }
current = { bg = "#253347" }
preview = { bg = "#253347" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#bcbdbd", bg = "#253347", bold = true }
inactive = { fg = "#b1b5bc", bg = "#1d2837" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#17202c", bg = "#7292bd", bold = true }
normal_alt  = { fg = "#7292bd", bg = "#b1b5bc" }

select_main = { fg = "#17202c", bg = "#9b82af", bold = true }
select_alt  = { fg = "#9b82af", bg = "#b1b5bc" }

unset_main  = { fg = "#17202c", bg = "#9380b2", bold = true }
unset_alt   = { fg = "#9380b2", bg = "#b1b5bc" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#7b8189", bold = true }
progress_normal = { fg = "#89aa9a", bg = "#171f2b" }
progress_error  = { fg = "#171f2b", bg = "#b46478" }

# Permissions
perm_type  = { fg = "#7292bd" }
perm_read  = { fg = "#c1ac71" }
perm_write = { fg = "#b46478" }
perm_exec  = { fg = "#89aa9a" }
perm_sep   = { fg = "#758292" }

[pick]
border   = { fg = "#67867b" }
active   = { fg = "#bcbdbd",  bg = "#253347" }
inactive = { fg = "#bcbdbd" }

[input]
border   = { fg = "#5f84b4" }
title    = { fg = "#5f84b4" }
value    = { fg = "#9380b2" }
selected = { bg = "#253347" }

[cmp]
border   = { fg = "#5f84b4" }
active   = { fg = "#bcbdbd", bg = "#253347" }
inactive = { fg = "#bcbdbd" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#67867b" }
title   = { fg = "#67867b" }
hovered = { fg = "#bcbdbd", bg = "#253347" }

[which]
cols            = 3
mask            = { bg = "#171f2b" }
cand            = { fg = "#75bbbd" }
rest            = { fg = "#7292bd" }
desc            = { fg = "#9b82af" }
separator       = " ➜ "
separator_style = { fg = "#758292" }

[confirm]
border  = { fg = "#5f84b4" }
title   = { fg = "#67867b" }
body    = {}
list    = {}
btn_yes = { bg = "#253347" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#67867b" }
title    = { fg = "#67867b" }
tbl_col  = { fg = "#7292bd" }
tbl_cell = { fg = "#c1ac71", bg = "#253347" }

[notify]
title_info  = { fg = "#5f84b4" }
title_warn  = { fg = "#ce844a" }
title_error = { fg = "#ac5369" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#89aa9a" }
run     = { fg = "#9b82af" }
desc    = { fg = "#b1b5bc" }
hovered = { bg = "#253347", bold = true }
footer  = { fg = "#bcbdbd", bg = "#1d2837" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#c1ac71" },

	# Media
	{ mime = "{audio,video}/*", fg = "#9b82af" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#b46478" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#75bbbd" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#758292" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#b46478" },
	{ url = "*", is = "exec"  , fg = "#89aa9a" },
	{ url = "*", is = "dummy", bg = "#b46478" },
	{ url = "*/", is = "dummy", bg = "#b46478" },

	# Fallback
	{ url = "*/", fg = "#7292bd" }
]
    