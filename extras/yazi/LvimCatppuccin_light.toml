#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme CatppuccinLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#aa724e", bold = true }
find_position = { fg = "#466264", bg = "#d4d8df", bold = true }

# Symlink
symlink_target = { fg = "#727897", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#8b723a", bg = "#8b723a" }
marker_cut      = { fg = "#9d445e", bg = "#9d445e" }
marker_marked   = { fg = "#c065a9", bg = "#c065a9" }
marker_selected = { fg = "#5d8bd3", bg = "#5d8bd3" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#52884d" }
count_cut      = { fg = "#f4f4f4", bg = "#b54c69" }
count_selected = { fg = "#fcfcfc", bg = "#47847a" }

# Border
border_symbol = "│"
border_style  = { fg = "#6f9a6b" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#fcfcfc", bg = "#5d8bd3", bold = true }
normal_alt  = { fg = "#43526d", bg = "#c4c4c4" }

select_main = { fg = "#fcfcfc", bg = "#c065a9", bold = true }
select_alt  = { fg = "#6a4660", bg = "#c4c4c4" }

unset_main  = { fg = "#dadada", bg = "#734e98", bold = true }
unset_alt   = { fg = "#5f457b", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#dddddd", bg = "#9d445e" }

# Permissions
perm_type  = { fg = "#4f658d" }
perm_read  = { fg = "#73623f" }
perm_write = { fg = "#9d445e" }
perm_exec  = { fg = "#4e6e4b" }
perm_sep   = { fg = "#727897" }

[pick]
border   = { fg = "#416cb1" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#416cb1" }
title    = { fg = "#416cb1" }
value    = { fg = "#734e98" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#416cb1" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#6f9a6b" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#42646a" }
rest            = { fg = "#4c6085" }
desc            = { fg = "#805073" }
separator       = " ➜ "
separator_style = { fg = "#727897" }

[confirm]
border  = { fg = "#416cb1" }
title   = { fg = "#416cb1" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#6f9a6b" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#4f658d" }
tbl_cell = { fg = "#796740", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#4165a1" }
title_warn  = { fg = "#8a5b42" }
title_error = { fg = "#a14860" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#4e6e4b" }
run     = { fg = "#88537a" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#73623f" },

	# Media
	{ mime = "{audio,video}/*", fg = "#88537a" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#9d445e" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#456c73" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#727897" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#9d445e" },
	{ url = "*", is = "exec"  , fg = "#4e6e4b" },
	{ url = "*", is = "dummy", bg = "#9d445e" },
	{ url = "*/", is = "dummy", bg = "#9d445e" },

	# Fallback
	{ url = "*/", fg = "#4f658d" }
]
    