#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme CatppuccinLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#62656f", italic = true }

# Find
find_keyword  = { fg = "#dadada", bg = "#aa724e", bold = true }
find_position = { fg = "#416cb1", bg = "#d4d8df", bold = true }

# Symlink
symlink_target = { fg = "#727897", italic = true }

# Marker
marker_copied   = { fg = "#8b723a", bg = "#8b723a" }
marker_cut      = { fg = "#9d445e", bg = "#9d445e" }
marker_marked   = { fg = "#c065a9", bg = "#c065a9" }
marker_selected = { fg = "#5d8bd3", bg = "#5d8bd3" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#5e8888", bg = "#52884d" }
count_cut      = { fg = "#5e8888", bg = "#b54c69" }
count_selected = { fg = "#5e8888", bg = "#47847a" }

# Border
border_symbol = "│"
border_style  = { fg = "#6f9a6b" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#e9e9e9" }
current = { bg = "#e9e9e9" }
preview = { bg = "#e9e9e9" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#5e8888", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#b6b6b6", bg = "#5d8bd3", bold = true }
normal_alt  = { fg = "#5d8bd3", bg = "#3c7478" }

select_main = { fg = "#b6b6b6", bg = "#c065a9", bold = true }
select_alt  = { fg = "#c065a9", bg = "#3c7478" }

unset_main  = { fg = "#b6b6b6", bg = "#734e98", bold = true }
unset_alt   = { fg = "#734e98", bg = "#3c7478" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#62656f", bold = true }
progress_normal = { fg = "#557f51", bg = "#dadada" }
progress_error  = { fg = "#dadada", bg = "#9d445e" }

# Permissions
perm_type  = { fg = "#5d8bd3" }
perm_read  = { fg = "#7f6c41" }
perm_write = { fg = "#9d445e" }
perm_exec  = { fg = "#557f51" }
perm_sep   = { fg = "#727897" }

[pick]
border   = { fg = "#6f9a6b" }
active   = { fg = "#5e8888",  bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

[input]
border   = { fg = "#416cb1" }
title    = { fg = "#416cb1" }
value    = { fg = "#734e98" }
selected = { bg = "#e9e9e9" }

[cmp]
border   = { fg = "#416cb1" }
active   = { fg = "#5e8888", bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#6f9a6b" }
title   = { fg = "#6f9a6b" }
hovered = { fg = "#5e8888", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#487d86" }
rest            = { fg = "#5d8bd3" }
desc            = { fg = "#c065a9" }
separator       = " ➜ "
separator_style = { fg = "#727897" }

[confirm]
border  = { fg = "#416cb1" }
title   = { fg = "#6f9a6b" }
body    = {}
list    = {}
btn_yes = { bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#6f9a6b" }
title    = { fg = "#6f9a6b" }
tbl_col  = { fg = "#5d8bd3" }
tbl_cell = { fg = "#7f6c41", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#416cb1" }
title_warn  = { fg = "#bf7546" }
title_error = { fg = "#b54c69" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#557f51" }
run     = { fg = "#c065a9" }
desc    = { fg = "#3c7478" }
hovered = { bg = "#e9e9e9", bold = true }
footer  = { fg = "#5e8888", bg = "#E4E4E4" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#7f6c41" },

	# Media
	{ mime = "{audio,video}/*", fg = "#c065a9" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#9d445e" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#487d86" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#727897" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#9d445e" },
	{ url = "*", is = "exec"  , fg = "#557f51" },
	{ url = "*", is = "dummy", bg = "#9d445e" },
	{ url = "*/", is = "dummy", bg = "#9d445e" },

	# Fallback
	{ url = "*/", fg = "#5d8bd3" }
]
    