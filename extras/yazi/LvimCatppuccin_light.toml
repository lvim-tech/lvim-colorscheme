#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme CatppuccinLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#ac8068", bold = true }
find_position = { fg = "#476567", bg = "#d8dbe0", bold = true }

# Symlink
symlink_target = { fg = "#727897", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#948161", bg = "#948161" }
marker_cut      = { fg = "#a45a6d", bg = "#a45a6d" }
marker_marked   = { fg = "#845377", bg = "#845377" }
marker_selected = { fg = "#6279a4", bg = "#6279a4" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#5e825c" }
count_cut      = { fg = "#fcfcfc", bg = "#b76277" }
count_selected = { fg = "#fcfcfc", bg = "#5e837b" }

# Border
border_symbol = "│"
border_style  = { fg = "#799677" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#fcfcfc", bg = "#6279a4", bold = true }
normal_alt  = { fg = "#475267", bg = "#c4c4c4" }

select_main = { fg = "#e0e0e0", bg = "#845377", bold = true }
select_alt  = { fg = "#66455d", bg = "#c4c4c4" }

unset_main  = { fg = "#fcfcfc", bg = "#9078ad", bold = true }
unset_alt   = { fg = "#584c68", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#f6f6f6", bg = "#a45a6d" }

# Permissions
perm_type  = { fg = "#556584" }
perm_read  = { fg = "#706551" }
perm_write = { fg = "#8f5261" }
perm_exec  = { fg = "#526c50" }
perm_sep   = { fg = "#727897" }

[pick]
border   = { fg = "#6a81b1" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#6a81b1" }
title    = { fg = "#6a81b1" }
value    = { fg = "#6f5c86" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#6a81b1" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#799677" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#4c6267" }
rest            = { fg = "#52607d" }
desc            = { fg = "#7c5070" }
separator       = " ➜ "
separator_style = { fg = "#727897" }

[confirm]
border  = { fg = "#6a81b1" }
title   = { fg = "#6a81b1" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#799677" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#556584" }
tbl_cell = { fg = "#736753", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#576585" }
title_warn  = { fg = "#815c4b" }
title_error = { fg = "#905462" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#526c50" }
run     = { fg = "#845377" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#706551" },

	# Media
	{ mime = "{audio,video}/*", fg = "#845377" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#8f5261" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#516a6f" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#727897" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#a45a6d" },
	{ url = "*", is = "exec"  , fg = "#526c50" },
	{ url = "*", is = "dummy", bg = "#a45a6d" },
	{ url = "*/", is = "dummy", bg = "#a45a6d" },

	# Fallback
	{ url = "*/", fg = "#556584" }
]
    