#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme EverforestSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#8b9b86", italic = true }

# Find
find_keyword  = { fg = "#202527", bg = "#cc7942", bold = true }
find_position = { fg = "#8f9f8b", bg = "#2b343a", bold = true }

# Symlink
symlink_target = { fg = "#6c7d63", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#a6935a", bg = "#a6935a" }
marker_cut      = { fg = "#cb4f4f", bg = "#cb4f4f" }
marker_marked   = { fg = "#bb755e", bg = "#bb755e" }
marker_selected = { fg = "#42728b", bg = "#42728b" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#b5ecff", bg = "#656831" }
count_cut      = { fg = "#def5ff", bg = "#c53b3b" }
count_selected = { fg = "#99e6ff", bg = "#2d695d" }

# Border
border_symbol = "│"
border_style  = { fg = "#595d31" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#31393e" }
current = { bg = "#373f47" }
preview = { bg = "#373f47" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#8f9f8b", bg = "#2e3439", bold = true }
inactive = { fg = "#788674", bg = "#292f33" }

[mode]
normal_main = { fg = "#d6f3ff", bg = "#42728b", bold = true }
normal_alt  = { fg = "#00bef5", bg = "#3b454d" }

select_main = { fg = "#fafeff", bg = "#bb755e", bold = true }
select_alt  = { fg = "#e99f89", bg = "#3b454d" }

unset_main  = { fg = "#99e6ff", bg = "#635d71", bold = true }
unset_alt   = { fg = "#b3adc1", bg = "#3b454d" }

[status]
# Progress
progress_label  = { fg = "#8b9b86", bold = true }
progress_normal = { fg = "#818e7e", bg = "#202527" }
progress_error  = { fg = "#fafeff", bg = "#cb4f4f" }

# Permissions
perm_type  = { fg = "#32a0cc" }
perm_read  = { fg = "#af9e6b" }
perm_write = { fg = "#e57272" }
perm_exec  = { fg = "#979b28" }
perm_sep   = { fg = "#6c7d63" }

[pick]
border   = { fg = "#36809f" }
active   = { fg = "#8f9f8b", bg = "#2e3439" }
inactive = { fg = "#8b9b86" }

[input]
border   = { fg = "#36809f" }
title    = { fg = "#36809f" }
value    = { fg = "#9992a9" }
selected = { fg = "#8f9f8b", bg = "#2e3439" }

[cmp]
border   = { fg = "#36809f" }
active   = { fg = "#8f9f8b", bg = "#2e3439" }
inactive = { fg = "#8b9b86" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#595d31" }
title   = { fg = "#8b9b86" }
hovered = { fg = "#8f9f8b", bg = "#2e3439" }

[which]
cols            = 3
mask            = { bg = "#202527" }
cand            = { fg = "#5d9a65" }
rest            = { fg = "#3b94bb" }
desc            = { fg = "#c37960" }
separator       = " ➜ "
separator_style = { fg = "#63725c" }

[confirm]
border  = { fg = "#36809f" }
title   = { fg = "#36809f" }
body    = {}
list    = {}
btn_yes = { fg = "#8f9f8b", bg = "#2e3439" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#595d31" }
title    = { fg = "#8b9b86" }
tbl_col  = { fg = "#32a0cc" }
tbl_cell = { fg = "#af9e6b", bg = "#2e3439" }

[notify]
title_info  = { fg = "#00a3d1" }
title_warn  = { fg = "#dc7c32" }
title_error = { fg = "#fa6565" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#979b28" }
run     = { fg = "#d58163" }
desc    = { fg = "#788674" }
hovered = { fg = "#8f9f8b", bg = "#2e3439", bold = true }
footer  = { fg = "#8f9f8b", bg = "#2e3439" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#af9e6b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#d58163" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e57272" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#5fa468" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#6c7d63" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#cb4f4f" },
	{ url = "*", is = "exec"  , fg = "#979b28" },
	{ url = "*", is = "dummy", bg = "#cb4f4f" },
	{ url = "*/", is = "dummy", bg = "#cb4f4f" },

	# Fallback
	{ url = "*/", fg = "#32a0cc" }
]
    