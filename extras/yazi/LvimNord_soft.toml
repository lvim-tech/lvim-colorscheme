#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme NordSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#b3bac6", italic = true }

# Find
find_keyword  = { fg = "#242934", bg = "#b88473", bold = true }
find_position = { fg = "#b4bac6", bg = "#2e3541", bold = true }

# Symlink
symlink_target = { fg = "#6b768c", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#b99c64", bg = "#b99c64" }
marker_cut      = { fg = "#ac6e74", bg = "#ac6e74" }
marker_marked   = { fg = "#a2869d", bg = "#a2869d" }
marker_selected = { fg = "#73889e", bg = "#73889e" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fdfeff", bg = "#788c67" }
count_cut      = { fg = "#f5f8ff", bg = "#a35e65" }
count_selected = { fg = "#fdfeff", bg = "#688a88" }

# Border
border_symbol = "│"
border_style  = { fg = "#68795e" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#313847" }
current = { bg = "#363f51" }
preview = { bg = "#363f51" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#b4bac6", bg = "#2a2f3a", bold = true }
inactive = { fg = "#b0b3ba", bg = "#282d38" }

[mode]
normal_main = { fg = "#fdfeff", bg = "#73889e", bold = true }
normal_alt  = { fg = "#95b3d2", bg = "#394356" }

select_main = { fg = "#fdfeff", bg = "#a2869d", bold = true }
select_alt  = { fg = "#c1aabd", bg = "#394356" }

unset_main  = { fg = "#fdfeff", bg = "#887f93", bold = true }
unset_alt   = { fg = "#b4acbd", bg = "#394356" }

[status]
# Progress
progress_label  = { fg = "#b3bac6", bold = true }
progress_normal = { fg = "#b4bac6", bg = "#242934" }
progress_error  = { fg = "#fdfeff", bg = "#ac6e74" }

# Permissions
perm_type  = { fg = "#7e98b3" }
perm_read  = { fg = "#c3a870" }
perm_write = { fg = "#bc858a" }
perm_exec  = { fg = "#879978" }
perm_sep   = { fg = "#6b768c" }

[pick]
border   = { fg = "#637b93" }
active   = { fg = "#b4bac6", bg = "#2a2f3a" }
inactive = { fg = "#b3bac6" }

[input]
border   = { fg = "#637b93" }
title    = { fg = "#637b93" }
value    = { fg = "#9a91a5" }
selected = { fg = "#b4bac6", bg = "#2a2f3a" }

[cmp]
border   = { fg = "#637b93" }
active   = { fg = "#b4bac6", bg = "#2a2f3a" }
inactive = { fg = "#b3bac6" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#68795e" }
title   = { fg = "#b3bac6" }
hovered = { fg = "#b4bac6", bg = "#2a2f3a" }

[which]
cols            = 3
mask            = { bg = "#242934" }
cand            = { fg = "#7097a3" }
rest            = { fg = "#7a93ac" }
desc            = { fg = "#a4899f" }
separator       = " ➜ "
separator_style = { fg = "#697488" }

[confirm]
border  = { fg = "#637b93" }
title   = { fg = "#637b93" }
body    = {}
list    = {}
btn_yes = { fg = "#b4bac6", bg = "#2a2f3a" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#68795e" }
title    = { fg = "#b3bac6" }
tbl_col  = { fg = "#7e98b3" }
tbl_cell = { fg = "#c3a870", bg = "#2a2f3a" }

[notify]
title_info  = { fg = "#7399bc" }
title_warn  = { fg = "#cc8269" }
title_error = { fg = "#cb8289" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#879978" }
run     = { fg = "#a78ba2" }
desc    = { fg = "#b0b3ba" }
hovered = { fg = "#b4bac6", bg = "#2a2f3a", bold = true }
footer  = { fg = "#b4bac6", bg = "#2a2f3a" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#c3a870" },

	# Media
	{ mime = "{audio,video}/*", fg = "#a78ba2" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#bc858a" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#719aa6" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#6b768c" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#ac6e74" },
	{ url = "*", is = "exec"  , fg = "#879978" },
	{ url = "*", is = "dummy", bg = "#ac6e74" },
	{ url = "*/", is = "dummy", bg = "#ac6e74" },

	# Fallback
	{ url = "*/", fg = "#7e98b3" }
]
    