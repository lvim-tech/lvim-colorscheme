#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme NordSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#b3bac6", italic = true }

# Find
find_keyword  = { fg = "#1f232c", bg = "#ba8574", bold = true }
find_position = { fg = "#b4bac6", bg = "#2f3643", bold = true }

# Symlink
symlink_target = { fg = "#6b768c", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#c3a25d", bg = "#c3a25d" }
marker_cut      = { fg = "#af7177", bg = "#af7177" }
marker_marked   = { fg = "#a58aa0", bg = "#a58aa0" }
marker_selected = { fg = "#8097af", bg = "#8097af" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#1f232c", bg = "#89a076" }
count_cut      = { fg = "#fafbff", bg = "#a66067" }
count_selected = { fg = "#1f232c", bg = "#789f9d" }

# Border
border_symbol = "│"
border_style  = { fg = "#76896a" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#323846" }
current = { bg = "#353d4d" }
preview = { bg = "#353d4d" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#b4bac6", bg = "#303643", bold = true }
inactive = { fg = "#b0b3ba", bg = "#282d38" }

[mode]
normal_main = { fg = "#1f232c", bg = "#8097af", bold = true }
normal_alt  = { fg = "#97b2ce", bg = "#3a4354" }

select_main = { fg = "#1f232c", bg = "#a58aa0", bold = true }
select_alt  = { fg = "#bfa9bb", bg = "#3a4354" }

unset_main  = { fg = "#1f232c", bg = "#9b93a4", bold = true }
unset_alt   = { fg = "#b5aebd", bg = "#3a4354" }

[status]
# Progress
progress_label  = { fg = "#b3bac6", bold = true }
progress_normal = { fg = "#b4bac6", bg = "#1f232c" }
progress_error  = { fg = "#fefeff", bg = "#af7177" }

# Permissions
perm_type  = { fg = "#8097af" }
perm_read  = { fg = "#cbae72" }
perm_write = { fg = "#bc868b" }
perm_exec  = { fg = "#97ab86" }
perm_sep   = { fg = "#6b768c" }

[pick]
border   = { fg = "#6f89a4" }
active   = { fg = "#b4bac6", bg = "#303643" }
inactive = { fg = "#b3bac6" }

[input]
border   = { fg = "#6f89a4" }
title    = { fg = "#6f89a4" }
value    = { fg = "#9b93a4" }
selected = { fg = "#b4bac6", bg = "#303643" }

[cmp]
border   = { fg = "#6f89a4" }
active   = { fg = "#b4bac6", bg = "#303643" }
inactive = { fg = "#b3bac6" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#76896a" }
title   = { fg = "#b3bac6" }
hovered = { fg = "#b4bac6", bg = "#303643" }

[which]
cols            = 3
mask            = { bg = "#1f232c" }
cand            = { fg = "#7eaab7" }
rest            = { fg = "#8097af" }
desc            = { fg = "#a58aa0" }
separator       = " ➜ "
separator_style = { fg = "#677185" }

[confirm]
border  = { fg = "#6f89a4" }
title   = { fg = "#6f89a4" }
body    = {}
list    = {}
btn_yes = { fg = "#b4bac6", bg = "#303643" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#76896a" }
title    = { fg = "#b3bac6" }
tbl_col  = { fg = "#8097af" }
tbl_cell = { fg = "#cbae72", bg = "#303643" }

[notify]
title_info  = { fg = "#7999ba" }
title_warn  = { fg = "#ca8169" }
title_error = { fg = "#ca8288" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#97ab86" }
run     = { fg = "#a78da2" }
desc    = { fg = "#b0b3ba" }
hovered = { fg = "#b4bac6", bg = "#303643", bold = true }
footer  = { fg = "#b4bac6", bg = "#303643" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#cbae72" },

	# Media
	{ mime = "{audio,video}/*", fg = "#a78da2" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#bc868b" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#7eaab7" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#6b768c" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#af7177" },
	{ url = "*", is = "exec"  , fg = "#97ab86" },
	{ url = "*", is = "dummy", bg = "#af7177" },
	{ url = "*/", is = "dummy", bg = "#af7177" },

	# Fallback
	{ url = "*/", fg = "#8097af" }
]
    