#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme EverforestDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#849380", italic = true }

# Find
find_keyword  = { fg = "#1a1f21", bg = "#cc7942", bold = true }
find_position = { fg = "#8a9986", bg = "#252f35", bold = true }

# Symlink
symlink_target = { fg = "#687760", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#a6935a", bg = "#a6935a" }
marker_cut      = { fg = "#cb4f4f", bg = "#cb4f4f" }
marker_marked   = { fg = "#bb755e", bg = "#bb755e" }
marker_selected = { fg = "#42728b", bg = "#42728b" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#b6ecff", bg = "#656831" }
count_cut      = { fg = "#def6ff", bg = "#c53b3b" }
count_selected = { fg = "#9ae6ff", bg = "#2d695d" }

# Border
border_symbol = "│"
border_style  = { fg = "#585b30" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#2d353b" }
current = { bg = "#303941" }
preview = { bg = "#303941" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#8a9986", bg = "#282e33", bold = true }
inactive = { fg = "#738070", bg = "#23292d" }

[mode]
normal_main = { fg = "#d7f4ff", bg = "#42728b", bold = true }
normal_alt  = { fg = "#00b5ea", bg = "#343e47" }

select_main = { fg = "#1a1f21", bg = "#bb755e", bold = true }
select_alt  = { fg = "#e49277", bg = "#343e47" }

unset_main  = { fg = "#9ae6ff", bg = "#635d71", bold = true }
unset_alt   = { fg = "#aba4ba", bg = "#343e47" }

[status]
# Progress
progress_label  = { fg = "#849380", bold = true }
progress_normal = { fg = "#7d897a", bg = "#1a1f21" }
progress_error  = { fg = "#fbfeff", bg = "#cb4f4f" }

# Permissions
perm_type  = { fg = "#379ac3" }
perm_read  = { fg = "#af9e6b" }
perm_write = { fg = "#e36a6a" }
perm_exec  = { fg = "#92962d" }
perm_sep   = { fg = "#687760" }

[pick]
border   = { fg = "#387a97" }
active   = { fg = "#8a9986", bg = "#282e33" }
inactive = { fg = "#849380" }

[input]
border   = { fg = "#387a97" }
title    = { fg = "#387a97" }
value    = { fg = "#938ca4" }
selected = { fg = "#8a9986", bg = "#282e33" }

[cmp]
border   = { fg = "#387a97" }
active   = { fg = "#8a9986", bg = "#282e33" }
inactive = { fg = "#849380" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#585b30" }
title   = { fg = "#849380" }
hovered = { fg = "#8a9986", bg = "#282e33" }

[which]
cols            = 3
mask            = { bg = "#1a1f21" }
cand            = { fg = "#5b9463" }
rest            = { fg = "#3e8eb2" }
desc            = { fg = "#bb755e" }
separator       = " ➜ "
separator_style = { fg = "#5f6d59" }

[confirm]
border  = { fg = "#387a97" }
title   = { fg = "#387a97" }
body    = {}
list    = {}
btn_yes = { fg = "#8a9986", bg = "#282e33" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#585b30" }
title    = { fg = "#849380" }
tbl_col  = { fg = "#379ac3" }
tbl_cell = { fg = "#af9e6b", bg = "#282e33" }

[notify]
title_info  = { fg = "#179ac5" }
title_warn  = { fg = "#d37836" }
title_error = { fg = "#f65757" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#92962d" }
run     = { fg = "#c87b61" }
desc    = { fg = "#738070" }
hovered = { fg = "#8a9986", bg = "#282e33", bold = true }
footer  = { fg = "#8a9986", bg = "#282e33" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#af9e6b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#c87b61" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e36a6a" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#5e9d66" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#687760" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#cb4f4f" },
	{ url = "*", is = "exec"  , fg = "#92962d" },
	{ url = "*", is = "dummy", bg = "#cb4f4f" },
	{ url = "*/", is = "dummy", bg = "#cb4f4f" },

	# Fallback
	{ url = "*/", fg = "#379ac3" }
]
    