#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme TokyonightLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#b57148", bold = true }
find_position = { fg = "#466264", bg = "#d5d9e1", bold = true }

# Symlink
symlink_target = { fg = "#7b809d", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#a37f4a", bg = "#a37f4a" }
marker_cut      = { fg = "#a94357", bg = "#a94357" }
marker_marked   = { fg = "#8051c9", bg = "#8051c9" }
marker_selected = { fg = "#4363a3", bg = "#4363a3" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#68844b" }
count_cut      = { fg = "#fcfcfc", bg = "#c4485f" }
count_selected = { fg = "#eeeeee", bg = "#277767" }

# Border
border_symbol = "│"
border_style  = { fg = "#81976a" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#e2e2e2", bg = "#4363a3", bold = true }
normal_alt  = { fg = "#3d507c", bg = "#c4c4c4" }

select_main = { fg = "#eeeeee", bg = "#8051c9", bold = true }
select_alt  = { fg = "#5d428c", bg = "#c4c4c4" }

unset_main  = { fg = "#e2e2e2", bg = "#715a95", bold = true }
unset_alt   = { fg = "#57496e", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#e5e5e5", bg = "#a94357" }

# Permissions
perm_type  = { fg = "#4363a3" }
perm_read  = { fg = "#746147" }
perm_write = { fg = "#a94357" }
perm_exec  = { fg = "#5a6b49" }
perm_sep   = { fg = "#7b809d" }

[pick]
border   = { fg = "#4971c5" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#4971c5" }
title    = { fg = "#4971c5" }
value    = { fg = "#715a95" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#4971c5" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#81976a" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#426277" }
rest            = { fg = "#425e99" }
desc            = { fg = "#7149b0" }
separator       = " ➜ "
separator_style = { fg = "#737895" }

[confirm]
border  = { fg = "#4971c5" }
title   = { fg = "#4971c5" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#81976a" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#4363a3" }
tbl_cell = { fg = "#7b6549", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#4763a4" }
title_warn  = { fg = "#8f593f" }
title_error = { fg = "#a54455" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#5a6b49" }
run     = { fg = "#784bbd" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#746147" },

	# Media
	{ mime = "{audio,video}/*", fg = "#784bbd" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a94357" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#446a82" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#7b809d" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#a94357" },
	{ url = "*", is = "exec"  , fg = "#5a6b49" },
	{ url = "*", is = "dummy", bg = "#a94357" },
	{ url = "*/", is = "dummy", bg = "#a94357" },

	# Fallback
	{ url = "*/", fg = "#4363a3" }
]
    