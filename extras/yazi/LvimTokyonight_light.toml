#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme TokyonightLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#878b9e", italic = true }

# Find
find_keyword  = { fg = "#dadada", bg = "#b57148", bold = true }
find_position = { fg = "#4971c5", bg = "#d5d9e1", bold = true }

# Symlink
symlink_target = { fg = "#8085a2", italic = true }

# Marker
marker_copied   = { fg = "#a37f4a", bg = "#a37f4a" }
marker_cut      = { fg = "#a94357", bg = "#a94357" }
marker_marked   = { fg = "#8051c9", bg = "#8051c9" }
marker_selected = { fg = "#4363a3", bg = "#4363a3" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#5e8888", bg = "#68844b" }
count_cut      = { fg = "#5e8888", bg = "#c4485f" }
count_selected = { fg = "#5e8888", bg = "#277767" }

# Border
border_symbol = "│"
border_style  = { fg = "#81976a" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#e9e9e9" }
current = { bg = "#e9e9e9" }
preview = { bg = "#e9e9e9" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#5e8888", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#b6b6b6", bg = "#4363a3", bold = true }
normal_alt  = { fg = "#4363a3", bg = "#3c7478" }

select_main = { fg = "#b6b6b6", bg = "#8051c9", bold = true }
select_alt  = { fg = "#8051c9", bg = "#3c7478" }

unset_main  = { fg = "#b6b6b6", bg = "#715a95", bold = true }
unset_alt   = { fg = "#715a95", bg = "#3c7478" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#878b9e", bold = true }
progress_normal = { fg = "#667b4f", bg = "#dadada" }
progress_error  = { fg = "#dadada", bg = "#a94357" }

# Permissions
perm_type  = { fg = "#4363a3" }
perm_read  = { fg = "#95784f" }
perm_write = { fg = "#a94357" }
perm_exec  = { fg = "#667b4f" }
perm_sep   = { fg = "#8085a2" }

[pick]
border   = { fg = "#81976a" }
active   = { fg = "#5e8888",  bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

[input]
border   = { fg = "#4971c5" }
title    = { fg = "#4971c5" }
value    = { fg = "#715a95" }
selected = { bg = "#e9e9e9" }

[cmp]
border   = { fg = "#4971c5" }
active   = { fg = "#5e8888", bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#81976a" }
title   = { fg = "#81976a" }
hovered = { fg = "#5e8888", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#4682a5" }
rest            = { fg = "#4363a3" }
desc            = { fg = "#8051c9" }
separator       = " ➜ "
separator_style = { fg = "#8085a2" }

[confirm]
border  = { fg = "#4971c5" }
title   = { fg = "#81976a" }
body    = {}
list    = {}
btn_yes = { bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#81976a" }
title    = { fg = "#81976a" }
tbl_col  = { fg = "#4363a3" }
tbl_cell = { fg = "#95784f", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#4971c5" }
title_warn  = { fg = "#cb733e" }
title_error = { fg = "#c4485f" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#667b4f" }
run     = { fg = "#8051c9" }
desc    = { fg = "#3c7478" }
hovered = { bg = "#e9e9e9", bold = true }
footer  = { fg = "#5e8888", bg = "#E4E4E4" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#95784f" },

	# Media
	{ mime = "{audio,video}/*", fg = "#8051c9" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a94357" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#4682a5" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#8085a2" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#a94357" },
	{ url = "*", is = "exec"  , fg = "#667b4f" },
	{ url = "*", is = "dummy", bg = "#a94357" },
	{ url = "*/", is = "dummy", bg = "#a94357" },

	# Fallback
	{ url = "*/", fg = "#4363a3" }
]
    