#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme TokyonightLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#b17f67", bold = true }
find_position = { fg = "#476567", bg = "#d9dbe0", bold = true }

# Symlink
symlink_target = { fg = "#7b809d", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#9d8465", bg = "#9d8465" }
marker_cut      = { fg = "#ab5867", bg = "#ab5867" }
marker_marked   = { fg = "#765ba6", bg = "#765ba6" }
marker_selected = { fg = "#6579ac", bg = "#6579ac" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#6c7e5b" }
count_cut      = { fg = "#fcfcfc", bg = "#bd606f" }
count_selected = { fg = "#fcfcfc", bg = "#658e83" }

# Border
border_symbol = "│"
border_style  = { fg = "#849276" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#fcfcfc", bg = "#6579ac", bold = true }
normal_alt  = { fg = "#485068", bg = "#c4c4c4" }

select_main = { fg = "#ebebeb", bg = "#765ba6", bold = true }
select_alt  = { fg = "#594878", bg = "#c4c4c4" }

unset_main  = { fg = "#fcfcfc", bg = "#8b7ea3", bold = true }
unset_alt   = { fg = "#544d62", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#f9f9f9", bg = "#ab5867" }

# Permissions
perm_type  = { fg = "#58658a" }
perm_read  = { fg = "#706351" }
perm_write = { fg = "#95515d" }
perm_exec  = { fg = "#5c6a4f" }
perm_sep   = { fg = "#7b809d" }

[pick]
border   = { fg = "#6c7fb5" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#6c7fb5" }
title    = { fg = "#6c7fb5" }
value    = { fg = "#6c6081" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#6c7fb5" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#849276" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#4e6170" }
rest            = { fg = "#525e7e" }
desc            = { fg = "#6a5394" }
separator       = " ➜ "
separator_style = { fg = "#737895" }

[confirm]
border  = { fg = "#6c7fb5" }
title   = { fg = "#6c7fb5" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#849276" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#58658a" }
tbl_cell = { fg = "#766754", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#596487" }
title_warn  = { fg = "#845c4c" }
title_error = { fg = "#90515b" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#5c6a4f" }
run     = { fg = "#70579e" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#706351" },

	# Media
	{ mime = "{audio,video}/*", fg = "#70579e" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#95515d" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#52697a" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#7b809d" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#ab5867" },
	{ url = "*", is = "exec"  , fg = "#5c6a4f" },
	{ url = "*", is = "dummy", bg = "#ab5867" },
	{ url = "*/", is = "dummy", bg = "#ab5867" },

	# Fallback
	{ url = "*/", fg = "#58658a" }
]
    