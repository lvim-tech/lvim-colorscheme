#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme LvimDark
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#639696", italic = true }

# Find
find_keyword  = { fg = "#181d1f", bg = "#FF9C2A", bold = true }
find_position = { fg = "#55a6ab", bg = "#1e2f37", bold = true }

# Symlink
symlink_target = { fg = "#577576", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#eab749", bg = "#eab749" }
marker_cut      = { fg = "#e65e4f", bg = "#e65e4f" }
marker_marked   = { fg = "#c75940", bg = "#c75940" }
marker_selected = { fg = "#0A85B9", bg = "#0A85B9" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#181d1f", bg = "#7d9654" }
count_cut      = { fg = "#fbfeff", bg = "#e34a39" }
count_selected = { fg = "#aeeaff", bg = "#1c7060" }

# Border
border_symbol = "│"
border_style  = { fg = "#6a804c" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#2b343a" }
current = { bg = "#2e3940" }
preview = { bg = "#2e3940" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#55a9ae", bg = "#2b343a", bold = true }
inactive = { fg = "#39858a", bg = "#20272b" }

[mode]
normal_main = { fg = "#fbfeff", bg = "#0A85B9", bold = true }
normal_alt  = { fg = "#00b7fe", bg = "#364149" }

select_main = { fg = "#fbfeff", bg = "#c75940", bold = true }
select_alt  = { fg = "#fe8d79", bg = "#364149" }

unset_main  = { fg = "#f4fcff", bg = "#177ab3", bold = true }
unset_alt   = { fg = "#3eb3ff", bg = "#364149" }

[status]
# Progress
progress_label  = { fg = "#639696", bold = true }
progress_normal = { fg = "#55a6ab", bg = "#181d1f" }
progress_error  = { fg = "#181d1f", bg = "#e65e4f" }

# Permissions
perm_type  = { fg = "#0098d4" }
perm_read  = { fg = "#edc060" }
perm_write = { fg = "#e76254" }
perm_exec  = { fg = "#8AA55F" }
perm_sep   = { fg = "#577576" }

[pick]
border   = { fg = "#0077a5" }
active   = { fg = "#55a9ae", bg = "#2b343a" }
inactive = { fg = "#639696" }

[input]
border   = { fg = "#0077a5" }
title    = { fg = "#0077a5" }
value    = { fg = "#0095dc" }
selected = { fg = "#55a9ae", bg = "#2b343a" }

[cmp]
border   = { fg = "#0077a5" }
active   = { fg = "#55a9ae", bg = "#2b343a" }
inactive = { fg = "#639696" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#6a804c" }
title   = { fg = "#639696" }
hovered = { fg = "#55a9ae", bg = "#2b343a" }

[which]
cols            = 3
mask            = { bg = "#181d1f" }
cand            = { fg = "#0092a9" }
rest            = { fg = "#008dc5" }
desc            = { fg = "#db5d3e" }
separator       = " ➜ "
separator_style = { fg = "#536d6e" }

[confirm]
border  = { fg = "#0077a5" }
title   = { fg = "#0077a5" }
body    = {}
list    = {}
btn_yes = { fg = "#55a9ae", bg = "#2b343a" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#6a804c" }
title    = { fg = "#639696" }
tbl_col  = { fg = "#0098d4" }
tbl_cell = { fg = "#edc060", bg = "#2b343a" }

[notify]
title_info  = { fg = "#0097d1" }
title_warn  = { fg = "#ff9010" }
title_error = { fg = "#f55646" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#8AA55F" }
run     = { fg = "#eb613c" }
desc    = { fg = "#39858a" }
hovered = { fg = "#55a9ae", bg = "#2b343a", bold = true }
footer  = { fg = "#55a9ae", bg = "#2b343a" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#edc060" },

	# Media
	{ mime = "{audio,video}/*", fg = "#eb613c" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e76254" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#009ab3" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#577576" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#e65e4f" },
	{ url = "*", is = "exec"  , fg = "#8AA55F" },
	{ url = "*", is = "dummy", bg = "#e65e4f" },
	{ url = "*/", is = "dummy", bg = "#e65e4f" },

	# Fallback
	{ url = "*/", fg = "#0098d4" }
]
    