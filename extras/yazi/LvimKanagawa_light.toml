#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme KanagawaLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#a87e56", bold = true }
find_position = { fg = "#476567", bg = "#d8dbe2", bold = true }

# Symlink
symlink_target = { fg = "#80809a", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#87734c", bg = "#87734c" }
marker_cut      = { fg = "#c35959", bg = "#c35959" }
marker_marked   = { fg = "#94544f", bg = "#94544f" }
marker_selected = { fg = "#6385c2", bg = "#6385c2" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#728559" }
count_cut      = { fg = "#fcfcfc", bg = "#d15d5d" }
count_selected = { fg = "#fcfcfc", bg = "#528295" }

# Border
border_symbol = "│"
border_style  = { fg = "#899875" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#fcfcfc", bg = "#6385c2", bold = true }
normal_alt  = { fg = "#45516a", bg = "#c4c4c4" }

select_main = { fg = "#e5e5e5", bg = "#94544f", bold = true }
select_alt  = { fg = "#6f4542", bg = "#c4c4c4" }

unset_main  = { fg = "#fcfcfc", bg = "#887fa0", bold = true }
unset_alt   = { fg = "#534d61", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#fcfcfc", bg = "#c35959" }

# Permissions
perm_type  = { fg = "#526489" }
perm_read  = { fg = "#726346" }
perm_write = { fg = "#9d4f4f" }
perm_exec  = { fg = "#5d6b4b" }
perm_sep   = { fg = "#80809a" }

[pick]
border   = { fg = "#6480b7" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#6480b7" }
title    = { fg = "#6480b7" }
value    = { fg = "#6a617f" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#6480b7" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#899875" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#4e6460" }
rest            = { fg = "#4f5f81" }
desc            = { fg = "#874f4b" }
separator       = " ➜ "
separator_style = { fg = "#797992" }

[confirm]
border  = { fg = "#6480b7" }
title   = { fg = "#6480b7" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#899875" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#526489" }
tbl_cell = { fg = "#756547", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#546588" }
title_warn  = { fg = "#7b604a" }
title_error = { fg = "#9a4c4c" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#5d6b4b" }
run     = { fg = "#94544f" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#726346" },

	# Media
	{ mime = "{audio,video}/*", fg = "#94544f" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#9d4f4f" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#516965" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#80809a" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#c35959" },
	{ url = "*", is = "exec"  , fg = "#5d6b4b" },
	{ url = "*", is = "dummy", bg = "#c35959" },
	{ url = "*/", is = "dummy", bg = "#c35959" },

	# Fallback
	{ url = "*/", fg = "#526489" }
]
    