#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme KanagawaLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#506a6a", italic = true }

# Find
find_keyword  = { fg = "#fcfcfc", bg = "#a5794e", bold = true }
find_position = { fg = "#476567", bg = "#d8dbe2", bold = true }

# Symlink
symlink_target = { fg = "#80809a", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#7b6943", bg = "#7b6943" }
marker_cut      = { fg = "#c85b5b", bg = "#c85b5b" }
marker_marked   = { fg = "#92534e", bg = "#92534e" }
marker_selected = { fg = "#6386c4", bg = "#6386c4" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fcfcfc", bg = "#6d7f55" }
count_cut      = { fg = "#fcfcfc", bg = "#d15e5e" }
count_selected = { fg = "#f4f4f4", bg = "#42778a" }

# Border
border_symbol = "│"
border_style  = { fg = "#859372" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#d5d5d5" }
current = { bg = "#cdcdcd" }
preview = { bg = "#cdcdcd" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }

[mode]
normal_main = { fg = "#fcfcfc", bg = "#6386c4", bold = true }
normal_alt  = { fg = "#445068", bg = "#c4c4c4" }

select_main = { fg = "#e2e2e2", bg = "#92534e", bold = true }
select_alt  = { fg = "#714642", bg = "#c4c4c4" }

unset_main  = { fg = "#fcfcfc", bg = "#82789b", bold = true }
unset_alt   = { fg = "#544e64", bg = "#c4c4c4" }

[status]
# Progress
progress_label  = { fg = "#506a6a", bold = true }
progress_normal = { fg = "#476567", bg = "#dadada" }
progress_error  = { fg = "#fcfcfc", bg = "#c85b5b" }

# Permissions
perm_type  = { fg = "#52658b" }
perm_read  = { fg = "#716243" }
perm_write = { fg = "#994e4e" }
perm_exec  = { fg = "#5b694a" }
perm_sep   = { fg = "#80809a" }

[pick]
border   = { fg = "#6381b8" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

[input]
border   = { fg = "#6381b8" }
title    = { fg = "#6381b8" }
value    = { fg = "#695f7f" }
selected = { fg = "#4b6f72", bg = "#e9e9e9" }

[cmp]
border   = { fg = "#6381b8" }
active   = { fg = "#4b6f72", bg = "#e9e9e9" }
inactive = { fg = "#506a6a" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#859372" }
title   = { fg = "#506a6a" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#4d625e" }
rest            = { fg = "#4f6083" }
desc            = { fg = "#8a504b" }
separator       = " ➜ "
separator_style = { fg = "#797992" }

[confirm]
border  = { fg = "#6381b8" }
title   = { fg = "#6381b8" }
body    = {}
list    = {}
btn_yes = { fg = "#4b6f72", bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#859372" }
title    = { fg = "#506a6a" }
tbl_col  = { fg = "#52658b" }
tbl_cell = { fg = "#776745", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#546589" }
title_warn  = { fg = "#7c5e44" }
title_error = { fg = "#9b4d4d" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#5b694a" }
run     = { fg = "#92534e" }
desc    = { fg = "#3c7478" }
hovered = { fg = "#4b6f72", bg = "#e9e9e9", bold = true }
footer  = { fg = "#4b6f72", bg = "#e9e9e9" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#716243" },

	# Media
	{ mime = "{audio,video}/*", fg = "#92534e" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#994e4e" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#526a66" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#80809a" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#c85b5b" },
	{ url = "*", is = "exec"  , fg = "#5b694a" },
	{ url = "*", is = "dummy", bg = "#c85b5b" },
	{ url = "*/", is = "dummy", bg = "#c85b5b" },

	# Fallback
	{ url = "*/", fg = "#52658b" }
]
    