#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme KanagawaLight
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#a3a3b1", italic = true }

# Find
find_keyword  = { fg = "#dadada", bg = "#a5794e", bold = true }
find_position = { fg = "#688bcb", bg = "#d8dbe2", bold = true }

# Symlink
symlink_target = { fg = "#9d9db5", italic = true }

# Marker
marker_copied   = { fg = "#7b6943", bg = "#7b6943" }
marker_cut      = { fg = "#c85b5b", bg = "#c85b5b" }
marker_marked   = { fg = "#92534e", bg = "#92534e" }
marker_selected = { fg = "#6386c4", bg = "#6386c4" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#5e8888", bg = "#6d7f55" }
count_cut      = { fg = "#5e8888", bg = "#d15e5e" }
count_selected = { fg = "#5e8888", bg = "#42778a" }

# Border
border_symbol = "│"
border_style  = { fg = "#859372" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#e9e9e9" }
current = { bg = "#e9e9e9" }
preview = { bg = "#e9e9e9" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#5e8888", bg = "#e9e9e9", bold = true }
inactive = { fg = "#3c7478", bg = "#E4E4E4" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#b6b6b6", bg = "#6386c4", bold = true }
normal_alt  = { fg = "#6386c4", bg = "#3c7478" }

select_main = { fg = "#b6b6b6", bg = "#92534e", bold = true }
select_alt  = { fg = "#92534e", bg = "#3c7478" }

unset_main  = { fg = "#b6b6b6", bg = "#82789b", bold = true }
unset_alt   = { fg = "#82789b", bg = "#3c7478" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#a3a3b1", bold = true }
progress_normal = { fg = "#677951", bg = "#dadada" }
progress_error  = { fg = "#dadada", bg = "#c85b5b" }

# Permissions
perm_type  = { fg = "#6386c4" }
perm_read  = { fg = "#776745" }
perm_write = { fg = "#c85b5b" }
perm_exec  = { fg = "#677951" }
perm_sep   = { fg = "#9d9db5" }

[pick]
border   = { fg = "#859372" }
active   = { fg = "#5e8888",  bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

[input]
border   = { fg = "#688bcb" }
title    = { fg = "#688bcb" }
value    = { fg = "#82789b" }
selected = { bg = "#e9e9e9" }

[cmp]
border   = { fg = "#688bcb" }
active   = { fg = "#5e8888", bg = "#e9e9e9" }
inactive = { fg = "#5e8888" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#859372" }
title   = { fg = "#859372" }
hovered = { fg = "#5e8888", bg = "#e9e9e9" }

[which]
cols            = 3
mask            = { bg = "#dadada" }
cand            = { fg = "#5d807a" }
rest            = { fg = "#6386c4" }
desc            = { fg = "#92534e" }
separator       = " ➜ "
separator_style = { fg = "#9d9db5" }

[confirm]
border  = { fg = "#688bcb" }
title   = { fg = "#859372" }
body    = {}
list    = {}
btn_yes = { bg = "#e9e9e9" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#859372" }
title    = { fg = "#859372" }
tbl_col  = { fg = "#6386c4" }
tbl_cell = { fg = "#776745", bg = "#e9e9e9" }

[notify]
title_info  = { fg = "#688bcb" }
title_warn  = { fg = "#ab7b4b" }
title_error = { fg = "#d15e5e" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#677951" }
run     = { fg = "#92534e" }
desc    = { fg = "#3c7478" }
hovered = { bg = "#e9e9e9", bold = true }
footer  = { fg = "#5e8888", bg = "#E4E4E4" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#776745" },

	# Media
	{ mime = "{audio,video}/*", fg = "#92534e" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c85b5b" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#5d807a" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#9d9db5" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#c85b5b" },
	{ url = "*", is = "exec"  , fg = "#677951" },
	{ url = "*", is = "dummy", bg = "#c85b5b" },
	{ url = "*/", is = "dummy", bg = "#c85b5b" },

	# Fallback
	{ url = "*/", fg = "#6386c4" }
]
    