#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme MaterialDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#5e6a70", italic = true }

# Find
find_keyword  = { fg = "#141a1d", bg = "#d77c61", bold = true }
find_position = { fg = "#4978da", bg = "#212d3b", bold = true }

# Symlink
symlink_target = { fg = "#5e6a70", italic = true }

# Marker
marker_copied   = { fg = "#d9a544", bg = "#d9a544" }
marker_cut      = { fg = "#d1676c", bg = "#d1676c" }
marker_marked   = { fg = "#da596e", bg = "#da596e" }
marker_selected = { fg = "#618adf", bg = "#618adf" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#b2c7c7", bg = "#99c15f" }
count_cut      = { fg = "#b2c7c7", bg = "#ca5157" }
count_selected = { fg = "#b2c7c7", bg = "#43d8b5" }

# Border
border_symbol = "│"
border_style  = { fg = "#80a254" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#242f34" }
current = { bg = "#242f34" }
preview = { bg = "#242f34" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#b2c7c7", bg = "#242f34", bold = true }
inactive = { fg = "#bbc8cd", bg = "#1c2529" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#161e21", bg = "#618adf", bold = true }
normal_alt  = { fg = "#618adf", bg = "#bbc8cd" }

select_main = { fg = "#161e21", bg = "#da596e", bold = true }
select_alt  = { fg = "#da596e", bg = "#bbc8cd" }

unset_main  = { fg = "#161e21", bg = "#9e86b0", bold = true }
unset_alt   = { fg = "#9e86b0", bg = "#bbc8cd" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#5e6a70", bold = true }
progress_normal = { fg = "#a6c974", bg = "#141a1d" }
progress_error  = { fg = "#141a1d", bg = "#d1676c" }

# Permissions
perm_type  = { fg = "#618adf" }
perm_read  = { fg = "#deb05c" }
perm_write = { fg = "#d1676c" }
perm_exec  = { fg = "#a6c974" }
perm_sep   = { fg = "#5e6a70" }

[pick]
border   = { fg = "#80a254" }
active   = { fg = "#b2c7c7",  bg = "#242f34" }
inactive = { fg = "#b2c7c7" }

[input]
border   = { fg = "#4978da" }
title    = { fg = "#4978da" }
value    = { fg = "#9e86b0" }
selected = { bg = "#242f34" }

[cmp]
border   = { fg = "#4978da" }
active   = { fg = "#b2c7c7", bg = "#242f34" }
inactive = { fg = "#b2c7c7" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#80a254" }
title   = { fg = "#80a254" }
hovered = { fg = "#b2c7c7", bg = "#242f34" }

[which]
cols            = 3
mask            = { bg = "#141a1d" }
cand            = { fg = "#63bbdf" }
rest            = { fg = "#618adf" }
desc            = { fg = "#da596e" }
separator       = " ➜ "
separator_style = { fg = "#5e6a70" }

[confirm]
border  = { fg = "#4978da" }
title   = { fg = "#80a254" }
body    = {}
list    = {}
btn_yes = { bg = "#242f34" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#80a254" }
title    = { fg = "#80a254" }
tbl_col  = { fg = "#618adf" }
tbl_cell = { fg = "#deb05c", bg = "#242f34" }

[notify]
title_info  = { fg = "#4978da" }
title_warn  = { fg = "#d1694b" }
title_error = { fg = "#ca5157" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#a6c974" }
run     = { fg = "#da596e" }
desc    = { fg = "#bbc8cd" }
hovered = { bg = "#242f34", bold = true }
footer  = { fg = "#b2c7c7", bg = "#1c2529" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#deb05c" },

	# Media
	{ mime = "{audio,video}/*", fg = "#da596e" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d1676c" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#63bbdf" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#5e6a70" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#d1676c" },
	{ url = "*", is = "exec"  , fg = "#a6c974" },
	{ url = "*", is = "dummy", bg = "#d1676c" },
	{ url = "*/", is = "dummy", bg = "#d1676c" },

	# Fallback
	{ url = "*/", fg = "#618adf" }
]
    