#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme EverforestDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#82907e", italic = true }

# Find
find_keyword  = { fg = "#161b1d", bg = "#cc7942", bold = true }
find_position = { fg = "#869482", bg = "#222b31", bold = true }

# Symlink
symlink_target = { fg = "#63725c", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#a6935a", bg = "#a6935a" }
marker_cut      = { fg = "#cb4f4f", bg = "#cb4f4f" }
marker_marked   = { fg = "#bb755e", bg = "#bb755e" }
marker_selected = { fg = "#42728b", bg = "#42728b" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#b7ecff", bg = "#656831" }
count_cut      = { fg = "#dff6ff", bg = "#c53b3b" }
count_selected = { fg = "#9be6ff", bg = "#2d695d" }

# Border
border_symbol = "│"
border_style  = { fg = "#575b2f" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#293137" }
current = { bg = "#2d3840" }
preview = { bg = "#2d3840" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#869482", bg = "#242a2f", bold = true }
inactive = { fg = "#717e6e", bg = "#1f2529" }

[mode]
normal_main = { fg = "#d7f4ff", bg = "#42728b", bold = true }
normal_alt  = { fg = "#08b2e6", bg = "#313d46" }

select_main = { fg = "#161b1d", bg = "#bb755e", bold = true }
select_alt  = { fg = "#e49277", bg = "#313d46" }

unset_main  = { fg = "#9be6ff", bg = "#635d71", bold = true }
unset_alt   = { fg = "#a8a2b8", bg = "#313d46" }

[status]
# Progress
progress_label  = { fg = "#82907e", bold = true }
progress_normal = { fg = "#7a8677", bg = "#161b1d" }
progress_error  = { fg = "#fbfeff", bg = "#cb4f4f" }

# Permissions
perm_type  = { fg = "#3b94bb" }
perm_read  = { fg = "#af9e6b" }
perm_write = { fg = "#e16666" }
perm_exec  = { fg = "#8c9031" }
perm_sep   = { fg = "#63725c" }

[pick]
border   = { fg = "#39748f" }
active   = { fg = "#869482", bg = "#242a2f" }
inactive = { fg = "#82907e" }

[input]
border   = { fg = "#39748f" }
title    = { fg = "#39748f" }
value    = { fg = "#8e879f" }
selected = { fg = "#869482", bg = "#242a2f" }

[cmp]
border   = { fg = "#39748f" }
active   = { fg = "#869482", bg = "#242a2f" }
inactive = { fg = "#82907e" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#575b2f" }
title   = { fg = "#82907e" }
hovered = { fg = "#869482", bg = "#242a2f" }

[which]
cols            = 3
mask            = { bg = "#161b1d" }
cand            = { fg = "#598e60" }
rest            = { fg = "#3f8bae" }
desc            = { fg = "#bb755e" }
separator       = " ➜ "
separator_style = { fg = "#5d6a57" }

[confirm]
border  = { fg = "#39748f" }
title   = { fg = "#39748f" }
body    = {}
list    = {}
btn_yes = { fg = "#869482", bg = "#242a2f" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#575b2f" }
title    = { fg = "#82907e" }
tbl_col  = { fg = "#3b94bb" }
tbl_cell = { fg = "#af9e6b", bg = "#242a2f" }

[notify]
title_info  = { fg = "#1e97c1" }
title_warn  = { fg = "#ce7637" }
title_error = { fg = "#f55252" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#8c9031" }
run     = { fg = "#c37960" }
desc    = { fg = "#717e6e" }
hovered = { fg = "#869482", bg = "#242a2f", bold = true }
footer  = { fg = "#869482", bg = "#242a2f" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#af9e6b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#c37960" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e16666" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#5d9a65" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#63725c" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#cb4f4f" },
	{ url = "*", is = "exec"  , fg = "#8c9031" },
	{ url = "*", is = "dummy", bg = "#cb4f4f" },
	{ url = "*/", is = "dummy", bg = "#cb4f4f" },

	# Fallback
	{ url = "*/", fg = "#3b94bb" }
]
    