#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme KanagawaDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#8383a2", italic = true }

# Find
find_keyword  = { fg = "#131418", bg = "#c99460", bold = true }
find_position = { fg = "#8a8aaa", bg = "#21242e", bold = true }

# Symlink
symlink_target = { fg = "#656593", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#debe7e", bg = "#debe7e" }
marker_cut      = { fg = "#b65252", bg = "#b65252" }
marker_marked   = { fg = "#c4746e", bg = "#c4746e" }
marker_selected = { fg = "#4d699b", bg = "#4d699b" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fdfdff", bg = "#697b52" }
count_cut      = { fg = "#eaeeff", bg = "#b24b4b" }
count_selected = { fg = "#131418", bg = "#4b869b" }

# Border
border_symbol = "│"
border_style  = { fg = "#5a6849" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#292a35" }
current = { bg = "#2e303e" }
preview = { bg = "#2e303e" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#8787a7", bg = "#212229", bold = true }
inactive = { fg = "#72728f", bg = "#1c1d23" }

[mode]
normal_main = { fg = "#e3e8ff", bg = "#4d699b", bold = true }
normal_alt  = { fg = "#709fef", bg = "#333543" }

select_main = { fg = "#131418", bg = "#c4746e", bold = true }
select_alt  = { fg = "#d18e89", bg = "#333543" }

unset_main  = { fg = "#f5f7ff", bg = "#766b90", bold = true }
unset_alt   = { fg = "#a49abe", bg = "#333543" }

[status]
# Progress
progress_label  = { fg = "#8383a2", bold = true }
progress_normal = { fg = "#7b7b9a", bg = "#131418" }
progress_error  = { fg = "#f5f7ff", bg = "#b65252" }

# Permissions
perm_type  = { fg = "#5485d1" }
perm_read  = { fg = "#e0c286" }
perm_write = { fg = "#d56161" }
perm_exec  = { fg = "#768c5a" }
perm_sep   = { fg = "#656593" }

[pick]
border   = { fg = "#4c699d" }
active   = { fg = "#8787a7", bg = "#212229" }
inactive = { fg = "#8383a2" }

[input]
border   = { fg = "#4c699d" }
title    = { fg = "#4c699d" }
value    = { fg = "#8a7fa5" }
selected = { fg = "#8787a7", bg = "#212229" }

[cmp]
border   = { fg = "#4c699d" }
active   = { fg = "#8787a7", bg = "#212229" }
inactive = { fg = "#8383a2" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#5a6849" }
title   = { fg = "#8383a2" }
hovered = { fg = "#8787a7", bg = "#212229" }

[which]
cols            = 3
mask            = { bg = "#131418" }
cand            = { fg = "#5e867f" }
rest            = { fg = "#5380c7" }
desc            = { fg = "#c4746e" }
separator       = " ➜ "
separator_style = { fg = "#5e5e8a" }

[confirm]
border  = { fg = "#4c699d" }
title   = { fg = "#4c699d" }
body    = {}
list    = {}
btn_yes = { fg = "#8787a7", bg = "#212229" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#5a6849" }
title    = { fg = "#8383a2" }
tbl_col  = { fg = "#5485d1" }
tbl_cell = { fg = "#e0c286", bg = "#212229" }

[notify]
title_info  = { fg = "#5185d5" }
title_warn  = { fg = "#c68f58" }
title_error = { fg = "#dd5b5b" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#768c5a" }
run     = { fg = "#c4746e" }
desc    = { fg = "#72728f" }
hovered = { fg = "#8787a7", bg = "#212229", bold = true }
footer  = { fg = "#8787a7", bg = "#212229" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#e0c286" },

	# Media
	{ mime = "{audio,video}/*", fg = "#c4746e" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d56161" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#628f87" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#656593" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#b65252" },
	{ url = "*", is = "exec"  , fg = "#768c5a" },
	{ url = "*", is = "dummy", bg = "#b65252" },
	{ url = "*/", is = "dummy", bg = "#b65252" },

	# Fallback
	{ url = "*/", fg = "#5485d1" }
]
    