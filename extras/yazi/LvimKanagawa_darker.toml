#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme KanagawaDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#8383a2", italic = true }

# Find
find_keyword  = { fg = "#18191f", bg = "#bf8f62", bold = true }
find_position = { fg = "#8a8aaa", bg = "#21242e", bold = true }

# Symlink
symlink_target = { fg = "#656593", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#cbae75", bg = "#cbae75" }
marker_cut      = { fg = "#ba5454", bg = "#ba5454" }
marker_marked   = { fg = "#c4726c", bg = "#c4726c" }
marker_selected = { fg = "#4e6a9c", bg = "#4e6a9c" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#f1f3ff", bg = "#64754e" }
count_cut      = { fg = "#edf0ff", bg = "#b34b4b" }
count_selected = { fg = "#f8f9ff", bg = "#4c798b" }

# Border
border_symbol = "│"
border_style  = { fg = "#566345" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#272934" }
current = { bg = "#2d2f3d" }
preview = { bg = "#2d2f3d" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#8585a5", bg = "#1e1f25", bold = true }
inactive = { fg = "#72728f", bg = "#1c1d23" }

[mode]
normal_main = { fg = "#e6eaff", bg = "#4e6a9c", bold = true }
normal_alt  = { fg = "#6f9dec", bg = "#313442" }

select_main = { fg = "#18191f", bg = "#c4726c", bold = true }
select_alt  = { fg = "#d18c87", bg = "#313442" }

unset_main  = { fg = "#eaedff", bg = "#70658b", bold = true }
unset_alt   = { fg = "#a399bf", bg = "#313442" }

[status]
# Progress
progress_label  = { fg = "#8383a2", bold = true }
progress_normal = { fg = "#8080a0", bg = "#18191f" }
progress_error  = { fg = "#fbfcff", bg = "#ba5454" }

# Permissions
perm_type  = { fg = "#5586d2" }
perm_read  = { fg = "#d1b57c" }
perm_write = { fg = "#d46262" }
perm_exec  = { fg = "#768d59" }
perm_sep   = { fg = "#656593" }

[pick]
border   = { fg = "#4c699f" }
active   = { fg = "#8585a5", bg = "#1e1f25" }
inactive = { fg = "#8383a2" }

[input]
border   = { fg = "#4c699f" }
title    = { fg = "#4c699f" }
value    = { fg = "#8c81a9" }
selected = { fg = "#8585a5", bg = "#1e1f25" }

[cmp]
border   = { fg = "#4c699f" }
active   = { fg = "#8585a5", bg = "#1e1f25" }
inactive = { fg = "#8383a2" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#566345" }
title   = { fg = "#8383a2" }
hovered = { fg = "#8585a5", bg = "#1e1f25" }

[which]
cols            = 3
mask            = { bg = "#18191f" }
cand            = { fg = "#5f8b83" }
rest            = { fg = "#5583cd" }
desc            = { fg = "#c4726c" }
separator       = " ➜ "
separator_style = { fg = "#61618d" }

[confirm]
border  = { fg = "#4c699f" }
title   = { fg = "#4c699f" }
body    = {}
list    = {}
btn_yes = { fg = "#8585a5", bg = "#1e1f25" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#566345" }
title    = { fg = "#8383a2" }
tbl_col  = { fg = "#5586d2" }
tbl_cell = { fg = "#d1b57c", bg = "#1e1f25" }

[notify]
title_info  = { fg = "#5185d7" }
title_warn  = { fg = "#b7875b" }
title_error = { fg = "#dd5b5b" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#768d59" }
run     = { fg = "#c4726c" }
desc    = { fg = "#72728f" }
hovered = { fg = "#8585a5", bg = "#1e1f25", bold = true }
footer  = { fg = "#8585a5", bg = "#1e1f25" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#d1b57c" },

	# Media
	{ mime = "{audio,video}/*", fg = "#c4726c" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d46262" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#608e86" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#656593" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#ba5454" },
	{ url = "*", is = "exec"  , fg = "#768d59" },
	{ url = "*", is = "dummy", bg = "#ba5454" },
	{ url = "*/", is = "dummy", bg = "#ba5454" },

	# Fallback
	{ url = "*/", fg = "#5586d2" }
]
    