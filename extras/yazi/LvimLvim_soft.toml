#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme LvimSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#659c9c", italic = true }

# Find
find_keyword  = { fg = "#1e2325", bg = "#FF9C2A", bold = true }
find_position = { fg = "#55a6ab", bg = "#23343c", bold = true }

# Symlink
symlink_target = { fg = "#5b7d7e", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#eab749", bg = "#eab749" }
marker_cut      = { fg = "#e65e4f", bg = "#e65e4f" }
marker_marked   = { fg = "#c75940", bg = "#c75940" }
marker_selected = { fg = "#0A85B9", bg = "#0A85B9" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#1e2325", bg = "#7d9654" }
count_cut      = { fg = "#fafeff", bg = "#e34a39" }
count_selected = { fg = "#adeaff", bg = "#1c7060" }

# Border
border_symbol = "│"
border_style  = { fg = "#6c814d" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#313a40" }
current = { bg = "#343f46" }
preview = { bg = "#343f46" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#54afb5", bg = "#313a40", bold = true }
inactive = { fg = "#378b91", bg = "#262d31" }

[mode]
normal_main = { fg = "#fafeff", bg = "#0A85B9", bold = true }
normal_alt  = { fg = "#49beff", bg = "#3c474f" }

select_main = { fg = "#fafeff", bg = "#c75940", bold = true }
select_alt  = { fg = "#ff9989", bg = "#3c474f" }

unset_main  = { fg = "#f3fcff", bg = "#177ab3", bold = true }
unset_alt   = { fg = "#60baff", bg = "#3c474f" }

[status]
# Progress
progress_label  = { fg = "#659c9c", bold = true }
progress_normal = { fg = "#55a6ab", bg = "#1e2325" }
progress_error  = { fg = "#1e2325", bg = "#e65e4f" }

# Permissions
perm_type  = { fg = "#009edb" }
perm_read  = { fg = "#edc060" }
perm_write = { fg = "#eb6e62" }
perm_exec  = { fg = "#8AA55F" }
perm_sep   = { fg = "#5b7d7e" }

[pick]
border   = { fg = "#007fb0" }
active   = { fg = "#54afb5", bg = "#313a40" }
inactive = { fg = "#659c9c" }

[input]
border   = { fg = "#007fb0" }
title    = { fg = "#007fb0" }
value    = { fg = "#009be4" }
selected = { fg = "#54afb5", bg = "#313a40" }

[cmp]
border   = { fg = "#007fb0" }
active   = { fg = "#54afb5", bg = "#313a40" }
inactive = { fg = "#659c9c" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#6c814d" }
title   = { fg = "#659c9c" }
hovered = { fg = "#54afb5", bg = "#313a40" }

[which]
cols            = 3
mask            = { bg = "#1e2325" }
cand            = { fg = "#0097b0" }
rest            = { fg = "#0093cc" }
desc            = { fg = "#e6603d" }
separator       = " ➜ "
separator_style = { fg = "#567273" }

[confirm]
border  = { fg = "#007fb0" }
title   = { fg = "#007fb0" }
body    = {}
list    = {}
btn_yes = { fg = "#54afb5", bg = "#313a40" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#6c814d" }
title    = { fg = "#659c9c" }
tbl_col  = { fg = "#009edb" }
tbl_cell = { fg = "#edc060", bg = "#313a40" }

[notify]
title_info  = { fg = "#009dd9" }
title_warn  = { fg = "#ff9010" }
title_error = { fg = "#f86457" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#8AA55F" }
run     = { fg = "#f46946" }
desc    = { fg = "#378b91" }
hovered = { fg = "#54afb5", bg = "#313a40", bold = true }
footer  = { fg = "#54afb5", bg = "#313a40" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#edc060" },

	# Media
	{ mime = "{audio,video}/*", fg = "#f46946" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#eb6e62" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#00a3bd" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#5b7d7e" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#e65e4f" },
	{ url = "*", is = "exec"  , fg = "#8AA55F" },
	{ url = "*", is = "dummy", bg = "#e65e4f" },
	{ url = "*/", is = "dummy", bg = "#e65e4f" },

	# Fallback
	{ url = "*/", fg = "#009edb" }
]
    