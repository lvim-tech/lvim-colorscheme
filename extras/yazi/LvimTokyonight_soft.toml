#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme TokyonightSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#b2b6c7", italic = true }

# Find
find_keyword  = { fg = "#181820", bg = "#dd8b5a", bold = true }
find_position = { fg = "#b5b9ca", bg = "#24293d", bold = true }

# Symlink
symlink_target = { fg = "#656c8b", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#bd9357", bg = "#bd9357" }
marker_cut      = { fg = "#d76479", bg = "#d76479" }
marker_marked   = { fg = "#9470d5", bg = "#9470d5" }
marker_selected = { fg = "#6589d7", bg = "#6589d7" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#181820", bg = "#8fb468" }
count_cut      = { fg = "#fefeff", bg = "#d14d66" }
count_selected = { fg = "#181820", bg = "#31927e" }

# Border
border_symbol = "│"
border_style  = { fg = "#79965c" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#282c3f" }
current = { bg = "#2c324a" }
preview = { bg = "#2c324a" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#b5b9ca", bg = "#262a3b", bold = true }
inactive = { fg = "#7f8296", bg = "#1f202d" }

[mode]
normal_main = { fg = "#181820", bg = "#6589d7", bold = true }
normal_alt  = { fg = "#83a1e9", bg = "#303751" }

select_main = { fg = "#181820", bg = "#9470d5", bold = true }
select_alt  = { fg = "#b193ee", bg = "#303751" }

unset_main  = { fg = "#181820", bg = "#9381b3", bold = true }
unset_alt   = { fg = "#aa99c8", bg = "#303751" }

[status]
# Progress
progress_label  = { fg = "#b2b6c7", bold = true }
progress_normal = { fg = "#b5b9ca", bg = "#181820" }
progress_error  = { fg = "#181820", bg = "#d76479" }

# Permissions
perm_type  = { fg = "#6589d7" }
perm_read  = { fg = "#c5a06b" }
perm_write = { fg = "#d76479" }
perm_exec  = { fg = "#9dbd7b" }
perm_sep   = { fg = "#656c8b" }

[pick]
border   = { fg = "#4e78d1" }
active   = { fg = "#b5b9ca", bg = "#262a3b" }
inactive = { fg = "#b2b6c7" }

[input]
border   = { fg = "#4e78d1" }
title    = { fg = "#4e78d1" }
value    = { fg = "#9381b3" }
selected = { fg = "#b5b9ca", bg = "#262a3b" }

[cmp]
border   = { fg = "#4e78d1" }
active   = { fg = "#b5b9ca", bg = "#262a3b" }
inactive = { fg = "#b2b6c7" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#79965c" }
title   = { fg = "#b2b6c7" }
hovered = { fg = "#b5b9ca", bg = "#262a3b" }

[which]
cols            = 3
mask            = { bg = "#181820" }
cand            = { fg = "#60b0de" }
rest            = { fg = "#6589d7" }
desc            = { fg = "#9470d5" }
separator       = " ➜ "
separator_style = { fg = "#616784" }

[confirm]
border  = { fg = "#4e78d1" }
title   = { fg = "#4e78d1" }
body    = {}
list    = {}
btn_yes = { fg = "#b5b9ca", bg = "#262a3b" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#79965c" }
title    = { fg = "#b2b6c7" }
tbl_col  = { fg = "#6589d7" }
tbl_cell = { fg = "#c5a06b", bg = "#262a3b" }

[notify]
title_info  = { fg = "#5885e4" }
title_warn  = { fg = "#d87b43" }
title_error = { fg = "#e25972" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#9dbd7b" }
run     = { fg = "#9975da" }
desc    = { fg = "#7f8296" }
hovered = { fg = "#b5b9ca", bg = "#262a3b", bold = true }
footer  = { fg = "#b5b9ca", bg = "#262a3b" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#c5a06b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#9975da" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d76479" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#60b0de" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#656c8b" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#d76479" },
	{ url = "*", is = "exec"  , fg = "#9dbd7b" },
	{ url = "*", is = "dummy", bg = "#d76479" },
	{ url = "*/", is = "dummy", bg = "#d76479" },

	# Fallback
	{ url = "*/", fg = "#6589d7" }
]
    