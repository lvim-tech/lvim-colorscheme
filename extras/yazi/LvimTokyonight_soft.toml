#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme TokyonightSoft
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#b2b6c7", italic = true }

# Find
find_keyword  = { fg = "#1e212a", bg = "#bb866d", bold = true }
find_position = { fg = "#b5b9ca", bg = "#272b38", bold = true }

# Symlink
symlink_target = { fg = "#676e8f", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#ad9170", bg = "#ad9170" }
marker_cut      = { fg = "#bb6171", bg = "#bb6171" }
marker_marked   = { fg = "#907bba", bg = "#907bba" }
marker_selected = { fg = "#6073a4", bg = "#6073a4" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fefeff", bg = "#697b58" }
count_cut      = { fg = "#f3f6ff", bg = "#ac5764" }
count_selected = { fg = "#e4eaff", bg = "#4e6f66" }

# Border
border_symbol = "│"
border_style  = { fg = "#5b6a50" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#2d3240" }
current = { bg = "#303646" }
preview = { bg = "#303646" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#b5b9ca", bg = "#242730", bold = true }
inactive = { fg = "#7f8296", bg = "#22252e" }

[mode]
normal_main = { fg = "#fafbff", bg = "#6073a4", bold = true }
normal_alt  = { fg = "#90a4db", bg = "#343a4c" }

select_main = { fg = "#fefeff", bg = "#907bba", bold = true }
select_alt  = { fg = "#ae9cd5", bg = "#343a4c" }

unset_main  = { fg = "#e8edff", bg = "#73638e", bold = true }
unset_alt   = { fg = "#ae9fc8", bg = "#343a4c" }

[status]
# Progress
progress_label  = { fg = "#b2b6c7", bold = true }
progress_normal = { fg = "#b5b9ca", bg = "#1e212a" }
progress_error  = { fg = "#fefeff", bg = "#bb6171" }

# Permissions
perm_type  = { fg = "#758cc9" }
perm_read  = { fg = "#b79d7b" }
perm_write = { fg = "#cb7181" }
perm_exec  = { fg = "#7e926b" }
perm_sep   = { fg = "#676e8f" }

[pick]
border   = { fg = "#5a6fa5" }
active   = { fg = "#b5b9ca", bg = "#242730" }
inactive = { fg = "#b2b6c7" }

[input]
border   = { fg = "#5a6fa5" }
title    = { fg = "#5a6fa5" }
value    = { fg = "#9484b1" }
selected = { fg = "#b5b9ca", bg = "#242730" }

[cmp]
border   = { fg = "#5a6fa5" }
active   = { fg = "#b5b9ca", bg = "#242730" }
inactive = { fg = "#b2b6c7" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#5b6a50" }
title   = { fg = "#b2b6c7" }
hovered = { fg = "#b5b9ca", bg = "#242730" }

[which]
cols            = 3
mask            = { bg = "#1e212a" }
cand            = { fg = "#6a8da7" }
rest            = { fg = "#6f87c4" }
desc            = { fg = "#937ebd" }
separator       = " ➜ "
separator_style = { fg = "#656c8b" }

[confirm]
border  = { fg = "#5a6fa5" }
title   = { fg = "#5a6fa5" }
body    = {}
list    = {}
btn_yes = { fg = "#b5b9ca", bg = "#242730" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#5b6a50" }
title    = { fg = "#b2b6c7" }
tbl_col  = { fg = "#758cc9" }
tbl_cell = { fg = "#b79d7b", bg = "#242730" }

[notify]
title_info  = { fg = "#6f8ad0" }
title_warn  = { fg = "#b97e66" }
title_error = { fg = "#d26f7e" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#7e926b" }
run     = { fg = "#9883c1" }
desc    = { fg = "#7f8296" }
hovered = { fg = "#b5b9ca", bg = "#242730", bold = true }
footer  = { fg = "#b5b9ca", bg = "#242730" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#b79d7b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#9883c1" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#cb7181" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#6b90ab" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#676e8f" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#bb6171" },
	{ url = "*", is = "exec"  , fg = "#7e926b" },
	{ url = "*", is = "dummy", bg = "#bb6171" },
	{ url = "*/", is = "dummy", bg = "#bb6171" },

	# Fallback
	{ url = "*/", fg = "#758cc9" }
]
    