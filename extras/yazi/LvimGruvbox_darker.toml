#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme GruvboxDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#928373", italic = true }

# Find
find_keyword  = { fg = "#141310", bg = "#cc7942", bold = true }
find_position = { fg = "#968a7b", bg = "#212425", bold = true }

# Symlink
symlink_target = { fg = "#766659", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#a6935a", bg = "#a6935a" }
marker_cut      = { fg = "#cb4f4f", bg = "#cb4f4f" }
marker_marked   = { fg = "#bb755e", bg = "#bb755e" }
marker_selected = { fg = "#42728b", bg = "#42728b" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#ffe254", bg = "#656831" }
count_cut      = { fg = "#fff0bf", bg = "#c53b3b" }
count_selected = { fg = "#f9d900", bg = "#2d695d" }

# Border
border_symbol = "│"
border_style  = { fg = "#57592d" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#2d2a29" }
current = { bg = "#34302f" }
preview = { bg = "#34302f" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#998c7e", bg = "#282625", bold = true }
inactive = { fg = "#7e7064", bg = "#1e1d1c" }

[mode]
normal_main = { fg = "#fff0bf", bg = "#42728b", bold = true }
normal_alt  = { fg = "#26a9d9", bg = "#383433" }

select_main = { fg = "#141310", bg = "#bb755e", bold = true }
select_alt  = { fg = "#e08768", bg = "#383433" }

unset_main  = { fg = "#fcdc00", bg = "#635d71", bold = true }
unset_alt   = { fg = "#a09ab1", bg = "#383433" }

[status]
# Progress
progress_label  = { fg = "#928373", bold = true }
progress_normal = { fg = "#887d71", bg = "#141310" }
progress_error  = { fg = "#fffffe", bg = "#cb4f4f" }

# Permissions
perm_type  = { fg = "#3e8eb2" }
perm_read  = { fg = "#af9e6b" }
perm_write = { fg = "#dd5a5a" }
perm_exec  = { fg = "#878b35" }
perm_sep   = { fg = "#766659" }

[pick]
border   = { fg = "#3a6f88" }
active   = { fg = "#998c7e", bg = "#282625" }
inactive = { fg = "#928373" }

[input]
border   = { fg = "#3a6f88" }
title    = { fg = "#3a6f88" }
value    = { fg = "#89829a" }
selected = { fg = "#998c7e", bg = "#282625" }

[cmp]
border   = { fg = "#3a6f88" }
active   = { fg = "#998c7e", bg = "#282625" }
inactive = { fg = "#928373" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#57592d" }
title   = { fg = "#928373" }
hovered = { fg = "#998c7e", bg = "#282625" }

[which]
cols            = 3
mask            = { bg = "#141310" }
cand            = { fg = "#57885e" }
rest            = { fg = "#4185a6" }
desc            = { fg = "#bb755e" }
separator       = " ➜ "
separator_style = { fg = "#6d5f53" }

[confirm]
border  = { fg = "#3a6f88" }
title   = { fg = "#3a6f88" }
body    = {}
list    = {}
btn_yes = { fg = "#998c7e", bg = "#282625" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#57592d" }
title    = { fg = "#928373" }
tbl_col  = { fg = "#3e8eb2" }
tbl_cell = { fg = "#af9e6b", bg = "#282625" }

[notify]
title_info  = { fg = "#2b8eb4" }
title_warn  = { fg = "#c1713b" }
title_error = { fg = "#f24848" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#878b35" }
run     = { fg = "#bb755e" }
desc    = { fg = "#7e7064" }
hovered = { fg = "#998c7e", bg = "#282625", bold = true }
footer  = { fg = "#998c7e", bg = "#282625" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#af9e6b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#bb755e" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#dd5a5a" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#5a9162" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#766659" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#cb4f4f" },
	{ url = "*", is = "exec"  , fg = "#878b35" },
	{ url = "*", is = "dummy", bg = "#cb4f4f" },
	{ url = "*/", is = "dummy", bg = "#cb4f4f" },

	# Fallback
	{ url = "*/", fg = "#3e8eb2" }
]
    