#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme GruvboxDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#928373", italic = true }

# Find
find_keyword  = { fg = "#1a1918", bg = "#c47d54", bold = true }
find_position = { fg = "#968a7b", bg = "#212425", bold = true }

# Symlink
symlink_target = { fg = "#766659", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#a5935f", bg = "#a5935f" }
marker_cut      = { fg = "#ca4f4f", bg = "#ca4f4f" }
marker_marked   = { fg = "#bb755e", bg = "#bb755e" }
marker_selected = { fg = "#497188", bg = "#497188" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#f4dfc6", bg = "#65683b" }
count_cut      = { fg = "#faeee3", bg = "#bd4343" }
count_selected = { fg = "#f1d5b5", bg = "#39675d" }

# Border
border_symbol = "│"
border_style  = { fg = "#575935" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#2b2927" }
current = { bg = "#32302d" }
preview = { bg = "#32302d" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#908577", bg = "#201f1e", bold = true }
inactive = { fg = "#7e7064", bg = "#1e1d1c" }

[mode]
normal_main = { fg = "#faeee3", bg = "#497188", bold = true }
normal_alt  = { fg = "#46a7d3", bg = "#363431" }

select_main = { fg = "#1a1918", bg = "#bb755e", bold = true }
select_alt  = { fg = "#e08768", bg = "#363431" }

unset_main  = { fg = "#f2d8bb", bg = "#635d71", bold = true }
unset_alt   = { fg = "#a09ab1", bg = "#363431" }

[status]
# Progress
progress_label  = { fg = "#928373", bold = true }
progress_normal = { fg = "#8b8073", bg = "#1a1918" }
progress_error  = { fg = "#fffefe", bg = "#ca4f4f" }

# Permissions
perm_type  = { fg = "#4c8dae" }
perm_read  = { fg = "#af9e6b" }
perm_write = { fg = "#dc5a5a" }
perm_exec  = { fg = "#878b46" }
perm_sep   = { fg = "#766659" }

[pick]
border   = { fg = "#416e84" }
active   = { fg = "#908577", bg = "#201f1e" }
inactive = { fg = "#928373" }

[input]
border   = { fg = "#416e84" }
title    = { fg = "#416e84" }
value    = { fg = "#89829a" }
selected = { fg = "#908577", bg = "#201f1e" }

[cmp]
border   = { fg = "#416e84" }
active   = { fg = "#908577", bg = "#201f1e" }
inactive = { fg = "#928373" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#575935" }
title   = { fg = "#928373" }
hovered = { fg = "#908577", bg = "#201f1e" }

[which]
cols            = 3
mask            = { bg = "#1a1918" }
cand            = { fg = "#598e60" }
rest            = { fg = "#4c8aaa" }
desc            = { fg = "#bb755e" }
separator       = " ➜ "
separator_style = { fg = "#736457" }

[confirm]
border  = { fg = "#416e84" }
title   = { fg = "#416e84" }
body    = {}
list    = {}
btn_yes = { fg = "#908577", bg = "#201f1e" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#575935" }
title    = { fg = "#928373" }
tbl_col  = { fg = "#4c8dae" }
tbl_cell = { fg = "#af9e6b", bg = "#201f1e" }

[notify]
title_info  = { fg = "#3c8fb3" }
title_warn  = { fg = "#b9744b" }
title_error = { fg = "#e95252" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#878b46" }
run     = { fg = "#bb755e" }
desc    = { fg = "#7e7064" }
hovered = { fg = "#908577", bg = "#201f1e", bold = true }
footer  = { fg = "#908577", bg = "#201f1e" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#af9e6b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#bb755e" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#dc5a5a" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#5a9162" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#766659" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#ca4f4f" },
	{ url = "*", is = "exec"  , fg = "#878b46" },
	{ url = "*", is = "dummy", bg = "#ca4f4f" },
	{ url = "*/", is = "dummy", bg = "#ca4f4f" },

	# Fallback
	{ url = "*/", fg = "#4c8dae" }
]
    