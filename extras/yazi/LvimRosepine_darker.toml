#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme RosepineDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#b3afb2", italic = true }

# Find
find_keyword  = { fg = "#131115", bg = "#a98a89", bold = true }
find_position = { fg = "#b9b4b5", bg = "#1d1d21", bold = true }

# Symlink
symlink_target = { fg = "#896882", italic = true }

# Marker — a solid bar, so foreground and background match on purpose
marker_copied   = { fg = "#ac9682", bg = "#ac9682" }
marker_cut      = { fg = "#a0727c", bg = "#a0727c" }
marker_marked   = { fg = "#9084a2", bg = "#9084a2" }
marker_selected = { fg = "#5d6d74", bg = "#5d6d74" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#fefdff", bg = "#697d6d" }
count_cut      = { fg = "#faf6ff", bg = "#95646f" }
count_selected = { fg = "#dbd9d9", bg = "#51635d" }

# Border
border_symbol = "│"
border_style  = { fg = "#59685c" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
#
# `padding` is REQUIRED here, and it is required because of the `bg` above.
# components/entity.lua gives every row one leading space, except a hovered row
# whose style has a background — that case is handed `indicator.padding.open`
# instead, and the preset leaves it empty:
#
#   function Entity:padding()
#     if not self._file.is_hovered then return " " end
#     local style = self:style_rev()          -- non-nil only when the row has a bg
#     if style then return ui.Span(th.indicator.padding.open) else return " " end
#   end
#
# Upstream styles the hovered row with `reversed = true` and no background, so
# it never reaches that branch. A wash — which is what this palette wants, and
# what Yazi 25 did here — does reach it, and an empty padding then costs the
# hovered row a column and shifts its icon out of line with every other row.
[indicator]
parent  = { bg = "#27222b" }
current = { bg = "#2e2834" }
preview = { bg = "#2e2834" }
padding = { open = " ", close = " " }

[tabs]
active   = { fg = "#b9b4b5", bg = "#19171b", bold = true }
inactive = { fg = "#979295", bg = "#171519" }

[mode]
normal_main = { fg = "#f3e8ff", bg = "#5d6d74", bold = true }
normal_alt  = { fg = "#7d9dab", bg = "#352e3c" }

select_main = { fg = "#131115", bg = "#9084a2", bold = true }
select_alt  = { fg = "#9f94b1", bg = "#352e3c" }

unset_main  = { fg = "#faf6ff", bg = "#726f7c", bold = true }
unset_alt   = { fg = "#9b98a5", bg = "#352e3c" }

[status]
# Progress
progress_label  = { fg = "#b3afb2", bold = true }
progress_normal = { fg = "#b9b4b5", bg = "#131115" }
progress_error  = { fg = "#131115", bg = "#a0727c" }

# Permissions
perm_type  = { fg = "#6d858f" }
perm_read  = { fg = "#b6a18b" }
perm_write = { fg = "#a4747e" }
perm_exec  = { fg = "#788b7c" }
perm_sep   = { fg = "#896882" }

[pick]
border   = { fg = "#56666d" }
active   = { fg = "#b9b4b5", bg = "#19171b" }
inactive = { fg = "#b3afb2" }

[input]
border   = { fg = "#56666d" }
title    = { fg = "#56666d" }
value    = { fg = "#817e8c" }
selected = { fg = "#b9b4b5", bg = "#19171b" }

[cmp]
border   = { fg = "#56666d" }
active   = { fg = "#b9b4b5", bg = "#19171b" }
inactive = { fg = "#b3afb2" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#59685c" }
title   = { fg = "#b3afb2" }
hovered = { fg = "#b9b4b5", bg = "#19171b" }

[which]
cols            = 3
mask            = { bg = "#131115" }
cand            = { fg = "#788787" }
rest            = { fg = "#6c828c" }
desc            = { fg = "#9084a2" }
separator       = " ➜ "
separator_style = { fg = "#896882" }

[confirm]
border  = { fg = "#56666d" }
title   = { fg = "#56666d" }
body    = {}
list    = {}
btn_yes = { fg = "#b9b4b5", bg = "#19171b" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#59685c" }
title    = { fg = "#b3afb2" }
tbl_col  = { fg = "#6d858f" }
tbl_cell = { fg = "#b6a18b", bg = "#19171b" }

[notify]
title_info  = { fg = "#68838d" }
title_warn  = { fg = "#9d7978" }
title_error = { fg = "#ad6f7e" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#788b7c" }
run     = { fg = "#9084a2" }
desc    = { fg = "#979295" }
hovered = { fg = "#b9b4b5", bg = "#19171b", bold = true }
footer  = { fg = "#b9b4b5", bg = "#19171b" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#b6a18b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#9084a2" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a4747e" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#788787" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#896882" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#a0727c" },
	{ url = "*", is = "exec"  , fg = "#788b7c" },
	{ url = "*", is = "dummy", bg = "#a0727c" },
	{ url = "*/", is = "dummy", bg = "#a0727c" },

	# Fallback
	{ url = "*/", fg = "#6d858f" }
]
    