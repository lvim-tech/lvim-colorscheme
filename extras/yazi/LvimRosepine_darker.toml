#:schema https://yazi-rs.github.io/schemas/theme.json
# Lvim Colorscheme RosepineDarker
# Generated by lvim-colorscheme for Yazi 26 — https://github.com/sxyazi/yazi

[mgr]
cwd = { fg = "#73717f", italic = true }

# Find
find_keyword  = { fg = "#0a0910", bg = "#c68784", bold = true }
find_position = { fg = "#3b6374", bg = "#171924", bold = true }

# Symlink
symlink_target = { fg = "#746e91", italic = true }

# Marker
marker_copied   = { fg = "#d09a4f", bg = "#d09a4f" }
marker_cut      = { fg = "#cd6985", bg = "#cd6985" }
marker_marked   = { fg = "#9f80c4", bg = "#9f80c4" }
marker_selected = { fg = "#416d7f", bg = "#416d7f" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#b4b2c7", bg = "#71a7b0" }
count_cut      = { fg = "#b4b2c7", bg = "#c65474" }
count_selected = { fg = "#b4b2c7", bg = "#3b6374" }

# Border
border_symbol = "│"
border_style  = { fg = "#5e8992" }

# The row under the cursor in each pane. In 25 this was `hovered` and
# `preview_hovered` under [manager]; 26 gives the parent pane one of its own.
[indicator]
parent  = { bg = "#211f2c" }
current = { bg = "#211f2c" }
preview = { bg = "#211f2c" }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "#b4b2c7", bg = "#211f2c", bold = true }
inactive = { fg = "#9694a3", bg = "#13111b" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#0f0e16", bg = "#416d7f", bold = true }
normal_alt  = { fg = "#416d7f", bg = "#9694a3" }

select_main = { fg = "#0f0e16", bg = "#9f80c4", bold = true }
select_alt  = { fg = "#9f80c4", bg = "#9694a3" }

unset_main  = { fg = "#0f0e16", bg = "#958fa7", bold = true }
unset_alt   = { fg = "#958fa7", bg = "#9694a3" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#73717f", bold = true }
progress_normal = { fg = "#83b2ba", bg = "#0a0910" }
progress_error  = { fg = "#0a0910", bg = "#cd6985" }

# Permissions
perm_type  = { fg = "#416d7f" }
perm_read  = { fg = "#d6a765" }
perm_write = { fg = "#cd6985" }
perm_exec  = { fg = "#83b2ba" }
perm_sep   = { fg = "#746e91" }

[pick]
border   = { fg = "#5e8992" }
active   = { fg = "#b4b2c7",  bg = "#211f2c" }
inactive = { fg = "#b4b2c7" }

[input]
border   = { fg = "#3b6374" }
title    = { fg = "#3b6374" }
value    = { fg = "#958fa7" }
selected = { bg = "#211f2c" }

[cmp]
border   = { fg = "#3b6374" }
active   = { fg = "#b4b2c7", bg = "#211f2c" }
inactive = { fg = "#b4b2c7" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#5e8992" }
title   = { fg = "#5e8992" }
hovered = { fg = "#b4b2c7", bg = "#211f2c" }

[which]
cols            = 3
mask            = { bg = "#0a0910" }
cand            = { fg = "#83b2ba" }
rest            = { fg = "#416d7f" }
desc            = { fg = "#9f80c4" }
separator       = " ➜ "
separator_style = { fg = "#746e91" }

[confirm]
border  = { fg = "#3b6374" }
title   = { fg = "#5e8992" }
body    = {}
list    = {}
btn_yes = { bg = "#211f2c" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#5e8992" }
title    = { fg = "#5e8992" }
tbl_col  = { fg = "#416d7f" }
tbl_cell = { fg = "#d6a765", bg = "#211f2c" }

[notify]
title_info  = { fg = "#3b6374" }
title_warn  = { fg = "#bd7370" }
title_error = { fg = "#c65474" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[help]
on      = { fg = "#83b2ba" }
run     = { fg = "#9f80c4" }
desc    = { fg = "#9694a3" }
hovered = { bg = "#211f2c", bold = true }
footer  = { fg = "#b4b2c7", bg = "#13111b" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#d6a765" },

	# Media
	{ mime = "{audio,video}/*", fg = "#9f80c4" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#cd6985" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#83b2ba" },

	# Virtual file system — 26 reports unreachable remote entries through this
	{ mime = "vfs/{absent,stale}", fg = "#746e91" },

	# Special files. `url` here was `name` before 26.
	{ url = "*", is = "orphan", bg = "#cd6985" },
	{ url = "*", is = "exec"  , fg = "#83b2ba" },
	{ url = "*", is = "dummy", bg = "#cd6985" },
	{ url = "*/", is = "dummy", bg = "#cd6985" },

	# Fallback
	{ url = "*/", fg = "#416d7f" }
]
    