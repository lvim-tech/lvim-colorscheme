    accent_alt: "#875537"
    # Default foreground.
    text: "#425353"
    # Descriptions, field labels, hints.
    muted: "#877666"
    # Unfocused pane borders.
    subtle: "#b1b1b1"
    # Completed operations.
    success: "#7a7d48"
    # Non-fatal problems.
    warning: "#c74e4e"
    # Failures.
    error: "#c74e4e"
    # Text of the title badge, drawn on `accent`.
    title_fg: "#ffffff"
