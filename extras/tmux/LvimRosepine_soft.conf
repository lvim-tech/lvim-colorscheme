# Palette for the layout in tmux.conf.
thm_bg="#1e1b2b"
thm_bg_dark="#141321"
thm_bg_soft_dark="#242134"
thm_fg="#b4b2c7"
thm_green="#83b2ba"
thm_green_dark="#71a7b0"
thm_red="#cd6985"
thm_red_dark="#c65474"
thm_orange="#c68784"
thm_orange_dark="#bd7370"
thm_blue_dark="#3b6374"
thm_teal_dark="#3b6374"

set -g mode-style "fg=#242134,bg=#bd7370"

set -g message-style "fg=#3b6374,bg=#141321"

set -g status-style "fg=#3b6374,bg=#141321"

setw -g window-status-style "fg=#83b2ba,bold,bg=#141321"
setw -g window-status-current-style "fg=#242134,bold,bg=#83b2ba"
setw -g window-status-activity-style "fg=#bd7370"

setw -g pane-border-style "fg=#71a7b0"
setw -g pane-active-border-style "fg=#71a7b0"

set -g @sysstat_cpu_color_low "#83b2ba"
set -g @sysstat_cpu_color_medium "#c68784"
set -g @sysstat_cpu_color_stress "#c65474"

set -g @sysstat_mem_color_low "#83b2ba"
set -g @sysstat_mem_color_medium "#c68784"
set -g @sysstat_mem_color_stress "#c65474"

set -g @prefix_highlight_fg "#cd6985,bold"
set -g @prefix_highlight_bg "#242134"
set -g @prefix_highlight_copy_mode_attr "fg=#cd6985,bold,bg=#141321"
