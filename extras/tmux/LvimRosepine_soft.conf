# Palette for the layout in tmux.conf.
thm_bg="#232126"
thm_bg_dark="#1f1d22"
thm_bg_soft_dark="#211f24"
thm_fg="#b3afb2"
thm_green="#788b7c"
thm_green_dark="#697d6d"
thm_red="#a0727c"
thm_red_dark="#95646f"
thm_orange="#a98a89"
thm_orange_dark="#9d7978"
thm_blue_dark="#526167"
thm_teal_dark="#51635d"

set -g mode-style "fg=#211f24,bg=#a27e7d"

set -g message-style "fg=#6a8c81,bg=#1f1d22"

set -g status-style "fg=#6d8b97,bg=#1f1d22"

setw -g window-status-style "fg=#788b7c,bold,bg=#1f1d22"
setw -g window-status-current-style "fg=#211f24,bold,bg=#7a8e7e"
setw -g window-status-activity-style "fg=#9d7978"

setw -g pane-border-style "fg=#697d6d"
setw -g pane-active-border-style "fg=#697d6d"

set -g @sysstat_cpu_color_low "#788b7c"
set -g @sysstat_cpu_color_medium "#a98a89"
set -g @sysstat_cpu_color_stress "#95646f"

set -g @sysstat_mem_color_low "#788b7c"
set -g @sysstat_mem_color_medium "#a98a89"
set -g @sysstat_mem_color_stress "#95646f"

set -g @prefix_highlight_fg "#ab7c86,bold"
set -g @prefix_highlight_bg "#211f24"
set -g @prefix_highlight_copy_mode_attr "fg=#a97984,bold,bg=#1f1d22"
