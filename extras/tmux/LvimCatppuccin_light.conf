# Palette for the layout in tmux.conf.
thm_bg="#E4E4E4"
thm_bg_dark="#dadada"
thm_bg_soft_dark="#dfdfdf"
thm_fg="#5e8888"
thm_green="#557153"
thm_green_dark="#5e825c"
thm_red="#a45a6d"
thm_red_dark="#b76277"
thm_orange="#ac8068"
thm_orange_dark="#88604d"
thm_blue_dark="#6d86ba"
thm_teal_dark="#5e837b"

set -g mode-style "fg=#ffffff,bg=#88604d"

set -g message-style "fg=#4d625e,bg=#dadada"

set -g status-style "fg=#525e7a,bg=#dadada"

setw -g window-status-style "fg=#4d634c,bold,bg=#dadada"
setw -g window-status-current-style "fg=#ffffff,bold,bg=#557153"
setw -g window-status-activity-style "fg=#88604d"

setw -g pane-border-style "fg=#5e825c"
setw -g pane-active-border-style "fg=#5e825c"

set -g @sysstat_cpu_color_low "#557153"
set -g @sysstat_cpu_color_medium "#ac8068"
set -g @sysstat_cpu_color_stress "#b76277"

set -g @sysstat_mem_color_low "#557153"
set -g @sysstat_mem_color_medium "#ac8068"
set -g @sysstat_mem_color_stress "#b76277"

set -g @prefix_highlight_fg "#8a515f,bold"
set -g @prefix_highlight_bg "#dfdfdf"
set -g @prefix_highlight_copy_mode_attr "fg=#864f5d,bold,bg=#dadada"
