# Palette for the layout in tmux.conf.
thm_bg="#003441"
thm_bg_dark="#00303d"
thm_bg_soft_dark="#00323f"
thm_fg="#9da4a4"
thm_green="#727c3e"
thm_green_dark="#666f37"
thm_red="#c24f4d"
thm_red_dark="#b34644"
thm_orange="#b46548"
thm_orange_dark="#a35b41"
thm_blue_dark="#477193"
thm_teal_dark="#407862"

set -g mode-style "fg=#00323f,bg=#a35b41"

set -g message-style "fg=#407862,bg=#00303d"

set -g status-style "fg=#477193,bg=#00303d"

setw -g window-status-style "fg=#727c3e,bold,bg=#00303d"
setw -g window-status-current-style "fg=#00323f,bold,bg=#727c3e"
setw -g window-status-activity-style "fg=#a35b41"

setw -g pane-border-style "fg=#666f37"
setw -g pane-active-border-style "fg=#666f37"

set -g @sysstat_cpu_color_low "#727c3e"
set -g @sysstat_cpu_color_medium "#b46548"
set -g @sysstat_cpu_color_stress "#b34644"

set -g @sysstat_mem_color_low "#727c3e"
set -g @sysstat_mem_color_medium "#b46548"
set -g @sysstat_mem_color_stress "#b34644"

set -g @prefix_highlight_fg "#c24f4d,bold"
set -g @prefix_highlight_bg "#00323f"
set -g @prefix_highlight_copy_mode_attr "fg=#c24f4d,bold,bg=#00303d"
