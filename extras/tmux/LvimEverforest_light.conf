# Palette for the layout in tmux.conf.
thm_bg="#E4E4E4"
thm_bg_dark="#dadada"
thm_bg_soft_dark="#dfdfdf"
thm_fg="#5e8888"
thm_green="#7b7e3d"
thm_green_dark="#8a8e46"
thm_red="#c74d4d"
thm_red_dark="#e44a4a"
thm_orange="#8d522b"
thm_orange_dark="#a05e33"
thm_blue_dark="#5b97b6"
thm_teal_dark="#479e8d"

set -g mode-style "fg=#ffffff,bg=#a05e33"

set -g message-style "fg=#42675f,bg=#dadada"

set -g status-style "fg=#4a6372,bg=#dadada"

setw -g window-status-style "fg=#5f613b,bold,bg=#dadada"
setw -g window-status-current-style "fg=#ffffff,bold,bg=#76793d"
setw -g window-status-activity-style "fg=#a05e33"

setw -g pane-border-style "fg=#8a8e46"
setw -g pane-active-border-style "fg=#8a8e46"

set -g @sysstat_cpu_color_low "#7b7e3d"
set -g @sysstat_cpu_color_medium "#8d522b"
set -g @sysstat_cpu_color_stress "#e44a4a"

set -g @sysstat_mem_color_low "#7b7e3d"
set -g @sysstat_mem_color_medium "#8d522b"
set -g @sysstat_mem_color_stress "#e44a4a"

set -g @prefix_highlight_fg "#9f4646,bold"
set -g @prefix_highlight_bg "#dfdfdf"
set -g @prefix_highlight_copy_mode_attr "fg=#9a4545,bold,bg=#dadada"
