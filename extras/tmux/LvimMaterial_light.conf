# Palette for the layout in tmux.conf.
thm_bg="#E4E4E4"
thm_bg_dark="#dadada"
thm_bg_soft_dark="#dfdfdf"
thm_fg="#5e8888"
thm_green="#6f864f"
thm_green_dark="#748f51"
thm_red="#b14b51"
thm_red_dark="#ca5157"
thm_orange="#c9745b"
thm_orange_dark="#a05540"
thm_blue_dark="#577acd"
thm_teal_dark="#4a8f7c"

set -g mode-style "fg=#dfdfdf,bg=#a05540"

set -g message-style "fg=#4a8f7c,bg=#dadada"

set -g status-style "fg=#577acd,bg=#dadada"

setw -g window-status-style "fg=#6f864f,bold,bg=#dadada"
setw -g window-status-current-style "fg=#dfdfdf,bold,bg=#6f864f"
setw -g window-status-activity-style "fg=#a05540"

setw -g pane-border-style "fg=#748f51"
setw -g pane-active-border-style "fg=#748f51"

set -g @sysstat_cpu_color_low "#6f864f"
set -g @sysstat_cpu_color_medium "#c9745b"
set -g @sysstat_cpu_color_stress "#ca5157"

set -g @sysstat_mem_color_low "#6f864f"
set -g @sysstat_mem_color_medium "#c9745b"
set -g @sysstat_mem_color_stress "#ca5157"

set -g @prefix_highlight_fg "#b14b51,bold"
set -g @prefix_highlight_bg "#dfdfdf"
set -g @prefix_highlight_copy_mode_attr "fg=#b14b51,bold,bg=#dadada"
