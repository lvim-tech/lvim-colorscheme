# Palette for the layout in tmux.conf.
thm_bg="#141c26"
thm_bg_dark="#101822"
thm_bg_soft_dark="#121a24"
thm_fg="#bcbdbd"
thm_green="#7b998a"
thm_green_dark="#6a8b7b"
thm_red="#b26377"
thm_red_dark="#ab5268"
thm_orange="#c88e62"
thm_orange_dark="#bd8055"
thm_blue_dark="#5677a3"
thm_teal_dark="#5a9887"

set -g mode-style "fg=#121a24,bg=#bd8055"

set -g message-style "fg=#5a9887,bg=#101822"

set -g status-style "fg=#5b84b9,bg=#101822"

setw -g window-status-style "fg=#7b998a,bold,bg=#101822"
setw -g window-status-current-style "fg=#121a24,bold,bg=#7b998a"
setw -g window-status-activity-style "fg=#bd8055"

setw -g pane-border-style "fg=#6a8b7b"
setw -g pane-active-border-style "fg=#6a8b7b"

set -g @sysstat_cpu_color_low "#7b998a"
set -g @sysstat_cpu_color_medium "#c88e62"
set -g @sysstat_cpu_color_stress "#ab5268"

set -g @sysstat_mem_color_low "#7b998a"
set -g @sysstat_mem_color_medium "#c88e62"
set -g @sysstat_mem_color_stress "#ab5268"

set -g @prefix_highlight_fg "#bf687e,bold"
set -g @prefix_highlight_bg "#121a24"
set -g @prefix_highlight_copy_mode_attr "fg=#bb667c,bold,bg=#101822"
