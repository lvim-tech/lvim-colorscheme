# Palette for the layout in tmux.conf.
thm_bg="#E4E4E4"
thm_bg_dark="#dadada"
thm_bg_soft_dark="#dfdfdf"
thm_fg="#5e8888"
thm_green="#606f52"
thm_green_dark="#6c7e5b"
thm_red="#ab5867"
thm_red_dark="#bd606f"
thm_orange="#b17f67"
thm_orange_dark="#8b604e"
thm_blue_dark="#7487bd"
thm_teal_dark="#658e83"

set -g mode-style "fg=#ffffff,bg=#8b604e"

set -g message-style "fg=#4e625c,bg=#dadada"

set -g status-style "fg=#555f80,bg=#dadada"

setw -g window-status-style "fg=#56624b,bold,bg=#dadada"
setw -g window-status-current-style "fg=#ffffff,bold,bg=#606f52"
setw -g window-status-activity-style "fg=#8b604e"

setw -g pane-border-style "fg=#6c7e5b"
setw -g pane-active-border-style "fg=#6c7e5b"

set -g @sysstat_cpu_color_low "#606f52"
set -g @sysstat_cpu_color_medium "#b17f67"
set -g @sysstat_cpu_color_stress "#bd606f"

set -g @sysstat_mem_color_low "#606f52"
set -g @sysstat_mem_color_medium "#b17f67"
set -g @sysstat_mem_color_stress "#bd606f"

set -g @prefix_highlight_fg "#904f5b,bold"
set -g @prefix_highlight_bg "#dfdfdf"
set -g @prefix_highlight_copy_mode_attr "fg=#884c56,bold,bg=#dadada"
