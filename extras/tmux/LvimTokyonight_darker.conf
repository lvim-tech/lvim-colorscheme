# Palette for the layout in tmux.conf.
thm_bg="#181b22"
thm_bg_dark="#14171e"
thm_bg_soft_dark="#161920"
thm_fg="#b2b6c7"
thm_green="#788a67"
thm_green_dark="#697b58"
thm_red="#bb6171"
thm_red_dark="#ac5764"
thm_orange="#bb866d"
thm_orange_dark="#ad7862"
thm_blue_dark="#546593"
thm_teal_dark="#4e6f66"

set -g mode-style "fg=#161920,bg=#ad7862"

set -g message-style "fg=#588b7e,bg=#14171e"

set -g status-style "fg=#6480c6,bg=#14171e"

setw -g window-status-style "fg=#788a67,bold,bg=#14171e"
setw -g window-status-current-style "fg=#161920,bold,bg=#788a67"
setw -g window-status-activity-style "fg=#ad7862"

setw -g pane-border-style "fg=#697b58"
setw -g pane-active-border-style "fg=#697b58"

set -g @sysstat_cpu_color_low "#788a67"
set -g @sysstat_cpu_color_medium "#bb866d"
set -g @sysstat_cpu_color_stress "#ac5764"

set -g @sysstat_mem_color_low "#788a67"
set -g @sysstat_mem_color_medium "#bb866d"
set -g @sysstat_mem_color_stress "#ac5764"

set -g @prefix_highlight_fg "#c46475,bold"
set -g @prefix_highlight_bg "#161920"
set -g @prefix_highlight_copy_mode_attr "fg=#c46475,bold,bg=#14171e"
