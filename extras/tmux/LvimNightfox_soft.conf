# Palette for the layout in tmux.conf.
thm_bg="#1d2837"
thm_bg_dark="#192433"
thm_bg_soft_dark="#1b2635"
thm_fg="#bcbdbd"
thm_green="#7b998a"
thm_green_dark="#6a8b7b"
thm_red="#b26377"
thm_red_dark="#ab5268"
thm_orange="#c88e62"
thm_orange_dark="#bd8055"
thm_blue_dark="#5677a3"
thm_teal_dark="#5a9887"

set -g mode-style "fg=#1b2635,bg=#bd8055"

set -g message-style "fg=#5a9887,bg=#192433"

set -g status-style "fg=#5677a3,bg=#192433"

setw -g window-status-style "fg=#7b998a,bold,bg=#192433"
setw -g window-status-current-style "fg=#1b2635,bold,bg=#7b998a"
setw -g window-status-activity-style "fg=#bd8055"

setw -g pane-border-style "fg=#6a8b7b"
setw -g pane-active-border-style "fg=#6a8b7b"

set -g @sysstat_cpu_color_low "#7b998a"
set -g @sysstat_cpu_color_medium "#c88e62"
set -g @sysstat_cpu_color_stress "#ab5268"

set -g @sysstat_mem_color_low "#7b998a"
set -g @sysstat_mem_color_medium "#c88e62"
set -g @sysstat_mem_color_stress "#ab5268"

set -g @prefix_highlight_fg "#b26377,bold"
set -g @prefix_highlight_bg "#1b2635"
set -g @prefix_highlight_copy_mode_attr "fg=#b26377,bold,bg=#192433"
