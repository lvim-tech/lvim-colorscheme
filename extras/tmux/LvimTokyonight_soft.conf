# Palette for the layout in tmux.conf.
thm_bg="#22252e"
thm_bg_dark="#1e212a"
thm_bg_soft_dark="#20232c"
thm_fg="#b2b6c7"
thm_green="#788a67"
thm_green_dark="#697b58"
thm_red="#bb6171"
thm_red_dark="#ac5764"
thm_orange="#bb866d"
thm_orange_dark="#ad7862"
thm_blue_dark="#546593"
thm_teal_dark="#4e6f66"

set -g mode-style "fg=#20232c,bg=#b57c64"

set -g message-style "fg=#5b9485,bg=#1e212a"

set -g status-style "fg=#6c88cd,bg=#1e212a"

setw -g window-status-style "fg=#7c906a,bold,bg=#1e212a"
setw -g window-status-current-style "fg=#20232c,bold,bg=#7c906a"
setw -g window-status-activity-style "fg=#ad7862"

setw -g pane-border-style "fg=#697b58"
setw -g pane-active-border-style "fg=#697b58"

set -g @sysstat_cpu_color_low "#788a67"
set -g @sysstat_cpu_color_medium "#bb866d"
set -g @sysstat_cpu_color_stress "#ac5764"

set -g @sysstat_mem_color_low "#788a67"
set -g @sysstat_mem_color_medium "#bb866d"
set -g @sysstat_mem_color_stress "#ac5764"

set -g @prefix_highlight_fg "#ca6e7e,bold"
set -g @prefix_highlight_bg "#20232c"
set -g @prefix_highlight_copy_mode_attr "fg=#ca6e7e,bold,bg=#1e212a"
