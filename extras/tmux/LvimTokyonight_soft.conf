# Palette for the layout in tmux.conf.
thm_bg="#1f202d"
thm_bg_dark="#181820"
thm_bg_soft_dark="#1b1b24"
thm_fg="#b2b6c7"
thm_green="#9dbd7b"
thm_green_dark="#8fb468"
thm_red="#d76479"
thm_red_dark="#d14d66"
thm_orange="#dd8b5a"
thm_orange_dark="#d87b43"
thm_blue_dark="#4e78d1"
thm_teal_dark="#31927e"

set -g mode-style "fg=#1b1b24,bg=#d87b43"

set -g message-style "fg=#31927e,bg=#181820"

set -g status-style "fg=#4e78d1,bg=#181820"

setw -g window-status-style "fg=#9dbd7b,bold,bg=#181820"
setw -g window-status-current-style "fg=#1b1b24,bold,bg=#9dbd7b"
setw -g window-status-activity-style "fg=#d87b43"

setw -g pane-border-style "fg=#8fb468"
setw -g pane-active-border-style "fg=#8fb468"

set -g @sysstat_cpu_color_low "#9dbd7b"
set -g @sysstat_cpu_color_medium "#dd8b5a"
set -g @sysstat_cpu_color_stress "#d14d66"

set -g @sysstat_mem_color_low "#9dbd7b"
set -g @sysstat_mem_color_medium "#dd8b5a"
set -g @sysstat_mem_color_stress "#d14d66"

set -g @prefix_highlight_fg "#d76479,bold"
set -g @prefix_highlight_bg "#1b1b24"
set -g @prefix_highlight_copy_mode_attr "fg=#d76479,bold,bg=#181820"
