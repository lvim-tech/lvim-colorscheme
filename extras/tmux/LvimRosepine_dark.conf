# Palette for the layout in tmux.conf.
thm_bg="#1d1b1f"
thm_bg_dark="#19171b"
thm_bg_soft_dark="#1b191d"
thm_fg="#b3afb2"
thm_green="#788b7c"
thm_green_dark="#697d6d"
thm_red="#a0727c"
thm_red_dark="#95646f"
thm_orange="#a98a89"
thm_orange_dark="#9d7978"
thm_blue_dark="#526167"
thm_teal_dark="#51635d"

set -g mode-style "fg=#1b191d,bg=#9d7978"

set -g message-style "fg=#68897e,bg=#19171b"

set -g status-style "fg=#6a8690,bg=#19171b"

setw -g window-status-style "fg=#788b7c,bold,bg=#19171b"
setw -g window-status-current-style "fg=#1b191d,bold,bg=#788b7c"
setw -g window-status-activity-style "fg=#9d7978"

setw -g pane-border-style "fg=#697d6d"
setw -g pane-active-border-style "fg=#697d6d"

set -g @sysstat_cpu_color_low "#788b7c"
set -g @sysstat_cpu_color_medium "#a98a89"
set -g @sysstat_cpu_color_stress "#95646f"

set -g @sysstat_mem_color_low "#788b7c"
set -g @sysstat_mem_color_medium "#a98a89"
set -g @sysstat_mem_color_stress "#95646f"

set -g @prefix_highlight_fg "#a77681,bold"
set -g @prefix_highlight_bg "#1b191d"
set -g @prefix_highlight_copy_mode_attr "fg=#a4747e,bold,bg=#19171b"
