# Palette for the layout in tmux.conf.
thm_bg="#E4E4E4"
thm_bg_dark="#dadada"
thm_bg_soft_dark="#dfdfdf"
thm_fg="#5e8888"
thm_green="#727c3e"
thm_green_dark="#7f8a46"
thm_red="#ca5350"
thm_red_dark="#d85c5a"
thm_orange="#ab6044"
thm_orange_dark="#bc6a4c"
thm_blue_dark="#5586ae"
thm_teal_dark="#4c8d73"

set -g mode-style "fg=#ffffff,bg=#aa634a"

set -g message-style "fg=#436556,bg=#dadada"

set -g status-style "fg=#486178,bg=#dadada"

setw -g window-status-style "fg=#5b623b,bold,bg=#dadada"
setw -g window-status-current-style "fg=#ffffff,bold,bg=#70793e"
setw -g window-status-activity-style "fg=#bc6a4c"

setw -g pane-border-style "fg=#7f8a46"
setw -g pane-active-border-style "fg=#7f8a46"

set -g @sysstat_cpu_color_low "#727c3e"
set -g @sysstat_cpu_color_medium "#ab6044"
set -g @sysstat_cpu_color_stress "#d85c5a"

set -g @sysstat_mem_color_low "#727c3e"
set -g @sysstat_mem_color_medium "#ab6044"
set -g @sysstat_mem_color_stress "#d85c5a"

set -g @prefix_highlight_fg "#994847,bold"
set -g @prefix_highlight_bg "#dfdfdf"
set -g @prefix_highlight_copy_mode_attr "fg=#944746,bold,bg=#dadada"
