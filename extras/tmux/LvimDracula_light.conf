# Palette for the layout in tmux.conf.
thm_bg="#E4E4E4"
thm_bg_dark="#dadada"
thm_bg_soft_dark="#dfdfdf"
thm_fg="#5e8888"
thm_green="#466d4e"
thm_green_dark="#507a57"
thm_red="#af5959"
thm_red_dark="#c75e5e"
thm_orange="#a38165"
thm_orange_dark="#7e5f47"
thm_blue_dark="#5a7d87"
thm_teal_dark="#577f74"

set -g mode-style "fg=#dfdfdf,bg=#7e5f47"

set -g message-style "fg=#577f74,bg=#dadada"

set -g status-style "fg=#5a7d87,bg=#dadada"

setw -g window-status-style "fg=#466d4e,bold,bg=#dadada"
setw -g window-status-current-style "fg=#dfdfdf,bold,bg=#466d4e"
setw -g window-status-activity-style "fg=#7e5f47"

setw -g pane-border-style "fg=#507a57"
setw -g pane-active-border-style "fg=#507a57"

set -g @sysstat_cpu_color_low "#466d4e"
set -g @sysstat_cpu_color_medium "#a38165"
set -g @sysstat_cpu_color_stress "#c75e5e"

set -g @sysstat_mem_color_low "#466d4e"
set -g @sysstat_mem_color_medium "#a38165"
set -g @sysstat_mem_color_stress "#c75e5e"

set -g @prefix_highlight_fg "#af5959,bold"
set -g @prefix_highlight_bg "#dfdfdf"
set -g @prefix_highlight_copy_mode_attr "fg=#af5959,bold,bg=#dadada"
