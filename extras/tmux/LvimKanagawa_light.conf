# Palette for the layout in tmux.conf.
thm_bg="#E4E4E4"
thm_bg_dark="#dadada"
thm_bg_soft_dark="#dfdfdf"
thm_fg="#5e8888"
thm_green="#697b51"
thm_green_dark="#728559"
thm_red="#c35959"
thm_red_dark="#d15d5d"
thm_orange="#a87e56"
thm_orange_dark="#b08257"
thm_blue_dark="#6c8dcc"
thm_teal_dark="#528295"

set -g mode-style "fg=#ffffff,bg=#906e50"

set -g message-style "fg=#486470,bg=#dadada"

set -g status-style "fg=#516080,bg=#dadada"

setw -g window-status-style "fg=#576347,bold,bg=#dadada"
setw -g window-status-current-style "fg=#ffffff,bold,bg=#697b51"
setw -g window-status-activity-style "fg=#b08257"

setw -g pane-border-style "fg=#728559"
setw -g pane-active-border-style "fg=#728559"

set -g @sysstat_cpu_color_low "#697b51"
set -g @sysstat_cpu_color_medium "#a87e56"
set -g @sysstat_cpu_color_stress "#d15d5d"

set -g @sysstat_mem_color_low "#697b51"
set -g @sysstat_mem_color_medium "#a87e56"
set -g @sysstat_mem_color_stress "#d15d5d"

set -g @prefix_highlight_fg "#944c4c,bold"
set -g @prefix_highlight_bg "#dfdfdf"
set -g @prefix_highlight_copy_mode_attr "fg=#904b4b,bold,bg=#dadada"
