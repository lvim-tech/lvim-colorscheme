# Palette for the layout in tmux.conf.
thm_bg="#262d31"
thm_bg_dark="#22292d"
thm_bg_soft_dark="#242b2f"
thm_fg="#5e8888"
thm_green="#7e965a"
thm_green_dark="#718650"
thm_red="#d75e52"
thm_red_dark="#cc5147"
thm_orange="#e19556"
thm_orange_dark="#da8950"
thm_blue_dark="#3b6d8d"
thm_teal_dark="#366c5f"

set -g mode-style "fg=#242b2f,bg=#da8950"

set -g message-style "fg=#366c5f,bg=#22292d"

set -g status-style "fg=#3b6d8d,bg=#22292d"

setw -g window-status-style "fg=#7e965a,bold,bg=#22292d"
setw -g window-status-current-style "fg=#242b2f,bold,bg=#7e965a"
setw -g window-status-activity-style "fg=#da8950"

setw -g pane-border-style "fg=#718650"
setw -g pane-active-border-style "fg=#718650"

set -g @sysstat_cpu_color_low "#7e965a"
set -g @sysstat_cpu_color_medium "#e19556"
set -g @sysstat_cpu_color_stress "#cc5147"

set -g @sysstat_mem_color_low "#7e965a"
set -g @sysstat_mem_color_medium "#e19556"
set -g @sysstat_mem_color_stress "#cc5147"

set -g @prefix_highlight_fg "#d75e52,bold"
set -g @prefix_highlight_bg "#242b2f"
set -g @prefix_highlight_copy_mode_attr "fg=#d75e52,bold,bg=#22292d"
