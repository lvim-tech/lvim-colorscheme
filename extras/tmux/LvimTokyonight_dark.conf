# Palette for the layout in tmux.conf.
thm_bg="#1d2028"
thm_bg_dark="#191c24"
thm_bg_soft_dark="#1b1e26"
thm_fg="#b2b6c7"
thm_green="#788a67"
thm_green_dark="#697b58"
thm_red="#bb6171"
thm_red_dark="#ac5764"
thm_orange="#bb866d"
thm_orange_dark="#ad7862"
thm_blue_dark="#546593"
thm_teal_dark="#4e6f66"

set -g mode-style "fg=#1b1e26,bg=#ad7862"

set -g message-style "fg=#4e6f66,bg=#191c24"

set -g status-style "fg=#546593,bg=#191c24"

setw -g window-status-style "fg=#788a67,bold,bg=#191c24"
setw -g window-status-current-style "fg=#1b1e26,bold,bg=#788a67"
setw -g window-status-activity-style "fg=#ad7862"

setw -g pane-border-style "fg=#697b58"
setw -g pane-active-border-style "fg=#697b58"

set -g @sysstat_cpu_color_low "#788a67"
set -g @sysstat_cpu_color_medium "#bb866d"
set -g @sysstat_cpu_color_stress "#ac5764"

set -g @sysstat_mem_color_low "#788a67"
set -g @sysstat_mem_color_medium "#bb866d"
set -g @sysstat_mem_color_stress "#ac5764"

set -g @prefix_highlight_fg "#bb6171,bold"
set -g @prefix_highlight_bg "#1b1e26"
set -g @prefix_highlight_copy_mode_attr "fg=#bb6171,bold,bg=#191c24"
