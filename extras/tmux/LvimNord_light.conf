# Palette for the layout in tmux.conf.
thm_bg="#E4E4E4"
thm_bg_dark="#dadada"
thm_bg_soft_dark="#dfdfdf"
thm_fg="#5e8888"
thm_green="#7e8f70"
thm_green_dark="#5d6d50"
thm_red="#976065"
thm_red_dark="#b2676e"
thm_orange="#7a564b"
thm_orange_dark="#916050"
thm_blue_dark="#60788f"
thm_teal_dark="#54706e"

set -g mode-style "fg=#dfdfdf,bg=#916050"

set -g message-style "fg=#54706e,bg=#dadada"

set -g status-style "fg=#60788f,bg=#dadada"

setw -g window-status-style "fg=#7e8f70,bold,bg=#dadada"
setw -g window-status-current-style "fg=#dfdfdf,bold,bg=#7e8f70"
setw -g window-status-activity-style "fg=#916050"

setw -g pane-border-style "fg=#5d6d50"
setw -g pane-active-border-style "fg=#5d6d50"

set -g @sysstat_cpu_color_low "#7e8f70"
set -g @sysstat_cpu_color_medium "#7a564b"
set -g @sysstat_cpu_color_stress "#b2676e"

set -g @sysstat_mem_color_low "#7e8f70"
set -g @sysstat_mem_color_medium "#7a564b"
set -g @sysstat_mem_color_stress "#b2676e"

set -g @prefix_highlight_fg "#976065,bold"
set -g @prefix_highlight_bg "#dfdfdf"
set -g @prefix_highlight_copy_mode_attr "fg=#976065,bold,bg=#dadada"
