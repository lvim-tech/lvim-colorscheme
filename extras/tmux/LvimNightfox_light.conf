# Palette for the layout in tmux.conf.
thm_bg="#E4E4E4"
thm_bg_dark="#dadada"
thm_bg_soft_dark="#dfdfdf"
thm_fg="#5e8888"
thm_green="#749182"
thm_green_dark="#557063"
thm_red="#a75d70"
thm_red_dark="#c55f78"
thm_orange="#ac7a53"
thm_orange_dark="#835739"
thm_blue_dark="#597ba8"
thm_teal_dark="#3e6b5e"

set -g mode-style "fg=#dfdfdf,bg=#835739"

set -g message-style "fg=#3e6b5e,bg=#dadada"

set -g status-style "fg=#597ba8,bg=#dadada"

setw -g window-status-style "fg=#749182,bold,bg=#dadada"
setw -g window-status-current-style "fg=#dfdfdf,bold,bg=#749182"
setw -g window-status-activity-style "fg=#835739"

setw -g pane-border-style "fg=#557063"
setw -g pane-active-border-style "fg=#557063"

set -g @sysstat_cpu_color_low "#749182"
set -g @sysstat_cpu_color_medium "#ac7a53"
set -g @sysstat_cpu_color_stress "#c55f78"

set -g @sysstat_mem_color_low "#749182"
set -g @sysstat_mem_color_medium "#ac7a53"
set -g @sysstat_mem_color_stress "#c55f78"

set -g @prefix_highlight_fg "#a75d70,bold"
set -g @prefix_highlight_bg "#dfdfdf"
set -g @prefix_highlight_copy_mode_attr "fg=#a75d70,bold,bg=#dadada"
