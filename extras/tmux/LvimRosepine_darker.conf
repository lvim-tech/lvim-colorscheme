# Palette for the layout in tmux.conf.
thm_bg="#171519"
thm_bg_dark="#131115"
thm_bg_soft_dark="#151317"
thm_fg="#b3afb2"
thm_green="#788b7c"
thm_green_dark="#697d6d"
thm_red="#a0727c"
thm_red_dark="#95646f"
thm_orange="#a98a89"
thm_orange_dark="#9d7978"
thm_blue_dark="#526167"
thm_teal_dark="#51635d"

set -g mode-style "fg=#151317,bg=#9d7978"

set -g message-style "fg=#658379,bg=#131115"

set -g status-style "fg=#68838d,bg=#131115"

setw -g window-status-style "fg=#788b7c,bold,bg=#131115"
setw -g window-status-current-style "fg=#151317,bold,bg=#788b7c"
setw -g window-status-activity-style "fg=#9d7978"

setw -g pane-border-style "fg=#697d6d"
setw -g pane-active-border-style "fg=#697d6d"

set -g @sysstat_cpu_color_low "#788b7c"
set -g @sysstat_cpu_color_medium "#a98a89"
set -g @sysstat_cpu_color_stress "#95646f"

set -g @sysstat_mem_color_low "#788b7c"
set -g @sysstat_mem_color_medium "#a98a89"
set -g @sysstat_mem_color_stress "#95646f"

set -g @prefix_highlight_fg "#a0727c,bold"
set -g @prefix_highlight_bg "#151317"
set -g @prefix_highlight_copy_mode_attr "fg=#a0727c,bold,bg=#131115"
