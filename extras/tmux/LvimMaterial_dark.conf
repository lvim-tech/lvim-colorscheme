# Palette for the layout in tmux.conf.
thm_bg="#222d32"
thm_bg_dark="#1e292e"
thm_bg_soft_dark="#202b30"
thm_fg="#b2c7c7"
thm_green="#90ad68"
thm_green_dark="#83a15c"
thm_red="#d05e64"
thm_red_dark="#c34e54"
thm_orange="#d37a60"
thm_orange_dark="#c76b52"
thm_blue_dark="#4f6fbb"
thm_teal_dark="#5bac96"

set -g mode-style "fg=#202b30,bg=#de7354"

set -g message-style "fg=#5bac96,bg=#1e292e"

set -g status-style "fg=#648be7,bg=#1e292e"

setw -g window-status-style "fg=#90ad68,bold,bg=#1e292e"
setw -g window-status-current-style "fg=#202b30,bold,bg=#90ad68"
setw -g window-status-activity-style "fg=#c76b52"

setw -g pane-border-style "fg=#83a15c"
setw -g pane-active-border-style "fg=#83a15c"

set -g @sysstat_cpu_color_low "#90ad68"
set -g @sysstat_cpu_color_medium "#d37a60"
set -g @sysstat_cpu_color_stress "#c34e54"

set -g @sysstat_mem_color_low "#90ad68"
set -g @sysstat_mem_color_medium "#d37a60"
set -g @sysstat_mem_color_stress "#c34e54"

set -g @prefix_highlight_fg "#d97478,bold"
set -g @prefix_highlight_bg "#202b30"
set -g @prefix_highlight_copy_mode_attr "fg=#d87075,bold,bg=#1e292e"
