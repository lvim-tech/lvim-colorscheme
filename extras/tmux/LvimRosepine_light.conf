# Palette for the layout in tmux.conf.
thm_bg="#E4E4E4"
thm_bg_dark="#dadada"
thm_bg_soft_dark="#dfdfdf"
thm_fg="#5e8888"
thm_green="#5d6c60"
thm_green_dark="#677b6b"
thm_red="#8e656e"
thm_red_dark="#a36e7a"
thm_orange="#a58382"
thm_orange_dark="#846564"
thm_blue_dark="#7e949d"
thm_teal_dark="#7b958d"

set -g mode-style "fg=#dfdfdf,bg=#846564"

set -g message-style "fg=#7b958d,bg=#dadada"

set -g status-style "fg=#7e949d,bg=#dadada"

setw -g window-status-style "fg=#5d6c60,bold,bg=#dadada"
setw -g window-status-current-style "fg=#dfdfdf,bold,bg=#5d6c60"
setw -g window-status-activity-style "fg=#846564"

setw -g pane-border-style "fg=#677b6b"
setw -g pane-active-border-style "fg=#677b6b"

set -g @sysstat_cpu_color_low "#5d6c60"
set -g @sysstat_cpu_color_medium "#a58382"
set -g @sysstat_cpu_color_stress "#a36e7a"

set -g @sysstat_mem_color_low "#5d6c60"
set -g @sysstat_mem_color_medium "#a58382"
set -g @sysstat_mem_color_stress "#a36e7a"

set -g @prefix_highlight_fg "#8e656e,bold"
set -g @prefix_highlight_bg "#dfdfdf"
set -g @prefix_highlight_copy_mode_attr "fg=#8e656e,bold,bg=#dadada"
