# Palette for the layout in tmux.conf.
thm_bg="#1d2128"
thm_bg_dark="#14171c"
thm_bg_soft_dark="#181d23"
thm_fg="#b3bac6"
thm_green="#97ab86"
thm_green_dark="#89a076"
thm_red="#af7177"
thm_red_dark="#a66067"
thm_orange="#ba8574"
thm_orange_dark="#b17562"
thm_blue_dark="#6f89a4"
thm_teal_dark="#789f9d"

set -g mode-style "fg=#181d23,bg=#b17562"

set -g message-style "fg=#789f9d,bg=#14171c"

set -g status-style "fg=#6f89a4,bg=#14171c"

setw -g window-status-style "fg=#97ab86,bold,bg=#14171c"
setw -g window-status-current-style "fg=#181d23,bold,bg=#97ab86"
setw -g window-status-activity-style "fg=#b17562"

setw -g pane-border-style "fg=#89a076"
setw -g pane-active-border-style "fg=#89a076"

set -g @sysstat_cpu_color_low "#97ab86"
set -g @sysstat_cpu_color_medium "#ba8574"
set -g @sysstat_cpu_color_stress "#a66067"

set -g @sysstat_mem_color_low "#97ab86"
set -g @sysstat_mem_color_medium "#ba8574"
set -g @sysstat_mem_color_stress "#a66067"

set -g @prefix_highlight_fg "#af7177,bold"
set -g @prefix_highlight_bg "#181d23"
set -g @prefix_highlight_copy_mode_attr "fg=#af7177,bold,bg=#14171c"
