# LvimTokyonight_light
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimTokyonight_light"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#6579ac"      # selection / active highlight, title & border accent
accent_alt = "#9e7460"  # headings, suspects, staged edits, new peers
text       = "#425353"        # default foreground
muted      = "#787d9a"       # hints and secondary labels
subtle     = "#b1b1b1"      # unfocused borders and dividers
success    = "#606f52"     # freeze on, healthy state
warning    = "#ab5867"     # a warning (same hue as error, not bold)
error      = "#ab5867"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
