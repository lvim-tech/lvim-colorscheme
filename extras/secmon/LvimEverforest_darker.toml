# LvimEverforest_darker
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimEverforest_darker"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#42728b"      # selection / active highlight, title & border accent
accent_alt = "#cc7942"  # headings, suspects, staged edits, new peers
text       = "#92a48c"        # default foreground
muted      = "#616f5a"       # hints and secondary labels
subtle     = "#35444f"      # unfocused borders and dividers
success    = "#75783a"     # freeze on, healthy state
warning    = "#cb4f4f"     # a warning (same hue as error, not bold)
error      = "#cb4f4f"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
