# LvimNightfox_soft
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimNightfox_soft"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#6885ad"      # selection / active highlight, title & border accent
accent_alt = "#c88e62"  # headings, suspects, staged edits, new peers
text       = "#bcbdbd"        # default foreground
muted      = "#758292"       # hints and secondary labels
subtle     = "#26486c"      # unfocused borders and dividers
success    = "#7b998a"     # freeze on, healthy state
warning    = "#b26377"     # a warning (same hue as error, not bold)
error      = "#b26377"       # an error / destructive action (bold)
title_fg   = "#171b23"    # foreground drawn on the accent badge
