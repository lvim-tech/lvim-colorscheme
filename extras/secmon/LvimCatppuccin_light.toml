# LvimCatppuccin_light
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimCatppuccin_light"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#6279a4"      # selection / active highlight, title & border accent
accent_alt = "#9a7561"  # headings, suspects, staged edits, new peers
text       = "#425252"        # default foreground
muted      = "#727897"       # hints and secondary labels
subtle     = "#b1b1b1"      # unfocused borders and dividers
success    = "#557153"     # freeze on, healthy state
warning    = "#a45a6d"     # a warning (same hue as error, not bold)
error      = "#a45a6d"       # an error / destructive action (bold)
title_fg   = "#090909"    # foreground drawn on the accent badge
