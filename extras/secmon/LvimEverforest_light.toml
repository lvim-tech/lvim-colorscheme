# LvimEverforest_light
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimEverforest_light"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#4f839e"      # selection / active highlight, title & border accent
accent_alt = "#8d522b"  # headings, suspects, staged edits, new peers
text       = "#425353"        # default foreground
muted      = "#778271"       # hints and secondary labels
subtle     = "#b1b1b1"      # unfocused borders and dividers
success    = "#7b7e3d"     # freeze on, healthy state
warning    = "#c74d4d"     # a warning (same hue as error, not bold)
error      = "#c74d4d"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
