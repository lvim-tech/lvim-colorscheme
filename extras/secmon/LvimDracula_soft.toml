# LvimDracula_soft
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimDracula_soft"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#638993"      # selection / active highlight, title & border accent
accent_alt = "#b58f70"  # headings, suspects, staged edits, new peers
text       = "#c7c7b3"        # default foreground
muted      = "#727a98"       # hints and secondary labels
subtle     = "#444962"      # unfocused borders and dividers
success    = "#62966d"     # freeze on, healthy state
warning    = "#bc6060"     # a warning (same hue as error, not bold)
error      = "#bc6060"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
