# LvimSolarized_light
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimSolarized_light"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#4c799d"      # selection / active highlight, title & border accent
accent_alt = "#ab6044"  # headings, suspects, staged edits, new peers
text       = "#425252"        # default foreground
muted      = "#657479"       # hints and secondary labels
subtle     = "#b1b1b1"      # unfocused borders and dividers
success    = "#727c3e"     # freeze on, healthy state
warning    = "#ca5350"     # a warning (same hue as error, not bold)
error      = "#ca5350"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
