# LvimKanagawa_dark
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimKanagawa_dark"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#4e6a9c"      # selection / active highlight, title & border accent
accent_alt = "#bf8f62"  # headings, suspects, staged edits, new peers
text       = "#9a9ab8"        # default foreground
muted      = "#656593"       # hints and secondary labels
subtle     = "#3e4152"      # unfocused borders and dividers
success    = "#6c7f54"     # freeze on, healthy state
warning    = "#ba5454"     # a warning (same hue as error, not bold)
error      = "#ba5454"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
