# LvimNord_darker
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimNord_darker"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#73889e"      # selection / active highlight, title & border accent
accent_alt = "#b88473"  # headings, suspects, staged edits, new peers
text       = "#b3bac6"        # default foreground
muted      = "#677185"       # hints and secondary labels
subtle     = "#354256"      # unfocused borders and dividers
success    = "#879978"     # freeze on, healthy state
warning    = "#ac6e74"     # a warning (same hue as error, not bold)
error      = "#ac6e74"       # an error / destructive action (bold)
title_fg   = "#1d2128"    # foreground drawn on the accent badge
