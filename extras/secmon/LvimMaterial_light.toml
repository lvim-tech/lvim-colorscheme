# LvimMaterial_light
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimMaterial_light"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#4d6cae"      # selection / active highlight, title & border accent
accent_alt = "#b36b57"  # headings, suspects, staged edits, new peers
text       = "#425252"        # default foreground
muted      = "#64747c"       # hints and secondary labels
subtle     = "#b1b1b1"      # unfocused borders and dividers
success    = "#6f864f"     # freeze on, healthy state
warning    = "#b14b51"     # a warning (same hue as error, not bold)
error      = "#b14b51"       # an error / destructive action (bold)
title_fg   = "#020202"    # foreground drawn on the accent badge
