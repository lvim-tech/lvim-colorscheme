# LvimBase_darker
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimBase_darker"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#447ca2"      # selection / active highlight, title & border accent
accent_alt = "#e19556"  # headings, suspects, staged edits, new peers
text       = "#68a8a8"        # default foreground
muted      = "#5b7d7e"       # hints and secondary labels
subtle     = "#31444d"      # unfocused borders and dividers
success    = "#7e965a"     # freeze on, healthy state
warning    = "#d75e52"     # a warning (same hue as error, not bold)
error      = "#d75e52"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
