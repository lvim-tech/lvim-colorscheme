# LvimCatppuccin_dark
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimCatppuccin_dark"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#6076a0"      # selection / active highlight, title & border accent
accent_alt = "#b88970"  # headings, suspects, staged edits, new peers
text       = "#b2b7c7"        # default foreground
muted      = "#6c7393"       # hints and secondary labels
subtle     = "#3b3f5c"      # unfocused borders and dividers
success    = "#6b8d69"     # freeze on, healthy state
warning    = "#b7657a"     # a warning (same hue as error, not bold)
error      = "#b7657a"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
