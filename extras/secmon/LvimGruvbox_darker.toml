# LvimGruvbox_darker
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimGruvbox_darker"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#497188"      # selection / active highlight, title & border accent
accent_alt = "#c47d54"  # headings, suspects, staged edits, new peers
text       = "#aa9782"        # default foreground
muted      = "#837263"       # hints and secondary labels
subtle     = "#423f3b"      # unfocused borders and dividers
success    = "#757845"     # freeze on, healthy state
warning    = "#ca4f4f"     # a warning (same hue as error, not bold)
error      = "#ca4f4f"       # an error / destructive action (bold)
title_fg   = "#030303"    # foreground drawn on the accent badge
