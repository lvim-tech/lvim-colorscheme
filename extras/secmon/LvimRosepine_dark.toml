# LvimRosepine_dark
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimRosepine_dark"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#5d6d74"      # selection / active highlight, title & border accent
accent_alt = "#a98a89"  # headings, suspects, staged edits, new peers
text       = "#b3afb2"        # default foreground
muted      = "#896882"       # hints and secondary labels
subtle     = "#423b49"      # unfocused borders and dividers
success    = "#788b7c"     # freeze on, healthy state
warning    = "#a0727c"     # a warning (same hue as error, not bold)
error      = "#a0727c"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
