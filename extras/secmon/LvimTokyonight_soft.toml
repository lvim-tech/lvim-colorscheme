# LvimTokyonight_soft
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimTokyonight_soft"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#6073a4"      # selection / active highlight, title & border accent
accent_alt = "#bb866d"  # headings, suspects, staged edits, new peers
text       = "#b2b6c7"        # default foreground
muted      = "#656c8b"       # hints and secondary labels
subtle     = "#3d455d"      # unfocused borders and dividers
success    = "#788a67"     # freeze on, healthy state
warning    = "#bb6171"     # a warning (same hue as error, not bold)
error      = "#bb6171"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
