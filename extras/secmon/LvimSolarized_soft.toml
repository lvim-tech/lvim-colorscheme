# LvimSolarized_soft
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimSolarized_soft"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#4f7ea3"      # selection / active highlight, title & border accent
accent_alt = "#b46548"  # headings, suspects, staged edits, new peers
text       = "#a7afaf"        # default foreground
muted      = "#697a80"       # hints and secondary labels
subtle     = "#005669"      # unfocused borders and dividers
success    = "#727c3e"     # freeze on, healthy state
warning    = "#c7504e"     # a warning (same hue as error, not bold)
error      = "#c7504e"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
