# LvimBase_light
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimBase_light"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#457da3"      # selection / active highlight, title & border accent
accent_alt = "#aa703f"  # headings, suspects, staged edits, new peers
text       = "#425252"        # default foreground
muted      = "#5b7d7e"       # hints and secondary labels
subtle     = "#b1b1b1"      # unfocused borders and dividers
success    = "#55673c"     # freeze on, healthy state
warning    = "#ae4b41"     # a warning (same hue as error, not bold)
error      = "#ae4b41"       # an error / destructive action (bold)
title_fg   = "#060606"    # foreground drawn on the accent badge
