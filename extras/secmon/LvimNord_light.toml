# LvimNord_light
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimNord_light"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#596a7c"      # selection / active highlight, title & border accent
accent_alt = "#7a564b"  # headings, suspects, staged edits, new peers
text       = "#425252"        # default foreground
muted      = "#6b7689"       # hints and secondary labels
subtle     = "#b1b1b1"      # unfocused borders and dividers
success    = "#738168"     # freeze on, healthy state
warning    = "#976065"     # a warning (same hue as error, not bold)
error      = "#976065"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
