# LvimGruvbox_light
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimGruvbox_light"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#57829c"      # selection / active highlight, title & border accent
accent_alt = "#875537"  # headings, suspects, staged edits, new peers
text       = "#425252"        # default foreground
muted      = "#877666"       # hints and secondary labels
subtle     = "#b1b1b1"      # unfocused borders and dividers
success    = "#7a7d48"     # freeze on, healthy state
warning    = "#c74e4e"     # a warning (same hue as error, not bold)
error      = "#c74e4e"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
