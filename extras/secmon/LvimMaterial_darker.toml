# LvimMaterial_darker
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimMaterial_darker"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#5b7fcb"      # selection / active highlight, title & border accent
accent_alt = "#d37a60"  # headings, suspects, staged edits, new peers
text       = "#b2c7c7"        # default foreground
muted      = "#6e7f87"       # hints and secondary labels
subtle     = "#2c4853"      # unfocused borders and dividers
success    = "#90ad68"     # freeze on, healthy state
warning    = "#d05e64"     # a warning (same hue as error, not bold)
error      = "#d05e64"       # an error / destructive action (bold)
title_fg   = "#1c2529"    # foreground drawn on the accent badge
