# LvimRosepine_light
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimRosepine_light"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#6f8289"      # selection / active highlight, title & border accent
accent_alt = "#987675"  # headings, suspects, staged edits, new peers
text       = "#425252"        # default foreground
muted      = "#926f8a"       # hints and secondary labels
subtle     = "#b1b1b1"      # unfocused borders and dividers
success    = "#5d6c60"     # freeze on, healthy state
warning    = "#8e656e"     # a warning (same hue as error, not bold)
error      = "#8e656e"       # an error / destructive action (bold)
title_fg   = "#151515"    # foreground drawn on the accent badge
