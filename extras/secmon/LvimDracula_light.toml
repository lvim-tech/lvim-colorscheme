# LvimDracula_light
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimDracula_light"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#517079"      # selection / active highlight, title & border accent
accent_alt = "#957860"  # headings, suspects, staged edits, new peers
text       = "#425252"        # default foreground
muted      = "#6b728f"       # hints and secondary labels
subtle     = "#b1b1b1"      # unfocused borders and dividers
success    = "#466d4e"     # freeze on, healthy state
warning    = "#af5959"     # a warning (same hue as error, not bold)
error      = "#af5959"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
