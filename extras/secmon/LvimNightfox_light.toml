# LvimNightfox_light
# Generated by lvim-colorscheme for secmon-tui — https://github.com/lvim-tech/secmon
#
# Install:
#   mkdir -p ~/.config/secmon/themes
#   cp extras/secmon/*.toml ~/.config/secmon/themes/
#
# Use, in ~/.config/secmon/config.toml: theme = "LvimNightfox_light"
#
# Every role is optional; a missing one falls back to the built-in default.

accent     = "#546d8e"      # selection / active highlight, title & border accent
accent_alt = "#a17351"  # headings, suspects, staged edits, new peers
text       = "#425252"        # default foreground
muted      = "#646f7d"       # hints and secondary labels
subtle     = "#b1b1b1"      # unfocused borders and dividers
success    = "#6b8377"     # freeze on, healthy state
warning    = "#a75d70"     # a warning (same hue as error, not bold)
error      = "#a75d70"       # an error / destructive action (bold)
title_fg   = "#ffffff"    # foreground drawn on the accent badge
