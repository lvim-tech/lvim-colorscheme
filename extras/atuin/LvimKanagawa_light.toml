# Lvim Colorscheme KanagawaLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimKanagawa_light"

[theme]
name = "LvimKanagawa_light"

[colors]
# Default foreground.
Base = "#425252"
# Failures.
AlertError = "#c35959"
# Non-fatal problems.
AlertWarn = "#816f4a"
# Informational notices.
AlertInfo = "#697b51"
# Secondary text.
Muted = "#3b797e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#9393b4"
# The selected entry.
Important = "#94544f"
# Section headings.
Title = "#607db4"
# Keybinding hints.
Guidance = "#5e827b"
# Command preview.
SyntaxCommand = "#697b51"
SyntaxFlag = "#5e827b"
SyntaxString = "#9d7754"
SyntaxVariable = "#94544f"
SyntaxOperator = "#425252"
SyntaxComment = "#9393b4"
