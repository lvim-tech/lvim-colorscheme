# Lvim Colorscheme KanagawaLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimKanagawa_light"

[theme]
name = "LvimKanagawa_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#c85b5b"
# Non-fatal problems.
AlertWarn = "#776745"
# Informational notices.
AlertInfo = "#677951"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#9595ae"
# The selected entry.
Important = "#92534e"
# Section headings.
Title = "#607eb6"
# Keybinding hints.
Guidance = "#5d807a"
# Command preview.
SyntaxCommand = "#677951"
SyntaxFlag = "#5d807a"
SyntaxString = "#9e754d"
SyntaxVariable = "#92534e"
SyntaxOperator = "#425353"
SyntaxComment = "#9595ae"
