# Lvim Colorscheme LvimLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimLvim_light"

[theme]
name = "LvimLvim_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#ac4135"
# Non-fatal problems.
AlertWarn = "#7e652f"
# Informational notices.
AlertInfo = "#70864f"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#7b9c9e"
# The selected entry.
Important = "#bc533c"
# Section headings.
Title = "#0879a9"
# Keybinding hints.
Guidance = "#01778a"
# Command preview.
SyntaxCommand = "#70864f"
SyntaxFlag = "#01778a"
SyntaxString = "#a96400"
SyntaxVariable = "#bc533c"
SyntaxOperator = "#425353"
SyntaxComment = "#7b9c9e"
