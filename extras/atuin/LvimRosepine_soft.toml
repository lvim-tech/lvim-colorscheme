# Lvim Colorscheme RosepineSoft
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimRosepine_soft"

[theme]
name = "LvimRosepine_soft"

[colors]
# Default foreground.
Base = "#b3afb2"
# Failures.
AlertError = "#a0727c"
# Non-fatal problems.
AlertWarn = "#b6a18b"
# Informational notices.
AlertInfo = "#788b7c"
# Secondary text.
Muted = "#8a8588"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#72596d"
# The selected entry.
Important = "#9084a2"
# Section headings.
Title = "#5d6d74"
# Keybinding hints.
Guidance = "#788787"
# Command preview.
SyntaxCommand = "#788b7c"
SyntaxFlag = "#788787"
SyntaxString = "#a98a89"
SyntaxVariable = "#9084a2"
SyntaxOperator = "#b3afb2"
SyntaxComment = "#72596d"
