# Lvim Colorscheme SolarizedSoft
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimSolarized_soft"

[theme]
name = "LvimSolarized_soft"

[colors]
# Default foreground.
Base = "#a2a9a9"
# Failures.
AlertError = "#bf4e4c"
# Non-fatal problems.
AlertWarn = "#96791f"
# Informational notices.
AlertInfo = "#727f1a"
# Secondary text.
Muted = "#758186"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#535d61"
# The selected entry.
Important = "#b75283"
# Section headings.
Title = "#4386b5"
# Keybinding hints.
Guidance = "#3e8d87"
# Command preview.
SyntaxCommand = "#727f1a"
SyntaxFlag = "#3e8d87"
SyntaxString = "#b15934"
SyntaxVariable = "#b75283"
SyntaxOperator = "#a2a9a9"
SyntaxComment = "#535d61"
