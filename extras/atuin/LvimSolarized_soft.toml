# Lvim Colorscheme SolarizedSoft
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimSolarized_soft"

[theme]
name = "LvimSolarized_soft"

[colors]
# Default foreground.
Base = "#a7afaf"
# Failures.
AlertError = "#c7504e"
# Non-fatal problems.
AlertWarn = "#9f8549"
# Informational notices.
AlertInfo = "#727c3e"
# Secondary text.
Muted = "#79878c"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#576267"
# The selected entry.
Important = "#c0578a"
# Section headings.
Title = "#4f7ea3"
# Keybinding hints.
Guidance = "#4b8580"
# Command preview.
SyntaxCommand = "#727c3e"
SyntaxFlag = "#4b8580"
SyntaxString = "#b46548"
SyntaxVariable = "#c0578a"
SyntaxOperator = "#a7afaf"
SyntaxComment = "#576267"
