# Lvim Colorscheme RosepineLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimRosepine_light"

[theme]
name = "LvimRosepine_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#a04a63"
# Non-fatal problems.
AlertWarn = "#927143"
# Informational notices.
AlertInfo = "#5d8086"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#9994b5"
# The selected entry.
Important = "#75509c"
# Section headings.
Title = "#558498"
# Keybinding hints.
Guidance = "#5d8086"
# Command preview.
SyntaxCommand = "#5d8086"
SyntaxFlag = "#5d8086"
SyntaxString = "#b46b67"
SyntaxVariable = "#75509c"
SyntaxOperator = "#425353"
SyntaxComment = "#9994b5"
