# Lvim Colorscheme RosepineLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimRosepine_light"

[theme]
name = "LvimRosepine_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#8e656e"
# Non-fatal problems.
AlertWarn = "#8c7b6a"
# Informational notices.
AlertInfo = "#5d6c60"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#b488ab"
# The selected entry.
Important = "#6d5f81"
# Section headings.
Title = "#6f8289"
# Keybinding hints.
Guidance = "#606d6d"
# Command preview.
SyntaxCommand = "#5d6c60"
SyntaxFlag = "#606d6d"
SyntaxString = "#987675"
SyntaxVariable = "#6d5f81"
SyntaxOperator = "#425353"
SyntaxComment = "#b488ab"
