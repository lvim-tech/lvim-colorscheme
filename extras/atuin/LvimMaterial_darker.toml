# Lvim Colorscheme MaterialDarker
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimMaterial_darker"

[theme]
name = "LvimMaterial_darker"

[colors]
# Default foreground.
Base = "#b2c7c7"
# Failures.
AlertError = "#d05e64"
# Non-fatal problems.
AlertWarn = "#cfa96a"
# Informational notices.
AlertInfo = "#90ad68"
# Secondary text.
Muted = "#8f979a"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#647278"
# The selected entry.
Important = "#d75d70"
# Section headings.
Title = "#5b7fcb"
# Keybinding hints.
Guidance = "#65a1bd"
# Command preview.
SyntaxCommand = "#90ad68"
SyntaxFlag = "#65a1bd"
SyntaxString = "#d37a60"
SyntaxVariable = "#d75d70"
SyntaxOperator = "#b2c7c7"
SyntaxComment = "#647278"
