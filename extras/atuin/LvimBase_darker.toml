# Lvim Colorscheme BaseDarker
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimBase_darker"

[theme]
name = "LvimBase_darker"

[colors]
# Default foreground.
Base = "#68a8a8"
# Failures.
AlertError = "#d75e52"
# Non-fatal problems.
AlertWarn = "#d8b36f"
# Informational notices.
AlertInfo = "#7e965a"
# Secondary text.
Muted = "#3a8287"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#475859"
# The selected entry.
Important = "#c6614d"
# Section headings.
Title = "#447ca2"
# Keybinding hints.
Guidance = "#448595"
# Command preview.
SyntaxCommand = "#7e965a"
SyntaxFlag = "#448595"
SyntaxString = "#e19556"
SyntaxVariable = "#c6614d"
SyntaxOperator = "#68a8a8"
SyntaxComment = "#475859"
