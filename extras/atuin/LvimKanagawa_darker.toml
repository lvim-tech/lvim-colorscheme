# Lvim Colorscheme KanagawaDarker
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimKanagawa_darker"

[theme]
name = "LvimKanagawa_darker"

[colors]
# Default foreground.
Base = "#9898b5"
# Failures.
AlertError = "#ba5454"
# Non-fatal problems.
AlertWarn = "#d1b57c"
# Informational notices.
AlertInfo = "#6c7f54"
# Secondary text.
Muted = "#72728f"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#4e4e73"
# The selected entry.
Important = "#c4726c"
# Section headings.
Title = "#4e6a9c"
# Keybinding hints.
Guidance = "#587a74"
# Command preview.
SyntaxCommand = "#6c7f54"
SyntaxFlag = "#587a74"
SyntaxString = "#bf8f62"
SyntaxVariable = "#c4726c"
SyntaxOperator = "#9898b5"
SyntaxComment = "#4e4e73"
