# Lvim Colorscheme SolarizedLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimSolarized_light"

[theme]
name = "LvimSolarized_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#cc5452"
# Non-fatal problems.
AlertWarn = "#896f1c"
# Informational notices.
AlertInfo = "#707c19"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#889ba5"
# The selected entry.
Important = "#bd5588"
# Section headings.
Title = "#39739c"
# Keybinding hints.
Guidance = "#347873"
# Command preview.
SyntaxCommand = "#707c19"
SyntaxFlag = "#347873"
SyntaxString = "#c3643d"
SyntaxVariable = "#bd5588"
SyntaxOperator = "#425353"
SyntaxComment = "#889ba5"
