# Lvim Colorscheme SolarizedLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimSolarized_light"

[theme]
name = "LvimSolarized_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#ca5350"
# Non-fatal problems.
AlertWarn = "#786435"
# Informational notices.
AlertInfo = "#727c3e"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#889ba5"
# The selected entry.
Important = "#b35181"
# Section headings.
Title = "#4c799d"
# Keybinding hints.
Guidance = "#467c77"
# Command preview.
SyntaxCommand = "#727c3e"
SyntaxFlag = "#467c77"
SyntaxString = "#ab6044"
SyntaxVariable = "#b35181"
SyntaxOperator = "#425353"
SyntaxComment = "#889ba5"
