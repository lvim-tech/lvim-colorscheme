# Lvim Colorscheme GruvboxLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimGruvbox_light"

[theme]
name = "LvimGruvbox_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#c74e4e"
# Non-fatal problems.
AlertWarn = "#8c7e55"
# Informational notices.
AlertInfo = "#7a7d48"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#a59283"
# The selected entry.
Important = "#915a47"
# Section headings.
Title = "#57829c"
# Keybinding hints.
Guidance = "#5c8861"
# Command preview.
SyntaxCommand = "#7a7d48"
SyntaxFlag = "#5c8861"
SyntaxString = "#875537"
SyntaxVariable = "#915a47"
SyntaxOperator = "#425353"
SyntaxComment = "#a59283"
