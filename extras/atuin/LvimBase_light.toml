# Lvim Colorscheme BaseLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimBase_light"

[theme]
name = "LvimBase_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#ae4b41"
# Non-fatal problems.
AlertWarn = "#856e42"
# Informational notices.
AlertInfo = "#55673c"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#7b9c9e"
# The selected entry.
Important = "#af5543"
# Section headings.
Title = "#457da3"
# Keybinding hints.
Guidance = "#3e7a89"
# Command preview.
SyntaxCommand = "#55673c"
SyntaxFlag = "#3e7a89"
SyntaxString = "#aa703f"
SyntaxVariable = "#af5543"
SyntaxOperator = "#425353"
SyntaxComment = "#7b9c9e"
