# Lvim Colorscheme EverforestDark
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimEverforest_dark"

[theme]
name = "LvimEverforest_dark"

[colors]
# Default foreground.
Base = "#96a991"
# Failures.
AlertError = "#cb4f4f"
# Non-fatal problems.
AlertWarn = "#af9e6b"
# Informational notices.
AlertInfo = "#75783a"
# Secondary text.
Muted = "#738070"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#535d4e"
# The selected entry.
Important = "#bb755e"
# Section headings.
Title = "#42758f"
# Keybinding hints.
Guidance = "#527a57"
# Command preview.
SyntaxCommand = "#75783a"
SyntaxFlag = "#527a57"
SyntaxString = "#cc7942"
SyntaxVariable = "#bb755e"
SyntaxOperator = "#96a991"
SyntaxComment = "#535d4e"
