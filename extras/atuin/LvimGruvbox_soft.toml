# Lvim Colorscheme GruvboxSoft
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimGruvbox_soft"

[theme]
name = "LvimGruvbox_soft"

[colors]
# Default foreground.
Base = "#b49f88"
# Failures.
AlertError = "#ca4f4f"
# Non-fatal problems.
AlertWarn = "#af9e6b"
# Informational notices.
AlertInfo = "#757845"
# Secondary text.
Muted = "#87786a"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#64584e"
# The selected entry.
Important = "#bb755e"
# Section headings.
Title = "#4a748c"
# Keybinding hints.
Guidance = "#527a57"
# Command preview.
SyntaxCommand = "#757845"
SyntaxFlag = "#527a57"
SyntaxString = "#c47d54"
SyntaxVariable = "#bb755e"
SyntaxOperator = "#b49f88"
SyntaxComment = "#64584e"
