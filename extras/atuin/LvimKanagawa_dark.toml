# Lvim Colorscheme KanagawaDark
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimKanagawa_dark"

[theme]
name = "LvimKanagawa_dark"

[colors]
# Default foreground.
Base = "#9898b5"
# Failures.
AlertError = "#b65252"
# Non-fatal problems.
AlertWarn = "#e0c286"
# Informational notices.
AlertInfo = "#6e8156"
# Secondary text.
Muted = "#72728f"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#505076"
# The selected entry.
Important = "#c4746e"
# Section headings.
Title = "#4d699b"
# Keybinding hints.
Guidance = "#597b75"
# Command preview.
SyntaxCommand = "#6e8156"
SyntaxFlag = "#597b75"
SyntaxString = "#c99460"
SyntaxVariable = "#c4746e"
SyntaxOperator = "#9898b5"
SyntaxComment = "#505076"
