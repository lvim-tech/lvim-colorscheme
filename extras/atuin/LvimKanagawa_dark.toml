# Lvim Colorscheme KanagawaDark
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimKanagawa_dark"

[theme]
name = "LvimKanagawa_dark"

[colors]
# Default foreground.
Base = "#9a9ab8"
# Failures.
AlertError = "#ba5454"
# Non-fatal problems.
AlertWarn = "#d1b57c"
# Informational notices.
AlertInfo = "#6c7f54"
# Secondary text.
Muted = "#747492"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#505076"
# The selected entry.
Important = "#c4726c"
# Section headings.
Title = "#4e6a9c"
# Keybinding hints.
Guidance = "#587a74"
# Command preview.
SyntaxCommand = "#6c7f54"
SyntaxFlag = "#587a74"
SyntaxString = "#bf8f62"
SyntaxVariable = "#c4726c"
SyntaxOperator = "#9a9ab8"
SyntaxComment = "#505076"
