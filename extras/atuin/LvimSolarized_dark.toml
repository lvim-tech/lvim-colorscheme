# Lvim Colorscheme SolarizedDark
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimSolarized_dark"

[theme]
name = "LvimSolarized_dark"

[colors]
# Default foreground.
Base = "#9da4a4"
# Failures.
AlertError = "#c24f4d"
# Non-fatal problems.
AlertWarn = "#9f8549"
# Informational notices.
AlertInfo = "#727c3e"
# Secondary text.
Muted = "#707c81"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#515b5f"
# The selected entry.
Important = "#c0578a"
# Section headings.
Title = "#4f7ea3"
# Keybinding hints.
Guidance = "#4b8580"
# Command preview.
SyntaxCommand = "#727c3e"
SyntaxFlag = "#4b8580"
SyntaxString = "#b46548"
SyntaxVariable = "#c0578a"
SyntaxOperator = "#9da4a4"
SyntaxComment = "#515b5f"
