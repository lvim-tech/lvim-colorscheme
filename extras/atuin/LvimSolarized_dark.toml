# Lvim Colorscheme SolarizedDark
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimSolarized_dark"

[theme]
name = "LvimSolarized_dark"

[colors]
# Default foreground.
Base = "#9da4a4"
# Failures.
AlertError = "#bf4e4c"
# Non-fatal problems.
AlertWarn = "#96791f"
# Informational notices.
AlertInfo = "#727f1a"
# Secondary text.
Muted = "#707c81"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#4f585c"
# The selected entry.
Important = "#b75283"
# Section headings.
Title = "#4386b5"
# Keybinding hints.
Guidance = "#3e8d87"
# Command preview.
SyntaxCommand = "#727f1a"
SyntaxFlag = "#3e8d87"
SyntaxString = "#ac5835"
SyntaxVariable = "#b75283"
SyntaxOperator = "#9da4a4"
SyntaxComment = "#4f585c"
