# Lvim Colorscheme CatppuccinSoft
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimCatppuccin_soft"

[theme]
name = "LvimCatppuccin_soft"

[colors]
# Default foreground.
Base = "#b2b7c7"
# Failures.
AlertError = "#d36d89"
# Non-fatal problems.
AlertWarn = "#d8b973"
# Informational notices.
AlertInfo = "#84c27f"
# Secondary text.
Muted = "#888c98"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#5f647d"
# The selected entry.
Important = "#d07fba"
# Section headings.
Title = "#6793da"
# Keybinding hints.
Guidance = "#71becc"
# Command preview.
SyntaxCommand = "#84c27f"
SyntaxFlag = "#71becc"
SyntaxString = "#da9366"
SyntaxVariable = "#d07fba"
SyntaxOperator = "#b2b7c7"
SyntaxComment = "#5f647d"
