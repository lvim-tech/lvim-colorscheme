# Lvim Colorscheme NightfoxDark
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimNightfox_dark"

[theme]
name = "LvimNightfox_dark"

[colors]
# Default foreground.
Base = "#bcbdbd"
# Failures.
AlertError = "#b46478"
# Non-fatal problems.
AlertWarn = "#c1ac71"
# Informational notices.
AlertInfo = "#89aa9a"
# Secondary text.
Muted = "#8e929a"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#626b76"
# The selected entry.
Important = "#9b82af"
# Section headings.
Title = "#7292bd"
# Keybinding hints.
Guidance = "#75bbbd"
# Command preview.
SyntaxCommand = "#89aa9a"
SyntaxFlag = "#75bbbd"
SyntaxString = "#d49360"
SyntaxVariable = "#9b82af"
SyntaxOperator = "#bcbdbd"
SyntaxComment = "#626b76"
