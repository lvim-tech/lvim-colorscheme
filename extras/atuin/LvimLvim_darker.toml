# Lvim Colorscheme LvimDarker
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimLvim_darker"

[theme]
name = "LvimLvim_darker"

[colors]
# Default foreground.
Base = "#68a5a5"
# Failures.
AlertError = "#e65e4f"
# Non-fatal problems.
AlertWarn = "#edc060"
# Informational notices.
AlertInfo = "#8AA55F"
# Secondary text.
Muted = "#3b7f84"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#455556"
# The selected entry.
Important = "#c75940"
# Section headings.
Title = "#0A85B9"
# Keybinding hints.
Guidance = "#018FA6"
# Command preview.
SyntaxCommand = "#8AA55F"
SyntaxFlag = "#018FA6"
SyntaxString = "#FF9C2A"
SyntaxVariable = "#c75940"
SyntaxOperator = "#68a5a5"
SyntaxComment = "#455556"
