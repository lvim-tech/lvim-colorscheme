# Lvim Colorscheme EverforestSoft
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimEverforest_soft"

[theme]
name = "LvimEverforest_soft"

[colors]
# Default foreground.
Base = "#9baf95"
# Failures.
AlertError = "#cb4f4f"
# Non-fatal problems.
AlertWarn = "#af9e6b"
# Informational notices.
AlertInfo = "#75783a"
# Secondary text.
Muted = "#788674"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#556050"
# The selected entry.
Important = "#bb755e"
# Section headings.
Title = "#427a96"
# Keybinding hints.
Guidance = "#537d58"
# Command preview.
SyntaxCommand = "#75783a"
SyntaxFlag = "#537d58"
SyntaxString = "#cc7942"
SyntaxVariable = "#bb755e"
SyntaxOperator = "#9baf95"
SyntaxComment = "#556050"
