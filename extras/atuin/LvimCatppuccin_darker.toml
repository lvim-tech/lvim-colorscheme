# Lvim Colorscheme CatppuccinDarker
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimCatppuccin_darker"

[theme]
name = "LvimCatppuccin_darker"

[colors]
# Default foreground.
Base = "#b2b7c7"
# Failures.
AlertError = "#b7657a"
# Non-fatal problems.
AlertWarn = "#b8a47e"
# Informational notices.
AlertInfo = "#6b8d69"
# Secondary text.
Muted = "#888c98"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#5f647d"
# The selected entry.
Important = "#b976a7"
# Section headings.
Title = "#6076a0"
# Keybinding hints.
Guidance = "#65878e"
# Command preview.
SyntaxCommand = "#6b8d69"
SyntaxFlag = "#65878e"
SyntaxString = "#b88970"
SyntaxVariable = "#b976a7"
SyntaxOperator = "#b2b7c7"
SyntaxComment = "#5f647d"
