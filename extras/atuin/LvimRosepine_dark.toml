# Lvim Colorscheme RosepineDark
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimRosepine_dark"

[theme]
name = "LvimRosepine_dark"

[colors]
# Default foreground.
Base = "#b4b2c7"
# Failures.
AlertError = "#cd6985"
# Non-fatal problems.
AlertWarn = "#d6a765"
# Informational notices.
AlertInfo = "#83b2ba"
# Secondary text.
Muted = "#898796"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#655f80"
# The selected entry.
Important = "#9f80c4"
# Section headings.
Title = "#417082"
# Keybinding hints.
Guidance = "#83b2ba"
# Command preview.
SyntaxCommand = "#83b2ba"
SyntaxFlag = "#83b2ba"
SyntaxString = "#c68784"
SyntaxVariable = "#9f80c4"
SyntaxOperator = "#b4b2c7"
SyntaxComment = "#655f80"
