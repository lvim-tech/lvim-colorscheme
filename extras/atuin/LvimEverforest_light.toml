# Lvim Colorscheme EverforestLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimEverforest_light"

[theme]
name = "LvimEverforest_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#c74d4d"
# Non-fatal problems.
AlertWarn = "#8c7e55"
# Informational notices.
AlertInfo = "#7b7e3d"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#8b9a83"
# The selected entry.
Important = "#915a47"
# Section headings.
Title = "#4f839e"
# Keybinding hints.
Guidance = "#5c8861"
# Command preview.
SyntaxCommand = "#7b7e3d"
SyntaxFlag = "#5c8861"
SyntaxString = "#8d522b"
SyntaxVariable = "#915a47"
SyntaxOperator = "#425353"
SyntaxComment = "#8b9a83"
