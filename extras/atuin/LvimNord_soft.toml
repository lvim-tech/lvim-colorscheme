# Lvim Colorscheme NordSoft
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimNord_soft"

[theme]
name = "LvimNord_soft"

[colors]
# Default foreground.
Base = "#b3bac6"
# Failures.
AlertError = "#ac6e74"
# Non-fatal problems.
AlertWarn = "#c3a870"
# Informational notices.
AlertInfo = "#879978"
# Secondary text.
Muted = "#8a8e96"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#5f6778"
# The selected entry.
Important = "#a2869d"
# Section headings.
Title = "#73889e"
# Keybinding hints.
Guidance = "#7097a3"
# Command preview.
SyntaxCommand = "#879978"
SyntaxFlag = "#7097a3"
SyntaxString = "#b88473"
SyntaxVariable = "#a2869d"
SyntaxOperator = "#b3bac6"
SyntaxComment = "#5f6778"
