# Lvim Colorscheme DraculaDark
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimDracula_dark"

[theme]
name = "LvimDracula_dark"

[colors]
# Default foreground.
Base = "#c7c7b3"
# Failures.
AlertError = "#bc6060"
# Non-fatal problems.
AlertWarn = "#adb27e"
# Informational notices.
AlertInfo = "#62966d"
# Secondary text.
Muted = "#989896"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#69708a"
# The selected entry.
Important = "#bf6f9a"
# Section headings.
Title = "#638993"
# Keybinding hints.
Guidance = "#66938a"
# Command preview.
SyntaxCommand = "#62966d"
SyntaxFlag = "#66938a"
SyntaxString = "#b58f70"
SyntaxVariable = "#bf6f9a"
SyntaxOperator = "#c7c7b3"
SyntaxComment = "#69708a"
