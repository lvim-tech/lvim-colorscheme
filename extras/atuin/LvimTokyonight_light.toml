# Lvim Colorscheme TokyonightLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimTokyonight_light"

[theme]
name = "LvimTokyonight_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#a94357"
# Non-fatal problems.
AlertWarn = "#95784f"
# Informational notices.
AlertInfo = "#667b4f"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#9095b1"
# The selected entry.
Important = "#8051c9"
# Section headings.
Title = "#4363a3"
# Keybinding hints.
Guidance = "#4682a5"
# Command preview.
SyntaxCommand = "#667b4f"
SyntaxFlag = "#4682a5"
SyntaxString = "#b16f48"
SyntaxVariable = "#8051c9"
SyntaxOperator = "#425353"
SyntaxComment = "#9095b1"
