# Lvim Colorscheme TokyonightLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimTokyonight_light"

[theme]
name = "LvimTokyonight_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#ab5867"
# Non-fatal problems.
AlertWarn = "#8f7b60"
# Informational notices.
AlertInfo = "#606f52"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#9095b1"
# The selected entry.
Important = "#765ba6"
# Section headings.
Title = "#6579ac"
# Keybinding hints.
Guidance = "#587387"
# Command preview.
SyntaxCommand = "#606f52"
SyntaxFlag = "#587387"
SyntaxString = "#9e7460"
SyntaxVariable = "#765ba6"
SyntaxOperator = "#425353"
SyntaxComment = "#9095b1"
