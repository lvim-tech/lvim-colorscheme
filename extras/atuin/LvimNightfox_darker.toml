# Lvim Colorscheme NightfoxDarker
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimNightfox_darker"

[theme]
name = "LvimNightfox_darker"

[colors]
# Default foreground.
Base = "#bcbdbd"
# Failures.
AlertError = "#b26377"
# Non-fatal problems.
AlertWarn = "#bba76f"
# Informational notices.
AlertInfo = "#7b998a"
# Secondary text.
Muted = "#8e929a"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#626b76"
# The selected entry.
Important = "#9a80ae"
# Section headings.
Title = "#6885ad"
# Keybinding hints.
Guidance = "#69a3a4"
# Command preview.
SyntaxCommand = "#7b998a"
SyntaxFlag = "#69a3a4"
SyntaxString = "#c88e62"
SyntaxVariable = "#9a80ae"
SyntaxOperator = "#bcbdbd"
SyntaxComment = "#626b76"
