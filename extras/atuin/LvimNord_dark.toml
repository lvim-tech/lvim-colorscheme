# Lvim Colorscheme NordDark
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimNord_dark"

[theme]
name = "LvimNord_dark"

[colors]
# Default foreground.
Base = "#b3bac6"
# Failures.
AlertError = "#af7177"
# Non-fatal problems.
AlertWarn = "#cbae72"
# Informational notices.
AlertInfo = "#97ab86"
# Secondary text.
Muted = "#8a8e96"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#5f6778"
# The selected entry.
Important = "#a58aa0"
# Section headings.
Title = "#8097af"
# Keybinding hints.
Guidance = "#7eaab7"
# Command preview.
SyntaxCommand = "#97ab86"
SyntaxFlag = "#7eaab7"
SyntaxString = "#ba8574"
SyntaxVariable = "#a58aa0"
SyntaxOperator = "#b3bac6"
SyntaxComment = "#5f6778"
