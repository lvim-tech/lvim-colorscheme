# Lvim Colorscheme CatppuccinLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimCatppuccin_light"

[theme]
name = "LvimCatppuccin_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#a45a6d"
# Non-fatal problems.
AlertWarn = "#8a7b5e"
# Informational notices.
AlertInfo = "#557153"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#8f94b3"
# The selected entry.
Important = "#845377"
# Section headings.
Title = "#6279a4"
# Keybinding hints.
Guidance = "#557278"
# Command preview.
SyntaxCommand = "#557153"
SyntaxFlag = "#557278"
SyntaxString = "#9a7561"
SyntaxVariable = "#845377"
SyntaxOperator = "#425353"
SyntaxComment = "#8f94b3"
