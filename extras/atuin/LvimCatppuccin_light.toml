# Lvim Colorscheme CatppuccinLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimCatppuccin_light"

[theme]
name = "LvimCatppuccin_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#9d445e"
# Non-fatal problems.
AlertWarn = "#7f6c41"
# Informational notices.
AlertInfo = "#557f51"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#8f94b3"
# The selected entry.
Important = "#b2619e"
# Section headings.
Title = "#597eba"
# Keybinding hints.
Guidance = "#487d86"
# Command preview.
SyntaxCommand = "#557f51"
SyntaxFlag = "#487d86"
SyntaxString = "#aa724e"
SyntaxVariable = "#b2619e"
SyntaxOperator = "#425353"
SyntaxComment = "#8f94b3"
