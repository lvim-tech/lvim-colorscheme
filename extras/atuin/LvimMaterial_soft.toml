# Lvim Colorscheme MaterialSoft
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimMaterial_soft"

[theme]
name = "LvimMaterial_soft"

[colors]
# Default foreground.
Base = "#b2c7c7"
# Failures.
AlertError = "#d1676c"
# Non-fatal problems.
AlertWarn = "#deb05c"
# Informational notices.
AlertInfo = "#a6c974"
# Secondary text.
Muted = "#8f979a"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#647278"
# The selected entry.
Important = "#da596e"
# Section headings.
Title = "#618adf"
# Keybinding hints.
Guidance = "#63bbdf"
# Command preview.
SyntaxCommand = "#a6c974"
SyntaxFlag = "#63bbdf"
SyntaxString = "#d77c61"
SyntaxVariable = "#da596e"
SyntaxOperator = "#b2c7c7"
SyntaxComment = "#647278"
