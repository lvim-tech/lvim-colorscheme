# Lvim Colorscheme DraculaDarker
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimDracula_darker"

[theme]
name = "LvimDracula_darker"

[colors]
# Default foreground.
Base = "#c7c7b3"
# Failures.
AlertError = "#dd5757"
# Non-fatal problems.
AlertWarn = "#d0da68"
# Informational notices.
AlertInfo = "#58d879"
# Secondary text.
Muted = "#989896"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#69708a"
# The selected entry.
Important = "#dc61a8"
# Section headings.
Title = "#65c8dd"
# Keybinding hints.
Guidance = "#61dfca"
# Command preview.
SyntaxCommand = "#58d879"
SyntaxFlag = "#61dfca"
SyntaxString = "#de9f5c"
SyntaxVariable = "#dc61a8"
SyntaxOperator = "#c7c7b3"
SyntaxComment = "#69708a"
