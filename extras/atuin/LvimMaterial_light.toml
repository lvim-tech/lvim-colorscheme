# Lvim Colorscheme MaterialLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimMaterial_light"

[theme]
name = "LvimMaterial_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#a9484d"
# Non-fatal problems.
AlertWarn = "#8b6d37"
# Informational notices.
AlertInfo = "#5f7541"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#8599a3"
# The selected entry.
Important = "#b44356"
# Section headings.
Title = "#3c62a8"
# Keybinding hints.
Guidance = "#407e97"
# Command preview.
SyntaxCommand = "#5f7541"
SyntaxFlag = "#407e97"
SyntaxString = "#b56b56"
SyntaxVariable = "#b44356"
SyntaxOperator = "#425353"
SyntaxComment = "#8599a3"
