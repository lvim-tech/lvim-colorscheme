# Lvim Colorscheme MaterialLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimMaterial_light"

[theme]
name = "LvimMaterial_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#b14b51"
# Non-fatal problems.
AlertWarn = "#8e7347"
# Informational notices.
AlertInfo = "#6f864f"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#8599a3"
# The selected entry.
Important = "#b04556"
# Section headings.
Title = "#4d6cae"
# Keybinding hints.
Guidance = "#55849a"
# Command preview.
SyntaxCommand = "#6f864f"
SyntaxFlag = "#55849a"
SyntaxString = "#b36b57"
SyntaxVariable = "#b04556"
SyntaxOperator = "#425353"
SyntaxComment = "#8599a3"
