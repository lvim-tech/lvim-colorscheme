# Lvim Colorscheme NightfoxLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimNightfox_light"

[theme]
name = "LvimNightfox_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#a75d70"
# Non-fatal problems.
AlertWarn = "#897a50"
# Informational notices.
AlertInfo = "#6b8377"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#8499b2"
# The selected entry.
Important = "#755a88"
# Section headings.
Title = "#546d8e"
# Keybinding hints.
Guidance = "#588586"
# Command preview.
SyntaxCommand = "#6b8377"
SyntaxFlag = "#588586"
SyntaxString = "#a17351"
SyntaxVariable = "#755a88"
SyntaxOperator = "#425353"
SyntaxComment = "#8499b2"
