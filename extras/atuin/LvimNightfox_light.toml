# Lvim Colorscheme NightfoxLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimNightfox_light"

[theme]
name = "LvimNightfox_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#a65c6e"
# Non-fatal problems.
AlertWarn = "#86774d"
# Informational notices.
AlertInfo = "#6b8578"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#8499b2"
# The selected entry.
Important = "#725986"
# Section headings.
Title = "#4a607e"
# Keybinding hints.
Guidance = "#4e7f80"
# Command preview.
SyntaxCommand = "#6b8578"
SyntaxFlag = "#4e7f80"
SyntaxString = "#a5734b"
SyntaxVariable = "#725986"
SyntaxOperator = "#425353"
SyntaxComment = "#8499b2"
