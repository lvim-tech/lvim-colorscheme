# Lvim Colorscheme TokyonightDarker
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimTokyonight_darker"

[theme]
name = "LvimTokyonight_darker"

[colors]
# Default foreground.
Base = "#b2b6c7"
# Failures.
AlertError = "#bb6171"
# Non-fatal problems.
AlertWarn = "#b79d7b"
# Informational notices.
AlertInfo = "#788a67"
# Secondary text.
Muted = "#898ca0"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#5f6580"
# The selected entry.
Important = "#907bba"
# Section headings.
Title = "#6073a4"
# Keybinding hints.
Guidance = "#648299"
# Command preview.
SyntaxCommand = "#788a67"
SyntaxFlag = "#648299"
SyntaxString = "#bb866d"
SyntaxVariable = "#907bba"
SyntaxOperator = "#b2b6c7"
SyntaxComment = "#5f6580"
