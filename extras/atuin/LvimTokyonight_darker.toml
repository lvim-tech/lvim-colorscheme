# Lvim Colorscheme TokyonightDarker
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimTokyonight_darker"

[theme]
name = "LvimTokyonight_darker"

[colors]
# Default foreground.
Base = "#b2b6c7"
# Failures.
AlertError = "#d76479"
# Non-fatal problems.
AlertWarn = "#c5a06b"
# Informational notices.
AlertInfo = "#9dbd7b"
# Secondary text.
Muted = "#898ca0"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#5f6580"
# The selected entry.
Important = "#9470d5"
# Section headings.
Title = "#6589d7"
# Keybinding hints.
Guidance = "#60b0de"
# Command preview.
SyntaxCommand = "#9dbd7b"
SyntaxFlag = "#60b0de"
SyntaxString = "#dd8b5a"
SyntaxVariable = "#9470d5"
SyntaxOperator = "#b2b6c7"
SyntaxComment = "#5f6580"
