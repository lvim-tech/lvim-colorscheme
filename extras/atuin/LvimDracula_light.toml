# Lvim Colorscheme DraculaLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimDracula_light"

[theme]
name = "LvimDracula_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#ba4040"
# Non-fatal problems.
AlertWarn = "#60652c"
# Informational notices.
AlertInfo = "#2f7a42"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#8f96b5"
# The selected entry.
Important = "#9f3d77"
# Section headings.
Title = "#3a7885"
# Keybinding hints.
Guidance = "#2d7065"
# Command preview.
SyntaxCommand = "#2f7a42"
SyntaxFlag = "#2d7065"
SyntaxString = "#9e703f"
SyntaxVariable = "#9f3d77"
SyntaxOperator = "#425353"
SyntaxComment = "#8f96b5"
