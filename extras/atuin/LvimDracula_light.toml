# Lvim Colorscheme DraculaLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimDracula_light"

[theme]
name = "LvimDracula_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#af5959"
# Non-fatal problems.
AlertWarn = "#777b56"
# Informational notices.
AlertInfo = "#466d4e"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#8f96b5"
# The selected entry.
Important = "#905274"
# Section headings.
Title = "#517079"
# Keybinding hints.
Guidance = "#496b64"
# Command preview.
SyntaxCommand = "#466d4e"
SyntaxFlag = "#496b64"
SyntaxString = "#957860"
SyntaxVariable = "#905274"
SyntaxOperator = "#425353"
SyntaxComment = "#8f96b5"
