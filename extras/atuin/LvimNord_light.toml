# Lvim Colorscheme NordLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimNord_light"

[theme]
name = "LvimNord_light"

[colors]
# Default foreground.
Base = "#425353"
# Failures.
AlertError = "#935d63"
# Non-fatal problems.
AlertWarn = "#87734a"
# Informational notices.
AlertInfo = "#738366"
# Secondary text.
Muted = "#3c7a7e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#8b97b3"
# The selected entry.
Important = "#8e778a"
# Section headings.
Title = "#6e8094"
# Keybinding hints.
Guidance = "#61848f"
# Command preview.
SyntaxCommand = "#738366"
SyntaxFlag = "#61848f"
SyntaxString = "#9f7467"
SyntaxVariable = "#8e778a"
SyntaxOperator = "#425353"
SyntaxComment = "#8b97b3"
