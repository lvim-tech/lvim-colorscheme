# Lvim Colorscheme NordLight
# Generated by lvim-colorscheme for atuin — https://github.com/atuinsh/atuin
#
# Install:
#   mkdir -p ~/.config/atuin/themes
#   cp extras/atuin/*.toml ~/.config/atuin/themes/
#
# Use, in ~/.config/atuin/config.toml:
#   [theme]
#   name = "LvimNord_light"

[theme]
name = "LvimNord_light"

[colors]
# Default foreground.
Base = "#425252"
# Failures.
AlertError = "#976065"
# Non-fatal problems.
AlertWarn = "#8b774e"
# Informational notices.
AlertInfo = "#738168"
# Secondary text.
Muted = "#3b797e"
# Tertiary text: timestamps, durations, exit codes.
Annotation = "#8698b6"
# The selected entry.
Important = "#6e5a6b"
# Section headings.
Title = "#596a7c"
# Keybinding hints.
Guidance = "#65838d"
# Command preview.
SyntaxCommand = "#738168"
SyntaxFlag = "#65838d"
SyntaxString = "#7a564b"
SyntaxVariable = "#6e5a6b"
SyntaxOperator = "#425252"
SyntaxComment = "#8698b6"
